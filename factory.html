            <div style={{ color: C.teal, fontSize: 12, marginBottom: 8 }}>
              📦 紐づく受注はセット品(1セット={fmt(linkedSOProduct.piecesPerSet)}枚)です。バラ品「{productById(linkedSOProduct.setSourceProductId)?.productName || '?'}」への目標数量に自動変換しました
              (受注{fmt(linkedSalesOrder.orderedQty)}セット × {fmt(linkedSOProduct.piecesPerSet)}枚 = {fmt(linkedSOProduct.piecesPerSet * linkedSalesOrder.orderedQty)}枚)。
            </div>
          )}
          {selectedProduct?.isSet && (
            <div style={{ color: C.teal, fontSize: 12, marginBottom: 8 }}>
              📦 この商品は「セット品」です。この計画自体でセット単位の完成品を作る場合はこのままでOKです(目標数量・実績はセット単位で記録してください)。バラ品を作ってから後でセットに組む場合は、バラ品(元になる商品)を選んでください。
            </div>
          )}
          {estimatedHours !== null && (
            <div style={{ fontSize: 12, color: C.teal, marginBottom: 8 }}>
              ⏱ 目安所要時間: 約{estimatedHours.toFixed(1)}時間(標準速度 {fmt(selectedProduct.speedPerHour)}枚/時間で計算)
            </div>
          )}
          {requiredMaterial !== null && (
            <div style={{ fontSize: 12, color: insufficientStock ? C.red : C.teal, marginBottom: 8 }}>
              📐 必要資材量の目安: 約{requiredMaterial.toFixed(2)}{unitLabel(selectedLot?.unit)}(1枚あたり{selectedProduct.materialPerUnit}で計算)
              {selectedLot && (insufficientStock
                ? ` — 選択中のロットの残量(${fmt(selectedLot.remainingLength)}${unitLabel(selectedLot.unit)})が不足しています`
                : ` — 選択中のロットの残量: ${fmt(selectedLot.remainingLength)}${unitLabel(selectedLot.unit)}`)}
            </div>
          )}
          {belowMinLot && (
            <div style={{ color: C.amber, fontSize: 12, marginBottom: 8 }}>⚠ この商品の最低ロット({fmt(selectedProduct.minLotQty)}枚)を下回っています。</div>
          )}
          {err && <div style={{ color: C.red, fontSize: 12, marginBottom: 8 }}>{err}</div>}
          <div style={{ display: 'flex', gap: 8 }}>
            <PrimaryButton onClick={submit}>{editingId ? <CheckCircle2 size={14} /> : <Plus size={14} />} {editingId ? '更新を保存' : '計画を追加'}</PrimaryButton>
            {editingId && <PrimaryButton onClick={cancelEdit} style={{ background: C.panelAlt2, color: C.text }}>キャンセル</PrimaryButton>}
          </div>
        </Panel>
      ) : (
        <LockedNotice text="生産計画の入力にはログインが必要です。" />
      )}


      <Panel style={{ padding: 16, overflowX: 'auto' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
          <div className="fm-display" style={{ fontSize: 16, fontWeight: 600 }}>生産計画一覧</div>
          {completedCount > 0 && <Badge tone="green">完了 {completedCount}件</Badge>}
        </div>
        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13, minWidth: 780 }}>
          <thead>
            <tr style={{ textAlign: 'left', color: C.textDim, borderBottom: `1px solid ${C.border}` }}>
              {['計画番号', '受注/得意先', '製品名', 'ライン', '資材', '進捗(たたみ済/目標)', '生産期間', '状態', ''].map((h) => (
                <th key={h} style={{ padding: '6px 8px', fontWeight: 500 }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {sortedRows.length === 0 && (
              <tr><td colSpan={9} style={{ padding: 14, color: C.textFaint }}>計画がありません。上のフォームから追加してください。</td></tr>
            )}
            {sortedRows.map(({ o, st, status }) => {
              const ratio = pct(st.folded, o.targetQty);
              const tone = status === '完了' ? 'green' : status === '仕掛中' ? 'teal' : 'dim';
              const lot = lotById(o.lotId);
              const so = salesOrderById(o.salesOrderId);
              const done = status === '完了';
              const planProduct = o.productId ? productById(o.productId) : null;
              const unitLabel3 = planProduct?.isSet ? 'セット' : '枚';
              return (
                <tr key={o.id} style={{ borderBottom: `1px solid ${C.border}`, background: o.id === editingId ? C.tealDim + '55' : done ? 'rgba(79,179,116,0.08)' : 'transparent' }}>
                  <td className="fm-mono" style={{ padding: '8px' }}>{o.planNo}</td>
                  <td style={{ padding: '8px', fontSize: 12, color: C.textDim }}>{so ? `${so.orderNo} / ${so.customerName}` : '—'}</td>
                  <td style={{ padding: '8px' }}>{o.productName}</td>
                  <td style={{ padding: '8px' }}>{lineById(o.lineId)?.name || '—'}</td>
                  <td style={{ padding: '8px', color: C.textDim, fontSize: 12 }}>{lot ? lot.lotNo : '—'}</td>
                  <td style={{ padding: '8px', minWidth: 160 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <div style={{ flex: 1 }}><ProgressBar ratio={ratio} color={done ? C.green : C.teal} /></div>
                      <span className="fm-mono" style={{ fontSize: 11, color: C.textDim, whiteSpace: 'nowrap' }}>{fmt(st.folded)}/{fmt(o.targetQty)}{unitLabel3}</span>
                    </div>
                  </td>
                  <td className="fm-mono" style={{ padding: '8px', fontSize: 12, whiteSpace: 'nowrap' }}>{planStart(o)} 〜 {planEnd(o)}</td>
                  <td style={{ padding: '8px' }}>
                    <Badge tone={tone}>{done ? <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}><CheckCircle2 size={11} />完了</span> : status}</Badge>
                  </td>
                  <td style={{ padding: '8px', display: 'flex', gap: 2 }}>
                    {isEditor && <IconBtn onClick={() => startEdit(o)} title="編集" icon={Pencil} />}
                    {isEditor && <IconBtn onClick={() => removeOrder(o.id)} title="削除" danger />}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </Panel>

      {isEditor && (
        <Panel style={{ padding: 16 }}>
          <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 12 }}>ライン管理</div>
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 12 }}>
            {data.lines.map((l) => (
              <div key={l.id} style={{ display: 'flex', alignItems: 'center', gap: 4, background: C.panelAlt, border: `1px solid ${C.border}`, borderRadius: 999, padding: '4px 6px 4px 12px', fontSize: 13 }}>
                {l.name}
                <IconBtn onClick={() => removeLine(l.id)} title="ライン削除" danger />
              </div>
            ))}
          </div>
          <div style={{ display: 'flex', gap: 8, maxWidth: 340 }}>
            <input className="fm-input" placeholder="新しいライン名 (例: ライン4)" value={newLine} onChange={(e) => setNewLine(e.target.value)} />
            <PrimaryButton onClick={() => { if (newLine.trim()) { addLine(newLine.trim()); setNewLine(''); } }}><Plus size={14} /> 追加</PrimaryButton>
          </div>
        </Panel>
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* 資材在庫タブ                                                         */
/* ------------------------------------------------------------------ */
function InventoryTab({ data, addLot, updateLot, removeLot, addMaterialTransaction, removeMaterialTransaction, isEditor }) {
  const blankForm = {
    lotNo: '', materialName: '', initialLength: '', remainingLength: '', receivedDate: todayStr(),
    unitPriceForeign: '',
  };
  const [form, setForm] = useState(blankForm);
  const [editingId, setEditingId] = useState(null);
  const [err, setErr] = useState('');

  const blankTxForm = { lotId: data.lots[0]?.id || '', date: todayStr(), type: '入庫', qty: '', note: '' };
  const [txForm, setTxForm] = useState(blankTxForm);
  const [txErr, setTxErr] = useState('');

  // 資材一覧が変わった時、選択中のロットが存在しなくなっていたら先頭のロットに補正する
  useEffect(() => {
    if (data.lots.length === 0) return;
    if (!data.lots.some((l) => l.id === txForm.lotId)) {
      setTxForm((f) => ({ ...f, lotId: data.lots[0].id }));
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [data.lots]);

  const materialTypeOptions = useMemo(
    () => [...new Set(data.products.map((p) => p.materialType).filter(Boolean))],
    [data.products],
  );

  const startEdit = (l) => {
    setEditingId(l.id);
    setForm({
      lotNo: l.lotNo, materialName: l.materialName,
      initialLength: String(l.initialLength), remainingLength: String(l.remainingLength),
      receivedDate: l.receivedDate, unitPriceForeign: String(l.unitPriceForeign || ''),
    });
  };
  const cancelEdit = () => { setEditingId(null); setForm(blankForm); setErr(''); };

  const submit = () => {
    if (!form.lotNo || !form.materialName || !form.initialLength) {
      setErr('ロット番号・資材名・初期数量は必須です。');
      return;
    }
    setErr('');
    const payload = {
      lotNo: form.lotNo,
      materialName: form.materialName,
      initialLength: Number(form.initialLength),
      remainingLength: form.remainingLength === '' ? Number(form.initialLength) : Number(form.remainingLength),
      receivedDate: form.receivedDate,
      unitPriceForeign: Number(form.unitPriceForeign) || 0,
      currency: 'JPY',
      exchangeRate: 1,
    };
    if (editingId) {
      updateLot(editingId, payload);
      setEditingId(null);
    } else {
      addLot(payload);
    }
    setForm(blankForm);
  };

  const totalInventoryValue = data.lots.reduce((sum, l) => sum + lotTotalCostJPY(l) * (num(l.initialLength) > 0 ? num(l.remainingLength) / num(l.initialLength) : 0), 0);

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
        <StatCard icon={Coins} label="在庫金額(円・残量ベース)" value={fmt(Math.round(totalInventoryValue))} unit="円" tone="amber" />
        <StatCard icon={Package} label="ロット数" value={data.lots.length} unit="件" tone="teal" />
      </div>

      {isEditor ? (
        <Panel style={{ padding: 16, border: editingId ? `1px solid ${C.teal}` : undefined }}>
          <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 4 }}>{editingId ? '資材ロットを編集' : '資材ロットを追加'}</div>
          <div style={{ fontSize: 12, color: C.textFaint, marginBottom: 12 }}>円での仕入単価を記録すると、在庫金額が自動計算されます。</div>
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 10 }}>
            <Field label="ロット番号"><input className="fm-input" value={form.lotNo} onChange={(e) => setForm({ ...form, lotNo: e.target.value })} placeholder="PP-20260727" /></Field>
            <Field label="資材名">
              <input list="material-type-options" className="fm-input" value={form.materialName} onChange={(e) => setForm({ ...form, materialName: e.target.value })} placeholder="PP不織布 20g/m²" />
              <datalist id="material-type-options">
                {materialTypeOptions.map((m) => <option key={m} value={m} />)}
              </datalist>
            </Field>
            <Field label="初期数量(個)"><input type="number" className="fm-input" value={form.initialLength} onChange={(e) => setForm({ ...form, initialLength: e.target.value })} placeholder="3000" /></Field>
            <Field label="単価(円)"><input type="number" step="0.01" className="fm-input" value={form.unitPriceForeign} onChange={(e) => setForm({ ...form, unitPriceForeign: e.target.value })} placeholder="63" /></Field>
            <Field label="入荷日"><input type="date" className="fm-input" value={form.receivedDate} onChange={(e) => setForm({ ...form, receivedDate: e.target.value })} /></Field>
          </div>
          {err && <div style={{ color: C.red, fontSize: 12, marginBottom: 8 }}>{err}</div>}
          <div style={{ display: 'flex', gap: 8 }}>
            <PrimaryButton onClick={submit}>{editingId ? <CheckCircle2 size={14} /> : <Plus size={14} />} {editingId ? '更新を保存' : 'ロットを追加'}</PrimaryButton>
            {editingId && <PrimaryButton onClick={cancelEdit} style={{ background: C.panelAlt2, color: C.text }}>キャンセル</PrimaryButton>}
          </div>
        </Panel>
      ) : (
        <LockedNotice text="資材ロットの入力にはログインが必要です。" />
      )}

      <Panel style={{ padding: 16, overflowX: 'auto' }}>
        <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 12 }}>資材在庫一覧</div>
        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13, minWidth: 680 }}>
          <thead>
            <tr style={{ textAlign: 'left', color: C.textDim, borderBottom: `1px solid ${C.border}` }}>
              {['ロット番号', '資材名', '残量', '単価(円)', '入荷日', ''].map((h) => <th key={h} style={{ padding: '6px 8px', fontWeight: 500 }}>{h}</th>)}
            </tr>
          </thead>
          <tbody>
            {data.lots.length === 0 && (
              <tr><td colSpan={6} style={{ padding: 14, color: C.textFaint }}>資材ロットがありません。</td></tr>
            )}
            {data.lots.map((l) => {
              const ratio = pct(l.remainingLength, l.initialLength);
              const low = ratio < 20;
              const unitCost = lotUnitCostJPY(l);
              return (
                <tr key={l.id} style={{ borderBottom: `1px solid ${C.border}`, background: l.id === editingId ? C.tealDim + '55' : 'transparent' }}>
                  <td className="fm-mono" style={{ padding: '8px' }}>{l.lotNo}</td>
                  <td style={{ padding: '8px' }}>{l.materialName}</td>
                  <td style={{ padding: '8px', minWidth: 200 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <div style={{ flex: 1 }}><ProgressBar ratio={ratio} color={low ? C.red : C.teal} /></div>
                      <span className="fm-mono" style={{ fontSize: 11, whiteSpace: 'nowrap', color: low ? C.red : C.textDim }}>{fmt(l.remainingLength)}/{fmt(l.initialLength)}{unitLabel(l.unit)}</span>
                    </div>
                  </td>
                  <td className="fm-mono" style={{ padding: '8px', color: C.amber }}>{unitCost.toFixed(2)}円</td>
                  <td className="fm-mono" style={{ padding: '8px' }}>{l.receivedDate}</td>
                  <td style={{ padding: '8px', display: 'flex', gap: 2 }}>
                    {isEditor && <IconBtn onClick={() => startEdit(l)} title="編集" icon={Pencil} />}
                    {isEditor && <IconBtn onClick={() => removeLot(l.id)} title="削除" danger />}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </Panel>

      {isEditor ? (
        <Panel style={{ padding: 16 }}>
          <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 4 }}>入出庫を記録</div>
          <div style={{ fontSize: 12, color: C.textFaint, marginBottom: 12 }}>生産計画とは関係なく、日々の資材の増減(仕入れ・使用・廃棄・棚卸調整など)だけを記録できます。</div>
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 10 }}>
            <Field label="資材(ロット)">
              <select className="fm-input" value={txForm.lotId} onChange={(e) => setTxForm({ ...txForm, lotId: e.target.value })}>
                {data.lots.length === 0 && <option value="">先に資材ロットを登録してください</option>}
                {data.lots.map((l) => <option key={l.id} value={l.id}>{l.lotNo} ({l.materialName})</option>)}
              </select>
            </Field>
            <Field label="日付"><input type="date" className="fm-input" value={txForm.date} onChange={(e) => setTxForm({ ...txForm, date: e.target.value })} /></Field>
            <Field label="種別">
              <select className="fm-input" value={txForm.type} onChange={(e) => setTxForm({ ...txForm, type: e.target.value })}>
                <option value="入庫">入庫(増える)</option>
                <option value="出庫">出庫(減る)</option>
              </select>
            </Field>
            <Field label="数量"><input type="number" className="fm-input" value={txForm.qty} onChange={(e) => setTxForm({ ...txForm, qty: e.target.value })} placeholder="50" /></Field>
            <Field label="メモ(任意)"><input className="fm-input" value={txForm.note} onChange={(e) => setTxForm({ ...txForm, note: e.target.value })} placeholder="例: 追加仕入れ / 廃棄 / 棚卸調整" /></Field>
          </div>
          {txErr && <div style={{ color: C.red, fontSize: 12, marginBottom: 8 }}>{txErr}</div>}
          <PrimaryButton
            onClick={() => {
              if (!txForm.lotId || !txForm.date || !txForm.qty) {
                setTxErr('資材・日付・数量は必須です。');
                return;
              }
              setTxErr('');
              addMaterialTransaction({ ...txForm, qty: Number(txForm.qty) });
              setTxForm({ ...txForm, qty: '', note: '' });
            }}
          ><Plus size={14} /> 記録する</PrimaryButton>
        </Panel>
      ) : (
        <LockedNotice text="入出庫の記録にはログインが必要です。" />
      )}

      <Panel style={{ padding: 16, overflowX: 'auto' }}>
        <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 12 }}>入出庫履歴</div>
        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13, minWidth: 600 }}>
          <thead>
            <tr style={{ textAlign: 'left', color: C.textDim, borderBottom: `1px solid ${C.border}` }}>
              {['日付', '資材', '種別', '数量', 'メモ', ''].map((h) => <th key={h} style={{ padding: '6px 8px', fontWeight: 500 }}>{h}</th>)}
            </tr>
          </thead>
          <tbody>
            {data.materialTransactions.length === 0 && (
              <tr><td colSpan={6} style={{ padding: 14, color: C.textFaint }}>まだ入出庫の記録がありません。</td></tr>
            )}
            {[...data.materialTransactions].sort((a, b) => (a.date < b.date ? 1 : -1)).map((tx) => {
              const lot = data.lots.find((l) => l.id === tx.lotId);
              return (
                <tr key={tx.id} style={{ borderBottom: `1px solid ${C.border}` }}>
                  <td className="fm-mono" style={{ padding: '8px' }}>{tx.date}</td>
                  <td style={{ padding: '8px' }}>{lot ? `${lot.lotNo} (${lot.materialName})` : '(削除済み)'}</td>
                  <td style={{ padding: '8px' }}><Badge tone={tx.type === '入庫' ? 'teal' : 'amber'}>{tx.type}</Badge></td>
                  <td className="fm-mono" style={{ padding: '8px', color: tx.type === '入庫' ? C.teal : C.amber }}>{tx.type === '入庫' ? '+' : '-'}{fmt(tx.qty)}{lot ? unitLabel(lot.unit) : ''}</td>
                  <td style={{ padding: '8px', color: C.textDim, fontSize: 12 }}>{tx.note || '—'}</td>
                  <td style={{ padding: '8px' }}>{isEditor && <IconBtn onClick={() => removeMaterialTransaction(tx.id)} title="削除" danger />}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </Panel>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* 生産実績・WIPタブ                                                    */
/* ------------------------------------------------------------------ */
function K981StatusPanel({ data, k981Status, k981Busy, k981Last, pushK981, isEditor }) {
  const cfg = data.k981 || {};
  if (!cfg.enabled) return null;
  const targets = data.records.filter((r) => k981Target(cfg, r));
  const st = k981Status || {};
  const sent = targets.filter((r) => st[r.id] && st[r.id].kintone_id && !st[r.id].error).length;
  const errs = targets.filter((r) => st[r.id] && st[r.id].error);
  const notYet = targets.length - sent - errs.length;
  return (
    <Panel style={{ padding: 14 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
        <div className="fm-display" style={{ fontSize: 15, fontWeight: 600 }}>kintone 生産実績アプリ(981)への登録</div>
        <Badge tone="green">登録済み {sent}</Badge>
        {notYet > 0 && <Badge tone="amber">未登録 {notYet}</Badge>}
        {errs.length > 0 && <Badge tone="red">送れなかった {errs.length}</Badge>}
        {isEditor && <PrimaryButton onClick={() => { if (!k981Busy) pushK981(null); }} style={{ marginLeft: 'auto', padding: '6px 12px' }}>{k981Busy ? '送信中…' : '今すぐ送る'}</PrimaryButton>}
      </div>
      <div style={{ fontSize: 12, color: C.textFaint, marginTop: 6 }}>
        {cfg.startDate} 以降の、製造分類を割り当てたラインの実績を保存すると、自動で登録します(直したときは kintone 側も更新)。生産管理で実績を消しても、kintone のレコードは消えません。
      </div>
      {k981Last && !k981Last.ok && <div style={{ fontSize: 12, color: C.red, marginTop: 6 }}>⚠ {k981Last.error}</div>}
      {k981Last && k981Last.ok && !k981Last.busy && (k981Last.added + k981Last.updated > 0) && <div style={{ fontSize: 12, color: C.green, marginTop: 6 }}>登録 {k981Last.added}件・更新 {k981Last.updated}件{k981Last.remaining ? `(残り ${k981Last.remaining}件は「今すぐ送る」で送れます)` : ''}</div>}
      {k981Last && k981Last.ok && k981Last.deletedInFactory > 0 && <div style={{ fontSize: 12, color: C.amber, marginTop: 6 }}>生産管理で消した実績のうち {k981Last.deletedInFactory}件が kintone に残っています(必要なら kintone で消してください)。</div>}
      {errs.length > 0 && (
        <div style={{ fontSize: 12, color: C.red, marginTop: 6 }}>
          {errs.slice(0, 5).map((r) => <div key={r.id}>・{r.date} {r.worker}:{st[r.id].error}</div>)}
          {errs.length > 5 && <div>ほか {errs.length - 5}件</div>}
        </div>
      )}
    </Panel>
  );
}

function ProductionTab({ data, addRecord, updateRecord, removeRecord, lineById, orderById, orderStats, productById, lotById, isEditor, k981Status, k981Busy, k981Last, pushK981 }) {
  const blankForm = {
    date: todayStr(), orderId: data.orders[0]?.id || '', worker: '',
    startTime: '', endTime: '',
    completedQty: '', defectItems: [], materialUsedLength: '',
    setMode: false, setProductId: '', setQty: '',
  };
  const [form, setForm] = useState(blankForm);
  const [editingId, setEditingId] = useState(null);
  const [materialAuto, setMaterialAuto] = useState(true);
  const [err, setErr] = useState('');

  const addDefectItem = () => setForm((f) => ({ ...f, defectItems: [...f.defectItems, { id: `${Date.now()}-${f.defectItems.length}`, cause: '', qty: '' }] }));
  const updateDefectItem = (idx, key, value) => setForm((f) => ({
    ...f,
    defectItems: f.defectItems.map((d, i) => (i === idx ? { ...d, [key]: value } : d)),
  }));
  const removeDefectItem = (idx) => setForm((f) => ({ ...f, defectItems: f.defectItems.filter((_, i) => i !== idx) }));

  const totalDefectQty = useMemo(
    () => form.defectItems.reduce((sum, d) => sum + (Number(d.qty) || 0), 0),
    [form.defectItems],
  );

  const workerOptions = useMemo(
    () => [...new Set(data.records.map((r) => r.worker).filter(Boolean))],
    [data.records],
  );

  const linkedProduct = useMemo(() => {
    const ord = orderById(form.orderId);
    return ord && ord.productId ? productById(ord.productId) : null;
  }, [form.orderId, orderById, productById]);

  const linkedLot = useMemo(() => {
    const ord = orderById(form.orderId);
    return ord && ord.lotId ? lotById(ord.lotId) : null;
  }, [form.orderId, orderById, lotById]);

  // この計画の商品(バラ品)を元にしたセット品があれば、セット単位入力を選べるようにする
  const availableSetProducts = useMemo(() => {
    if (!linkedProduct) return [];
    return data.products.filter((p) => p.isSet && p.setSourceProductId === linkedProduct.id);
  }, [data.products, linkedProduct]);

  // セット単位入力に切り替えた時、未選択なら先頭のセット品を自動選択する
  useEffect(() => {
    if (form.setMode && !form.setProductId && availableSetProducts.length > 0) {
      setForm((f) => ({ ...f, setProductId: availableSetProducts[0].id }));
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [form.setMode, availableSetProducts]);

  const selectedSetProduct = availableSetProducts.find((p) => p.id === form.setProductId) || null;
  const baraEquivalent = form.setMode && selectedSetProduct && form.setQty !== ''
    ? num(selectedSetProduct.piecesPerSet) * Number(form.setQty)
    : null;

  // 完成数(または セット単位ならバラ換算数) + 不良数の合計 = 実質的な生産数(資材使用量の計算に使う)
  const completedBase = form.setMode ? (baraEquivalent || 0) : (Number(form.completedQty) || 0);
  const derivedMachineUp = completedBase + totalDefectQty;

  // 資材使用量の自動計算(担当者が直接編集したら自動計算を止める)
  useEffect(() => {
    if (!materialAuto) return;
    if (linkedProduct && linkedProduct.materialPerUnit > 0 && derivedMachineUp > 0) {
      const calc = derivedMachineUp * linkedProduct.materialPerUnit;
      setForm((f) => ({ ...f, materialUsedLength: calc ? String(Math.round(calc * 100) / 100) : '' }));
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [form.orderId, derivedMachineUp, materialAuto, linkedProduct]);

  const materialInsufficient = linkedLot && form.materialUsedLength !== '' && Number(form.materialUsedLength) > num(linkedLot.remainingLength);

  const startEdit = (r) => {
    setEditingId(r.id);
    setMaterialAuto(false);
    const isSetRec = !!(r.setProductId && r.setQty);
    const restoredDefects = Array.isArray(r.defectItems) && r.defectItems.length > 0
      ? r.defectItems.map((d, i) => ({ id: d.id || `${i}`, cause: d.cause || '', qty: String(d.qty ?? '') }))
      : (num(r.defectQty) > 0 ? [{ id: 'legacy0', cause: r.defectCause || '', qty: String(r.defectQty) }] : []);
    setForm({
      date: r.date, orderId: r.orderId, worker: r.worker || '',
      startTime: r.startTime || '', endTime: r.endTime || '',
      completedQty: isSetRec ? '' : String(r.foldedQty ?? ''),
      defectItems: restoredDefects,
      materialUsedLength: String(r.materialUsedLength ?? ''),
      setMode: isSetRec,
      setProductId: isSetRec ? r.setProductId : '',
      setQty: isSetRec ? String(r.setQty) : '',
    });
  };
  const cancelEdit = () => { setEditingId(null); setForm(blankForm); setMaterialAuto(true); setErr(''); };

  const submit = () => {
    if (!form.orderId || !form.date || !form.worker) {
      setErr('日付・担当者・計画は必須です。');
      return;
    }
    if (form.setMode) {
      if (!form.setProductId || !form.setQty) {
        setErr('セット単位入力の場合、セット品とセット数は必須です。');
        return;
      }
    } else if (form.completedQty === '') {
      setErr('完成数を入力してください。');
      return;
    }
    setErr('');
    const ord = orderById(form.orderId);
    const completedQtyValue = form.setMode
      ? num(selectedSetProduct?.piecesPerSet) * (Number(form.setQty) || 0)
      : (Number(form.completedQty) || 0);
    const cleanDefectItems = form.defectItems
      .filter((d) => d.cause || (Number(d.qty) || 0) > 0)
      .map((d) => ({ cause: d.cause, qty: Number(d.qty) || 0 }));
    const totalDefect = cleanDefectItems.reduce((sum, d) => sum + d.qty, 0);
    const payload = {
      date: form.date,
      orderId: form.orderId,
      lineId: ord?.lineId,
      worker: form.worker,
      startTime: form.startTime,
      endTime: form.endTime,
      machineUpQty: completedQtyValue + totalDefect,
      inspectedQty: completedQtyValue,
      foldedQty: completedQtyValue,
      defectQty: totalDefect,
      defectCause: cleanDefectItems.map((d) => d.cause).filter(Boolean).join('、'),
      defectItems: cleanDefectItems,
      materialUsedLength: Number(form.materialUsedLength) || 0,
      setProductId: form.setMode ? form.setProductId : '',
      setQty: form.setMode ? (Number(form.setQty) || 0) : 0,
    };
    if (editingId) {
      updateRecord(editingId, payload);
      setEditingId(null);
      setForm(blankForm);
      setMaterialAuto(true);
    } else {
      addRecord(payload);
      setForm({ ...form, worker: '', startTime: '', endTime: '', completedQty: '', defectItems: [], materialUsedLength: '', setQty: '' });
      setMaterialAuto(true);
    }
  };

  const sortedRecords = [...data.records].sort((a, b) => (a.date < b.date ? 1 : -1));
  const [showAllRecords, setShowAllRecords] = useState(false);
  const visibleRecords = showAllRecords ? sortedRecords : sortedRecords.slice(0, 20);

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      {isEditor ? (
        <Panel style={{ padding: 16, border: editingId ? `1px solid ${C.teal}` : undefined }}>
          <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 12 }}>{editingId ? '実績を編集' : '実績を入力'}</div>
          {availableSetProducts.length > 0 && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10 }}>
              <input
                type="checkbox"
                id="setModeCheckbox"
                checked={form.setMode}
                onChange={(e) => setForm({ ...form, setMode: e.target.checked, completedQty: '', setQty: '' })}
                style={{ width: 16, height: 16 }}
              />
              <label htmlFor="setModeCheckbox" style={{ fontSize: 13, color: C.text, cursor: 'pointer' }}>
                検品・たたみの完了をセット単位で入力する
              </label>
            </div>
          )}
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 10 }}>
            <Field label="日付"><input type="date" className="fm-input" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} /></Field>
            <Field label="生産計画">
              <select className="fm-input" value={form.orderId} onChange={(e) => setForm({ ...form, orderId: e.target.value })}>
                {data.orders.map((o) => <option key={o.id} value={o.id}>{o.planNo} - {o.productName} ({lineById(o.lineId)?.name})</option>)}
              </select>
            </Field>
            <Field label="担当者">
              <input list="worker-options" className="fm-input" value={form.worker} onChange={(e) => setForm({ ...form, worker: e.target.value })} placeholder="例: 田中" />
              <datalist id="worker-options">
                {workerOptions.map((w) => <option key={w} value={w} />)}
              </datalist>
            </Field>
            <Field label="開始時間"><input type="time" className="fm-input" value={form.startTime} onChange={(e) => setForm({ ...form, startTime: e.target.value })} /></Field>
            <Field label="終了時間"><input type="time" className="fm-input" value={form.endTime} onChange={(e) => setForm({ ...form, endTime: e.target.value })} /></Field>
            {!form.setMode && (
              <Field label="完成数(枚)"><input type="number" className="fm-input" value={form.completedQty} onChange={(e) => setForm({ ...form, completedQty: e.target.value })} placeholder="450" /></Field>
            )}
            {form.setMode && (
              <>
                <Field label="セット品">
                  <select className="fm-input" value={form.setProductId} onChange={(e) => setForm({ ...form, setProductId: e.target.value })}>
                    {availableSetProducts.map((p) => <option key={p.id} value={p.id}>{p.productCode} - {p.productName}(1セット={p.piecesPerSet}枚)</option>)}
                  </select>
                </Field>
                <Field label="セット数"><input type="number" className="fm-input" value={form.setQty} onChange={(e) => setForm({ ...form, setQty: e.target.value })} placeholder="10" /></Field>
              </>
            )}
            <Field label={materialAuto && linkedProduct?.materialPerUnit > 0 ? '資材使用量(自動計算)' : '資材使用量(手動)'}>
              <div style={{ display: 'flex', gap: 6 }}>
                <input
                  type="number"
                  className="fm-input"
                  value={form.materialUsedLength}
                  onChange={(e) => { setMaterialAuto(false); setForm({ ...form, materialUsedLength: e.target.value }); }}
                  placeholder="30"
                />
                {linkedLot && unitLabel(linkedLot.unit) === '本' && (
                  <button
                    type="button"
                    onClick={() => { setMaterialAuto(false); setForm((f) => ({ ...f, materialUsedLength: String((Number(f.materialUsedLength) || 0) + 2) })); }}
                    className="fm-btn"
                    style={{ background: C.panelAlt2, border: `1px solid ${C.border}`, color: C.text, borderRadius: 6, padding: '0 10px', cursor: 'pointer', fontSize: 12, whiteSpace: 'nowrap' }}
                  >+2本</button>
                )}
              </div>
            </Field>
          </div>

          <div style={{ marginBottom: 10, paddingTop: 10, borderTop: `1px dashed ${C.border}` }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
              <span style={{ fontSize: 13, color: C.textDim, fontWeight: 600 }}>不良項目(任意・複数追加できます)</span>
              <span className="fm-mono" style={{ fontSize: 12, color: totalDefectQty > 0 ? C.red : C.textFaint }}>合計 {fmt(totalDefectQty)}枚</span>
            </div>
            {form.defectItems.length === 0 && (
              <div style={{ fontSize: 12, color: C.textFaint, marginBottom: 8 }}>不良がなければ何も追加しなくてOKです。</div>
            )}
            <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 8 }}>
              {form.defectItems.map((d, idx) => (
                <div key={d.id} style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                  <select className="fm-input" style={{ flex: 1 }} value={d.cause} onChange={(e) => updateDefectItem(idx, 'cause', e.target.value)}>
                    <option value="">原因を選択</option>
                    {DEFECT_CAUSES.map((c) => <option key={c} value={c}>{c}</option>)}
                  </select>
                  <input type="number" className="fm-input" style={{ width: 110 }} value={d.qty} onChange={(e) => updateDefectItem(idx, 'qty', e.target.value)} placeholder="数量" />
                  <IconBtn onClick={() => removeDefectItem(idx)} title="この項目を削除" danger />
                </div>
              ))}
            </div>
            <button
              type="button"
              onClick={addDefectItem}
              className="fm-btn"
              style={{ background: C.panelAlt2, border: `1px solid ${C.border}`, color: C.text, borderRadius: 6, padding: '6px 12px', cursor: 'pointer', fontSize: 12, display: 'inline-flex', alignItems: 'center', gap: 6 }}
            ><Plus size={13} /> 不良項目を追加</button>
          </div>
          {linkedLot && unitLabel(linkedLot.unit) === '本' && (
            <div style={{ fontSize: 11, color: C.textFaint, marginBottom: 8 }}>この資材は2本一組で機械にセットする運用のため、通常は2の倍数(2本・4本…)で記録します。</div>
          )}
          {form.setMode && selectedSetProduct && form.setQty !== '' && (
            <div style={{ fontSize: 12, color: C.teal, marginBottom: 8 }}>
              📦 {fmt(form.setQty)}セット × {fmt(selectedSetProduct.piecesPerSet)}枚 = バラ換算{fmt(baraEquivalent)}枚として実績を記録し、完成品在庫は「{selectedSetProduct.productName}」に{fmt(form.setQty)}セット加算、バラ品「{linkedProduct?.productName}」の完成品在庫から{fmt(baraEquivalent)}枚差し引かれます。
            </div>
          )}
          {form.setMode && linkedProduct && baraEquivalent > num(linkedProduct.finishedStock) && (
            <div style={{ color: C.amber, fontSize: 12, marginBottom: 8 }}>
              ⚠ バラ品「{linkedProduct.productName}」の完成品在庫(現在{fmt(linkedProduct.finishedStock)}枚)が必要数({fmt(baraEquivalent)}枚)より少ないため、記録すると在庫が0になります。
            </div>
          )}
          {linkedProduct?.materialPerUnit > 0 && !materialAuto && (
            <div style={{ fontSize: 11, color: C.textFaint, marginBottom: 8 }}>
              手動入力中です。 <button type="button" onClick={() => setMaterialAuto(true)} className="fm-btn" style={{ background: 'none', border: 'none', color: C.teal, cursor: 'pointer', padding: 0, textDecoration: 'underline', fontSize: 11 }}>自動計算に戻す</button>
            </div>
          )}
          {materialInsufficient && (
            <div style={{ color: C.red, fontSize: 12, marginBottom: 8 }}>
              ⚠ この計画の資材ロット(残量 {fmt(linkedLot.remainingLength)}{unitLabel(linkedLot.unit)})が不足する可能性があります。
            </div>
          )}
          {err && <div style={{ color: C.red, fontSize: 12, marginBottom: 8 }}>{err}</div>}
          <div style={{ display: 'flex', gap: 8 }}>
            <PrimaryButton onClick={submit}>{editingId ? <CheckCircle2 size={14} /> : <Plus size={14} />} {editingId ? '更新を保存' : '実績を記録'}</PrimaryButton>
            {editingId && <PrimaryButton onClick={cancelEdit} style={{ background: C.panelAlt2, color: C.text }}>キャンセル</PrimaryButton>}
          </div>
        </Panel>
      ) : (
        <LockedNotice text="実績の入力にはログインが必要です。" />
      )}

      {/* 計画別 進捗サマリ */}
      <Panel style={{ padding: 16 }}>
        <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 12 }}>計画別 進捗サマリ</div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {[...data.orders].map((o) => ({ o, st: orderStats(o.id) })).sort((a, b) => a.o.planNo.localeCompare(b.o.planNo)).map(({ o, st }) => {
            const done = o.targetQty > 0 && st.folded >= o.targetQty;
            const planProduct = o.productId ? productById(o.productId) : null;
            const unitLabel3 = planProduct?.isSet ? 'セット' : '枚';
            return (
              <div key={o.id} style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap', background: done ? 'rgba(79,179,116,0.08)' : C.panelAlt, border: `1px solid ${done ? C.greenDim : C.border}`, borderRadius: 8, padding: '10px 14px' }}>
                <span style={{ fontWeight: 600, fontSize: 13, minWidth: 190, display: 'flex', alignItems: 'center', gap: 6 }}>
                  {done && <CheckCircle2 size={14} color={C.green} />}
                  {o.planNo}
                  {planProduct?.productCode && <span className="fm-mono" style={{ fontSize: 11, color: C.textFaint }}>{planProduct.productCode}</span>}
                  <span style={{ color: C.textDim, fontWeight: 400 }}>{o.productName}</span>
                </span>
                <span style={{ fontSize: 12, color: C.textFaint }}>{lineById(o.lineId)?.name || '—'}</span>
                <div className="fm-mono" style={{ display: 'flex', gap: 14, fontSize: 12 }}>
                  <span style={{ color: C.green }}>完成 <b>{fmt(st.folded)}</b>/{fmt(o.targetQty)}{unitLabel3}</span>
                  {st.defect > 0 && <span style={{ color: C.red }}>不良 <b>{fmt(st.defect)}</b></span>}
                </div>
                <span style={{ fontSize: 11, color: C.textFaint, marginLeft: 'auto' }}>納期 {planEnd(o)}</span>
                {done && <Badge tone="green">完了</Badge>}
              </div>
            );
          })}
        </div>
      </Panel>

      <K981StatusPanel data={data} k981Status={k981Status} k981Busy={k981Busy} k981Last={k981Last} pushK981={pushK981} isEditor={isEditor} />
      <Panel style={{ padding: 16, overflowX: 'auto' }}>
        <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 12 }}>実績記録一覧</div>
        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13, minWidth: 780 }}>
          <thead>
            <tr style={{ textAlign: 'left', color: C.textDim, borderBottom: `1px solid ${C.border}` }}>
              {['日付', 'ライン', '計画', '商品コード', '担当者', 'かかった時間', '完成数', '不良', ...((data.k981 || {}).enabled ? ['kintone'] : []), ''].map((h) => <th key={h} style={{ padding: '6px 8px', fontWeight: 500 }}>{h}</th>)}
            </tr>
          </thead>
          <tbody>
            {sortedRecords.length === 0 && (
              <tr><td colSpan={9} style={{ padding: 14, color: C.textFaint }}>実績記録がありません。</td></tr>
            )}
            {visibleRecords.map((r) => {
              const planProduct = orderById(r.orderId)?.productId ? productById(orderById(r.orderId).productId) : null;
              return (
              <tr key={r.id} style={{ borderBottom: `1px solid ${C.border}`, background: r.id === editingId ? C.tealDim + '55' : 'transparent' }}>
                <td className="fm-mono" style={{ padding: '8px' }}>{r.date}</td>
                <td style={{ padding: '8px' }}>{lineById(r.lineId)?.name || '—'}</td>
                <td style={{ padding: '8px' }}>{orderById(r.orderId)?.planNo || '—'}</td>
                <td className="fm-mono" style={{ padding: '8px', fontSize: 12, color: C.textDim }}>{planProduct?.productCode || '—'}</td>
                <td style={{ padding: '8px' }}>{r.worker || '—'}</td>
                <td className="fm-mono" style={{ padding: '8px', fontSize: 12, color: C.textDim, whiteSpace: 'nowrap' }}>
                  {workDuration(r.startTime, r.endTime) || '—'}
                </td>
                <td className="fm-mono" style={{ padding: '8px' }}>
                  {fmt(r.foldedQty)}
                  {r.setProductId && r.setQty ? <span style={{ fontSize: 11, color: C.textFaint }}> ({fmt(r.setQty)}セット)</span> : null}
                </td>
                <td style={{ padding: '8px' }}>
                  {num(r.defectQty) > 0 ? (
                    <div>
                      <span className="fm-mono" style={{ color: C.red }}>{fmt(r.defectQty)}</span>
                      {Array.isArray(r.defectItems) && r.defectItems.length > 0 && (
                        <div style={{ fontSize: 11, color: C.textFaint, marginTop: 2 }}>
                          {r.defectItems.map((d, i) => `${d.cause || '未分類'}:${fmt(d.qty)}`).join(' / ')}
                        </div>
                      )}
                    </div>
                  ) : <span className="fm-mono" style={{ color: C.textDim }}>0</span>}
                </td>
                {(data.k981 || {}).enabled && (
                  <td style={{ padding: '8px' }}>
                    {!k981Target(data.k981, r) ? <span style={{ color: C.textFaint }}>—</span>
                      : (k981Status && k981Status[r.id] && k981Status[r.id].error) ? <span title={k981Status[r.id].error}><Badge tone="red">未送信</Badge></span>
                      : (k981Status && k981Status[r.id] && k981Status[r.id].kintone_id) ? <Badge tone="green">{'#' + k981Status[r.id].kintone_id}</Badge>
                      : <Badge tone="amber">未登録</Badge>}
                  </td>
                )}
                <td style={{ padding: '8px', display: 'flex', gap: 2 }}>
                  {isEditor && <IconBtn onClick={() => startEdit(r)} title="編集" icon={Pencil} />}
                  {isEditor && <IconBtn onClick={() => removeRecord(r.id)} title="削除" danger />}
                </td>
              </tr>
              );
            })}
          </tbody>
        </table>
        {sortedRecords.length > visibleRecords.length && (
          <div style={{ textAlign: 'center', marginTop: 10 }}>
            <PrimaryButton onClick={() => setShowAllRecords(true)} style={{ background: C.panelAlt2, color: C.text }}>
              もっと見る(残り{sortedRecords.length - visibleRecords.length}件)
            </PrimaryButton>
          </div>
        )}
        {showAllRecords && sortedRecords.length > 20 && (
          <div style={{ textAlign: 'center', marginTop: 10 }}>
            <PrimaryButton onClick={() => setShowAllRecords(false)} style={{ background: C.panelAlt2, color: C.text }}>
              最新20件だけ表示
            </PrimaryButton>
          </div>
        )}
      </Panel>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* カレンダータブ                                                       */
/* ------------------------------------------------------------------ */
function CalendarTab({ data, lineById, orderById, orderStats, productById }) {
  const now = new Date();
  const [year, setYear] = useState(now.getFullYear());
  const [month, setMonth] = useState(now.getMonth());
  const [selected, setSelected] = useState(todayStr());

  const cells = useMemo(() => buildMonthGrid(year, month), [year, month]);
  const weekdays = ['日', '月', '火', '水', '木', '金', '土'];

  const dayTotals = useCallback((dateStr) => {
    const recs = data.records.filter((r) => r.date === dateStr);
    return recs.reduce((acc, r) => ({
      machineUp: acc.machineUp + num(r.machineUpQty),
      inspected: acc.inspected + num(r.inspectedQty),
      folded: acc.folded + num(r.foldedQty),
      defect: acc.defect + num(r.defectQty),
      count: acc.count + 1,
    }), { machineUp: 0, inspected: 0, folded: 0, defect: 0, count: 0 });
  }, [data]);

  const prevMonth = () => { if (month === 0) { setMonth(11); setYear((y) => y - 1); } else setMonth((m) => m - 1); };
  const nextMonth = () => { if (month === 11) { setMonth(0); setYear((y) => y + 1); } else setMonth((m) => m + 1); };
  const goToday = () => { setYear(now.getFullYear()); setMonth(now.getMonth()); setSelected(todayStr()); };

  const selectedRecords = data.records.filter((r) => r.date === selected);
  const selectedTotals = dayTotals(selected);

  const completedOnSelected = data.orders.filter((o) => {
    if (o.targetQty <= 0) return false;
    const st = orderStats(o.id);
    if (st.folded < o.targetQty) return false;
    return selectedRecords.some((r) => r.orderId === o.id);
  });

  // その日が納期の計画(達成状況の参考表示用)
  const duePlansOnSelected = data.orders.filter((o) => o.dueDate === selected);

  // その日が生産期間内(開始日〜終了日)の計画(1日あたり計画 vs 実績の比較用)
  const activePlansOnSelected = data.orders.filter((o) => planActiveOn(o, selected));

  // 表示中の月に生産期間が重なる計画(ガントチャート表示用)
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const monthStartStr = toDateStr(year, month, 1);
  const monthEndStr = toDateStr(year, month, daysInMonth);
  const ganttPlans = useMemo(() => data.orders
    .filter((o) => planEnd(o) >= monthStartStr && planStart(o) <= monthEndStr)
    .map((o) => {
      const s = planStart(o) < monthStartStr ? 1 : parseDate(planStart(o)).getDate();
      const e = planEnd(o) > monthEndStr ? daysInMonth : parseDate(planEnd(o)).getDate();
      const st = orderStats(o.id);
      const done = o.targetQty > 0 && st.folded >= o.targetQty;
      const recDays = [...new Set(
        data.records
          .filter((r) => r.orderId === o.id && r.date >= monthStartStr && r.date <= monthEndStr)
          .map((r) => parseDate(r.date).getDate())
      )];
      return { o, s, e, done, recDays, st };
    }), [data.orders, data.records, monthStartStr, monthEndStr, daysInMonth, orderStats]);

  // 表示中の月に納期がある計画の合計 vs その月の実績合計(ざっくりしたペース比較)
  const monthDateSet = useMemo(() => new Set(cells.filter((d) => d !== null).map((d) => toDateStr(year, month, d))), [cells, year, month]);
  const monthDuePlans = data.orders.filter((o) => monthDateSet.has(o.dueDate));
  const monthPlannedQty = monthDuePlans.reduce((s, o) => s + num(o.targetQty), 0);
  const monthActualQty = data.records.filter((r) => monthDateSet.has(r.date)).reduce((s, r) => s + num(r.foldedQty), 0);
  const monthAchievement = monthPlannedQty > 0 ? (monthActualQty / monthPlannedQty) * 100 : null;

  const lineBreak = data.lines.map((line) => {
    const recs = selectedRecords.filter((r) => r.lineId === line.id);
    const t = recs.reduce((acc, r) => ({
      machineUp: acc.machineUp + num(r.machineUpQty),
      inspected: acc.inspected + num(r.inspectedQty),
      folded: acc.folded + num(r.foldedQty),
      defect: acc.defect + num(r.defectQty),
    }), { machineUp: 0, inspected: 0, folded: 0, defect: 0 });
    return { line, t, recs };
  });

  const workerMap = {};
  selectedRecords.forEach((r) => {
    const w = r.worker || '未記入';
    if (!workerMap[w]) workerMap[w] = { machineUp: 0, folded: 0, defect: 0 };
    workerMap[w].machineUp += num(r.machineUpQty);
    workerMap[w].folded += num(r.foldedQty);
    workerMap[w].defect += num(r.defectQty);
  });

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
        <StatCard icon={ClipboardList} label="今月納期の計画数量" value={fmt(monthPlannedQty)} unit="枚" tone="amber" />
        <StatCard icon={CheckCircle2} label="今月の実績(たたみ済み)" value={fmt(monthActualQty)} unit="枚" tone="green" />
        <StatCard icon={Gauge} label="達成率" value={monthAchievement === null ? '—' : monthAchievement.toFixed(0)} unit={monthAchievement === null ? '' : '%'} tone={monthAchievement !== null && monthAchievement < 80 ? 'red' : 'teal'} />
      </div>

      <Panel style={{ padding: 16 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 8, marginBottom: 12 }}>
          <div className="fm-display" style={{ fontSize: 18, fontWeight: 700 }}>{year}年 {month + 1}月</div>
          <div style={{ display: 'flex', gap: 6 }}>
            <PrimaryButton onClick={prevMonth} style={{ background: C.panelAlt2, color: C.text }}>‹ 前月</PrimaryButton>
            <PrimaryButton onClick={goToday} style={{ background: C.panelAlt2, color: C.text }}>今日</PrimaryButton>
            <PrimaryButton onClick={nextMonth} style={{ background: C.panelAlt2, color: C.text }}>次月 ›</PrimaryButton>
          </div>
        </div>
        <div style={{ display: 'flex', gap: 14, marginBottom: 10, fontSize: 11, color: C.textFaint, alignItems: 'center' }}>
          <span style={{ display: 'flex', alignItems: 'center', gap: 4 }}><span style={{ width: 6, height: 6, borderRadius: 999, background: C.green }} /> 実績あり</span>
          <span style={{ display: 'flex', alignItems: 'center', gap: 4 }}>🏁 この日が納期の計画あり</span>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 4, marginBottom: 4 }}>
          {weekdays.map((w) => <div key={w} style={{ textAlign: 'center', fontSize: 11, color: C.textFaint, padding: '4px 0' }}>{w}</div>)}
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 4 }}>
          {cells.map((d, i) => {
            if (d === null) return <div key={i} />;
            const dateStr = toDateStr(year, month, d);
            const t = dayTotals(dateStr);
            const isSelected = dateStr === selected;
            const isToday = dateStr === todayStr();
            const dRate = t.machineUp > 0 ? (t.defect / t.machineUp) * 100 : 0;
            const hasActivity = t.count > 0;
            const duePlansCount = data.orders.filter((o) => o.dueDate === dateStr).length;
            return (
              <button
                key={i}
                onClick={() => setSelected(dateStr)}
                className="fm-btn"
                style={{
                  textAlign: 'left',
                  border: isSelected ? `1.5px solid ${C.teal}` : duePlansCount > 0 ? `1px solid ${C.amberDim}` : `1px solid ${C.border}`,
                  background: isSelected ? C.tealDim : C.panelAlt,
                  borderRadius: 8, padding: '6px 8px', minHeight: 56,
                  cursor: 'pointer', color: C.text,
                }}
              >
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <span className="fm-mono" style={{ fontSize: 12, color: isToday ? C.teal : C.textDim, fontWeight: isToday ? 700 : 400 }}>{d}</span>
                  <span style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                    {duePlansCount > 0 && <span style={{ fontSize: 10 }} title="この日が納期の計画あり">🏁</span>}
                    {hasActivity && <span style={{ width: 6, height: 6, borderRadius: 999, background: dRate > 5 ? C.red : C.green }} />}
                  </span>
                </div>
                {hasActivity && (
                  <div className="fm-mono" style={{ fontSize: 11, color: C.textDim, marginTop: 4 }}>
                    完成 <span style={{ color: C.green }}>{fmt(t.folded)}</span>
                  </div>
                )}
              </button>
            );
          })}
        </div>
      </Panel>

      <Panel style={{ padding: 16, overflowX: 'auto' }}>
        <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 4 }}>生産計画スケジュール({year}年{month + 1}月)</div>
        <div style={{ fontSize: 12, color: C.textFaint, marginBottom: 12 }}>バーが計画の生産期間(開始日〜終了日)、オレンジの縦線がその日に実績が入力されたことを示します。</div>
        {ganttPlans.length === 0 ? (
          <div style={{ fontSize: 13, color: C.textFaint }}>この月に該当する生産計画はありません。</div>
        ) : (
          <div style={{ minWidth: 640 }}>
            <div style={{ display: 'flex', marginBottom: 6 }}>
              <div style={{ width: 170, flexShrink: 0 }} />
              <div style={{ position: 'relative', flex: 1, height: 14 }}>
                {Array.from({ length: daysInMonth }, (_, i) => i + 1)
                  .filter((d) => d === 1 || d % (daysInMonth > 20 ? 5 : 2) === 0)
                  .map((d) => (
                    <span key={d} className="fm-mono" style={{ position: 'absolute', left: `${((d - 1) / daysInMonth) * 100}%`, fontSize: 9, color: C.textFaint }}>{d}</span>
                  ))}
              </div>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {ganttPlans.map(({ o, s, e, done, recDays, st }) => (
                <div key={o.id} style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                  <div style={{ width: 170, flexShrink: 0, fontSize: 11, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }} title={`${o.planNo} ${o.productName}`}>
                    <span style={{ fontWeight: 600 }}>{o.planNo}</span> <span style={{ color: C.textFaint }}>{o.productName}</span>
                  </div>
                  <div style={{ position: 'relative', flex: 1, height: 18, background: C.bg, borderRadius: 4, border: `1px solid ${C.border}` }}>
                    <div
                      style={{
                        position: 'absolute', top: 2, bottom: 2,
                        left: `${((s - 1) / daysInMonth) * 100}%`,
                        width: `${((e - s + 1) / daysInMonth) * 100}%`,
                        borderRadius: 3, background: done ? C.green : C.teal, opacity: 0.85,
                      }}
                      title={`${planStart(o)} 〜 ${planEnd(o)} / 実績 ${fmt(st.folded)}枚`}
                    />
                    {recDays.map((d) => (
                      <div
                        key={d}
                        style={{ position: 'absolute', top: -2, bottom: -2, left: `${((d - 0.5) / daysInMonth) * 100}%`, width: 2, background: C.amber }}
                        title={`${toDateStr(year, month, d)} に実績あり`}
                      />
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
      </Panel>

      <Panel style={{ padding: 16 }}>
        <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 12 }}>{selected} の実績詳細</div>
        {selectedRecords.length === 0 ? (
          <div style={{ fontSize: 13, color: C.textFaint }}>この日の実績記録はありません。カレンダーの日付をクリックして確認できます。</div>
        ) : (
          <>
            <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 14 }}>
              <StatCard icon={Activity} label="機械上がり" value={fmt(selectedTotals.machineUp)} unit="枚" tone="teal" />
              <StatCard icon={CheckCircle2} label="たたみ済み" value={fmt(selectedTotals.folded)} unit="枚" tone="green" />
              <StatCard icon={AlertTriangle} label="不良数" value={fmt(selectedTotals.defect)} unit="枚" tone="red" />
            </div>

            {completedOnSelected.length > 0 && (
              <div style={{ marginBottom: 16 }}>
                <div className="fm-display" style={{ fontSize: 13, fontWeight: 600, marginBottom: 8, color: C.textDim, display: 'flex', alignItems: 'center', gap: 6 }}>
                  <CheckCircle2 size={13} color={C.green} /> この日に完了した計画
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                  {completedOnSelected.map((o) => {
                    const planProduct = o.productId ? productById(o.productId) : null;
                    const unitLabel3 = planProduct?.isSet ? 'セット' : '枚';
                    return (
                      <div key={o.id} className="fm-mono" style={{ fontSize: 12, background: 'rgba(79,179,116,0.08)', borderRadius: 6, padding: '6px 10px', display: 'flex', gap: 10, alignItems: 'center' }}>
                        <span style={{ fontFamily: 'Inter', fontWeight: 600 }}>{o.planNo}</span>
                        <span style={{ fontFamily: 'Inter', color: C.textDim }}>{o.productName}</span>
                        <span style={{ color: C.green, marginLeft: 'auto' }}>{fmt(o.targetQty)}{unitLabel3} 完成</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {duePlansOnSelected.length > 0 && (
              <div style={{ marginBottom: 16 }}>
                <div className="fm-display" style={{ fontSize: 13, fontWeight: 600, marginBottom: 8, color: C.textDim, display: 'flex', alignItems: 'center', gap: 6 }}>
                  🏁 この日が納期の計画(累計 計画 vs 実績)
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                  {duePlansOnSelected.map((o) => {
                    const st = orderStats(o.id);
                    const ratio = pct(st.folded, o.targetQty);
                    const done = o.targetQty > 0 && st.folded >= o.targetQty;
                    const late = !done && selected < todayStr();
                    const tone = done ? 'green' : late ? 'red' : 'amber';
                    const planProduct = o.productId ? productById(o.productId) : null;
                    const unitLabel3 = planProduct?.isSet ? 'セット' : '枚';
                    return (
                      <div key={o.id} style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap', background: C.panelAlt, borderRadius: 6, padding: '8px 10px' }}>
                        <span style={{ fontSize: 12, fontWeight: 600, minWidth: 140 }}>{o.planNo} <span style={{ color: C.textDim, fontWeight: 400 }}>{o.productName}</span></span>
                        <div style={{ flex: 1, minWidth: 100, maxWidth: 200 }}><ProgressBar ratio={ratio} color={done ? C.green : late ? C.red : C.amber} /></div>
                        <span className="fm-mono" style={{ fontSize: 11, color: C.textDim }}>実績 {fmt(st.folded)} / 計画 {fmt(o.targetQty)}{unitLabel3}</span>
                        <Badge tone={tone}>{done ? '達成' : late ? '未達(納期超過)' : '進行中'}</Badge>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {activePlansOnSelected.length > 0 && (
              <div style={{ marginBottom: 16 }}>
                <div className="fm-display" style={{ fontSize: 13, fontWeight: 600, marginBottom: 8, color: C.textDim, display: 'flex', alignItems: 'center', gap: 6 }}>
                  📅 この日の生産計画(1日あたり計画 vs この日の実績)
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                  {activePlansOnSelected.map((o) => {
                    const dailyTarget = planDailyTarget(o);
                    const dayRecs = data.records.filter((r) => r.orderId === o.id && r.date === selected);
                    const dayActual = dayRecs.reduce((s, r) => s + num(r.machineUpQty), 0);
                    const dayFolded = dayRecs.reduce((s, r) => s + num(r.foldedQty), 0);
                    const ratio = pct(dayActual, dailyTarget);
                    const behind = dailyTarget > 0 && dayActual < dailyTarget * 0.8;
                    const tone = dailyTarget === 0 ? 'dim' : behind ? 'red' : 'green';
                    return (
                      <div key={o.id} style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap', background: C.panelAlt, borderRadius: 6, padding: '8px 10px' }}>
                        <span style={{ fontSize: 12, fontWeight: 600, minWidth: 140 }}>{o.planNo} <span style={{ color: C.textDim, fontWeight: 400 }}>{o.productName}</span></span>
                        <span style={{ fontSize: 10, color: C.textFaint, whiteSpace: 'nowrap' }}>{planStart(o)}〜{planEnd(o)}</span>
                        <div style={{ flex: 1, minWidth: 100, maxWidth: 200 }}><ProgressBar ratio={ratio} color={behind ? C.red : C.teal} /></div>
                        <span className="fm-mono" style={{ fontSize: 11, color: C.textDim, whiteSpace: 'nowrap' }}>
                          実績(機械上がり) {fmt(dayActual)} / 1日計画 {fmt(Math.round(dailyTarget))}枚
                        </span>
                        <span className="fm-mono" style={{ fontSize: 10, color: C.textFaint }}>たたみ済 {fmt(dayFolded)}枚</span>
                        <Badge tone={tone}>{dailyTarget === 0 ? '—' : behind ? 'ペース遅れ' : '順調'}</Badge>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            <div className="fm-display" style={{ fontSize: 13, fontWeight: 600, marginBottom: 8, color: C.textDim }}>ライン別</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 18 }}>
              {lineBreak.filter((lb) => lb.recs.length > 0).map(({ line, t }) => (
                <div key={line.id} className="fm-mono" style={{ display: 'flex', gap: 12, fontSize: 12, alignItems: 'center', flexWrap: 'wrap', background: C.panelAlt, borderRadius: 6, padding: '6px 10px' }}>
                  <span style={{ fontFamily: 'Inter', fontWeight: 600, minWidth: 80 }}>{line.name}</span>
                  <span>上がり {fmt(t.machineUp)}</span>
                  <span>検品 {fmt(t.inspected)}</span>
                  <span style={{ color: C.green }}>たたみ {fmt(t.folded)}</span>
                  <span style={{ color: C.red }}>不良 {fmt(t.defect)}</span>
                </div>
              ))}
            </div>

            <div className="fm-display" style={{ fontSize: 13, fontWeight: 600, marginBottom: 8, color: C.textDim }}>担当者別</div>
            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13 }}>
              <thead>
                <tr style={{ textAlign: 'left', color: C.textDim, borderBottom: `1px solid ${C.border}` }}>
                  {['担当者', '機械上がり', 'たたみ済み', '不良'].map((h) => <th key={h} style={{ padding: '6px 8px', fontWeight: 500 }}>{h}</th>)}
                </tr>
              </thead>
              <tbody>
                {Object.entries(workerMap).map(([w, v]) => (
                  <tr key={w} style={{ borderBottom: `1px solid ${C.border}` }}>
                    <td style={{ padding: '8px', display: 'flex', alignItems: 'center', gap: 6 }}><User size={13} color={C.textDim} />{w}</td>
                    <td className="fm-mono" style={{ padding: '8px' }}>{fmt(v.machineUp)}</td>
                    <td className="fm-mono" style={{ padding: '8px', color: C.green }}>{fmt(v.folded)}</td>
                    <td className="fm-mono" style={{ padding: '8px', color: v.defect > 0 ? C.red : C.textDim }}>{fmt(v.defect)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </>
        )}
      </Panel>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* タブ管理タブ                                                         */
/* ------------------------------------------------------------------ */
function FoldSettings({ data, setFold, isEditor }) {
  if (!isEditor) return null;
  const lineId = foldLineIdOf(data);
  const fromLogi = data.records.filter((r) => r.source === 'logilink').length;
  return (
    <Panel style={{ padding: 16, marginBottom: 16 }}>
      <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 4 }}>ロジリンクの現場入力(たたみ数)</div>
      <div style={{ fontSize: 12, color: C.textFaint, marginBottom: 10 }}>
        ロジリンクの作業記録で「生産たたみ、パッキング」を終えるときに入れたたたみ数を、ここで選んだラインの生産実績として取り込みます(生産管理を開いている間、1分ごと)。現場で選べる生産計画は、このラインの終わっていない計画です。これまでに取り込んだ実績: {fromLogi}件
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
        <span style={{ fontSize: 13, minWidth: 120 }}>取り込み先のライン</span>
        <select className="fm-input" style={{ width: 240 }} value={lineId} onChange={(e) => setFold({ lineId: e.target.value })}>
          {!lineId && <option value="">選んでください</option>}
          {data.lines.map((l) => <option key={l.id} value={l.id}>{l.name}</option>)}
        </select>
      </div>
    </Panel>
  );
}

function K981Settings({ data, setK981, isEditor }) {
  const cfg = data.k981 || {};
  const [opts, setOpts] = useState(null); // kintone の製造分類の選択肢など
  const [msg, setMsg] = useState('');
  const [newName, setNewName] = useState('');
  if (!isEditor) return null;
  const readFields = async () => {
    setMsg('kintone を読んでいます…');
    const r = await callK981({ action: 'fields' });
    if (!r.ok) { setMsg('⚠ ' + r.error); return; }
    setOpts(r);
    setMsg(r.missing && r.missing.length ? `⚠ 981 に「${r.missing.join('」「')}」が見つかりません` : `製造分類の選択肢: ${r.categoryOptions.join('・') || '(なし。文字で入れてください)'}`);
  };
  const workerUser = cfg.workerUser || {};
  const lineCategory = cfg.lineCategory || {};
  const names = [...new Set([
    ...data.records.flatMap((r) => String(r.worker || '').split(/[・、,，\/／\s]+/).map((x) => x.replace(/さん$/, '').trim())),
    ...Object.keys(workerUser),
  ].filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ja'));
  const setWorker = (n, v) => { const w = { ...workerUser }; if (v) w[n] = v.trim(); else delete w[n]; setK981({ workerUser: w }); };
  const setLine = (id, v) => { const l = { ...lineCategory }; if (v) l[id] = v; else delete l[id]; setK981({ lineCategory: l }); };
  return (
    <Panel style={{ padding: 16, marginBottom: 16 }}>
      <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 4 }}>kintone 生産実績アプリ(981)への登録</div>
      <div style={{ fontSize: 12, color: C.textFaint, marginBottom: 12 }}>
        生産実績を保存すると、kintone の生産実績アプリにも同じ内容を登録します(kintone への二重入力が要らなくなります)。開始日より前の実績は送りません(kintone に直接入れた分と重ならないように)。
      </div>
      <div style={{ display: 'flex', gap: 16, alignItems: 'flex-end', flexWrap: 'wrap', marginBottom: 12 }}>
        <label style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 13 }}>
          <input type="checkbox" checked={!!cfg.enabled} onChange={(e) => setK981({ enabled: e.target.checked, startDate: cfg.startDate || todayStr() })} /> 使う
        </label>
        <Field label="開始日(この日以降の実績を送る)"><input type="date" className="fm-input" value={cfg.startDate || ''} onChange={(e) => setK981({ startDate: e.target.value })} /></Field>
        <PrimaryButton onClick={readFields} style={{ background: C.panelAlt2, color: C.text }}>kintone の項目を確かめる</PrimaryButton>
      </div>
      {msg && <div style={{ fontSize: 12, color: msg.startsWith('⚠') ? C.red : C.textDim, marginBottom: 10 }}>{msg}</div>}
      <div style={{ fontSize: 13, fontWeight: 600, margin: '8px 0 4px' }}>ラインと製造分類</div>
      <div style={{ fontSize: 12, color: C.textFaint, marginBottom: 6 }}>製造分類を選んだラインの実績だけを送ります(たたみ・検品のラインは「送らない」のまま)。</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 12 }}>
        {data.lines.map((l) => (
          <div key={l.id} style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <span style={{ fontSize: 13, minWidth: 180 }}>{l.name}</span>
            {opts && opts.categoryOptions && opts.categoryOptions.length ? (
              <select className="fm-input" style={{ width: 220 }} value={lineCategory[l.id] || ''} onChange={(e) => setLine(l.id, e.target.value)}>
                <option value="">送らない</option>
                {opts.categoryOptions.map((o) => <option key={o} value={o}>{o}</option>)}
              </select>
            ) : (
              <input className="fm-input" style={{ width: 220 }} placeholder="送らない(製造分類を入れると送る)" value={lineCategory[l.id] || ''} onChange={(e) => setLine(l.id, e.target.value)} />
            )}
          </div>
        ))}
      </div>
      <div style={{ fontSize: 13, fontWeight: 600, margin: '8px 0 4px' }}>作業者の対応表</div>
      <div style={{ fontSize: 12, color: C.textFaint, marginBottom: 6 }}>担当者の名前と、kintone のログイン名。kintone のアカウントが無い人は空のままにすると、981 の「備考」に名前が入ります。</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
        {names.map((n) => (
          <div key={n} style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <span style={{ fontSize: 13, minWidth: 120 }}>{n}</span>
            <input className="fm-input" style={{ width: 280 }} placeholder="kintone のログイン名(無ければ空)" value={workerUser[n] || ''} onChange={(e) => setWorker(n, e.target.value)} />
          </div>
        ))}
      </div>
    </Panel>
  );
}

function SettingsTab({ TABS, tabOrder, updateTabOrder, resetTabOrder, isEditor }) {
  const ordered = [
    ...tabOrder.map((id) => TABS.find((t) => t.id === id)).filter(Boolean),
    ...TABS.filter((t) => !tabOrder.includes(t.id)),
  ];

  const move = (index, dir) => {
    const target = index + dir;
    if (target < 0 || target >= ordered.length) return;
    const newOrder = ordered.map((t) => t.id);
    [newOrder[index], newOrder[target]] = [newOrder[target], newOrder[index]];
    updateTabOrder(newOrder);
  };

  if (!isEditor) {
    return (
      <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
        <LockedNotice text="タブの並び替えにはログインが必要です。" />
      </div>
    );
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <Panel style={{ padding: 16 }}>
        <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 4 }}>タブの並び替え</div>
        <div style={{ fontSize: 12, color: C.textFaint, marginBottom: 12 }}>上下ボタンでタブの表示順を変更できます。よく使うタブを左側(上)に置くと使いやすくなります。</div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 12 }}>
          {ordered.map((t, i) => {
            const Icon = t.icon;
            return (
              <div key={t.id} style={{ display: 'flex', alignItems: 'center', gap: 10, background: C.panelAlt, border: `1px solid ${C.border}`, borderRadius: 8, padding: '8px 12px' }}>
                <span className="fm-mono" style={{ fontSize: 11, color: C.textFaint, minWidth: 20 }}>{i + 1}</span>
                <Icon size={15} color={C.teal} />
                <span style={{ fontSize: 13, flex: 1 }}>{t.label}</span>
                <IconBtn onClick={() => move(i, -1)} title="上へ" icon={ArrowUp} />
                <IconBtn onClick={() => move(i, 1)} title="下へ" icon={ArrowDown} />
              </div>
            );
          })}
        </div>
        <PrimaryButton onClick={resetTabOrder} style={{ background: C.panelAlt2, color: C.text }}>初期の並びに戻す</PrimaryButton>
      </Panel>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* 品質管理タブ                                                         */
/* ------------------------------------------------------------------ */
function QualityTab({ data, lineById, orderById }) {
  const defectRecords = data.records.filter((r) => num(r.defectQty) > 0);
  const totalMachineUp = data.records.reduce((a, r) => a + num(r.machineUpQty), 0);
  const totalDefect = data.records.reduce((a, r) => a + num(r.defectQty), 0);
  const overallRate = totalMachineUp > 0 ? (totalDefect / totalMachineUp) * 100 : 0;

  const byCause = useMemo(() => {
    const map = {};
    data.records.forEach((r) => {
      const items = Array.isArray(r.defectItems) && r.defectItems.length > 0
        ? r.defectItems
        : (num(r.defectQty) > 0 ? [{ cause: r.defectCause, qty: r.defectQty }] : []);
      items.forEach((it) => {
        const key = it.cause || '未分類';
        map[key] = (map[key] || 0) + num(it.qty);
      });
    });
    return Object.entries(map).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
  }, [data.records]);

  const chartColors = [C.red, C.amber, C.teal, C.green, C.textDim, C.borderLight];

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
        <StatCard icon={Activity} label="累計 機械上がり" value={fmt(totalMachineUp)} unit="枚" tone="teal" />
        <StatCard icon={AlertTriangle} label="累計 不良数" value={fmt(totalDefect)} unit="枚" tone="red" />
        <StatCard icon={Gauge} label="総合不良率" value={overallRate.toFixed(2)} unit="%" tone={overallRate > 5 ? 'red' : 'teal'} />
      </div>

      <Panel style={{ padding: 16 }}>
        <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 12 }}>不良原因別 内訳</div>
        {byCause.length === 0 ? (
          <div style={{ fontSize: 13, color: C.textFaint }}>不良記録がまだありません。</div>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {byCause.map((entry, i) => {
              const max = byCause[0].value || 1;
              return (
                <div key={entry.name} style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                  <span style={{ fontSize: 12, color: C.textDim, minWidth: 100 }}>{entry.name}</span>
                  <div style={{ flex: 1 }}><ProgressBar ratio={(entry.value / max) * 100} color={chartColors[i % chartColors.length]} height={10} /></div>
                  <span className="fm-mono" style={{ fontSize: 12, color: C.text, minWidth: 40, textAlign: 'right' }}>{fmt(entry.value)}</span>
                </div>
              );
            })}
          </div>
        )}
      </Panel>

      <Panel style={{ padding: 16, overflowX: 'auto' }}>
        <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 12 }}>不良記録一覧</div>
        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13, minWidth: 700 }}>
          <thead>
            <tr style={{ textAlign: 'left', color: C.textDim, borderBottom: `1px solid ${C.border}` }}>
              {['日付', 'ライン', '計画', '不良数', '内訳'].map((h) => <th key={h} style={{ padding: '6px 8px', fontWeight: 500 }}>{h}</th>)}
            </tr>
          </thead>
          <tbody>
            {defectRecords.length === 0 && (
              <tr><td colSpan={5} style={{ padding: 14, color: C.textFaint }}>不良記録がありません。</td></tr>
            )}
            {[...defectRecords].sort((a, b) => (a.date < b.date ? 1 : -1)).map((r) => {
              const items = Array.isArray(r.defectItems) && r.defectItems.length > 0
                ? r.defectItems
                : (num(r.defectQty) > 0 ? [{ cause: r.defectCause, qty: r.defectQty }] : []);
              return (
                <tr key={r.id} style={{ borderBottom: `1px solid ${C.border}` }}>
                  <td className="fm-mono" style={{ padding: '8px' }}>{r.date}</td>
                  <td style={{ padding: '8px' }}>{lineById(r.lineId)?.name || '—'}</td>
                  <td style={{ padding: '8px' }}>{orderById(r.orderId)?.planNo || '—'}</td>
                  <td className="fm-mono" style={{ padding: '8px', color: C.red }}>{fmt(r.defectQty)}</td>
                  <td style={{ padding: '8px' }}>
                    <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                      {items.map((it, i) => (
                        <Badge key={i} tone="red">{it.cause || '未分類'} {fmt(it.qty)}</Badge>
                      ))}
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </Panel>
    </div>
  );
}

  if (!CONFIGURED) return <SetupGuide />;
  return <App />;
