<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>物流センター 作業割り当てボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* ベース(白・薄いグレー・濃いグレー) */
  --ink-950:#0B0E14;
  --ink-900:#101828;
  --ink-800:#1D2939;
  --ink-700:#344054;
  --ink-600:#475467;
  --paper-50:#FFFFFF;
  --paper-100:#F9FAFB;
  --paper-200:#F0F2F5;
  --paper-line:#E4E7EC;
  /* アクセント(単一色: インディゴ)。旧amber変数名を維持したまま新しい単色アクセントに割り当てる */
  --amber-500:#4F46E5;
  --amber-600:#4338CA;
  /* ステータス色: 緑=完了、青=作業中、黄=注意、赤=遅延 */
  --green-500:#12B76A;
  --teal-500:#2E90FA;
  --rust-600:#F04438;
  --warning-500:#F79009;
  --warning-600:#B54708;
  --indigo-500:#4F46E5;
  --pink-500:#EE46BC;
  --slate-500:#667085;
  --slate-300:#98A2B3;
  --ink-text:#101828;
  --shadow-sm:0 1px 2px rgba(16,24,40,.06);
  --shadow-md:0 2px 8px rgba(16,24,40,.08);
  --shadow-lg:0 8px 24px rgba(16,24,40,.12);
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:14px;
  --font-display:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font-body);
  font-variant-numeric:tabular-nums;
  background:var(--paper-100);
  color:var(--ink-text);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--paper-line);border-radius:6px;}

#app{min-height:100vh;}

/* ---------- ROLE GATE ---------- */
.gate{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--paper-100);
  padding:32px 16px;text-align:center;
}
.gate-eyebrow{
  font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;color:var(--amber-500);
  text-transform:uppercase;margin-bottom:10px;font-weight:600;
}
.gate-title{
  font-family:var(--font-display);font-weight:700;font-size:clamp(24px,4vw,34px);
  color:var(--ink-900);margin:0 0 8px;letter-spacing:-.01em;
}
.gate-sub{font-size:14px;color:var(--slate-500);margin:0 0 36px;max-width:440px;line-height:1.6;}
.gate-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;width:100%;max-width:920px;}
.gate-card{
  position:relative;background:var(--paper-50);border:1px solid var(--paper-line);border-radius:var(--radius-lg,14px);padding:26px 20px;
  display:flex;flex-direction:column;align-items:center;gap:10px;transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease;
  box-shadow:var(--shadow-sm);
}
.gate-card:hover{transform:translateY(-2px);border-color:var(--amber-500);box-shadow:var(--shadow-md);}
.gate-card:active{transform:translateY(0) scale(.98);}
.gate-lock-badge{position:absolute;top:10px;right:12px;font-size:13px;opacity:.45;}
.gate-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.gate-card-title{font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--ink-900);}
.gate-card-desc{font-size:12.5px;color:var(--slate-500);line-height:1.5;}
.changelog-link{background:transparent;border:none;color:var(--slate-500);font-size:12px;text-decoration:underline;margin-top:28px;cursor:pointer;}
.changelog-link:hover{color:var(--ink-900);}

.changelog-card{background:var(--paper-50);border-radius:16px;padding:28px;max-width:480px;width:100%;max-height:80vh;overflow-y:auto;text-align:left;box-shadow:var(--shadow-lg);}
.changelog-title{font-family:var(--font-display);font-weight:700;font-size:18px;margin-bottom:18px;color:var(--ink-900);}
.changelog-entry{margin-bottom:20px;}
.changelog-entry:last-of-type{margin-bottom:12px;}
.changelog-date{font-family:var(--font-mono);font-size:12px;color:var(--amber-600);font-weight:700;margin-bottom:6px;letter-spacing:.02em;}
.changelog-items{margin:0;padding-left:20px;font-size:13px;line-height:1.8;color:var(--ink-text);}
.changelog-close{width:100%;padding:12px;border-radius:10px;border:none;background:var(--paper-200);color:var(--slate-500);font-weight:600;font-size:14px;}
.changelog-close:hover{background:var(--paper-line);}

/* ---------- TOPBAR ---------- */
.topbar{
  background:var(--ink-900);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--ink-800);position:sticky;top:0;z-index:20;
}
.topbar-left{display:flex;align-items:baseline;gap:12px;}
.topbar-title{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:-.01em;}
.topbar-date{font-family:var(--font-mono);font-size:12px;color:#9AA4B8;}
.topbar-right{display:flex;align-items:center;gap:8px;}
.pill-btn{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#E4E7EC;border-radius:8px;
  padding:7px 14px;font-size:12.5px;font-weight:500;transition:background .12s,border-color .12s;
}
.pill-btn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.24);color:#fff;}
@media (max-width:640px){
  .topbar{flex-wrap:wrap;gap:8px;padding:10px 14px;}
  .topbar-left{flex-wrap:wrap;gap:6px;}
  .topbar-title{font-size:14px;}
  .mgr-wrap{padding:12px;}
  .mgr-settings-summary{font-size:13px;}
  .vc-relink-row{flex-wrap:wrap;}
  .vc-batch-actions{gap:6px;}
  .report-table{font-size:12px;}
  .date-nav{flex-wrap:wrap;}
}

/* ---------- MANAGER VIEW ---------- */
.dash-summary{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;
  background:var(--paper-line);border:1px solid var(--paper-line);border-radius:var(--radius-lg);
  overflow:hidden;margin-bottom:18px;box-shadow:var(--shadow-sm);
}
.dash-stat{background:var(--paper-50);padding:16px 14px;text-align:center;}
.dash-stat-value{font-family:var(--font-display);font-weight:800;font-size:28px;color:var(--ink-900);letter-spacing:-.02em;line-height:1.1;}
.dash-stat-label{font-size:11.5px;color:var(--slate-500);margin-top:4px;font-weight:500;}
.dash-stat-working .dash-stat-value{color:var(--teal-500);}
.dash-stat-idle .dash-stat-value{color:var(--slate-500);}
.dash-stat-break .dash-stat-value{color:var(--amber-500);}
@media (max-width:640px){
  .dash-stat{padding:12px 8px;}
  .dash-stat-value{font-size:22px;}
  .dash-stat-label{font-size:10px;}
}
.mgr-wrap{padding:20px;max-width:1400px;margin:0 auto;}
.date-nav{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.date-nav-btn{
  width:40px;height:40px;border-radius:10px;border:1px solid var(--paper-line);background:#fff;
  font-size:16px;color:var(--ink-900);flex:none;
}
.date-nav-btn:hover{border-color:var(--amber-500);}
.date-nav-input{border:1px solid var(--paper-line);border-radius:10px;padding:9px 12px;font-size:14px;font-family:var(--font-mono);}
.date-nav-today-badge{background:var(--green-500);color:#fff;font-size:11px;font-weight:700;padding:4px 12px;border-radius:12px;}
.date-nav-today-btn{background:var(--ink-900);color:#fff;border:none;border-radius:12px;padding:8px 16px;font-size:12px;font-weight:600;}

.cal-month-label{font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--ink-900);padding:0 6px;}
.cal-grid-header{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
.cal-weekday{text-align:center;font-size:11px;color:var(--slate-500);font-weight:700;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-cell{
  min-height:74px;border:1px solid var(--paper-line);border-radius:10px;padding:6px 7px;background:var(--paper-50);
  cursor:pointer;display:flex;flex-direction:column;gap:2px;
}
.cal-cell:hover{border-color:var(--amber-500);background:#EEF2FF;}
.cal-cell-empty{border:none;background:transparent;cursor:default;}
.cal-cell-empty:hover{border:none;background:transparent;}
.cal-cell-today{border-color:var(--ink-900);border-width:2px;}
.cal-cell-sun{background:#FEF3F2;}
.cal-cell-sun:hover{background:#FEE4E2;}
.cal-cell-sat{background:#EEF0FB;}
.cal-cell-sat:hover{background:#E2E5F8;}
.cal-cell-holiday{background:#FEF3F2;border-color:#FDA29B;}
.cal-cell-holiday:hover{background:#FEE4E2;}
.cal-cell-holiday-name{font-size:9px;color:#B42318;line-height:1.15;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cal-weekday-sun{color:#F04438;}
.cal-weekday-sat{color:#4C5FD5;}
.cal-cell-day{font-family:var(--font-mono);font-weight:700;font-size:13px;color:var(--ink-900);}
.cal-cell-stat{font-size:10.5px;color:var(--slate-500);}
@media (max-width:640px){
  .cal-cell{min-height:58px;padding:4px 5px;}
  .cal-cell-stat{font-size:9.5px;}
}

.warn-banner{
  background:#FFFAEB;border:1px solid var(--warning-500);color:var(--warning-600);border-radius:10px;
  padding:12px 16px;font-size:13px;font-weight:600;margin-bottom:16px;line-height:1.6;
}
.warn-banner-danger{background:#FEF3F2;border-color:#F04438;color:#912018;}
.warn-fix-btn{
  display:inline-block;margin-top:8px;background:#B42318;color:#fff;border:none;border-radius:8px;
  padding:8px 14px;font-size:12px;font-weight:700;
}
.warn-fix-btn:hover{background:#912018;}
.vc-import-status{background:#EFF8FF;border:1px solid var(--teal-500);color:#175CD3;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:12px;}
.vc-manage-details{margin-top:14px;border-top:1px solid var(--paper-line);padding-top:10px;}
.mgr-settings-details{background:var(--paper-100);border:1px solid var(--paper-line);border-radius:14px;padding:16px 18px;}
.mgr-settings-summary{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--ink-900);cursor:pointer;list-style:revert;}
.mgr-settings-summary:hover{color:var(--amber-600);}
.vc-manage-details summary{font-size:13px;font-weight:700;color:var(--ink-900);cursor:pointer;}
.vc-manage-toggle-btn{background:var(--paper-100);border:1px solid var(--paper-line);border-radius:var(--radius-sm);padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--ink-900);margin-right:6px;min-height:38px;}
.vc-relink-row{display:flex;align-items:center;gap:8px;margin:10px 0;padding:10px;background:var(--paper-100);border-radius:10px;}
.vc-manage-toggle-btn:hover{border-color:var(--teal-500);color:var(--teal-500);}
.vc-queue{margin-top:12px;padding-top:12px;border-top:1px dashed var(--amber-500);}
.vc-queue-title{font-size:11px;font-weight:700;color:var(--rust-600);margin-bottom:8px;text-transform:uppercase;letter-spacing:.03em;}
.vc-queue-hint{font-size:12px;color:var(--slate-500);margin-bottom:8px;}
.vc-select-shortcuts{display:flex;gap:8px;margin-bottom:8px;}
.vc-select-shortcut-btn{
  background:#fff;border:1px solid var(--paper-line);color:var(--ink-900);border-radius:10px;
  padding:7px 14px;font-size:12px;font-weight:600;
}
.vc-select-shortcut-btn:hover{border-color:var(--amber-500);color:var(--amber-600);}
.vc-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;border-bottom:1px solid var(--paper-line);padding-bottom:8px;}
.vc-tab-btn{background:var(--paper-100);border:1px solid var(--paper-line);border-radius:10px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--slate-500);}
.vc-tab-btn.active{background:var(--ink-900);color:#fff;border-color:var(--ink-900);}
.vc-tab-body{margin-top:10px;}
.vc-preview-row{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--paper-line);border-radius:10px;margin-bottom:6px;}
.vc-preview-row.vc-preview-excluded{opacity:.45;}
.vc-warning-box{background:#FFFAEB;border:1px solid var(--warning-500);color:var(--warning-600);border-radius:10px;padding:10px 12px;font-size:12px;margin-bottom:8px;line-height:1.5;}
.checklist-panel{border:2px solid #F04438;background:#FEF3F2;}
.checklist-panel .panel-title{color:#F04438;}
.checklist-item{padding:10px 0;border-bottom:1px solid #FEE4E2;}
.checklist-item:last-child{border-bottom:none;}
.checklist-item-title{font-size:13px;font-weight:700;color:var(--ink-900);}
.checklist-item-action{font-size:12px;color:var(--slate-500);margin:3px 0 6px;}
.checklist-item-actions{display:flex;gap:8px;flex-wrap:wrap;}
.csv-link-badge{display:inline-block;font-size:10px;font-weight:700;border-radius:10px;padding:2px 8px;margin-left:4px;vertical-align:middle;}
.csv-link-badge-on{background:#EFF8FF;color:#175CD3;}
.csv-link-badge-off{background:var(--paper-100);color:var(--slate-500);}
.fin-summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:10px;}
.fin-summary-card{background:var(--paper-100);border-radius:12px;padding:14px;text-align:center;}
.fin-summary-label{font-size:11px;color:var(--slate-500);margin-bottom:4px;}
.fin-summary-value{font-family:var(--font-mono);font-size:20px;font-weight:700;color:var(--ink-900);}
.fin-price-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.fin-price-taskname{flex:1;font-size:13px;font-weight:600;}
.fin-price-input{width:90px;border:1px solid var(--paper-line);border-radius:8px;padding:6px 8px;font-family:var(--font-mono);}
.fin-price-unit{border:1px solid var(--paper-line);border-radius:8px;padding:6px 4px;font-size:12px;}
.vc-preview-name-input{flex:1;border:1px solid var(--paper-line);border-radius:8px;padding:6px 8px;font-size:13px;}
.vc-preview-meta{font-size:11px;color:var(--slate-500);white-space:nowrap;}
.vc-slip-list{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto;}
.vc-slip-row{
  display:flex;align-items:flex-start;gap:10px;cursor:pointer;
  border:1px solid var(--paper-line);background:#fff;border-radius:10px;padding:10px 14px;
  font-size:13px;text-align:left;width:100%;
}
.vc-slip-row input[type="checkbox"]{margin-top:3px;width:18px;height:18px;flex:none;}
.vc-slip-row:hover{border-color:var(--amber-500);background:#EEF2FF;}
.vc-slip-row-checked{border-color:var(--amber-500);background:#FFFAEB;}
.vc-slip-main{display:flex;flex-direction:column;gap:2px;flex:1;}
.vc-slip-no{font-family:var(--font-mono);font-weight:700;color:var(--ink-900);}
.vc-slip-meta{font-size:12px;color:var(--slate-500);}
.vc-slip-others{font-size:11px;color:var(--indigo-500);font-weight:600;}
.vc-slip-times{font-size:11px;color:var(--teal-500);font-weight:600;}
.vc-batch-actions{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.vc-batch-btn{
  width:100%;background:#fff;border:2px solid var(--amber-500);color:var(--amber-600);border-radius:10px;
  padding:11px;font-size:13px;font-weight:700;
}
.vc-batch-btn:disabled{border-color:var(--paper-line);color:var(--slate-300);}
.vc-batch-btn:hover:not(:disabled){background:#EEF2FF;}
.vc-active-slip{background:#EEF2FF;border:1px solid var(--amber-500);border-radius:12px;padding:14px 16px;}
.vc-active-slip-head{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--ink-900);margin-bottom:4px;}
.vc-active-slip-meta{font-size:12px;color:var(--slate-500);margin-bottom:4px;}
.vc-complete-btn{
  width:100%;background:var(--teal-500);color:#fff;border:none;border-radius:10px;
  padding:11px;font-size:13px;font-weight:700;
}
.vc-complete-btn:disabled{background:var(--paper-100);color:var(--slate-300);}
.vc-complete-btn:hover:not(:disabled){background:#175CD3;}
.chip-warn{border:1px solid var(--warning-500);background:#FFFAEB;}
.chip-warn-label{font-size:10px;font-weight:700;color:var(--warning-600);}
.break-toggle-row{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-900);margin-bottom:12px;cursor:pointer;}
.break-toggle-row input{width:16px;height:16px;}
.break-time-row{display:flex;gap:16px;}
.break-time-row input{border:1px solid var(--paper-line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:var(--font-mono);}
.date-nav-today-btn:hover{background:var(--ink-700);}
.log-edit-btn{background:var(--paper-100);border:1px solid var(--paper-line);border-radius:var(--radius-sm);padding:9px 16px;font-size:12.5px;font-weight:600;color:var(--ink-900);min-height:38px;}
.log-stop-btn{background:#FEF3F2;border:1px solid #F04438;border-radius:var(--radius-sm);padding:9px 14px;font-size:12.5px;font-weight:700;color:#B42318;margin-right:6px;min-height:38px;}
.breakdown-detail-list{margin-top:6px;text-align:left;display:block;}
.missing-subtime-warning{
  margin-top:6px;font-size:10px;font-weight:700;color:#B42318;background:#FEF3F2;
  border-radius:8px;padding:3px 8px;display:inline-block;
}
.breakdown-detail-row{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--slate-500);padding:2px 0;}
.breakdown-detail-name{font-weight:600;color:var(--ink-900);min-width:64px;}
.breakdown-detail-qty{font-family:var(--font-mono);min-width:48px;text-align:right;}
.breakdown-detail-time{font-family:var(--font-mono);min-width:56px;text-align:right;}
.log-stop-btn:hover{background:#FEE4E2;}
.log-edit-btn:hover{border-color:var(--amber-500);background:#FFFAEB;}
.mgr-grid{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start;min-width:0;}
@media (max-width:900px){.mgr-grid{grid-template-columns:1fr;}}
.mgr-grid > *{min-width:0;}
.panel{background:var(--paper-50);border:1px solid var(--paper-line);border-radius:var(--radius-lg);padding:20px;min-width:0;box-shadow:var(--shadow-sm);}
.panel-title{
  font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:0;
  text-transform:none;color:var(--ink-900);margin:0 0 14px;display:flex;align-items:center;justify-content:space-between;
}
.count-badge{font-family:var(--font-mono);font-size:11px;font-weight:600;background:var(--paper-200);color:var(--slate-500);padding:2px 9px;border-radius:20px;}

.roster-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.roster-item{
  display:flex;flex-direction:column;gap:6px;padding:10px 12px;
  border-radius:var(--radius-md);background:var(--paper-100);border:1px solid var(--paper-line);
}
.pattern-row{display:flex;gap:4px;}
.avatar-swatch-row{display:flex;gap:5px;margin-top:6px;}
.holiday-off-toggle{
  margin-top:6px;font-size:11px;font-weight:600;color:var(--slate-500);background:#fff;
  border:1px solid var(--paper-line);border-radius:12px;padding:4px 10px;
}
.holiday-off-toggle.on{background:#FEF3F2;border-color:#F04438;color:#B42318;}
.overtime-row{display:flex;align-items:center;gap:6px;margin-top:6px;}
.overtime-label{font-size:11px;color:var(--slate-500);}
.overtime-input{border:1px solid var(--paper-line);border-radius:8px;padding:3px 6px;font-size:11px;font-family:var(--font-mono);}
.avatar-swatch{width:16px;height:16px;border-radius:4px;border:2px solid transparent;cursor:pointer;}
.avatar-swatch.sel{border-color:var(--ink-900);}
.pattern-day{
  width:24px;height:24px;border-radius:6px;border:1px solid var(--paper-line);background:#fff;
  font-size:11px;font-weight:600;color:var(--slate-300);padding:0;
}
.pattern-day.on{background:var(--teal-500);color:#fff;border-color:var(--teal-500);}
.category-toggle-row{display:flex;gap:6px;margin-bottom:10px;}
.category-toggle-btn{
  flex:1;padding:7px 0;border-radius:8px;border:1px solid var(--paper-line);background:#fff;
  font-size:12px;font-weight:600;color:var(--slate-500);
}
.category-toggle-btn.sel{background:var(--ink-900);color:#fff;border-color:var(--ink-900);}
.roster-item.archived{opacity:.4;}
.roster-name{font-size:14px;font-weight:500;}
.roster-controls{display:flex;align-items:center;gap:6px;}
.toggle-att{
  border:none;border-radius:14px;padding:4px 10px;font-size:11px;font-weight:600;
}
.toggle-att.on{background:var(--green-500);color:#fff;}
.toggle-att.off{background:var(--paper-200);color:var(--slate-500);}
.icon-x{border:none;background:transparent;color:var(--slate-300);font-size:16px;padding:8px;min-width:32px;min-height:32px;border-radius:var(--radius-sm);display:inline-flex;align-items:center;justify-content:center;}
.icon-x:hover{color:var(--rust-600);}
.add-row{display:flex;gap:6px;margin-top:8px;}
.add-row input{
  flex:1;border:1px solid var(--paper-line);border-radius:8px;padding:8px 10px;font-size:13px;
  outline:none;
}
.add-row input:focus{border-color:var(--amber-500);}
.add-btn{
  background:var(--amber-500);color:#fff;border:none;border-radius:var(--radius-sm);padding:9px 16px;font-size:13px;font-weight:600;
  transition:background .12s;
}
.add-btn:hover{background:var(--amber-600);}
.add-btn:disabled{background:var(--paper-line);color:var(--slate-300);}

.staff-pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--paper-line);}
.pool-hint{font-size:11px;color:var(--slate-500);width:100%;margin-bottom:2px;}
.chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--paper-100);border:1px solid var(--paper-line);
  border-radius:20px;padding:6px 12px;font-size:13px;font-weight:500;cursor:grab;user-select:none;
}
.chip:active{cursor:grabbing;}
.chip-dot{width:7px;height:7px;border-radius:50%;background:var(--slate-300);}

.task-board{display:flex;flex-wrap:wrap;gap:14px;}
.task-col{
  min-width:230px;flex:1 0 230px;background:var(--paper-50);border:1px solid var(--paper-line);border-radius:12px;
  padding:12px;transition:background .12s,border-color .12s;
}
.task-col.dragover{background:#FFFAEB;border-color:var(--amber-500);}
.task-col-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.task-color-dot{width:12px;height:12px;border-radius:3px;flex:none;}
.task-col-name{font-family:var(--font-display);font-weight:600;font-size:15px;flex:1;}
.task-col-unit{font-size:11px;color:var(--slate-500);}
.assign-all-btn{width:100%;margin-top:8px;padding:7px;border-radius:8px;border:1px dashed var(--slate-300);background:#fff;font-size:11px;font-weight:600;color:var(--slate-500);}
.assign-all-btn:hover{border-color:var(--teal-500);color:var(--teal-500);border-style:solid;}
.task-col-edit{border:none;background:transparent;color:var(--slate-300);font-size:13px;padding:0 4px;}
.task-col-edit:hover{color:var(--indigo-500);}
.task-col-del{border:none;background:transparent;color:var(--slate-300);font-size:13px;}
.task-col-del:hover{color:var(--rust-600);}
.task-col-body{display:flex;flex-wrap:wrap;gap:6px;min-height:50px;}
.task-chip{
  display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--paper-line);border-radius:16px;
  padding:5px 10px;font-size:12px;font-weight:500;
}
.task-chip button{border:none;background:transparent;color:var(--slate-300);font-size:12px;padding:0;line-height:1;}
.task-chip button:hover{color:var(--rust-600);}
.new-task-btn{
  min-width:150px;flex:0 0 auto;border:2px dashed var(--paper-line);border-radius:12px;background:transparent;
  color:var(--slate-500);font-size:13px;font-weight:600;padding:0 20px;display:flex;align-items:center;justify-content:center;
}
.new-task-btn:hover{border-color:var(--amber-500);color:var(--amber-600);}

.task-form{background:var(--paper-50);border:1px solid var(--paper-line);border-radius:12px;padding:14px;min-width:230px;flex:1 0 230px;}
.task-form label{font-size:11px;color:var(--slate-500);display:block;margin-bottom:4px;margin-top:8px;}
.task-form input{width:100%;border:1px solid var(--paper-line);border-radius:8px;padding:7px 9px;font-size:13px;outline:none;}
.task-form input:focus{border-color:var(--amber-500);}
.swatches{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;}
.swatch{width:22px;height:22px;border-radius:6px;border:2px solid transparent;}
.swatch.sel{border-color:var(--ink-900);}
.task-form-actions{display:flex;gap:8px;margin-top:12px;}
.task-form-actions button{flex:1;padding:8px;border-radius:8px;font-size:12px;font-weight:600;border:none;}
.tf-cancel{background:var(--paper-200);color:var(--slate-500);}
.tf-confirm{background:var(--amber-500);color:#B54708;}

.empty-note{font-size:13px;color:var(--slate-500);padding:14px 0;}

.reg-group{margin-bottom:14px;border:1px solid var(--paper-line);border-radius:12px;padding:4px 14px 14px;background:var(--paper-50);}
.reg-group-summary{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 2px;cursor:pointer;list-style:none;}
.reg-group-summary::-webkit-details-marker{display:none;}
.reg-group-summary::before{content:'▸';color:var(--slate-500);font-size:11px;margin-right:6px;transition:transform .15s;}
details[open] > .reg-group-summary::before{transform:rotate(90deg);}
.reg-group-date{font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--rust-600);letter-spacing:.03em;}
.reg-group-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;margin-top:6px;}
.reg-search{width:100%;border:1px solid var(--paper-line);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:14px;outline:none;}

.subcat-tag-wrap{margin-bottom:4px;}
.subcat-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;min-height:20px;}
.subcat-chip{
  display:inline-flex;align-items:center;gap:5px;background:var(--paper-100);border:1px solid var(--paper-line);
  border-radius:14px;padding:4px 6px 4px 12px;font-size:12px;font-weight:600;color:var(--ink-900);
}
.subcat-chip button{border:none;background:transparent;color:var(--slate-300);font-size:14px;line-height:1;padding:2px 4px;}
.subcat-chip button:hover{color:var(--rust-600);}
.subcat-chip-unit{color:var(--slate-500);font-weight:400;}
.subcat-add-row{display:flex;gap:6px;}
.subcat-preset-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.subcat-preset-btn{background:var(--paper-100);border:1px dashed var(--paper-line);border-radius:14px;padding:4px 10px;font-size:11px;font-weight:600;color:var(--slate-500);}
.subcat-preset-btn:hover{border-color:var(--amber-500);color:var(--amber-600);border-style:solid;}
.subcat-add-row input{
  border:1px solid var(--paper-line);border-radius:8px;padding:8px 10px;font-size:13px;outline:none;
}
.subcat-name-input{flex:2;min-width:0;}
.subcat-unit-input{flex:1;min-width:0;}
.subcat-add-row input:focus{border-color:var(--amber-500);}
.subcat-add-btn{background:var(--ink-900);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;flex:none;}
.subcat-add-btn:hover{background:var(--ink-700);}
.reg-search:focus{border-color:var(--amber-500);}
.reg-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:#fff;border:1px solid var(--paper-line);margin-bottom:0;}
.reg-row-name{font-size:13px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.reg-row-badge{font-size:10px;font-weight:700;color:var(--teal-500);background:#EFF8FF;border-radius:8px;padding:1px 6px;flex:none;}
.reg-row-cat{font-size:10px;font-weight:700;border-radius:8px;padding:1px 6px;flex:none;}
.reg-row-cat-出荷{color:var(--indigo-500);background:#EEF0FB;}
.reg-row-cat-入庫{color:var(--rust-600);background:#FEF3F2;}
.reg-row-cat-その他{color:var(--slate-500);background:var(--paper-100);}
.reg-row-unit{font-size:11px;color:var(--slate-500);flex:none;}

.report-mode-toggle{display:flex;gap:8px;margin-bottom:18px;}
.report-mode-btn{padding:8px 18px;border-radius:20px;border:1px solid var(--paper-line);background:#fff;font-size:13px;font-weight:600;color:var(--slate-500);}
.report-mode-btn.active{background:var(--ink-900);color:#fff;border-color:var(--ink-900);}
.report-controls{display:flex;gap:14px;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap;}
.report-field label{font-size:11px;color:var(--slate-500);display:block;margin-bottom:4px;}
.report-field input{border:1px solid var(--paper-line);border-radius:8px;padding:8px 10px;font-size:13px;outline:none;}
.report-field input:focus{border-color:var(--amber-500);}
.report-go-btn{background:var(--ink-900);color:#fff;border:none;border-radius:8px;padding:9px 20px;font-size:13px;font-weight:600;}
.csv-export-btn{background:var(--teal-500);color:#fff;border:none;border-radius:16px;padding:6px 14px;font-size:12px;font-weight:600;margin-left:12px;vertical-align:middle;}
.csv-export-btn:hover{background:#1570CF;}
.report-go-btn:hover{background:var(--ink-700);}
.report-section-title{font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--ink-900);margin:22px 0 10px;}
.report-table{width:100%;border-collapse:collapse;}
.report-table th{text-align:left;font-size:11.5px;color:var(--slate-500);text-transform:none;font-weight:600;letter-spacing:0;padding:9px 10px;border-bottom:1px solid var(--paper-line);}
.report-table td{padding:11px 10px;border-bottom:1px solid var(--paper-line);font-size:13px;vertical-align:top;}
.report-table tbody tr:hover{background:var(--paper-100);}
.report-table td.num{font-family:var(--font-mono);text-align:right;white-space:nowrap;}
.task-breakdown-chip{display:inline-flex;align-items:center;gap:4px;background:var(--paper-200);border-radius:8px;padding:2px 8px;font-size:11px;margin:2px 4px 2px 0;}
.report-range-note{font-size:12px;color:var(--slate-500);margin-bottom:10px;}

.ach-wrap{max-width:820px;margin:0 auto;padding:24px 20px 60px;}
.ach-header{font-family:var(--font-display);font-weight:700;font-size:24px;color:var(--ink-900);text-align:center;margin-bottom:22px;}
.ach-section-title{font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--ink-900);margin:26px 0 12px;}
.ach-stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;}
.ach-stat-card{background:#fff;border:1px solid var(--paper-line);border-radius:14px;padding:16px 14px;text-align:center;}
.ach-stat-icon{font-size:22px;margin-bottom:6px;}
.ach-stat-label{font-size:12px;color:var(--slate-500);margin-bottom:4px;}
.ach-stat-value{font-family:var(--font-mono);font-weight:700;font-size:24px;color:var(--ink-900);}
.ach-stat-unit{font-size:13px;color:var(--slate-500);margin-left:2px;}
.ach-today-sub{text-align:center;font-size:12px;color:var(--slate-500);margin-top:10px;}
.ach-detail-toggle{margin-left:8px;background:var(--paper-100);border:1px solid var(--paper-line);border-radius:12px;padding:3px 10px;font-size:11px;font-weight:600;color:var(--ink-900);}
.ach-detail-toggle:hover{border-color:var(--amber-500);color:var(--amber-600);}
.ach-detail-panel{margin-top:14px;}
.ach-detail-note{font-size:12px;color:var(--slate-500);margin-bottom:8px;line-height:1.6;}

.ach-cta{text-align:center;padding:20px 10px;}
.ach-cta .empty-note{padding-bottom:16px;}

.ach-challenge-card{background:linear-gradient(135deg,#FFFAEB,#FFFAEB);border:1px solid var(--amber-500);border-radius:18px;padding:24px 20px;text-align:center;}
.ach-challenge-nums{font-family:var(--font-mono);font-weight:700;font-size:32px;color:var(--ink-900);margin-bottom:14px;}
.ach-challenge-nums b{color:var(--rust-600);font-size:38px;}
.ach-progress-bar{height:18px;border-radius:9px;background:#fff;border:1px solid var(--paper-line);overflow:hidden;margin-bottom:10px;}
.ach-progress-fill{height:100%;background:linear-gradient(90deg,var(--amber-500),#FFD782);border-radius:9px;transition:width .4s;}
.ach-challenge-sub{font-size:14px;font-weight:600;color:var(--ink-900);}

.ach-record-card{background:#fff;border:1px solid var(--paper-line);border-radius:16px;padding:22px 20px;text-align:center;}
.ach-record-value{font-family:var(--font-mono);font-weight:700;font-size:34px;color:var(--indigo-500);}
.ach-record-month{font-size:13px;color:var(--slate-500);margin-bottom:12px;}
.ach-record-remaining{font-size:15px;font-weight:700;color:var(--rust-600);}

.ach-record-banner{border-radius:18px;padding:24px 20px;text-align:center;margin-top:26px;background:linear-gradient(135deg,#FFFAEB,#FEF0C7);border:2px solid var(--amber-500);}
.ach-new-record-title{font-family:var(--font-display);font-weight:700;font-size:24px;color:var(--rust-600);margin-bottom:6px;animation:achPulse 2.4s infinite;}
@keyframes achPulse{0%,100%{opacity:1;}50%{opacity:.72;}}
@media (prefers-reduced-motion:reduce){.ach-new-record-title{animation:none;}}
.ach-new-record-sub{font-family:var(--font-mono);font-size:20px;font-weight:700;color:var(--ink-900);margin-bottom:6px;}
.ach-new-record-note{font-size:13px;color:var(--slate-500);}

.ach-message{text-align:center;font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--ink-900);margin:24px 0;padding:14px;background:var(--paper-100);border-radius:14px;}

.ach-yoy-card{background:#fff;border:1px solid var(--paper-line);border-radius:14px;padding:16px 18px;}
.ach-yoy-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:14px;}
.ach-yoy-row b{font-family:var(--font-mono);font-size:17px;}
.ach-yoy-pct{text-align:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--paper-line);font-weight:700;font-size:15px;}
.ach-yoy-pct.up{color:var(--green-500);}
.ach-yoy-pct.down{color:var(--slate-500);}

.ach-daily-chart{display:flex;align-items:flex-end;gap:3px;height:80px;padding:10px 4px 0;background:#fff;border:1px solid var(--paper-line);border-radius:12px;overflow-x:auto;}
.ach-bar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;min-width:8px;height:100%;}
.ach-bar{width:100%;max-width:14px;background:linear-gradient(180deg,#FFD782,var(--amber-500));border-radius:2px 2px 0 0;}
.ach-bar-label{font-size:8px;color:var(--slate-500);margin-top:2px;}
.ach-bestday{text-align:center;font-size:13px;font-weight:600;color:var(--rust-600);margin-top:10px;}

.ach-mini-stats{display:flex;justify-content:center;gap:24px;background:#fff;border:1px solid var(--paper-line);border-radius:12px;padding:14px;}
.ach-mini-stats span{font-size:13px;color:var(--slate-500);}
.ach-mini-stats b{font-family:var(--font-mono);font-size:18px;color:var(--ink-900);margin-left:4px;}

.ach-refresh-small{display:block;margin:28px auto 8px;}
.ach-generated-note{text-align:center;font-size:11px;color:var(--slate-300);}

.rpg-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:14px;}
.rpg-card{
  background:linear-gradient(160deg,#1B2340,#232C52);border:1px solid #384080;border-radius:16px;
  padding:16px 18px;color:#fff;box-shadow:0 4px 14px rgba(35,44,82,.25);
}
.rpg-card-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.rpg-rank{font-size:18px;flex:none;width:28px;text-align:center;}

.rpg-avatar-wrap{position:relative;width:52px;height:58px;flex:none;}
.rpg-avatar-pixel{
  width:52px;height:58px;position:relative;z-index:2;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.04);border-radius:8px;
}
.rpg-avatar-pixel svg{width:44px;height:auto;}
.avatar-tier-4 .rpg-avatar-pixel svg{filter:drop-shadow(0 0 5px rgba(242,169,59,.85));animation:rpgAvatarGlow 1.8s infinite;}
@keyframes rpgAvatarGlow{0%,100%{filter:drop-shadow(0 0 3px rgba(242,169,59,.5));}50%{filter:drop-shadow(0 0 9px rgba(242,169,59,1));}}
.avatar-cape{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:62px;height:66px;background:radial-gradient(circle,rgba(76,111,213,.4),transparent 70%);z-index:1;}
.avatar-badge{position:absolute;font-size:13px;z-index:3;line-height:1;}
.avatar-badge-star{top:-3px;right:-3px;}
.avatar-badge-sword{bottom:-3px;right:-5px;}
.avatar-badge-shield{bottom:-3px;left:-5px;}
.avatar-badge-crown{top:-13px;left:50%;transform:translateX(-50%);font-size:15px;}

.rpg-name-block{flex:1;min-width:0;}
.rpg-name{font-family:var(--font-display);font-weight:700;font-size:16px;}
.rpg-title{font-size:12px;color:#B9C0E8;margin-top:1px;}
.rpg-level-badge{
  background:var(--amber-500);color:#B54708;font-family:var(--font-mono);font-weight:700;font-size:13px;
  border-radius:10px;padding:4px 10px;flex:none;
}
.rpg-xp-bar{height:10px;border-radius:5px;background:#12173080;overflow:hidden;margin-bottom:6px;}
.rpg-xp-fill{height:100%;background:linear-gradient(90deg,var(--amber-500),#FFD782);border-radius:5px;transition:width .3s;}
.rpg-xp-label{font-family:var(--font-mono);font-size:11px;color:#9AA3D6;margin-bottom:10px;}

.rpg-stats{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;}
.rpg-stat-row{display:flex;align-items:center;gap:6px;font-size:11px;}
.rpg-stat-icon{width:16px;text-align:center;}
.rpg-stat-label{width:48px;color:#B9C0E8;flex:none;}
.rpg-stat-bar{flex:1;height:6px;border-radius:3px;background:#12173080;overflow:hidden;}
.rpg-stat-fill{height:100%;border-radius:3px;transition:width .3s;}
.rpg-stat-fill.atk{background:linear-gradient(90deg,#F04438,#FF8A50);}
.rpg-stat-fill.def{background:linear-gradient(90deg,#2E90FA,#84CAFF);}
.rpg-stat-fill.spd{background:linear-gradient(90deg,#12B76A,#75E0A7);}
.rpg-stat-val{width:22px;text-align:right;font-family:var(--font-mono);color:#fff;font-size:11px;flex:none;}

.rpg-spec-chips{display:flex;flex-wrap:wrap;gap:6px;}
.rpg-spec-chip{background:#12173080;border-radius:10px;padding:3px 9px;font-size:11px;color:#DCE1FF;}
.rpg-spec-chip b{color:var(--amber-500);font-family:var(--font-mono);}

.toast-container{position:fixed;top:74px;right:16px;z-index:300;display:flex;flex-direction:column;gap:8px;max-width:320px;}
.toast{
  background:var(--ink-900);color:#fff;border-radius:10px;padding:12px 16px;font-size:13px;line-height:1.5;
  box-shadow:0 6px 18px rgba(0,0,0,.25);border-left:4px solid var(--amber-500);
  animation:toastIn .22s ease-out;display:flex;align-items:center;gap:12px;justify-content:space-between;
}
.toast-text{flex:1;}
.toast-action{
  flex:none;background:rgba(255,255,255,.14);border:none;color:#fff;border-radius:16px;padding:6px 14px;
  font-size:12px;font-weight:700;white-space:nowrap;
}
.toast-action:hover{background:rgba(255,255,255,.24);}
.toast.leaving{animation:toastOut .18s ease-in forwards;}
@keyframes toastIn{from{opacity:0;transform:translateX(14px);}to{opacity:1;transform:translateX(0);}}
@keyframes toastOut{to{opacity:0;transform:translateX(14px);}}
@media (max-width:640px){.toast-container{left:12px;right:12px;max-width:none;top:66px;}}

/* ---------- INPUT VIEW (作業実績入力 / tablet-optimized) ---------- */
.input-wrap{min-height:calc(100vh - 60px);display:flex;flex-direction:column;}
.input-wrap button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.name-grid-wrap{flex:1;padding:28px 20px;max-width:1000px;margin:0 auto;width:100%;}
.name-grid-title{font-family:var(--font-display);font-weight:600;font-size:24px;color:var(--ink-900);margin-bottom:22px;text-align:center;}
.name-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;}
.name-tile{
  background:#fff;border:2px solid var(--paper-line);border-radius:16px;padding:28px 14px;text-align:center;
  font-family:var(--font-display);font-weight:600;font-size:20px;color:var(--ink-900);transition:transform .1s,border-color .1s;

<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";
  var cfg = window.SUPABASE_CONFIG || {};
  var client = null;
  if(cfg.url && cfg.anonKey && cfg.url.indexOf('YOUR-PROJECT')===-1){
    client = window.supabase.createClient(cfg.url, cfg.anonKey);
  }
  window.__supabaseClient = client;

  window.storage = {
    get: async function(key, shared){
      if(!client) throw new Error('Supabase未設定です(config.jsを確認してください)');
      var res = await client.from('kv_store').select('value').eq('key', key).maybeSingle();
      if(res.error) throw res.error;
      if(!res.data) throw new Error('key not found');
      return { key: key, value: res.data.value };
    },
    set: async function(key, value, shared){
      if(!client) return null;
      var res = await client.from('kv_store').upsert({ key: key, value: value }, { onConflict: 'key' }).select('value').maybeSingle();
      if(res.error) return null;
      return { key: key, value: value };
    },
    delete: async function(key, shared){
      if(!client) return null;
      var res = await client.from('kv_store').delete().eq('key', key);
      if(res.error) return null;
      return { key: key, deleted: true };
    },
    list: async function(prefix, shared){
      if(!client) throw new Error('Supabase未設定です(config.jsを確認してください)');
      var query = client.from('kv_store').select('key');
      if(prefix) query = query.like('key', prefix+'%');
      var res = await query;
      if(res.error) throw res.error;
      return { keys: (res.data||[]).map(function(r){ return r.key; }), prefix: prefix };
    }
  };
})();
</script>
<script>
(function(){
"use strict";

var TASK_COLORS = [
  {name:'amber', hex:'#F2A93B'},
  {name:'teal', hex:'#2E90FA'},
  {name:'indigo', hex:'#4C5FD5'},
  {name:'pink', hex:'#F04438'},
  {name:'green', hex:'#12B76A'},
  {name:'rust', hex:'#F04438'},
  {name:'slate', hex:'#667085'}
];
var TASK_CATEGORIES = ['出荷','入庫','その他'];
function taskCategory(t){
  return (t && t.category && TASK_CATEGORIES.indexOf(t.category)!==-1) ? t.category : 'その他';
}
function renderCategoryToggle(context, current){
  var opts = TASK_CATEGORIES.map(function(c){
    return '<button type="button" class="category-toggle-btn '+(current===c?'sel':'')+'" data-category-set="'+context+'|'+c+'">'+c+'</button>';
  }).join('');
  return '<div class="category-toggle-row">'+opts+'</div>';
}
function colorSortIndex(hex){
  var idx = TASK_COLORS.findIndex(function(c){ return c.hex===hex; });
  return idx===-1 ? 999 : idx;
}
function byTaskColor(getColor){
  return function(a,b){ return colorSortIndex(getColor(a)) - colorSortIndex(getColor(b)); };
}

function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
}
function todayStr(){
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayLabel(){
  var d = new Date();
  var days = ['日','月','火','水','木','金','土'];
  return (d.getMonth()+1)+'/'+d.getDate()+'('+days[d.getDay()]+')';
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function parseSubcats(str){
  return (str||'').split(/[,、]/).map(function(s){ return s.trim(); }).filter(function(s){ return s.length>0; });
}
function subcatName(sc){
  return typeof sc==='string' ? sc : ((sc && sc.name) || '');
}
function subcatUnit(sc, fallback){
  if(typeof sc==='string') return fallback || '件';
  return (sc && sc.unit) || fallback || '件';
}
function subcatUnitMap(task){
  var map = {};
  (task.subcategories||[]).forEach(function(sc){
    map[subcatName(sc)] = subcatUnit(sc, task.unit);
  });
  return map;
}
function breakdownLabel(breakdown, task){
  if(!breakdown) return '';
  var keys = Object.keys(breakdown).filter(function(k){ return breakdown[k]>0; });
  if(!keys.length) return '';
  var unitMap = subcatUnitMap(task);
  return '('+keys.map(function(k){ return esc(k)+' '+breakdown[k]+esc(unitMap[k]||task.unit); }).join(' / ')+')';
}
function unitGroupedTotals(breakdown, task){
  if(!breakdown) return [];
  var keys = Object.keys(breakdown).filter(function(k){ return breakdown[k]>0; });
  if(!keys.length) return [];
  var unitMap = subcatUnitMap(task);
  var totals = {};
  var order = [];
  keys.forEach(function(k){
    var u = unitMap[k]||task.unit;
    if(!(u in totals)){ totals[u] = 0; order.push(u); }
    totals[u] += breakdown[k]||0;
  });
  return order.map(function(u){ return { unit: u, qty: totals[u] }; });
}
function formatUnitGroupedTotals(groups, escapeHtml){
  return groups.map(function(g){ return g.qty+(escapeHtml?esc(g.unit):g.unit); }).join(' / ');
}
function breakdownDetailRows(l, t){
  if(!l.breakdown && !l.activeSubcat) return '';
  var breakdown = l.breakdown || {};
  var subTimes = l.subTimes || {};
  var unitMap = subcatUnitMap(t);
  var keys = Object.keys(breakdown).filter(function(k){ return breakdown[k]>0; });
  if(l.activeSubcat && keys.indexOf(l.activeSubcat)===-1) keys.push(l.activeSubcat);
  Object.keys(subTimes).forEach(function(k){ if(subTimes[k]>0 && keys.indexOf(k)===-1) keys.push(k); });
  if(!keys.length) return '';
  var rows = keys.map(function(k){
    var qty = breakdown[k]||0;
    var unit = unitMap[k]||t.unit;
    var base = subTimes[k]||0;
    var timeHtml;
    if(l.activeSubcat===k && l.activeSubcatStart){
      var live = base + (Date.now()-new Date(l.activeSubcatStart).getTime());
      timeHtml = '<span data-live-subtimer-start="'+l.activeSubcatStart+'" data-live-subtimer-base="'+base+'" style="color:var(--rust-600);font-weight:700;">'+fmtElapsed(live)+'</span>';
    }else{
      timeHtml = base>0 ? fmtHM(base) : '-';
    }
    return '<div class="breakdown-detail-row">'+
      '<span class="breakdown-detail-name">'+esc(k)+'</span>'+
      '<span class="breakdown-detail-qty">'+qty+esc(unit)+'</span>'+
      '<span class="breakdown-detail-time">⏱ '+timeHtml+'</span>'+
    '</div>';
  }).join('');
  return '<div class="breakdown-detail-list">'+rows+'</div>';
}

function bindSubcatTagControls(){
  var inModal = !!state.modal;
  document.querySelectorAll('[data-subcat-preset]').forEach(function(el){
    el.addEventListener('click', function(){
      var parts = el.getAttribute('data-subcat-preset').split('|');
      var ctx = parts[0], textId = parts[1], presetName = parts[2];
      var ref = subcatListRef(ctx);
      if(!ref) return;
      var list = (ref.get()||[]).slice();
      if(!list.some(function(sc){ return subcatName(sc)===presetName; })){
        list.push({name:presetName, unit:'件'});
      }
      ref.set(list);
      if(!inModal) state.suppressRender = false;
      render();
    });
  });
  document.querySelectorAll('[data-subcat-add]').forEach(function(el){
    el.addEventListener('click', function(){
      var parts = el.getAttribute('data-subcat-add').split('|');
      var ctx = parts[0], textId = parts[1];
      var nameInput = document.getElementById(textId);
      var unitInput = document.getElementById(textId+'-unit');
      if(!nameInput) return;
      var name = (nameInput.value||'').trim();
      if(!name) return;
      var unit = (unitInput && unitInput.value.trim()) || '件';
      var ref = subcatListRef(ctx);
      if(!ref) return;
      var list = (ref.get()||[]).slice();
      if(!list.some(function(sc){ return subcatName(sc)===name; })){
        list.push({name:name, unit:unit});
      }
      ref.set(list);
      var draftRef = subcatDraftRef(ctx);
      if(draftRef) draftRef.set({name:'', unit:unit});
      if(!inModal) state.suppressRender = false;
      render();
    });
  });
  document.querySelectorAll('[data-subcat-remove]').forEach(function(el){
    el.addEventListener('click', function(){
      var parts = el.getAttribute('data-subcat-remove').split('|');
      var ctx = parts[0], idx = parseInt(parts[1],10);
      var ref = subcatListRef(ctx);
      if(!ref) return;
      var list = (ref.get()||[]).slice();
      list.splice(idx,1);
      ref.set(list);
      if(!inModal) state.suppressRender = false;
      render();
    });
  });
  document.querySelectorAll('.subcat-add-row').forEach(function(wrap){
    var addBtn = wrap.querySelector('[data-subcat-add]');
    if(!addBtn) return;
    var ctx = addBtn.getAttribute('data-subcat-add').split('|')[0];
    var draftRef = subcatDraftRef(ctx);

    if(nameInput) nameInput.addEventListener('input', function(){
      if(draftRef) draftRef.set({ name:nameInput.value, unit: unitInput?unitInput.value:'件' });
    });
    if(unitInput) unitInput.addEventListener('input', function(){

    input.addEventListener('focusin', function(){ state.suppressRender = true; });
    if(!inModal){
      input.addEventListener('focusout', function(){ setTimeout(function(){ state.suppressRender = false; }, 150); });
    }

      if(e.key==='Enter'){
        e.preventDefault();
        var wrap = input.closest('.subcat-add-row');
        var btn = wrap ? wrap.querySelector('[data-subcat-add]') : null;
        if(btn) btn.click();
      }
    });
  });

function fmtElapsed(ms){
  if(ms<0) ms=0;
  var s = Math.floor(ms/1000);
  var h = Math.floor(s/3600);
  var m = Math.floor((s%3600)/60);
  var sec = s%60;
  if(h>0) return h+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
function fmtHM(ms){
  var mins = Math.round(ms/60000);
  var h = Math.floor(mins/60);
  var m = mins%60;
  if(h>0) return h+'h'+String(m).padStart(2,'0')+'m';
  return m+'m';
}
function fmtClock(iso){
  var d = new Date(iso);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

/* 通信失敗・接続確立直後(特にデプロイ直後のページ再読み込み時)の一時的な不具合で、
   例外を投げずに「成功したが空」という結果が返ることがある。これを「本当にデータが無い」
   と区別できないまま受け入れてしまうと、直後の自動処理が誤ってbacklog等を再構築し、
   その空の状態を保存してしまう恐れがある(過去に実際に発生した不具合)。
   そのため、値が取得できなかった場合は間隔を空けて複数回再試行してから判断する。 */
async function fetchWithRetry(key, retries){
  retries = retries || 3;
  var lastErr = null;
  for(var attempt=0; attempt<retries; attempt++){
    try{
      var r = await window.storage.get(key, true);
      if(r && r.value!==undefined && r.value!==null) return { ok:true, value: r.value };
      // 例外は投げなかったが値が空 -> 一時的な不具合の可能性があるため再試行する
      lastErr = null;
    }catch(e){
      lastErr = e;
    }
    if(attempt<retries-1) await new Promise(function(res){ setTimeout(res, 250*(attempt+1)); });
  }
  return { ok:false, error: lastErr };
}

async function saveBacklog(list){
  if(state.day && state.day.date===todayStr()){
    var openTaskIds = {};
    (state.day.logs||[]).forEach(function(l){
      if(l.end===null && l.taskId && l.taskId!=='BREAK') openTaskIds[l.taskId] = true;
    });
    var listIds = {};
    list.forEach(function(t){ listIds[t.id] = true; });
    var missing = Object.keys(openTaskIds).filter(function(tid){ return !listIds[tid]; });
    if(missing.length){
      missing.forEach(function(tid){
        var existing = (state.backlog||[]).find(function(t){ return t.id===tid; });
        if(existing && !listIds[tid]){
          list.push(existing);
          listIds[tid] = true;
        }
      });
      showToast('⚠️ 計測中の作業がデータから失われそうになったため、自動的に保護しました。');
    }
  }
  state.backlog = list;
  pendingSaves++;
  try{ await window.storage.set('task-backlog', JSON.stringify(list), true); }catch(e){}
  finally{ pendingSaves--; }
}

function ensureTemplateTasksForDateSync(dateStr){
  var wd = new Date(dateStr+'T00:00:00').getDay();
  var existingKeys = {};
  state.backlog.forEach(function(t){ if(t.fromTemplate) existingKeys[t.fromTemplate+'|'+t.workDate] = true; });
  var changed = false;
  state.templates.forEach(function(tmpl){
    if(tmpl.archived) return;
    var pattern = tmpl.pattern || defaultPattern();
    if(!pattern[wd]) return;
    var key = tmpl.id+'|'+dateStr;
    if(existingKeys[key]) return;
    state.backlog.push({id:uid(), name:tmpl.name, unit:tmpl.unit, color:tmpl.color, workDate:dateStr, archived:false, fromTemplate:tmpl.id, subcategories:tmpl.subcategories||[], category:taskCategory(tmpl)});
    existingKeys[key] = true;
    changed = true;
  });
  return changed;
}

async function ensureTemplateTasksForUpcoming(numDays){
  var base = new Date();
  var anyChanged = false;
  for(var i=0;i<numDays;i++){
    var d = new Date(base.getFullYear(), base.getMonth(), base.getDate()+i);
    var dateStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(ensureTemplateTasksForDateSync(dateStr)) anyChanged = true;

  if(anyChanged){
    if(state.dataLoadUncertain){
      console.warn('作業一覧の読み込みが不確実なため、繰り返し作業の自動作成をスキップしました(データ保護のため)。');
      return;
    }
    await saveBacklog(state.backlog);
  }
}

var PRODUCTIVITY_MIN_SAMPLES = 5; // これ未満は「実績不足」として個人生産性を使わない

/* 生産性マスタへの反映(実測のみを使う。複数人が同じ作業に同時に入っていた日は
   個人ぶんの正確な内訳が分からないため、個人サンプルには使わず、
   作業全体の標準生産性の算出にのみ使う。) */
function updateProductivityMasterFromDay(master, dateStr, day, workVolume){
  var agg = aggregateDays([day]);
  Object.keys(agg.perTask).forEach(function(tid){
    if(tid==='BREAK') return;
    var wvTotals = wvTotalsForTask(workVolume||emptyWorkVolume(), tid);
    if(!wvTotals || !wvTotals.primaryCount && !wvTotals.totalQty) return;
    var qty = wvTotals.totalQty; // 出荷個数を基本の作業量単位とする
    if(!qty) return;
    var taskMs = agg.perTask[tid].ms || 0;
    if(taskMs<=0) return;
    var taskHours = taskMs/3600000;
    if(!master[tid]) master[tid] = { unit:'個', taskAverage:{ totalQty:0, totalHours:0, sampleCount:0 }, byStaff:{} };
    var m = master[tid];
    m.taskAverage.totalQty += qty;
    m.taskAverage.totalHours += taskHours;
    m.taskAverage.sampleCount += 1;

    // その日その作業に従事したスタッフ一覧(内訳の有無に関わらずtaskId単位)
    var staffIdsOnTask = Object.keys(agg.perStaff).filter(function(sid){
      return agg.perStaff[sid].byTask[tid] && agg.perStaff[sid].byTask[tid].ms>0;
    });
    // 一人だけで完結した日のみ、個人サンプルとして採用する(複数人だと数量の内訳が不明なため)
    if(staffIdsOnTask.length===1){
      var sid = staffIdsOnTask[0];
      var staffMs = agg.perStaff[sid].byTask[tid].ms;
      var staffHours = staffMs/3600000;
      if(!m.byStaff[sid]) m.byStaff[sid] = { totalQty:0, totalHours:0, sampleCount:0 };
      m.byStaff[sid].totalQty += qty;
      m.byStaff[sid].totalHours += staffHours;
      m.byStaff[sid].sampleCount += 1;
    }
  });
  return master;
}
function productivityRateFor(master, taskId, staffId){
  var m = master && master[taskId];
  if(!m) return { rate:null, basis:'none', sampleCount:0 };
  if(staffId && m.byStaff && m.byStaff[staffId] && m.byStaff[staffId].sampleCount>=PRODUCTIVITY_MIN_SAMPLES){
    var s = m.byStaff[staffId];
    return { rate: s.totalQty/s.totalHours, basis:'individual', sampleCount: s.sampleCount };
  }
  if(m.taskAverage && m.taskAverage.sampleCount>=1 && m.taskAverage.totalHours>0){
    return { rate: m.taskAverage.totalQty/m.taskAverage.totalHours, basis:'taskAverage', sampleCount: m.taskAverage.sampleCount };
  }
  return { rate:null, basis:'none', sampleCount:0 };
}

/* 全角/半角・前後の空白程度の単純なゆらぎのみ吸収する。曖昧な部分一致は行わない(完全一致優先の方針)。 */
function normalizeCustomerName(name){
  if(!name) return '';
  return name.trim()
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(ch){ return String.fromCharCode(ch.charCodeAt(0)-0xFEE0); })
    .replace(/\s+/g, '');
}
function findMappingForCustomer(mapping, customerName){
  var norm = normalizeCustomerName(customerName);
  return (mapping.entries||[]).find(function(e){ return e.enabled && normalizeCustomerName(e.customerName)===norm; }) || null;
}
/* 共通の紐付け解決処理。手動CSV取込・将来の自動取込のどちらからも、この関数を呼び出す想定。
   shipperGroups(荷主出荷NO単位、customerNameを保持)を、作業枠ごとにグループ化する。
   マスターに無い得意先は絶対に推測せず、unmappedとして返す。 */
function resolveCustomerTaskMapping(shipperGroups, mapping){
  var byTask = {}; // taskId -> shipperGroups[]
  var unmappedByCustomer = {}; // customerName -> shipperGroups[]
  shipperGroups.forEach(function(g){
    var m = findMappingForCustomer(mapping, g.customerName);
    if(m){
      if(!byTask[m.taskId]) byTask[m.taskId] = [];
      byTask[m.taskId].push(g);
    }else{
      var key = g.customerName || '(不明)';
      if(!unmappedByCustomer[key]) unmappedByCustomer[key] = [];
      unmappedByCustomer[key].push(g);
    }
  });
  return { byTask: byTask, unmappedByCustomer: unmappedByCustomer };
}
/* shipperGroupsの一部集合から、primaryCount/lineCount/totalQty/byCustomer/byProductを再集計する。
   parseCsvForWorkVolumeの集計ロジックと同じ考え方をshipperGroups単位に適用する。 */
function summarizeShipperGroups(groupsSubset){
  var primaryCount = groupsSubset.length;
  var lineCount = groupsSubset.reduce(function(a,g){ return a+g.lineCount; }, 0);
  var totalQty = groupsSubset.reduce(function(a,g){ return a+g.totalQty; }, 0);
  var byCustomer = {};
  groupsSubset.forEach(function(g){
    var key = g.customerName || '(不明)';
    if(!byCustomer[key]) byCustomer[key] = { primaryCount:0, lineCount:0, totalQty:0 };
    byCustomer[key].primaryCount += 1;
    byCustomer[key].lineCount += g.lineCount;
    byCustomer[key].totalQty += g.totalQty;
  });
  return { primaryCount:primaryCount, lineCount:lineCount, totalQty:totalQty, byCustomer:byCustomer };
}
/* ---------- CSV → 得意先マスター照合 → 作業枠ごとの取込計画、の共通パイプライン ----------
   手動CSV取込・将来の共有フォルダ自動取込のどちらからも、この関数を呼び出す想定。
   DOM操作を一切行わない純粋なデータ処理関数。 */
function buildAutoMappedImportPlan(parseResult, mapping){
  var resolved = resolveCustomerTaskMapping(parseResult.shipperGroups, mapping);
  var taskPlans = Object.keys(resolved.byTask).map(function(taskId){
    var groupsSubset = resolved.byTask[taskId];
    var summary = summarizeShipperGroups(groupsSubset);
    var customerNamesInTask = {};
    groupsSubset.forEach(function(g){ customerNamesInTask[g.customerName] = true; });
    var byProductForTask = {};
    Object.keys(parseResult.byProduct||{}).forEach(function(code){
      var p = parseResult.byProduct[code];
      if(customerNamesInTask[p.customerName]) byProductForTask[code] = p;
    });
    return {
      taskId: taskId,
      primaryCount: summary.primaryCount, lineCount: summary.lineCount, totalQty: summary.totalQty,
      byCustomer: summary.byCustomer, byProduct: byProductForTask,
      shipperNos: groupsSubset.map(function(g){ return g.shipperNo; })
    };
  });
  var unmapped = Object.keys(resolved.unmappedByCustomer).map(function(customerName){
    var groupsSubset = resolved.unmappedByCustomer[customerName];
    var summary = summarizeShipperGroups(groupsSubset);
    return { customerName: customerName, primaryCount: summary.primaryCount, lineCount: summary.lineCount, totalQty: summary.totalQty };
  });
  return { taskPlans: taskPlans, unmapped: unmapped };
}

/* ---------- 配置アルゴリズム ---------- */
function staffRemainingMinutes(staffId, day, nowDate, shiftSettings){
  var endStr = (day.shiftEndOverrides && day.shiftEndOverrides[staffId]) || (shiftSettings && shiftSettings.enabled ? shiftSettings.end : null) || '18:00';
  var startStr = (day.shiftStartOverrides && day.shiftStartOverrides[staffId]) || (shiftSettings && shiftSettings.enabled ? shiftSettings.start : null) || '09:00';
  var dateStr = day.date;
  var endDate = new Date(dateStr+'T'+endStr+':00');
  var nowD = nowDate || new Date();
  var remainMs = endDate.getTime() - nowD.getTime();
  return Math.max(0, remainMs/60000);
}
function tasksWithVolumeForDate(backlog, dateStr, workVolume){
  return backlog.filter(function(t){ return t.workDate===dateStr && !t.archived; }).filter(function(t){
    var totals = wvTotalsForTask(workVolume||emptyWorkVolume(), t.id);
    return totals && totals.totalQty>0;
  });
}
/* 各作業について、標準生産性ベースの「目安」必要人時・逼迫度を計算する。
   ※ここでの「作業量」は当日CSVの全体量であり、残作業量ではない
   (実際の完了数量を取得できないため、残作業量は今回算出しない方針)。 */
function computeTaskUrgency(task, workVolume, taskPriority, productivityMaster, nowDate){
  var totals = wvTotalsForTask(workVolume, task.id);
  var qty = totals.totalQty;
  var prio = (taskPriority && taskPriority[task.id]) || { deadline: null, priorityLevel: 4 };
  var avgProd = productivityRateFor(productivityMaster, task.id, null); // taskAverageのみを見る(逼迫度の目安用)
  var roughHours = (avgProd.rate && avgProd.rate>0) ? qty/avgProd.rate : null;
  var deadlineMinutes = null;
  if(prio.deadline){
    var dl = new Date(task.workDate+'T'+prio.deadline+':00');
    deadlineMinutes = Math.max(0, (dl.getTime()-nowDate.getTime())/60000);
  }
  var urgency;
  if(roughHours===null){
    urgency = -1; // 生産性データが無く逼迫度を計算できない(優先順位のみで判断)
  }else if(deadlineMinutes===null){
    urgency = roughHours>0 ? 0.01 : 0; // 締切なし。優先順位頼み
  }else if(deadlineMinutes<=0){
    urgency = 999; // 締切を過ぎている
  }else{
    urgency = (roughHours*60)/deadlineMinutes;
  }
  return { taskId: task.id, qty: qty, roughHours: roughHours, deadlineMinutes: deadlineMinutes, priorityLevel: prio.priorityLevel, urgency: urgency, unit: (productivityMaster[task.id]&&productivityMaster[task.id].unit)||'個' };
}
/* 配置案を作成する(貪欲法)。候補者は「出勤中」かつ「現在アクティブな作業が無い(空き)」人のみ。
   進行中の作業者を強制的に動かすことはしない(v1のシンプル方針)。 */
function computeStaffingSuggestion(day, workVolume, taskPriority, productivityMaster, nowDate, backlog, roster){
  var dateStr = day.date;
  var tasks = tasksWithVolumeForDate(backlog, dateStr, workVolume);
  var urgencies = tasks.map(function(t){ return computeTaskUrgency(t, workVolume, taskPriority, productivityMaster, nowDate); });
  // 逼迫度が高い順(不明[-1]は最後)、同点は優先順位(数値が小さいほど優先) ※納期・優先度を最優先する順序は維持
  urgencies.sort(function(a,b){
    if(a.urgency===-1 && b.urgency!==-1) return 1;
    if(b.urgency===-1 && a.urgency!==-1) return -1;
    if(Math.abs(a.urgency-b.urgency)>0.001) return b.urgency-a.urgency;
    return a.priorityLevel-b.priorityLevel;
  });

  var candidates = roster.filter(function(s){
    if(s.archived) return false;
    if(!day.attendance[s.id]) return false;
    var log = (day.logs||[]).find(function(l){ return l.staffId===s.id && l.end===null; });
    return !log; // 現在何もアクティブな作業をしていない人だけを配置対象にする
  }).map(function(s){ return s.id; });

  // ---- 作業負荷・直近作業の把握(偏り防止のための追加情報。納期・優先度より優先度は下) ----
  var STANDARD_WORKDAY_MIN = 480; // 8時間を「1日分の負荷」の基準値として正規化に使う
  var URGENCY_STRICT_THRESHOLD = 0.75; // これ以上の逼迫度は「納期厳守モード」とし、負荷分散よりも納期達成を優先する
  var REPEAT_PENALTY_RATIO = 0.25; // 同一作業への連続配置に対する評価の目安の割引率(除外はしない)

  var agg = aggregateDays([day]);
  var workedMinutesToday = {}; // これまでの実績作業時間(休憩含む合計から休憩を除く)
  roster.forEach(function(s){
    var info = agg.perStaff[s.id];
    workedMinutesToday[s.id] = info ? Math.max(0, (info.ms - (info.breakMs||0)))/60000 : 0;
  });
  var assignedMinutesInPlan = {}; // 今回の配置案の中で、すでに割り当てた(予定)分数
  roster.forEach(function(s){ assignedMinutesInPlan[s.id] = 0; });
  var lastTaskForStaff = {}; // 本日その人が最後に従事していた作業(進行中 or 直近で終了したもの)
  roster.forEach(function(s){
    var logsForStaff = (day.logs||[]).filter(function(l){ return l.staffId===s.id && l.taskId!=='BREAK'; });
    if(logsForStaff.length){
      logsForStaff.sort(function(a,b){ return new Date(b.start)-new Date(a.start); });
      lastTaskForStaff[s.id] = logsForStaff[0].taskId;
    }
  });

  var assignments = [];
  var expectedQty = {}; // taskId -> 見込み処理量の累計
  urgencies.forEach(function(u){ expectedQty[u.taskId] = 0; });

  /* 候補者ごとにスコアを計算する。
     スコア = 見込み処理量(納期までの持ち時間 × 生産性)を基準に、
     納期に十分な余裕がある場合のみ、
       ・作業負荷(実績+この配置案内での割当予定)が高い人を割り引く
       ・同一作業への連続配置を軽く割り引く
     という調整を行う。納期が厳しい作業(urgent)では調整を行わず、
     常に「その作業を一番早く終えられる人」を優先する(公平性より納期達成)。 */
  function bestCandidateFor(u){
    var urgent = (u.urgency!==-1 && u.urgency>=URGENCY_STRICT_THRESHOLD);
    var rawBest = null, rawBestQty = -1; // 調整前の「最速」候補(理由説明用に別途保持)
    var best = null, bestScore = -Infinity;
    candidates.forEach(function(sid){
      var remainMin = staffRemainingMinutes(sid, day, nowDate, state.shiftSettings);
      if(remainMin<=0) return;
      var effectiveMin = (u.deadlineMinutes!==null) ? Math.min(remainMin, u.deadlineMinutes) : remainMin;
      var prod = productivityRateFor(productivityMaster, u.taskId, sid);
      if(!prod.rate) return; // 生産性が全く分からない人は見積りに使わない
      var qty = (effectiveMin/60)*prod.rate;
      var totalLoadMin = (workedMinutesToday[sid]||0) + (assignedMinutesInPlan[sid]||0);
      var loadPenalty = Math.min(0.5, totalLoadMin/STANDARD_WORKDAY_MIN); // 最大50%までの割引に抑える
      var isRepeat = (lastTaskForStaff[sid]===u.taskId);
      if(qty>rawBestQty){ rawBestQty = qty; rawBest = { staffId: sid, qty:qty, basis:prod.basis, rate:prod.rate, hasLoadPenalty: loadPenalty>0.02, hasRepeatPenalty: isRepeat }; }

      var score = qty;
      if(!urgent){
        if(loadPenalty>0.02) score = score*(1-loadPenalty);
        if(isRepeat) score = score*(1-REPEAT_PENALTY_RATIO);
      }
      if(score>bestScore){ bestScore = score; best = { staffId:sid, qty:qty, basis:prod.basis, rate:prod.rate }; }
    });
    if(best) best.rawBest = rawBest;
    return best;
  }
  function buildReason(u, pick){
    if(u.deadlineMinutes!==null && u.urgency!==-1 && u.urgency>=URGENCY_STRICT_THRESHOLD){
      return '締切まで残りわずかなため('+Math.round(u.deadlineMinutes)+'分)';
    }
    if(u.priorityLevel<=2){
      return '優先度が高いため';
    }
    if(u.roughHours!==null && u.roughHours>=3){
      return 'この作業の必要工数が大きいため';
    }
    if(pick.rawBest && pick.rawBest.staffId!==pick.staffId){
      var rawName = staffById(pick.rawBest.staffId).name;
      if(pick.rawBest.hasRepeatPenalty) return '作業の偏りを抑えるため';
      if(pick.rawBest.hasLoadPenalty) return rawName+'さんの作業負荷が高いため'+staffById(pick.staffId).name+'さんを配置';
    }
    if(pick.basis==='individual') return staffById(pick.staffId).name+'さんはこの作業の生産性が高いため';
    return '担当者確保のため';
  }

  urgencies.forEach(function(u){
    while(candidates.length){
      if(u.roughHours!==null && expectedQty[u.taskId]>=u.qty-0.01) break; // 見込みで足りていれば打ち切り(浮動小数点誤差を許容)
      var pick = bestCandidateFor(u);
      if(!pick) break;
      assignments.push({
        staffId: pick.staffId, taskId: u.taskId,
        expectedQty: Math.round(pick.qty), productivityBasis: pick.basis, rate: pick.rate,
        reason: buildReason(u, pick)
      });
      expectedQty[u.taskId] += pick.qty;
      var remainMinForPick = staffRemainingMinutes(pick.staffId, day, nowDate, state.shiftSettings);
      var effMinForPick = (u.deadlineMinutes!==null) ? Math.min(remainMinForPick, u.deadlineMinutes) : remainMinForPick;
      assignedMinutesInPlan[pick.staffId] = (assignedMinutesInPlan[pick.staffId]||0) + effMinForPick;
      lastTaskForStaff[pick.staffId] = u.taskId;
      candidates.splice(candidates.indexOf(pick.staffId),1);
      if(u.roughHours===null) break; // 生産性不明タスクは1人配置したら次へ(目安が無いため積み増ししない)
    }
  });

  // 余った人員: 最も見込みが足りていない作業へ追加配置
  while(candidates.length && urgencies.length){
    var short = urgencies.filter(function(u){ return u.roughHours!==null; })
      .sort(function(a,b){ return (b.qty-expectedQty[b.taskId]) - (a.qty-expectedQty[a.taskId]); })[0];
    if(!short) break;
    var pick2 = bestCandidateFor(short);
    if(!pick2) break;
    assignments.push({ staffId: pick2.staffId, taskId: short.taskId, expectedQty: Math.round(pick2.qty), productivityBasis: pick2.basis, rate: pick2.rate, reason:'余剰人員の追加配置' });
    expectedQty[short.taskId] += pick2.qty;
    candidates.splice(candidates.indexOf(pick2.staffId),1);
  }

  var taskSummaries = urgencies.map(function(u){
    return { taskId:u.taskId, qty:u.qty, roughHours:u.roughHours, deadlineMinutes:u.deadlineMinutes, priorityLevel:u.priorityLevel, unit:u.unit, expectedQty: Math.round(expectedQty[u.taskId]||0), shortage: u.roughHours!==null ? Math.max(0, u.qty-(expectedQty[u.taskId]||0)) : null };
  });

  return { generatedAt: nowDate.toISOString(), status:'draft', assignments: assignments, taskSummaries: taskSummaries, unassignedStaffIds: candidates.slice() };
}
/* 作業完了直後の「次のおすすめ作業」。その人が今から入った場合の見込み処理量が
   最も締切に効く作業を1件返す。 */
function suggestNextTaskFor(staffId, day, workVolume, taskPriority, productivityMaster, nowDate, backlog){
  var dateStr = day.date;
  var tasks = tasksWithVolumeForDate(backlog, dateStr, workVolume);
  var urgencies = tasks.map(function(t){ return computeTaskUrgency(t, workVolume, taskPriority, productivityMaster, nowDate); });
  var remainMin = staffRemainingMinutes(staffId, day, nowDate, state.shiftSettings);
  if(remainMin<=0 || !urgencies.length) return null;
  var scored = urgencies.map(function(u){
    var effectiveMin = (u.deadlineMinutes!==null) ? Math.min(remainMin, u.deadlineMinutes) : remainMin;
    var prod = productivityRateFor(productivityMaster, u.taskId, staffId);
    var expectedQty = prod.rate ? (effectiveMin/60)*prod.rate : null;
    return { taskId:u.taskId, urgency:u.urgency, deadlineMinutes:u.deadlineMinutes, priorityLevel:u.priorityLevel, expectedQty: expectedQty, rate: prod.rate, basis: prod.basis, unit:u.unit, qty:u.qty };
  });
  scored.sort(function(a,b){
    if(a.urgency===-1 && b.urgency!==-1) return 1;
    if(b.urgency===-1 && a.urgency!==-1) return -1;
    if(Math.abs(a.urgency-b.urgency)>0.001) return b.urgency-a.urgency;
    return a.priorityLevel-b.priorityLevel;
  });
  return scored[0] || null;
}

/* ---------- CSV重複ファイル検知(全日付・全作業を対象にした軽量インデックス) ---------- */
async function computeFileFingerprint(file){
  var buffer = await file.arrayBuffer();
  var hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
  return Array.from(new Uint8Array(hashBuffer)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
}

}
function computeAnomalyWarning(newTotals, prevImport){
  if(!prevImport) return null;
  var SMALL_SAMPLE_THRESHOLD = 10;
  function pctDiff(newVal, oldVal){
    if(oldVal===0) return newVal===0 ? 0 : 100;
    return ((newVal-oldVal)/oldVal)*100;
  }
  var diffs = {
    primaryCount: pctDiff(newTotals.primaryCount, prevImport.primaryCount),
    lineCount: pctDiff(newTotals.lineCount, prevImport.lineCount),
    totalQty: pctDiff(newTotals.totalQty, prevImport.totalQty)
  };
  var flagged = Object.keys(diffs).filter(function(k){ return Math.abs(diffs[k])>=50; });
  if(!flagged.length) return null;
  return { flagged: flagged, diffs: diffs, prevImport: prevImport, isSmallSample: prevImport.primaryCount < SMALL_SAMPLE_THRESHOLD };
}
function findShipperNoOverlap(newShipperNos, workVolume, taskId, excludeImportId){
  var prevImports = wvActiveImports(workVolume).filter(function(i){ return i.taskId===taskId && i.id!==excludeImportId && i.shipperNos; });
  var seen = {};
  prevImports.forEach(function(i){ i.shipperNos.forEach(function(sn){ seen[sn]=true; }); });
  return newShipperNos.filter(function(sn){ return seen[sn]; });
}
function wvTotalsForTask(data, taskId){
  var imports = wvActiveImports(data).filter(function(i){ return i.taskId===taskId; });
  return {
    primaryCount: imports.reduce(function(a,i){ return a+(i.primaryCount||0); }, 0),
    lineCount: imports.reduce(function(a,i){ return a+(i.lineCount||0); }, 0),
    totalQty: imports.reduce(function(a,i){ return a+(i.totalQty||0); }, 0),
    importCount: imports.length
  };
}
function parseCsvForWorkVolume(file, columnMap, callback, errCallback){
  var reader = new FileReader();
  reader.onload = function(e){
    var buffer = e.target.result;
    var text;
    try{ text = new TextDecoder('shift-jis').decode(buffer); }
    catch(err){ text = new TextDecoder('utf-8').decode(buffer); }
    try{
      var parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
      var rows = parsed.data;
      var headers = parsed.meta && parsed.meta.fields ? parsed.meta.fields : [];
      var locCol = columnMap && columnMap.pickLocation;
      var invCol = columnMap && columnMap.invoiceType;
      var groups = {};
      var order = [];
      var byCustomer = {};
      var byProduct = {};
      rows.forEach(function(r){
        var shipperNo = (r['荷主出荷NO']||'').trim();
        if(!shipperNo) return;
        var rowCustomerName = (r['取引先名']||'').trim() || '(不明)';
        if(!groups[shipperNo]){
          groups[shipperNo] = {
            shipperNo: shipperNo,
            customerName: rowCustomerName,
            pickLocation: locCol ? (r[locCol]||'').trim() : '',
            invoiceType: invCol ? (r[invCol]||'').trim() : '',
            lineCount:0, totalQty:0
          };
          order.push(shipperNo);
        }
        groups[shipperNo].lineCount++;
        var qty = parseInt(r['出荷指示数'],10);
        if(isNaN(qty)) qty = 0;
        groups[shipperNo].totalQty += qty;

        // 荷主(取引先名)別・商品(商品ID)別の内訳(実CSVの列名で取得。無ければ「(不明)」扱い)
        var customerName = rowCustomerName;
        if(!byCustomer[customerName]) byCustomer[customerName] = { primaryShipperNos:{}, lineCount:0, totalQty:0 };
        byCustomer[customerName].primaryShipperNos[shipperNo] = true;
        byCustomer[customerName].lineCount++;
        byCustomer[customerName].totalQty += qty;

        var productCode = (r['商品ID']||'').trim();
        if(productCode){
          var productName = (r['商品名']||'').trim();
          if(!byProduct[productCode]) byProduct[productCode] = { productName: productName, customerName: customerName, primaryShipperNos:{}, lineCount:0, totalQty:0 };
          byProduct[productCode].primaryShipperNos[shipperNo] = true;
          byProduct[productCode].lineCount++;
          byProduct[productCode].totalQty += qty;
        }
      });
      var shipperGroups = order.map(function(sn){ return groups[sn]; });
      if(!shipperGroups.length){ errCallback('データが見つかりませんでした。CSVの形式(荷主出荷NO列など)をご確認ください。'); return; }
      var primaryCount = shipperGroups.length;
      var lineCount = shipperGroups.reduce(function(a,g){ return a+g.lineCount; }, 0);
      var totalQty = shipperGroups.reduce(function(a,g){ return a+g.totalQty; }, 0);
      var missingColumns = [];
      if(headers.indexOf('荷主出荷NO')===-1) missingColumns.push('荷主出荷NO');
      if(headers.indexOf('出荷指示数')===-1) missingColumns.push('出荷指示数');
      if(locCol && headers.indexOf(locCol)===-1) missingColumns.push(locCol+'(引当ロケーション列)');
      if(invCol && headers.indexOf(invCol)===-1) missingColumns.push(invCol+'(送り状区分列)');
      if(headers.indexOf('取引先名')===-1) missingColumns.push('取引先名(荷主別分析が空になります)');
      if(headers.indexOf('商品ID')===-1) missingColumns.push('商品ID(商品別分析が空になります)');

      // primaryShipperNos(件数の重複カウント防止用の集合)を件数に変換して確定
      var byCustomerFinal = {};
      Object.keys(byCustomer).forEach(function(k){
        var c = byCustomer[k];
        byCustomerFinal[k] = { primaryCount: Object.keys(c.primaryShipperNos).length, lineCount: c.lineCount, totalQty: c.totalQty };
      });
      var byProductFinal = {};
      Object.keys(byProduct).forEach(function(k){
        var p = byProduct[k];
        byProductFinal[k] = { productName: p.productName, customerName: p.customerName, primaryCount: Object.keys(p.primaryShipperNos).length, lineCount: p.lineCount, totalQty: p.totalQty };
      });

      callback({
        primaryCount: primaryCount, lineCount: lineCount, totalQty: totalQty, shipperGroups: shipperGroups,
        rowCount: rows.length, headers: headers, missingColumns: missingColumns,
        byCustomer: byCustomerFinal, byProduct: byProductFinal
      });
    }catch(err){
      errCallback('CSVの読み込みに失敗しました: '+(err.message||err));
    }
  };
  reader.onerror = function(){ errCallback('ファイルの読み込みに失敗しました。'); };
  reader.readAsArrayBuffer(file);
}
function buildWvBatchName(template, criteria, taskName, seq){
  return (template||'{作業名} バッチ{連番}')
    .replace(/\{引当ロケーション\}/g, criteria.pickLocation || '(未指定)')
    .replace(/\{送り状区分\}/g, criteria.invoiceType || '(未指定)')
    .replace(/\{作業名\}/g, taskName || '')
    .replace(/\{連番\}/g, String(seq));
}
function generateWorkVolumeBatches(shipperGroups, config, taskId, taskName, importId){
  var mode = config.criteria || 'none';
  if(mode==='none') return [];
  var groups = {};
  var order = [];
  if(mode==='even_split'){
    var max = Math.max(1, config.evenSplitMaxSlips||15);
    for(var i=0;i<shipperGroups.length;i+=max){
      var chunk = shipperGroups.slice(i, i+max);
      var seq = Math.floor(i/max)+1;
      var key = 'chunk-'+seq;
      groups[key] = { items: chunk, criteria: {} };
      order.push(key);
    }
  }else{
    shipperGroups.forEach(function(g){
      var loc = mode!=='invoice' ? (g.pickLocation||'') : '';
      var inv = mode!=='location' ? (g.invoiceType||'') : '';
      var key = loc+'|||'+inv;
      if(!groups[key]){ groups[key] = { items:[], criteria:{ pickLocation:(mode!=='invoice'?loc:undefined), invoiceType:(mode!=='location'?inv:undefined) } }; order.push(key); }
      groups[key].items.push(g);
    });
  }
  var seqCounter = 0;
  return order.map(function(key){
    seqCounter++;
    var g = groups[key];
    return {
      id: uid(), taskId: taskId, importId: importId,
      name: buildWvBatchName(config.nameTemplate, g.criteria, taskName, seqCounter),
      criteria: g.criteria,
      primaryCount: g.items.length,
      lineCount: g.items.reduce(function(a,x){ return a+x.lineCount; }, 0),
      totalQty: g.items.reduce(function(a,x){ return a+x.totalQty; }, 0),
      deletedAt:null, deletedBy:null, deleteReason:null,
      createdAt: new Date().toISOString()
    };
  });
}
async function getWorkVolumeForDate(dateStr){
  if(dateStr===todayStr()) return state.workVolume;
  var data = await loadWorkVolume(dateStr);
  return data || emptyWorkVolume();
}
async function deleteWvImport(dateStr, importId, reason){
  var data = await getWorkVolumeForDate(dateStr);
  var imp = data.imports.find(function(i){ return i.id===importId; });
  if(!imp) return;
  imp.deletedAt = new Date().toISOString();
  imp.deletedBy = state.activeStaffId;
  imp.deleteReason = reason || '';
  data.batches.forEach(function(b){
    if(b.importId===importId && !b.deletedAt){
      b.deletedAt = imp.deletedAt; b.deletedBy = imp.deletedBy; b.deleteReason = '取込削除に伴う自動削除';
    }
  });
  await saveWorkVolume(dateStr, data);
  if(dateStr===todayStr()) state.workVolume = data;
  if(state.wvTargetDate===dateStr || (!state.wvTargetDate && dateStr===todayStr())) state.wvViewData = data;
}
async function restoreWvImport(dateStr, importId){
  var data = await getWorkVolumeForDate(dateStr);
  var imp = data.imports.find(function(i){ return i.id===importId; });
  if(!imp) return;
  imp.deletedAt = null; imp.deletedBy = null; imp.deleteReason = null;
  data.batches.forEach(function(b){
    if(b.importId===importId && b.deleteReason==='取込削除に伴う自動削除'){
      b.deletedAt = null; b.deletedBy = null; b.deleteReason = null;
    }
  });
  await saveWorkVolume(dateStr, data);
  if(dateStr===todayStr()) state.workVolume = data;
  if(state.wvTargetDate===dateStr || (!state.wvTargetDate && dateStr===todayStr())) state.wvViewData = data;
}
async function moveWvImportDate(fromDateStr, toDateStr, importId){
  if(fromDateStr===toDateStr) return { ok:false, msg:'同じ日付です' };
  var fromData = await getWorkVolumeForDate(fromDateStr);
  var imp = fromData.imports.find(function(i){ return i.id===importId; });
  if(!imp) return { ok:false, msg:'取込が見つかりません' };
  var movedBatches = fromData.batches.filter(function(b){ return b.importId===importId; });
  fromData.imports = fromData.imports.filter(function(i){ return i.id!==importId; });
  fromData.batches = fromData.batches.filter(function(b){ return b.importId!==importId; });
  await saveWorkVolume(fromDateStr, fromData);
  if(fromDateStr===todayStr()) state.workVolume = fromData;

  var toData = await getWorkVolumeForDate(toDateStr);
  toData.imports.push(imp);
  toData.batches = toData.batches.concat(movedBatches);
  await saveWorkVolume(toDateStr, toData);
  if(toDateStr===todayStr()) state.workVolume = toData;

  if(state.wvTargetDate===fromDateStr) state.wvViewData = fromData;
  else if(state.wvTargetDate===toDateStr) state.wvViewData = toData;
  return { ok:true, imp: imp };
}
