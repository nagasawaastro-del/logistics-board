<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>物流センター 作業割り当てボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink-950:#0A0E17;
  --ink-900:#111827;
  --ink-800:#1A2338;
  --ink-700:#232E48;
  --ink-600:#374156;
  --paper-50:#FAF8F3;
  --paper-100:#F1ECE1;
  --paper-200:#E5DFCF;
  --paper-line:#D9D2BE;
  --amber-500:#F2A93B;
  --amber-600:#D98E1F;
  --rust-600:#C1521F;
  --teal-500:#2FA6A6;
  --green-500:#3FB27F;
  --indigo-500:#4C5FD5;
  --pink-500:#D6577E;
  --slate-500:#667085;
  --slate-300:#9AA3B2;
  --ink-text:#1B2333;
  --font-display:'Oswald',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font-body);
  background:var(--paper-50);
  color:var(--ink-text);
  overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--paper-line);border-radius:6px;}

#app{min-height:100vh;}

/* ---------- ROLE GATE ---------- */
.gate{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,var(--paper-50),var(--paper-100));
  padding:32px 16px;text-align:center;
}
.gate-eyebrow{
  font-family:var(--font-mono);font-size:12px;letter-spacing:.18em;color:var(--rust-600);
  text-transform:uppercase;margin-bottom:10px;
}
.gate-title{
  font-family:var(--font-display);font-weight:700;font-size:clamp(28px,5vw,44px);
  color:var(--ink-900);margin:0 0 8px;letter-spacing:.01em;
}
.gate-sub{font-size:15px;color:var(--slate-500);margin:0 0 40px;max-width:440px;}
.gate-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;width:100%;max-width:920px;}
.gate-card{
  background:#fff;border:1px solid var(--paper-line);border-radius:14px;padding:28px 20px;
  display:flex;flex-direction:column;align-items:center;gap:10px;transition:transform .15s,border-color .15s;
}
.gate-card:hover{transform:translateY(-2px);border-color:var(--amber-500);}
.gate-card:active{transform:translateY(0) scale(.98);}
.gate-icon{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;}
.gate-card-title{font-family:var(--font-display);font-weight:600;font-size:18px;color:var(--ink-900);}
.gate-card-desc{font-size:13px;color:var(--slate-500);line-height:1.5;}
.changelog-link{background:transparent;border:none;color:var(--slate-500);font-size:12px;text-decoration:underline;margin-top:28px;cursor:pointer;}
.changelog-link:hover{color:var(--ink-900);}

.changelog-card{background:#fff;border-radius:20px;padding:28px;max-width:480px;width:100%;max-height:80vh;overflow-y:auto;text-align:left;}
.changelog-title{font-family:var(--font-display);font-weight:700;font-size:20px;margin-bottom:18px;color:var(--ink-900);}
.changelog-entry{margin-bottom:20px;}
.changelog-entry:last-of-type{margin-bottom:12px;}
.changelog-date{font-family:var(--font-mono);font-size:12px;color:var(--rust-600);font-weight:700;margin-bottom:6px;letter-spacing:.03em;}
.changelog-items{margin:0;padding-left:20px;font-size:13px;line-height:1.8;color:var(--ink-text);}
.changelog-close{width:100%;padding:13px;border-radius:12px;border:none;background:var(--paper-200);color:var(--slate-500);font-weight:700;font-size:14px;}
.changelog-close:hover{background:var(--paper-line);}

/* ---------- TOPBAR ---------- */
.topbar{
  background:var(--ink-900);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:3px solid var(--amber-500);position:sticky;top:0;z-index:20;
}
.topbar-left{display:flex;align-items:baseline;gap:12px;}
.topbar-title{font-family:var(--font-display);font-weight:600;font-size:16px;letter-spacing:.03em;}
.topbar-date{font-family:var(--font-mono);font-size:12px;color:var(--slate-300);}
.topbar-right{display:flex;align-items:center;gap:10px;}
.pill-btn{
  background:transparent;border:1px solid var(--ink-600);color:#cfd5e0;border-radius:20px;
  padding:6px 14px;font-size:12px;font-weight:500;
}
.pill-btn:hover{border-color:var(--amber-500);color:#fff;}

/* ---------- MANAGER VIEW ---------- */
.mgr-wrap{padding:20px;max-width:1400px;margin:0 auto;}
.date-nav{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.date-nav-btn{
  width:40px;height:40px;border-radius:10px;border:1px solid var(--paper-line);background:#fff;
  font-size:16px;color:var(--ink-900);flex:none;
}
.date-nav-btn:hover{border-color:var(--amber-500);}
.date-nav-input{border:1px solid var(--paper-line);border-radius:10px;padding:9px 12px;font-size:14px;font-family:var(--font-mono);}
.date-nav-today-badge{background:var(--green-500);color:#fff;font-size:11px;font-weight:700;padding:4px 12px;border-radius:12px;}
.date-nav-today-btn{background:var(--ink-900);color:#fff;border:none;border-radius:12px;padding:8px 16px;font-size:12px;font-weight:600;}

.cal-month-label{font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--ink-900);padding:0 6px;}
.cal-grid-header{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
.cal-weekday{text-align:center;font-size:11px;color:var(--slate-500);font-weight:700;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-cell{
  min-height:74px;border:1px solid var(--paper-line);border-radius:10px;padding:6px 7px;background:var(--paper-50);
  cursor:pointer;display:flex;flex-direction:column;gap:2px;
}
.cal-cell:hover{border-color:var(--amber-500);background:#FFF9EE;}
.cal-cell-empty{border:none;background:transparent;cursor:default;}
.cal-cell-empty:hover{border:none;background:transparent;}
.cal-cell-today{border-color:var(--ink-900);border-width:2px;}
.cal-cell-sun{background:#FDEEF2;}
.cal-cell-sun:hover{background:#FBE0E8;}
.cal-cell-sat{background:#EEF0FB;}
.cal-cell-sat:hover{background:#E2E5F8;}
.cal-cell-holiday{background:#FDEEF2;border-color:#F0A9BE;}
.cal-cell-holiday:hover{background:#FBE0E8;}
.cal-cell-holiday-name{font-size:9px;color:#C1466A;line-height:1.15;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cal-weekday-sun{color:#D6577E;}
.cal-weekday-sat{color:#4C5FD5;}
.cal-cell-day{font-family:var(--font-mono);font-weight:700;font-size:13px;color:var(--ink-900);}
.cal-cell-stat{font-size:10.5px;color:var(--slate-500);}
@media (max-width:640px){
  .cal-cell{min-height:58px;padding:4px 5px;}
  .cal-cell-stat{font-size:9.5px;}
}

.warn-banner{
  background:#FFF3DE;border:1px solid var(--amber-500);color:#7A4A00;border-radius:10px;
  padding:12px 16px;font-size:13px;font-weight:600;margin-bottom:16px;
}
.chip-warn{border:1px solid var(--amber-500);background:#FFF7E8;}
.chip-warn-label{font-size:10px;font-weight:700;color:var(--amber-600);}
.break-toggle-row{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-900);margin-bottom:12px;cursor:pointer;}
.break-toggle-row input{width:16px;height:16px;}
.break-time-row{display:flex;gap:16px;}
.break-time-row input{border:1px solid var(--paper-line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:var(--font-mono);}
.date-nav-today-btn:hover{background:var(--ink-700);}
.log-edit-btn{background:var(--paper-100);border:1px solid var(--paper-line);border-radius:14px;padding:5px 14px;font-size:12px;font-weight:600;color:var(--ink-900);}
.log-stop-btn{background:#FDEEF2;border:1px solid #D6577E;border-radius:14px;padding:5px 12px;font-size:12px;font-weight:700;color:#B33C63;margin-right:6px;}
.breakdown-detail-list{margin-top:6px;text-align:left;display:inline-block;}
.breakdown-detail-row{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--slate-500);padding:2px 0;}
.breakdown-detail-name{font-weight:600;color:var(--ink-900);min-width:64px;}
.breakdown-detail-qty{font-family:var(--font-mono);min-width:48px;text-align:right;}
.breakdown-detail-time{font-family:var(--font-mono);min-width:56px;text-align:right;}
.log-stop-btn:hover{background:#F9DCE5;}
.log-edit-btn:hover{border-color:var(--amber-500);background:#FFF7E8;}
.mgr-grid{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start;min-width:0;}
@media (max-width:900px){.mgr-grid{grid-template-columns:1fr;}}
.mgr-grid > *{min-width:0;}
.panel{background:#fff;border:1px solid var(--paper-line);border-radius:14px;padding:18px;min-width:0;}
.panel-title{
  font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.04em;
  text-transform:uppercase;color:var(--ink-900);margin:0 0 14px;display:flex;align-items:center;justify-content:space-between;
}
.count-badge{font-family:var(--font-mono);font-size:11px;background:var(--paper-100);color:var(--slate-500);padding:2px 8px;border-radius:10px;}

.roster-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.roster-item{
  display:flex;flex-direction:column;gap:6px;padding:8px 10px;
  border-radius:10px;background:var(--paper-50);border:1px solid var(--paper-line);
}
.pattern-row{display:flex;gap:4px;}
.avatar-swatch-row{display:flex;gap:5px;margin-top:6px;}
.holiday-off-toggle{
  margin-top:6px;font-size:11px;font-weight:600;color:var(--slate-500);background:#fff;
  border:1px solid var(--paper-line);border-radius:12px;padding:4px 10px;
}
.holiday-off-toggle.on{background:#FDEEF2;border-color:#D6577E;color:#B33C63;}
.overtime-row{display:flex;align-items:center;gap:6px;margin-top:6px;}
.overtime-label{font-size:11px;color:var(--slate-500);}
.overtime-input{border:1px solid var(--paper-line);border-radius:8px;padding:3px 6px;font-size:11px;font-family:var(--font-mono);}
.avatar-swatch{width:16px;height:16px;border-radius:4px;border:2px solid transparent;cursor:pointer;}
.avatar-swatch.sel{border-color:var(--ink-900);}
.pattern-day{
  width:24px;height:24px;border-radius:6px;border:1px solid var(--paper-line);background:#fff;
  font-size:11px;font-weight:600;color:var(--slate-300);padding:0;
}
.pattern-day.on{background:var(--teal-500);color:#fff;border-color:var(--teal-500);}
.category-toggle-row{display:flex;gap:6px;margin-bottom:10px;}
.category-toggle-btn{
  flex:1;padding:7px 0;border-radius:8px;border:1px solid var(--paper-line);background:#fff;
  font-size:12px;font-weight:600;color:var(--slate-500);
}
.category-toggle-btn.sel{background:var(--ink-900);color:#fff;border-color:var(--ink-900);}
.roster-item.archived{opacity:.4;}
.roster-name{font-size:14px;font-weight:500;}
.roster-controls{display:flex;align-items:center;gap:6px;}
.toggle-att{
  border:none;border-radius:14px;padding:4px 10px;font-size:11px;font-weight:600;
}
.toggle-att.on{background:var(--green-500);color:#fff;}
.toggle-att.off{background:var(--paper-200);color:var(--slate-500);}
.icon-x{border:none;background:transparent;color:var(--slate-300);font-size:14px;padding:2px 4px;}
.icon-x:hover{color:var(--rust-600);}
.add-row{display:flex;gap:6px;margin-top:8px;}
.add-row input{
  flex:1;border:1px solid var(--paper-line);border-radius:8px;padding:8px 10px;font-size:13px;
  outline:none;
}
.add-row input:focus{border-color:var(--amber-500);}
.add-btn{
  background:var(--ink-900);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;
}
.add-btn:hover{background:var(--ink-700);}

.staff-pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--paper-line);}
.pool-hint{font-size:11px;color:var(--slate-500);width:100%;margin-bottom:2px;}
.chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--paper-100);border:1px solid var(--paper-line);
  border-radius:20px;padding:6px 12px;font-size:13px;font-weight:500;cursor:grab;user-select:none;
}
.chip:active{cursor:grabbing;}
.chip-dot{width:7px;height:7px;border-radius:50%;background:var(--slate-300);}

.task-board{display:flex;flex-wrap:wrap;gap:14px;}
.task-col{
  min-width:230px;flex:1 0 230px;background:var(--paper-50);border:1px solid var(--paper-line);border-radius:12px;
  padding:12px;transition:background .12s,border-color .12s;
}
.task-col.dragover{background:#FFF7E8;border-color:var(--amber-500);}
.task-col-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.task-color-dot{width:12px;height:12px;border-radius:3px;flex:none;}
.task-col-name{font-family:var(--font-display);font-weight:600;font-size:15px;flex:1;}
.task-col-unit{font-size:11px;color:var(--slate-500);}
.assign-all-btn{width:100%;margin-top:8px;padding:7px;border-radius:8px;border:1px dashed var(--slate-300);background:#fff;font-size:11px;font-weight:600;color:var(--slate-500);}
.assign-all-btn:hover{border-color:var(--teal-500);color:var(--teal-500);border-style:solid;}
.task-col-del{border:none;background:transparent;color:var(--slate-300);font-size:13px;}
.task-col-del:hover{color:var(--rust-600);}
.task-col-body{display:flex;flex-wrap:wrap;gap:6px;min-height:50px;}
.task-chip{
  display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--paper-line);border-radius:16px;
  padding:5px 10px;font-size:12px;font-weight:500;
}
.task-chip button{border:none;background:transparent;color:var(--slate-300);font-size:12px;padding:0;line-height:1;}
.task-chip button:hover{color:var(--rust-600);}
.new-task-btn{
  min-width:150px;flex:0 0 auto;border:2px dashed var(--paper-line);border-radius:12px;background:transparent;
  color:var(--slate-500);font-size:13px;font-weight:600;padding:0 20px;display:flex;align-items:center;justify-content:center;
}
.new-task-btn:hover{border-color:var(--amber-500);color:var(--amber-600);}

.task-form{background:var(--paper-50);border:1px solid var(--paper-line);border-radius:12px;padding:14px;min-width:230px;flex:1 0 230px;}
.task-form label{font-size:11px;color:var(--slate-500);display:block;margin-bottom:4px;margin-top:8px;}
.task-form input{width:100%;border:1px solid var(--paper-line);border-radius:8px;padding:7px 9px;font-size:13px;outline:none;}
.task-form input:focus{border-color:var(--amber-500);}
.swatches{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;}
.swatch{width:22px;height:22px;border-radius:6px;border:2px solid transparent;}
.swatch.sel{border-color:var(--ink-900);}
.task-form-actions{display:flex;gap:8px;margin-top:12px;}
.task-form-actions button{flex:1;padding:8px;border-radius:8px;font-size:12px;font-weight:600;border:none;}
.tf-cancel{background:var(--paper-200);color:var(--slate-500);}
.tf-confirm{background:var(--amber-500);color:#4A2C00;}

.empty-note{font-size:13px;color:var(--slate-500);padding:14px 0;}

.reg-group{margin-bottom:14px;border:1px solid var(--paper-line);border-radius:12px;padding:4px 14px 14px;background:var(--paper-50);}
.reg-group-summary{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 2px;cursor:pointer;list-style:none;}
.reg-group-summary::-webkit-details-marker{display:none;}
.reg-group-summary::before{content:'▸';color:var(--slate-500);font-size:11px;margin-right:6px;transition:transform .15s;}
details[open] > .reg-group-summary::before{transform:rotate(90deg);}
.reg-group-date{font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--rust-600);letter-spacing:.03em;}
.reg-group-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;margin-top:6px;}
.reg-search{width:100%;border:1px solid var(--paper-line);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:14px;outline:none;}

.subcat-tag-wrap{margin-bottom:4px;}
.subcat-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;min-height:20px;}
.subcat-chip{
  display:inline-flex;align-items:center;gap:5px;background:var(--paper-100);border:1px solid var(--paper-line);
  border-radius:14px;padding:4px 6px 4px 12px;font-size:12px;font-weight:600;color:var(--ink-900);
}
.subcat-chip button{border:none;background:transparent;color:var(--slate-300);font-size:14px;line-height:1;padding:2px 4px;}
.subcat-chip button:hover{color:var(--rust-600);}
.subcat-chip-unit{color:var(--slate-500);font-weight:400;}
.subcat-add-row{display:flex;gap:6px;}
.subcat-add-row input{
  border:1px solid var(--paper-line);border-radius:8px;padding:8px 10px;font-size:13px;outline:none;
}
.subcat-name-input{flex:2;min-width:0;}
.subcat-unit-input{flex:1;min-width:0;}
.subcat-add-row input:focus{border-color:var(--amber-500);}
.subcat-add-btn{background:var(--ink-900);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;flex:none;}
.subcat-add-btn:hover{background:var(--ink-700);}
.reg-search:focus{border-color:var(--amber-500);}
.reg-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:#fff;border:1px solid var(--paper-line);margin-bottom:0;}
.reg-row-name{font-size:13px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.reg-row-badge{font-size:10px;font-weight:700;color:var(--teal-500);background:#E9F6F6;border-radius:8px;padding:1px 6px;flex:none;}
.reg-row-cat{font-size:10px;font-weight:700;border-radius:8px;padding:1px 6px;flex:none;}
.reg-row-cat-出荷{color:var(--indigo-500);background:#EEF0FB;}
.reg-row-cat-入庫{color:var(--rust-600);background:#FBEDE6;}
.reg-row-cat-その他{color:var(--slate-500);background:var(--paper-100);}
.reg-row-unit{font-size:11px;color:var(--slate-500);flex:none;}

.report-mode-toggle{display:flex;gap:8px;margin-bottom:18px;}
.report-mode-btn{padding:8px 18px;border-radius:20px;border:1px solid var(--paper-line);background:#fff;font-size:13px;font-weight:600;color:var(--slate-500);}
.report-mode-btn.active{background:var(--ink-900);color:#fff;border-color:var(--ink-900);}
.report-controls{display:flex;gap:14px;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap;}
.report-field label{font-size:11px;color:var(--slate-500);display:block;margin-bottom:4px;}
.report-field input{border:1px solid var(--paper-line);border-radius:8px;padding:8px 10px;font-size:13px;outline:none;}
.report-field input:focus{border-color:var(--amber-500);}
.report-go-btn{background:var(--ink-900);color:#fff;border:none;border-radius:8px;padding:9px 20px;font-size:13px;font-weight:600;}
.csv-export-btn{background:var(--teal-500);color:#fff;border:none;border-radius:16px;padding:6px 14px;font-size:12px;font-weight:600;margin-left:12px;vertical-align:middle;}
.csv-export-btn:hover{background:#268888;}
.report-go-btn:hover{background:var(--ink-700);}
.report-section-title{font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--ink-900);margin:22px 0 10px;}
.report-table{width:100%;border-collapse:collapse;}
.report-table th{text-align:left;font-size:11px;color:var(--slate-500);text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--paper-line);}
.report-table td{padding:10px;border-bottom:1px solid var(--paper-line);font-size:13px;vertical-align:top;}
.report-table td.num{font-family:var(--font-mono);text-align:right;white-space:nowrap;}
.task-breakdown-chip{display:inline-flex;align-items:center;gap:4px;background:var(--paper-100);border-radius:12px;padding:2px 8px;font-size:11px;margin:2px 4px 2px 0;}

.ach-daily-chart{display:flex;align-items:flex-end;gap:3px;height:80px;padding:10px 4px 0;background:#fff;border:1px solid var(--paper-line);border-radius:12px;overflow-x:auto;}

.rpg-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:14px;}

.rpg-avatar-wrap{position:relative;width:52px;height:58px;flex:none;}

@keyframes rpgAvatarGlow{0%,100%{filter:drop-shadow(0 0 3px rgba(242,169,59,.5));}50%{filter:drop-shadow(0 0 9px rgba(242,169,59,1));}}
.avatar-cape{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:62px;height:66px;background:radial-gradient(circle,rgba(76,111,213,.4),transparent 70%);z-index:1;}
.avatar-badge{position:absolute;font-size:13px;z-index:3;line-height:1;}
.avatar-badge-star{top:-3px;right:-3px;}
.avatar-badge-sword{bottom:-3px;right:-5px;}
.avatar-badge-shield{bottom:-3px;left:-5px;}
.avatar-badge-crown{top:-13px;left:50%;transform:translateX(-50%);font-size:15px;}

.rpg-name-block{flex:1;min-width:0;}
.rpg-name{font-family:var(--font-display);font-weight:700;font-size:16px;}
.rpg-title{font-size:12px;color:#B9C0E8;margin-top:1px;}
.rpg-level-badge{
  background:var(--amber-500);color:#4A2C00;font-family:var(--font-mono);font-weight:700;font-size:13px;

}

.rpg-xp-label{font-family:var(--font-mono);font-size:11px;color:#9AA3D6;margin-bottom:10px;}

.rpg-stats{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;}
.rpg-stat-row{display:flex;align-items:center;gap:6px;font-size:11px;}

.rpg-stat-label{width:48px;color:#B9C0E8;flex:none;}

.rpg-stat-fill.atk{background:linear-gradient(90deg,#C1521F,#FF8A50);}
.rpg-stat-fill.def{background:linear-gradient(90deg,#2FA6A6,#7FE0E0);}
.rpg-stat-fill.spd{background:linear-gradient(90deg,#3FB27F,#8CE8B8);}
.rpg-stat-val{width:22px;text-align:right;font-family:var(--font-mono);color:#fff;font-size:11px;flex:none;}

.rpg-spec-chips{display:flex;flex-wrap:wrap;gap:6px;}
.rpg-spec-chip{background:#12173080;border-radius:10px;padding:3px 9px;font-size:11px;color:#DCE1FF;}
.rpg-spec-chip b{color:var(--amber-500);font-family:var(--font-mono);}

.toast-container{position:fixed;top:74px;right:16px;z-index:300;display:flex;flex-direction:column;gap:8px;max-width:320px;}
.toast{
  background:var(--ink-900);color:#fff;border-radius:10px;padding:12px 16px;font-size:13px;line-height:1.5;
  box-shadow:0 6px 18px rgba(0,0,0,.25);border-left:4px solid var(--amber-500);
  animation:toastIn .22s ease-out;display:flex;align-items:center;gap:12px;justify-content:space-between;
}

.toast-action{
  flex:none;background:rgba(255,255,255,.14);border:none;color:#fff;border-radius:16px;padding:6px 14px;
  font-size:12px;font-weight:700;white-space:nowrap;
}

@keyframes toastIn{from{opacity:0;transform:translateX(14px);}to{opacity:1;transform:translateX(0);}}
@keyframes toastOut{to{opacity:0;transform:translateX(14px);}}
@media (max-width:640px){.toast-container{left:12px;right:12px;max-width:none;top:66px;}}

/* ---------- INPUT VIEW (作業実績入力 / tablet-optimized) ---------- */
.input-wrap{min-height:calc(100vh - 60px);display:flex;flex-direction:column;}
.input-wrap button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.name-grid-wrap{flex:1;padding:28px 20px;max-width:1000px;margin:0 auto;width:100%;}
.name-grid-title{font-family:var(--font-display);font-weight:600;font-size:24px;color:var(--ink-900);margin-bottom:22px;text-align:center;}
.name-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;}
.name-tile{
  background:#fff;border:2px solid var(--paper-line);border-radius:16px;padding:28px 14px;text-align:center;
  font-family:var(--font-display);font-weight:600;font-size:20px;color:var(--ink-900);transition:transform .1s,border-color .1s;

  border-bottom:1px solid var(--paper-line);
}

.staff-header-sub{font-size:13px;color:var(--slate-500);margin-top:2px;}
.back-link{border:2px solid var(--paper-line);background:#fff;border-radius:22px;padding:12px 22px;font-size:14px;font-weight:700;color:var(--slate-500);min-height:48px;-webkit-user-select:none;user-select:none;}
.back-link:active{border-color:var(--rust-600);color:var(--rust-600);transform:scale(.96);}

.task-tile-wrap{flex:1;padding:22px;max-width:1000px;margin:0 auto;width:100%;}
.task-tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;}

  position:relative;border-radius:18px;padding:26px 22px;min-height:150px;display:flex;flex-direction:column;
  justify-content:space-between;border:3px solid transparent;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.07);

}

.status-dot.idle{background:var(--slate-300);}
.task-tile-timer{font-family:var(--font-mono);font-size:28px;font-weight:700;color:var(--rust-600);margin-top:6px;}

  background:#fff;color:var(--slate-500);
}

.sub-timer-display{font-family:var(--font-mono);font-size:13px;color:var(--slate-500);}
.sub-timer-display.active{color:var(--rust-600);font-weight:700;}
.live-count-row .qty-break-label{font-size:13px;}
.task-tile-coworkers{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--paper-line);}

.coworker-chip.coworker-brk{background:#EEF0FB;color:var(--indigo-500);}

.coworker-chip.coworker-idle{background:var(--paper-100);color:var(--slate-300);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

.end-day-bar{padding:18px 22px 32px;max-width:1000px;margin:0 auto;width:100%;}
.end-day-btn{
  width:100%;background:var(--ink-900);color:#fff;border:none;border-radius:16px;padding:22px;
  font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:.02em;min-height:64px;

}
.break-banner-title{font-family:var(--font-display);font-weight:700;font-size:22px;color:var(--indigo-500);margin-bottom:6px;}
.break-banner-timer{font-family:var(--font-mono);font-size:34px;font-weight:700;color:var(--ink-900);margin-bottom:8px;}
.break-banner-sub{font-size:13px;color:var(--slate-500);line-height:1.6;}

.summary-wrap{max-width:680px;margin:60px auto;padding:0 22px;text-align:center;}

.summary-list{display:flex;flex-direction:column;gap:10px;text-align:left;margin-bottom:30px;}
.summary-row{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--paper-line);border-radius:14px;padding:16px 20px;}
.summary-task{display:flex;align-items:center;gap:10px;font-weight:500;font-size:15px;}
.summary-vals{font-family:var(--font-mono);font-size:14px;color:var(--slate-500);}

/* ---------- QUANTITY MODAL (tablet-optimized) ---------- */
.modal-overlay{

  z-index:100;padding:20px;
}

.template-notice{

.qty-break-total{font-size:14px;font-weight:600;color:var(--slate-500);text-align:center;margin-bottom:18px;}

}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";
  var cfg = window.SUPABASE_CONFIG || {};
  var client = null;
  if(cfg.url && cfg.anonKey && cfg.url.indexOf('YOUR-PROJECT')===-1){
    client = window.supabase.createClient(cfg.url, cfg.anonKey);
  }

  window.storage = {
    get: async function(key, shared){
      if(!client) throw new Error('Supabase未設定です(config.jsを確認してください)');
      var res = await client.from('kv_store').select('value').eq('key', key).maybeSingle();
      if(res.error) throw res.error;
      if(!res.data) throw new Error('key not found');
      return { key: key, value: res.data.value };
    },
    set: async function(key, value, shared){
      if(!client) return null;
      var res = await client.from('kv_store').upsert({ key: key, value: value }, { onConflict: 'key' }).select('value').maybeSingle();
      if(res.error) return null;
      return { key: key, value: value };
    },
    delete: async function(key, shared){
      if(!client) return null;
      var res = await client.from('kv_store').delete().eq('key', key);
      if(res.error) return null;
      return { key: key, deleted: true };
    },
    list: async function(prefix, shared){
      if(!client) throw new Error('Supabase未設定です(config.jsを確認してください)');
      var query = client.from('kv_store').select('key');
      if(prefix) query = query.like('key', prefix+'%');
      var res = await query;
      if(res.error) throw res.error;
      return { keys: (res.data||[]).map(function(r){ return r.key; }), prefix: prefix };
    }
  };
})();
</script>

function todayLabel(){

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function parseSubcats(str){

}
function subcatName(sc){

function subcatUnit(sc, fallback){
  if(typeof sc==='string') return fallback || '件';

function subcatUnitMap(task){
  var map = {};
  (task.subcategories||[]).forEach(function(sc){
    map[subcatName(sc)] = subcatUnit(sc, task.unit);
  });
  return map;
}
function breakdownLabel(breakdown, task){
  if(!breakdown) return '';
  var keys = Object.keys(breakdown).filter(function(k){ return breakdown[k]>0; });
  if(!keys.length) return '';
  var unitMap = subcatUnitMap(task);
  return '('+keys.map(function(k){ return esc(k)+' '+breakdown[k]+esc(unitMap[k]||task.unit); }).join(' / ')+')';
}
function breakdownDetailRows(l, t){
  if(!l.breakdown && !l.activeSubcat) return '';
  var breakdown = l.breakdown || {};
  var subTimes = l.subTimes || {};
  var unitMap = subcatUnitMap(t);
  var keys = Object.keys(breakdown).filter(function(k){ return breakdown[k]>0; });
  if(l.activeSubcat && keys.indexOf(l.activeSubcat)===-1) keys.push(l.activeSubcat);
  Object.keys(subTimes).forEach(function(k){ if(subTimes[k]>0 && keys.indexOf(k)===-1) keys.push(k); });
  if(!keys.length) return '';
  var rows = keys.map(function(k){
    var qty = breakdown[k]||0;
    var unit = unitMap[k]||t.unit;
    var base = subTimes[k]||0;
    var timeHtml;
    if(l.activeSubcat===k && l.activeSubcatStart){
      var live = base + (Date.now()-new Date(l.activeSubcatStart).getTime());
      timeHtml = '<span data-live-subtimer-start="'+l.activeSubcatStart+'" data-live-subtimer-base="'+base+'" style="color:var(--rust-600);font-weight:700;">'+fmtElapsed(live)+'</span>';
    }else{
      timeHtml = base>0 ? fmtHM(base) : '-';
    }
    return '<div class="breakdown-detail-row">'+
      '<span class="breakdown-detail-name">'+esc(k)+'</span>'+
      '<span class="breakdown-detail-qty">'+qty+esc(unit)+'</span>'+
      '<span class="breakdown-detail-time">⏱ '+timeHtml+'</span>'+
    '</div>';
  }).join('');
  return '<div class="breakdown-detail-list">'+rows+'</div>';
}

    }
    input.addEventListener('keydown', function(e){
      if(e.key==='Enter'){
        e.preventDefault();
        var wrap = input.closest('.subcat-add-row');
        var btn = wrap ? wrap.querySelector('[data-subcat-add]') : null;
        if(btn) btn.click();
      }
    });
  });

function fmtElapsed(ms){
  if(ms<0) ms=0;
  var s = Math.floor(ms/1000);
  var h = Math.floor(s/3600);
  var m = Math.floor((s%3600)/60);
  var sec = s%60;
  if(h>0) return h+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
function fmtHM(ms){
  var mins = Math.round(ms/60000);
  var h = Math.floor(mins/60);
  var m = mins%60;
  if(h>0) return h+'h'+String(m).padStart(2,'0')+'m';
  return m+'m';
}
function fmtClock(iso){
  var d = new Date(iso);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

async function ensureTemplateTasksForDate(dateStr){
  var wd = new Date(dateStr+'T00:00:00').getDay();
  var existingKeys = {};
  state.backlog.forEach(function(t){ if(t.fromTemplate) existingKeys[t.fromTemplate+'|'+t.workDate] = true; });
  var changed = false;
  state.templates.forEach(function(tmpl){
    if(tmpl.archived) return;
    var pattern = tmpl.pattern || defaultPattern();
    if(!pattern[wd]) return;
    var key = tmpl.id+'|'+dateStr;
    if(existingKeys[key]) return;
    state.backlog.push({id:uid(), name:tmpl.name, unit:tmpl.unit, color:tmpl.color, workDate:dateStr, archived:false, fromTemplate:tmpl.id, subcategories:tmpl.subcategories||[], category:taskCategory(tmpl)});
    changed = true;
  });
  if(changed) await saveBacklog(state.backlog);
}
async function ensureTemplateTasksForToday(){
  return ensureTemplateTasksForDate(todayStr());
}
function defaultPattern(){
  return [false,true,true,true,true,true,false];
}
async function loadJpHolidays(){
  var cached = null;
  try{
    var r = await window.storage.get('jp-holidays', true);
    if(r && r.value) cached = JSON.parse(r.value);
  }catch(e){}
  var isFresh = cached && cached.fetchedAt && (Date.now()-cached.fetchedAt < 14*24*60*60*1000);
  if(isFresh) return cached;
  try{
    var res = await fetch('https://holidays-jp.github.io/api/v1/date.json');
    if(res.ok){
      var data = await res.json();
      var fresh = { fetchedAt: Date.now(), data: data };
      try{ await window.storage.set('jp-holidays', JSON.stringify(fresh), true); }catch(e){}
      return fresh;
    }
  }catch(e){}
  return cached || { fetchedAt:0, data:{} };
}
function holidayName(dateStr){
  return (state.jpHolidays && state.jpHolidays.data && state.jpHolidays.data[dateStr]) || null;
}
function freshDay(dateStr){
  var attendance = {};
  var weekday = new Date(dateStr+'T00:00:00').getDay();
  var holiday = holidayName(dateStr);
  state.roster.forEach(function(s){
    if(s.archived) return;
    var pattern = s.pattern || defaultPattern();
    var on = !!pattern[weekday];
    if(on && s.offOnHolidays && holiday) on = false;
    attendance[s.id] = on;
  });
  return { date: dateStr, attendance: attendance, assignments:{}, logs:[] };
}

/* ---------- CALENDAR (登録内容・出勤予定の月表示) ---------- */
function daysInMonth(monthKey){
  var p = monthKey.split('-').map(Number);
  return new Date(p[0], p[1], 0).getDate();
}
function firstWeekdayOfMonth(monthKey){
  var p = monthKey.split('-').map(Number);
  return new Date(p[0], p[1]-1, 1).getDay();
}
function shiftMonthKey(monthKey, delta){
  var p = monthKey.split('-').map(Number);
  var d = new Date(p[0], p[1]-1+delta, 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function monthKeyLabel(monthKey){
  var p = monthKey.split('-');
  return p[0]+'年'+parseInt(p[1],10)+'月';
}
function predictedAttendanceCount(dateStr){
  var wd = new Date(dateStr+'T00:00:00').getDay();
  return activeRoster().filter(function(s){
    var pattern = s.pattern || defaultPattern();
    return !!pattern[wd];
  }).length;
}
function actualAttendanceCount(day){
  var roster = activeRoster();
  return roster.filter(function(s){ return !!day.attendance[s.id]; }).length;
}
async function runCalendarMonth(monthKey){
  state.calendarLoading = true;
  render();
  var n = daysInMonth(monthKey);
  var data = {};
  for(var d=1; d<=n; d++){
    var dateStr = monthKey+'-'+String(d).padStart(2,'0');
    var day = await loadDayByDate(dateStr);
    data[dateStr] = {
      taskCount: tasksForDate(dateStr).length,
      presentCount: day ? actualAttendanceCount(day) : predictedAttendanceCount(dateStr),
      isActual: !!day
    };
  }
  if(state.calendarMonth===monthKey){
    state.calendarData = data;
  }
  state.calendarLoading = false;
  render();
}
function renderCalendar(){
  if(!state.calendarMonth) state.calendarMonth = todayStr().slice(0,7);
  var monthKey = state.calendarMonth;

  var nav = '<div class="date-nav">'+
    '<button class="date-nav-btn" id="calPrevBtn" title="前の月">&#8592;</button>'+
    '<div class="cal-month-label">'+monthKeyLabel(monthKey)+'</div>'+
    '<button class="date-nav-btn" id="calNextBtn" title="次の月">&#8594;</button>'+
    '<button class="date-nav-today-btn" id="calTodayBtn">今月</button>'+
    '<button class="report-go-btn" id="calRefreshBtn">'+(state.calendarData?'更新する':'この月を読み込む')+'</button>'+
  '</div>';

  var body;
  if(state.calendarLoading){
    body = '<div class="empty-note">この月の作業件数・出勤予定人数を読み込み中です...</div>';
  }else if(!state.calendarData){
    body = '<div class="empty-note">「この月を読み込む」を押すと、日ごとの登録作業件数・出勤予定人数を表示します。</div>';
  }else{
    var WD = ['日','月','火','水','木','金','土'];
    var firstWd = firstWeekdayOfMonth(monthKey);
    var totalDays = daysInMonth(monthKey);
    var cells = '';
    for(var i=0;i<firstWd;i++){ cells += '<div class="cal-cell cal-cell-empty"></div>'; }
    for(var d=1; d<=totalDays; d++){
      var dateStr = monthKey+'-'+String(d).padStart(2,'0');
      var info = state.calendarData[dateStr] || {taskCount:0, presentCount:0, isActual:false};
      var isToday = dateStr===todayStr();
      var wd = (firstWd + d - 1) % 7;
      var holiday = holidayName(dateStr);
      var cellClass = 'cal-cell';
      if(isToday) cellClass += ' cal-cell-today';
      if(holiday) cellClass += ' cal-cell-holiday';
      else if(wd===0) cellClass += ' cal-cell-sun';
      else if(wd===6) cellClass += ' cal-cell-sat';
      cells += '<div class="'+cellClass+'" data-cal-date="'+dateStr+'">'+
        '<div class="cal-cell-day">'+d+'</div>'+
        (holiday ? '<div class="cal-cell-holiday-name" title="'+esc(holiday)+'">'+esc(holiday)+'</div>' : '')+
        '<div class="cal-cell-stat">📋 '+info.taskCount+'件</div>'+
        '<div class="cal-cell-stat">'+(info.isActual?'👤 ':'👤予定 ')+info.presentCount+'人</div>'+
      '</div>';
    }
    var headerRow = WD.map(function(w,i){
      var cls = i===0 ? 'cal-weekday cal-weekday-sun' : (i===6 ? 'cal-weekday cal-weekday-sat' : 'cal-weekday');
      return '<div class="'+cls+'">'+w+'</div>';
    }).join('');
    body = '<div class="cal-grid-header">'+headerRow+'</div>'+
      '<div class="cal-grid">'+cells+'</div>'+
      '<div class="pool-hint" style="margin-top:12px;">日付をタップすると、その日の管理者画面(出勤・作業割り当て)に移動して編集・追加できます。「👤予定」は曜日パターンからの見込み人数、「👤」は実際に出勤登録された人数です。</div>';
  }

  return '<div class="mgr-wrap"><div style="max-width:900px;margin:0 auto;">'+

function shiftDateStr(dateStr, deltaDays){
  var d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+deltaDays);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function localDateTimeToISO(dateStr, timeStr){
  var dp = dateStr.split('-').map(Number);
  var tp = (timeStr||'00:00').split(':').map(Number);
  var d = new Date(dp[0], dp[1]-1, dp[2], tp[0]||0, tp[1]||0, 0);
  return d.toISOString();
}
function isoToLocalTimeInput(iso){
  if(!iso) return '';
  var d = new Date(iso);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function taskOptionsForEdit(dateStr, currentTaskId){
  var list = tasksForDate(dateStr).slice();
  if(currentTaskId && !list.some(function(t){ return t.id===currentTaskId; })){
    var t = taskById(currentTaskId);
    var label = t.isBreak ? t.name : t.name+'(削除済み)';
    list.unshift({ id:currentTaskId, name:label, color:t.color, unit:t.unit });
  }
  return list;
}
function activeBacklog(){
  return state.backlog.filter(function(t){ return !t.archived; });
}
function activeTemplates(){
  return state.templates.filter(function(t){ return !t.archived; });
}
function tasksForDate(dateStr){
  return activeBacklog().filter(function(t){ return t.workDate===dateStr; });
}
function tasksForToday(){
  return tasksForDate(todayStr());
}
function taskById(id){
  if(id==='BREAK') return {id:'BREAK', name:'休憩', color:'#667085', unit:'', archived:false, isBreak:true};
  var t = state.backlog.find(function(t){ return t.id===id; });
  return t || {name:'(削除済み)', color:'#999', unit:''};
}
function staffById(id){
  var s = state.roster.find(function(s){ return s.id===id; });
  return s || {name:'(不明)'};
}
function currentLog(staffId){
  return state.day.logs.find(function(l){ return l.staffId===staffId && l.end===null; }) || null;
}
function coworkersForTask(taskId, excludeStaffId){
  return activeRoster().filter(function(s){
    if(s.id===excludeStaffId) return false;
    if(!state.day.attendance[s.id]) return false;
    return (state.day.assignments[s.id]||[]).indexOf(taskId)!==-1;
  }).map(function(s){
    var log = currentLog(s.id);
    var working = !!(log && log.taskId===taskId);
    var onBreak = !!(log && log.taskId==='BREAK');
    var onOther = !!(log && !working && !onBreak);
    var statusLabel = working ? '作業中' : onBreak ? '休憩中' : onOther ? '別作業中' : '待機中';
    var statusClass = working ? 'working' : onBreak ? 'brk' : onOther ? 'other' : 'idle';
    return { name: s.name, statusLabel: statusLabel, statusClass: statusClass };
  }).sort(function(a,b){
    var order = {working:0, other:1, brk:2, idle:3};
    return order[a.statusClass]-order[b.statusClass];
  });
}
function totalsByTaskForDay(day, staffId){
  var map = {};
  day.logs.filter(function(l){ return l.staffId===staffId; }).forEach(function(l){
    var end = l.end ? new Date(l.end).getTime() : Date.now();
    var dur = end - new Date(l.start).getTime();
    map[l.taskId] = (map[l.taskId]||0) + dur;
  });
  return map;
}
function totalsByTask(staffId){
  return totalsByTaskForDay(state.day, staffId);
}
function taskAggregateForDay(day, taskId){
  var ms=0, qty=0, activeCount=0, breakdown={};
  day.logs.forEach(function(l){
    if(l.taskId!==taskId) return;
    var end = l.end ? new Date(l.end).getTime() : Date.now();
    ms += end - new Date(l.start).getTime();
    qty += (l.quantity||0);
    if(l.end===null) activeCount++;
    if(l.breakdown){
      Object.keys(l.breakdown).forEach(function(k){ breakdown[k] = (breakdown[k]||0) + (l.breakdown[k]||0); });
    }
  });
  return {ms:ms, qty:qty, activeCount:activeCount, breakdown:breakdown};
}
function taskAggregate(taskId){
  return taskAggregateForDay(state.day, taskId);
}
function dateRangeList(startStr, endStr){
  var dates = [];
  var d = new Date(startStr+'T00:00:00');
  var end = new Date(endStr+'T00:00:00');
  var guard = 0;
  while(d.getTime() <= end.getTime() && guard < 400){
    dates.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
    d.setDate(d.getDate()+1);
    guard++;
  }
  return dates;
}
function aggregateDays(days){
  var perStaff = {};
  var perTask = {};
  days.forEach(function(day){
    if(!day) return;
    day.logs.forEach(function(l){
      var end = l.end ? new Date(l.end).getTime() : Date.now();
      var dur = Math.max(0, end - new Date(l.start).getTime());
      var qty = l.quantity || 0;
      if(!perStaff[l.staffId]) perStaff[l.staffId] = { ms:0, qty:0, breakMs:0, byTask:{} };
      perStaff[l.staffId].ms += dur;
      perStaff[l.staffId].qty += qty;
      if(l.taskId==='BREAK') perStaff[l.staffId].breakMs += dur;
      if(!perStaff[l.staffId].byTask[l.taskId]) perStaff[l.staffId].byTask[l.taskId] = { ms:0, qty:0, breakdown:{} };
      perStaff[l.staffId].byTask[l.taskId].ms += dur;
      perStaff[l.staffId].byTask[l.taskId].qty += qty;

      if(!perTask[l.taskId]) perTask[l.taskId] = { ms:0, qty:0, staff:{}, breakdown:{} };
      perTask[l.taskId].ms += dur;
      perTask[l.taskId].qty += qty;
      perTask[l.taskId].staff[l.staffId] = true;
      if(l.breakdown){
        Object.keys(l.breakdown).forEach(function(k){
          perTask[l.taskId].breakdown[k] = (perTask[l.taskId].breakdown[k]||0) + (l.breakdown[k]||0);
          perStaff[l.staffId].byTask[l.taskId].breakdown[k] = (perStaff[l.staffId].byTask[l.taskId].breakdown[k]||0) + (l.breakdown[k]||0);
        });
      }
    });
  });
  return { perStaff: perStaff, perTask: perTask };
}

/* ---------- render root ---------- */
function render(){
  var root = document.getElementById('app');
  if(!state.role){
    var gateHtml = renderGate();
    if(state.showChangelog) gateHtml += renderChangelogModal();
    root.innerHTML = gateHtml;
    bindGate();
    if(state.showChangelog) bindChangelogModal();
    return;
  }
  var html = '';
  if(state.role !== 'monitor'){
    html += renderTopbar();
  }
  if(state.role==='manager') html += renderManager();
  else if(state.role==='register') html += renderRegister();
  else if(state.role==='report') html += renderReport();
  else if(state.role==='input') html += renderInput();
  else if(state.role==='monitor') html += renderMonitor();
  else if(state.role==='achievements') html += renderAchievements();
  else if(state.role==='calendar') html += renderCalendar();
  if(state.modal) html += renderModal();
  root.innerHTML = html;
  bindCommon();
  if(state.role==='manager') bindManager();
  if(state.role==='register') bindRegister();
  if(state.role==='report') bindReport();
  if(state.role==='input') bindInput();
  if(state.role==='monitor') bindMonitor();
  if(state.role==='achievements') bindAchievements();
  if(state.role==='calendar') bindCalendar();
  if(state.modal) bindModal();
}

function bindManager(){
  document.querySelectorAll('[data-toggle-att]').forEach(function(el){
    el.addEventListener('click', async function(){
      var id = el.getAttribute('data-toggle-att');
      var day = managerActiveDay();
      day.attendance[id] = !day.attendance[id];
      await saveDay(day);
      render();
    });
  });
  document.querySelectorAll('[data-del-staff]').forEach(function(el){
    el.addEventListener('click', async function(){
      var id = el.getAttribute('data-del-staff');
      if(!confirm('このスタッフを削除しますか?(過去の記録は残ります)')) return;
      var s = state.roster.find(function(s){ return s.id===id; });
      if(s) s.archived = true;
      await saveRoster(state.roster);
      render();
    });
  });
  var newStaffInput = document.getElementById('newStaffInput');
  var addStaffBtn = document.getElementById('addStaffBtn');
  function focusGuard(el){
    el.addEventListener('focusin', function(){ state.suppressRender = true; });
    el.addEventListener('focusout', function(){ setTimeout(function(){ state.suppressRender = false; }, 150); });
  }
  if(newStaffInput){
    focusGuard(newStaffInput);
    newStaffInput.addEventListener('input', function(){ state.newStaffDraftName = newStaffInput.value; });
    newStaffInput.addEventListener('keydown', function(e){ if(e.key==='Enter') addStaffBtn.click(); });
  }
  if(addStaffBtn){
    addStaffBtn.addEventListener('click', async function(){
      var name = (newStaffInput.value||'').trim();
      if(!name) return;
      state.roster.push({id:uid(), name:name, archived:false, pattern:defaultPattern()});
      state.newStaffDraftName = '';
      state.suppressRender = false;
      await saveRoster(state.roster);
      render();
    });
  }
  document.querySelectorAll('[data-del-task]').forEach(function(el){
    el.addEventListener('click', async function(){
      var id = el.getAttribute('data-del-task');
      var t = state.backlog.find(function(t){ return t.id===id; });
      if(!t) return;
      var taskName = t.name;
      t.archived = true;
      await saveBacklog(state.backlog);
      render();
      showToast('「'+taskName+'」を削除しました', '元に戻す', async function(){
        var cur = state.backlog.find(function(x){ return x.id===id; });
        if(cur){
          cur.archived = false;
          await saveBacklog(state.backlog);
          render();
        }
      });
    });
  });
  document.querySelectorAll('[data-pattern-toggle]').forEach(function(el){
    el.addEventListener('click', async function(){
      var parts = el.getAttribute('data-pattern-toggle').split('|');
      var sid = parts[0], idx = parseInt(parts[1],10);
      var s = state.roster.find(function(s){ return s.id===sid; });
      if(!s) return;
      var pattern = (s.pattern || defaultPattern()).slice();
      pattern[idx] = !pattern[idx];
      s.pattern = pattern;
      await saveRoster(state.roster);
      render();
    });
  });
  document.querySelectorAll('[data-avatar-color]').forEach(function(el){
    el.addEventListener('click', async function(){
      var parts = el.getAttribute('data-avatar-color').split('|');
      var sid = parts[0], color = parts[1];
      var s = state.roster.find(function(s){ return s.id===sid; });
      if(!s) return;
      s.avatarColor = color;
      await saveRoster(state.roster);
      render();
    });
  });
  document.querySelectorAll('[data-holiday-off-toggle]').forEach(function(el){
    el.addEventListener('click', async function(){
      var sid = el.getAttribute('data-holiday-off-toggle');
      var s = state.roster.find(function(s){ return s.id===sid; });
      if(!s) return;
      s.offOnHolidays = !s.offOnHolidays;
      await saveRoster(state.roster);
      render();
    });
  });
  document.querySelectorAll('[data-unassign]').forEach(function(el){
    el.addEventListener('click', async function(){
      var parts = el.getAttribute('data-unassign').split('|');
      var sid=parts[0], tid=parts[1];
      var day = managerActiveDay();
      var arr = day.assignments[sid]||[];
      day.assignments[sid] = arr.filter(function(x){ return x!==tid; });
      await saveDay(day);
      render();
    });
  });
  document.querySelectorAll('[data-assign-all]').forEach(function(el){
    el.addEventListener('click', async function(){
      var tid = el.getAttribute('data-assign-all');
      var day = managerActiveDay();
      var present = presentStaffForDay(day);
      present.forEach(function(s){
        var arr = day.assignments[s.id] || [];
        if(arr.indexOf(tid)===-1) arr.push(tid);
        day.assignments[s.id] = arr;
      });
      await saveDay(day);
      render();
    });
  });
  var addTaskBtn = document.getElementById('addTaskBtn');
  if(addTaskBtn){
    addTaskBtn.addEventListener('click', function(){
      state.newTaskColIndex = 0;
      state.newTaskColor = TASK_COLORS[tasksForDate(managerActiveDate()).length % TASK_COLORS.length].hex;
      state.suppressRender = true;
      render();
    });
  }
  var cancelTaskBtn = document.getElementById('cancelTaskBtn');
  if(cancelTaskBtn){
    cancelTaskBtn.addEventListener('click', function(){
      state.newTaskColIndex = -1;
      state.newTaskDraftName = '';
      state.newTaskDraftUnit = '件';
      state.suppressRender = false;
      render();
    });
  }
  document.querySelectorAll('[data-color-swatch]').forEach(function(el){
    el.addEventListener('click', function(){
      state.newTaskColor = el.getAttribute('data-color-swatch');
      render();
    });
  });
  var newTaskNameInput = document.getElementById('newTaskName');
  var newTaskUnitInput = document.getElementById('newTaskUnit');
  [newTaskNameInput, newTaskUnitInput].forEach(function(el){
    if(!el) return;
    el.addEventListener('focusin', function(){ state.suppressRender = true; });
    el.addEventListener('focusout', function(){ setTimeout(function(){ state.suppressRender = false; }, 150); });
  });
  if(newTaskNameInput) newTaskNameInput.addEventListener('input', function(){ state.newTaskDraftName = newTaskNameInput.value; });
  if(newTaskUnitInput) newTaskUnitInput.addEventListener('input', function(){ state.newTaskDraftUnit = newTaskUnitInput.value; });
  var confirmTaskBtn = document.getElementById('confirmTaskBtn');
  if(confirmTaskBtn){
    confirmTaskBtn.addEventListener('click', async function(){
      var name = (newTaskNameInput.value||'').trim();
      if(!name){ newTaskNameInput.style.borderColor = '#C1521F'; newTaskNameInput.focus(); return; }
      var unit = newTaskUnitInput ? ((newTaskUnitInput.value||'件').trim() || '件') : '件';
      var subcats = (state.newTaskDraftSubcats||[]).slice();
      state.backlog.push({id:uid(), name:name, unit:unit, color:state.newTaskColor, workDate:managerActiveDate(), archived:false, subcategories:subcats, category:state.newTaskDraftCategory});
      state.newTaskColIndex = -1;
      state.newTaskDraftName = '';
      state.newTaskDraftUnit = '件';
      state.newTaskDraftSubcats = [];
      state.newTaskSubcatDraft = {name:'', unit:''};
      state.suppressRender = false;
      await saveBacklog(state.backlog);
      render();
    });
  }
  document.querySelectorAll('[data-staff-chip]').forEach(function(el){
    el.addEventListener('dragstart', function(e){
      state.dragStaffId = el.getAttribute('data-staff-chip');
      e.dataTransfer.effectAllowed = 'copy';
    });
  });
  document.querySelectorAll('[data-task-col]').forEach(function(el){
    el.addEventListener('dragover', function(e){ e.preventDefault(); el.classList.add('dragover'); });
    el.addEventListener('dragleave', function(){ el.classList.remove('dragover'); });
    el.addEventListener('drop', async function(e){
      e.preventDefault();
      el.classList.remove('dragover');
      var taskId = el.getAttribute('data-task-col');
      var staffId = state.dragStaffId;
      if(!staffId) return;
      var day = managerActiveDay();
      var arr = day.assignments[staffId] || [];
      if(arr.indexOf(taskId)===-1) arr.push(taskId);
      day.assignments[staffId] = arr;
      state.dragStaffId = null;
      await saveDay(day);
      render();
    });
  });

  var dateInput = document.getElementById('dateNavInput');
  if(dateInput){
    dateInput.addEventListener('focusin', function(){ state.suppressRender = true; });
    dateInput.addEventListener('focusout', function(){ setTimeout(function(){ state.suppressRender = false; }, 150); });
    dateInput.addEventListener('change', function(){
      state.suppressRender = false;
      if(dateInput.value) switchManagerDate(dateInput.value);
    });
  }
  var prevBtn = document.getElementById('dateNavPrev');
  if(prevBtn) prevBtn.addEventListener('click', function(){
    switchManagerDate(shiftDateStr(managerActiveDate(), -1));
  });
  var nextBtn = document.getElementById('dateNavNext');
  if(nextBtn) nextBtn.addEventListener('click', function(){
    switchManagerDate(shiftDateStr(managerActiveDate(), 1));
  });
  var todayBtn = document.getElementById('dateNavToday');
  if(todayBtn) todayBtn.addEventListener('click', function(){
    switchManagerDate(todayStr());
  });

  document.querySelectorAll('[data-edit-log]').forEach(function(el){
    el.addEventListener('click', function(){
      var logId = el.getAttribute('data-edit-log');
      var day = managerActiveDay();
      var log = (day.logs||[]).find(function(l){ return l.id===logId; });
      if(!log) return;
      openEditLogModal(log);
    });
  });
  document.querySelectorAll('[data-stop-log]').forEach(function(el){
    el.addEventListener('click', function(){
      var logId = el.getAttribute('data-stop-log');
      stopLogAsManager(logId);
    });
  });
  var openAddLogBtn = document.getElementById('openAddLogBtn');
  if(openAddLogBtn) openAddLogBtn.addEventListener('click', openAddLogModal);

  var shiftEnabledInput = document.getElementById('shiftEnabledInput');
  var shiftStartInput = document.getElementById('shiftStartInput');
  var shiftEndInput = document.getElementById('shiftEndInput');
  function saveShiftSettingsFromInputs(){
    saveShiftSettings({
      enabled: !!(shiftEnabledInput && shiftEnabledInput.checked),
      start: (shiftStartInput && shiftStartInput.value) || '09:00',
      end: (shiftEndInput && shiftEndInput.value) || '18:00'
    });
  }
  if(shiftEnabledInput) shiftEnabledInput.addEventListener('change', function(){
    saveShiftSettingsFromInputs();
    render();
  });
  [shiftStartInput, shiftEndInput].forEach(function(el){
    if(!el) return;
    el.addEventListener('focusin', function(){ state.suppressRender = true; });
    el.addEventListener('focusout', function(){ setTimeout(function(){ state.suppressRender = false; }, 150); });
    el.addEventListener('change', function(){
      state.suppressRender = false;
      saveShiftSettingsFromInputs();
    });
  });

  var breakEnabledInput = document.getElementById('breakEnabledInput');
  var breakStartInput = document.getElementById('breakStartInput');
  var breakEndInput = document.getElementById('breakEndInput');
  function saveBreakSettingsFromInputs(){
    saveBreakSettings({
      enabled: !!(breakEnabledInput && breakEnabledInput.checked),
      start: (breakStartInput && breakStartInput.value) || '12:00',
      end: (breakEndInput && breakEndInput.value) || '13:00'
    });
  }
  if(breakEnabledInput) breakEnabledInput.addEventListener('change', function(){
    saveBreakSettingsFromInputs();
    render();
  });
  [breakStartInput, breakEndInput].forEach(function(el){
    if(!el) return;
    el.addEventListener('focusin', function(){ state.suppressRender = true; });
    el.addEventListener('focusout', function(){ setTimeout(function(){ state.suppressRender = false; }, 150); });
    el.addEventListener('change', function(){
      state.suppressRender = false;
      saveBreakSettingsFromInputs();
    });
  });

  document.querySelectorAll('[data-overtime-end]').forEach(function(el){
    el.addEventListener('focusin', function(){ state.suppressRender = true; });
    el.addEventListener('focusout', function(){ setTimeout(function(){ state.suppressRender = false; }, 150); });
    el.addEventListener('change', async function(){
      var sid = el.getAttribute('data-overtime-end');
      var day = managerActiveDay();
      if(!day.shiftEndOverrides) day.shiftEndOverrides = {};
      if(el.value){
        day.shiftEndOverrides[sid] = el.value;
      }else{
        delete day.shiftEndOverrides[sid];
      }
      state.suppressRender = false;
      await saveDay(day);
      render();
    });
  });

  var achievementTargetInput = document.getElementById('achievementTargetInput');
  if(achievementTargetInput){
    achievementTargetInput.addEventListener('focusin', function(){ state.suppressRender = true; });
    achievementTargetInput.addEventListener('focusout', function(){ setTimeout(function(){ state.suppressRender = false; }, 150); });
    achievementTargetInput.addEventListener('change', function(){
      var v = parseInt(achievementTargetInput.value,10);
      if(isNaN(v) || v<0) v = 0;
      saveAchievementSettings({ monthlyTargetPieces: v });
    });
  }

  bindCategoryToggle();
  bindSubcatTagControls();
}

/* ---------- REGISTER (task registration by employees) ---------- */
function tomorrowStr(){
  var d = new Date();
  d.setDate(d.getDate()+1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function dateLabelFromStr(dateStr){
  var d = new Date(dateStr+'T00:00:00');
  var WD = ['日','月','火','水','木','金','土'];
  var label = (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')';
  if(dateStr===todayStr()) label += ' ・本日';
  return label;
}
function renderRegister(){
  if(!state.regNewDate) state.regNewDate = tomorrowStr();
  if(state.regSearchQuery===undefined) state.regSearchQuery = '';
  var swatches = TASK_COLORS.map(function(c){
    return '<div class="swatch '+(state.newTaskColor===c.hex?'sel':'')+'" style="background:'+c.hex+'" data-color-swatch="'+c.hex+'"></div>';
  }).join('');

  var query = state.regSearchQuery.trim().toLowerCase();
  var upcoming = activeBacklog().filter(function(t){ return t.workDate >= todayStr(); })
    .filter(function(t){ return !query || t.name.toLowerCase().indexOf(query)!==-1; })
    .sort(function(a,b){ return a.workDate < b.workDate ? -1 : (a.workDate > b.workDate ? 1 : 0); });
  var groups = {};

    groups[t.workDate].push(t);
  });
  var listHtml = order.map(function(dateStr){
    var items = groups[dateStr].slice().sort(byTaskColor(function(t){ return t.color; }));
    var rows = items.map(function(t){
      var badge = t.fromTemplate ? '<span class="reg-row-badge">定型</span>' : '';
      var catBadge = '<span class="reg-row-cat reg-row-cat-'+taskCategory(t)+'">'+esc(taskCategory(t))+'</span>';
      return '<div class="reg-row">'+

      '</div>';
    }).join('');

  var WD = ['日','月','火','水','木','金','土'];

  var tmplSwatches = TASK_COLORS.map(function(c){

    return '<div class="roster-item">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">'+

  }).join('') || '<div class="empty-note">毎日/毎週発生する作業を登録すると、該当する曜日に自動で本日分の作業として追加されます。</div>';

  return '<div class="mgr-wrap"><div class="mgr-grid" style="grid-template-columns:320px 1fr;">'+
    '<div style="display:flex;flex-direction:column;gap:20px;">'+
    '<div class="panel">'+

      '<input type="date" id="regDate" value="'+state.regNewDate+'" min="'+todayStr()+'" style="width:100%;border:1px solid var(--paper-line);border-radius:8px;padding:8px 9px;font-size:13px;margin-bottom:10px;">'+

function renderProductivityRanking(agg){
  var staffIds = Object.keys(agg.perStaff).filter(function(sid){
    var info = agg.perStaff[sid];
    var workMs = info.ms - (info.breakMs||0);
    return workMs > 0;
  }).sort(function(a,b){
    var infoA = agg.perStaff[a], infoB = agg.perStaff[b];
    var rateA = infoA.qty / ((infoA.ms - (infoA.breakMs||0))/3600000);
    var rateB = infoB.qty / ((infoB.ms - (infoB.breakMs||0))/3600000);
    return rateB - rateA;
  });
  if(!staffIds.length) return '';
  var rows = staffIds.map(function(sid, idx){
    var s = staffById(sid);
    var info = agg.perStaff[sid];
    var workMs = info.ms - (info.breakMs||0);
    var rate = info.qty / (workMs/3600000);
    return '<tr><td class="num">'+(idx+1)+'</td><td>'+esc(s.name)+'</td><td class="num"><b style="color:var(--rust-600);font-family:var(--font-mono);">'+rate.toFixed(1)+'</b> 件/時</td><td class="num">'+info.qty+'件</td><td class="num">'+fmtHM(workMs)+'</td></tr>';
  }).join('');
  return '<div class="report-section-title">生産性ランキング(実働1時間あたりの件数)</div>'+
    '<div class="report-range-note">休憩時間は除いた実働時間で計算しています。作業に内訳(件数)がある場合のみ対象です。</div>'+
    '<table class="report-table"><thead><tr><th>順位</th><th>名前</th><th>1時間あたり</th><th>合計件数</th><th>実働時間</th></tr></thead><tbody>'+rows+'</tbody></table>';
}
function csvEscape(v){
  var s = String(v==null?'':v);
  if(/[",\n]/.test(s)) s = '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function downloadCSV(filename, rows){
  var csv = '\uFEFF'+rows.map(function(r){ return r.map(csvEscape).join(','); }).join('\r\n');
  var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ if(a.parentNode) a.parentNode.removeChild(a); URL.revokeObjectURL(url); }, 200);
}
function exportAggCSV(agg, label){
  var rows = [];
  rows.push(['スタッフ別']);
  rows.push(['名前','合計時間(分)','実働時間(分)','合計件数','時間あたり件数']);
  Object.keys(agg.perStaff).forEach(function(sid){
    var s = staffById(sid);
    var info = agg.perStaff[sid];
    var workMs = info.ms - (info.breakMs||0);
    var rate = workMs>0 ? (info.qty/(workMs/3600000)).toFixed(1) : '';
    rows.push([s.name, Math.round(info.ms/60000), Math.round(workMs/60000), info.qty, rate]);
  });
  rows.push([]);
  rows.push(['作業別']);
  rows.push(['作業名','合計時間(分)','合計件数','稼働人数']);
  Object.keys(agg.perTask).forEach(function(tid){
    var t = taskById(tid);
    var info = agg.perTask[tid];
    rows.push([t.name, Math.round(info.ms/60000), info.qty, Object.keys(info.staff).length]);
  });
  downloadCSV('集計_'+label+'.csv', rows);
}

/* ---------- Achievements (実績) data helpers ---------- */
function isPieceUnit(unit){
  return unit==='ピース' || unit==='個';
}
function isCountUnit(unit){
  return unit==='件';
}
function freshCategoryBucket(){
  return { pieces:0, count:0, other:{}, logCount:0 };
}
function addQtyToBucket(bucket, unit, v){
  if(v<=0) return;
  if(isPieceUnit(unit)) bucket.pieces += v;
  else if(isCountUnit(unit)) bucket.count += v;
  else bucket.other[unit] = (bucket.other[unit]||0) + v;
}
function classifyDayIntoBuckets(day, buckets){
  if(!day) return;
  day.logs.forEach(function(l){
    if(l.taskId==='BREAK') return;
    var task = taskById(l.taskId);
    var cat = taskCategory(task);
    if(!buckets[cat]) buckets[cat] = freshCategoryBucket();
    buckets[cat].logCount++;
    if(l.breakdown){
      var unitMap = subcatUnitMap(task);
      Object.keys(l.breakdown).forEach(function(k){
        addQtyToBucket(buckets[cat], unitMap[k]||task.unit, l.breakdown[k]||0);
      });
    }else if(l.quantity){
      addQtyToBucket(buckets[cat], task.unit, l.quantity);
    }
  });
}
function aggregateBucketsForDays(days){
  var buckets = {};
  (days||[]).forEach(function(day){ classifyDayIntoBuckets(day, buckets); });
  return buckets;
}
function monthKeyOf(dateStr){ return dateStr.slice(0,7); }
function aggregateByMonth(days){
  var byMonth = {};
  (days||[]).forEach(function(day){
    if(!day) return;
    var mk = monthKeyOf(day.date);
    if(!byMonth[mk]) byMonth[mk] = {};
    classifyDayIntoBuckets(day, byMonth[mk]);
  });
  return byMonth;
}
function shipmentPieces(buckets){
  return (buckets && buckets['出荷']) ? buckets['出荷'].pieces : 0;
}
async function runAchievementsReport(){
  state.achievementsLoading = true;
  state.achievementsError = null;
  render();
  try{
    var allDays = await loadAllDaysForLifetime();
    var byMonth = aggregateByMonth(allDays);
    var now = new Date();
    var curMonthKey = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
    var curBuckets = byMonth[curMonthKey] || {};

    var bestMonthKey = null, bestPieces = 0;
    Object.keys(byMonth).forEach(function(mk){
      if(mk===curMonthKey) return;
      var p = shipmentPieces(byMonth[mk]);
      if(p>bestPieces){ bestPieces=p; bestMonthKey=mk; }
    });

    var lastYearKey = (now.getFullYear()-1)+'-'+String(now.getMonth()+1).padStart(2,'0');
    var lastYearBuckets = byMonth[lastYearKey] || null;

    var dailyPieces = {};
    var bestDay = null, bestDayPieces = 0;
    allDays.forEach(function(day){
      if(!day || monthKeyOf(day.date)!==curMonthKey) return;
      var b = {};
      classifyDayIntoBuckets(day, b);
      var p = shipmentPieces(b);
      dailyPieces[day.date] = p;
      if(p>bestDayPieces){ bestDayPieces=p; bestDay=day.date; }
    });

    state.achievementsResult = {
      generatedAt: Date.now(),
      curMonthKey: curMonthKey,
      curBuckets: curBuckets,
      bestMonthKey: bestMonthKey,
      bestPieces: bestPieces,
      lastYearKey: lastYearKey,
      lastYearBuckets: lastYearBuckets,
      dailyPieces: dailyPieces,
      bestDay: bestDay,
      bestDayPieces: bestDayPieces,
      dayCount: allDays.length
    };
  }catch(e){
    state.achievementsError = 'データの読み込みに失敗しました。もう一度お試しください。';
  }
  state.achievementsLoading = false;
  render();
}

function aggregateLifetime(days){
  var perStaff = {};
  days.forEach(function(day){
    if(!day) return;
    day.logs.forEach(function(l){
      if(!perStaff[l.staffId]) perStaff[l.staffId] = { xp:0, bySpec:{}, workMs:0, workDays:{} };
      if(l.taskId==='BREAK') return;
      var end = l.end ? new Date(l.end).getTime() : Date.now();
      var dur = Math.max(0, end - new Date(l.start).getTime());
      perStaff[l.staffId].workMs += dur;
      perStaff[l.staffId].workDays[day.date] = true;
      if(l.breakdown){
        Object.keys(l.breakdown).forEach(function(k){
          var v = l.breakdown[k]||0;
          if(v<=0) return;
          perStaff[l.staffId].xp += v;
          perStaff[l.staffId].bySpec[k] = (perStaff[l.staffId].bySpec[k]||0) + v;
        });
      }else if(l.quantity){
        var q = l.quantity||0;
        if(q<=0) return;
        perStaff[l.staffId].xp += q;
        var t = taskById(l.taskId);
        perStaff[l.staffId].bySpec[t.name] = (perStaff[l.staffId].bySpec[t.name]||0) + q;
      }
    });
  });
  return perStaff;
}
function rpgXpForLevel(lv){ return 25*Math.pow(lv-1,2); }
function rpgLevelInfo(xp){
  var level = Math.floor(Math.sqrt(xp/25)) + 1;
  var curFloor = rpgXpForLevel(level);
  var nextFloor = rpgXpForLevel(level+1);
  var progress = nextFloor>curFloor ? (xp-curFloor)/(nextFloor-curFloor) : 1;
  return { level:level, xp:xp, curFloor:curFloor, nextFloor:nextFloor, progress:Math.min(1,Math.max(0,progress)) };
}
function rpgTitleForLevel(level){
  if(level>=21) return 'マスター';
  if(level>=11) return 'エキスパート';
  if(level>=6) return 'ベテラン';
  if(level>=3) return '一人前';
  return '見習い';
}
function rpgAvatarTier(level){
  if(level>=21) return 4;
  if(level>=11) return 3;
  if(level>=6) return 2;
  if(level>=3) return 1;
  return 0;
}
function rpgStats(info){
  var workDaysCount = Object.keys(info.workDays||{}).length;
  var workHours = (info.workMs||0)/3600000;
  var rate = workHours>0 ? info.xp/workHours : 0;
  return {
    atk: Math.min(99, Math.round(Math.sqrt(info.xp)*2)),
    def: Math.min(99, Math.round(workDaysCount*2.5)),
    spd: Math.min(99, Math.round(rate*3))
  };
}

async function runRangeReport(startStr, endStr){
  state.reportStart = startStr;
  state.reportEnd = endStr;
  if(new Date(startStr) > new Date(endStr)){
    state.reportError = '開始日は終了日より前にしてください。';
    render();
    return;
  }
  var dates = dateRangeList(startStr, endStr);
  if(dates.length > 62){
    state.reportError = '一度に集計できるのは62日間までです。期間を短くしてください。';
    render();
    return;
  }
  state.reportLoading = true;
  state.reportError = null;
  render();
  var days = [];
  for(var i=0;i<dates.length;i++){
    var d = await loadDayByDate(dates[i]);
    if(d) days.push(d);
  }
  var agg = aggregateDays(days);
  state.reportRangeResult = { start: startStr, end: endStr, dayCount: dates.length, daysWithData: days.length, agg: agg };
  state.reportLoading = false;
  render();

async function liveCountAdjust(taskId, subcatName, delta){
  var log = currentLog(state.activeStaffId);
  if(!log || log.taskId!==taskId) return;
  if(!log.breakdown) log.breakdown = {};
  log.breakdown[subcatName] = Math.max(0, (log.breakdown[subcatName]||0) + delta);
  log.quantity = Object.keys(log.breakdown).reduce(function(a,k){ return a+(log.breakdown[k]||0); }, 0);
  await saveDay(state.day);
  render();
}
function finalizeActiveSubTimer(log){
  if(!log || !log.activeSubcat || !log.activeSubcatStart) return;
  if(!log.subTimes) log.subTimes = {};
  var start = new Date(log.activeSubcatStart).getTime();
  log.subTimes[log.activeSubcat] = (log.subTimes[log.activeSubcat]||0) + Math.max(0, Date.now()-start);
  log.activeSubcat = null;
  log.activeSubcatStart = null;
}
async function toggleSubTimer(taskId, subcatName){
  var log = currentLog(state.activeStaffId);
  if(!log || log.taskId!==taskId) return;
  if(log.activeSubcat === subcatName){
    finalizeActiveSubTimer(log);
  }else{
    finalizeActiveSubTimer(log);
    log.activeSubcat = subcatName;
    log.activeSubcatStart = new Date().toISOString();
  }
  await saveDay(state.day);
  render();
}

async function checkAutoBreak(){
  if(!state.breakSettings || !state.breakSettings.enabled) return;
  if(!state.day || state.day.date !== todayStr()) return;
  var now = new Date();
  var nowStr = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  var inBreak = nowStr >= state.breakSettings.start && nowStr < state.breakSettings.end;
  var changed = false;
  presentStaff().forEach(function(s){
    var log = currentLog(s.id);
    if(inBreak){
      if(log && log.taskId!=='BREAK'){
        finalizeActiveSubTimer(log);
        log.end = new Date().toISOString();
        if(log.quantity==null && !log.breakdown) log.quantity = 0;
        state.day.logs.push({id:uid(), staffId:s.id, taskId:'BREAK', start:new Date().toISOString(), end:null, quantity:null});
        changed = true;
      }
    }else{
      if(log && log.taskId==='BREAK'){
        log.end = new Date().toISOString();
        log.quantity = null;
        changed = true;
      }
    }
  });
  if(changed){
    await saveDay(state.day);
  }
}
async function checkAutoShift(){
  if(!state.shiftSettings || !state.shiftSettings.enabled) return;
  if(!state.day || state.day.date !== todayStr()) return;
  var day = state.day;
  var now = new Date();
  var wd = now.getDay();
  var nowStr = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  if(!day.autoShiftStarted) day.autoShiftStarted = {};
  if(!day.autoShiftEnded) day.autoShiftEnded = {};
  if(!day.shiftEndOverrides) day.shiftEndOverrides = {};
  var changed = false;
  activeRoster().forEach(function(s){
    var pattern = s.pattern || defaultPattern();
    if(!pattern[wd]) return;
    var endTime = day.shiftEndOverrides[s.id] || state.shiftSettings.end;
    var isOn = !!day.attendance[s.id];

    if(!isOn && !day.autoShiftStarted[s.id] && nowStr >= state.shiftSettings.start && nowStr < endTime){
      day.attendance[s.id] = true;
      day.autoShiftStarted[s.id] = true;
      changed = true;
      isOn = true;
    }

    if(isOn && !day.autoShiftEnded[s.id] && nowStr >= endTime){
      day.attendance[s.id] = false;
      day.autoShiftEnded[s.id] = true;
      changed = true;
      var log = currentLog(s.id);
      if(log && log.end===null){
        finalizeActiveSubTimer(log);
        log.end = new Date().toISOString();
        if(log.taskId==='BREAK'){
          log.quantity = null;
        }else if(log.quantity==null && !log.breakdown){
          log.quantity = 0;
        }
      }
    }
  });
  if(changed){
    await saveDay(day);
  }
}

async function saveEditTemplate(){
  var m = state.modal;
  var tmpl = state.templates.find(function(t){ return t.id===m.templateId; });
  if(!tmpl){ state.modal=null; state.suppressRender=false; render(); return; }
  var nameInput = document.getElementById('editTmplName');
  var unitInput = document.getElementById('editTmplUnit');
  var name = (nameInput.value||'').trim();
  if(!name){ nameInput.style.borderColor='#C1521F'; nameInput.focus(); return; }
  tmpl.name = name;
  tmpl.unit = unitInput ? ((unitInput.value||'件').trim() || '件') : '件';
  tmpl.color = m.color;
  tmpl.subcategories = (m.subcatsList||[]).slice();
  tmpl.category = m.category || 'その他';
  state.modal = null;
  state.suppressRender = false;
  await saveTemplates(state.templates);

  var today = todayStr();
  var changed = false;
  state.backlog.forEach(function(task){
    if(task.fromTemplate===tmpl.id && task.workDate>=today && !task.archived){
      task.name = tmpl.name;
      task.unit = tmpl.unit;
      task.color = tmpl.color;
      task.subcategories = tmpl.subcategories.slice();
      task.category = tmpl.category;
      changed = true;
    }
  });
  if(changed) await saveBacklog(state.backlog);

  render();
}
async function deleteEditTemplate(){
  var m = state.modal;
  var tmpl = state.templates.find(function(t){ return t.id===m.templateId; });
  if(!tmpl) return;
  var templateId = tmpl.id;
  var tmplName = tmpl.name;
  tmpl.archived = true;
  await saveTemplates(state.templates);
  var today = todayStr();
  var cascadedIds = [];
  state.backlog.forEach(function(task){
    if(task.fromTemplate===templateId && task.workDate>=today && !task.archived){
      task.archived = true;
      cascadedIds.push(task.id);
    }
  });
  if(cascadedIds.length) await saveBacklog(state.backlog);
  state.modal = null;
  state.suppressRender = false;
  render();
  showToast('繰り返し作業「'+tmplName+'」を削除しました', '元に戻す', async function(){
    var curTmpl = state.templates.find(function(x){ return x.id===templateId; });
    if(curTmpl) curTmpl.archived = false;
    await saveTemplates(state.templates);
    cascadedIds.forEach(function(taskId){
      var task = state.backlog.find(function(x){ return x.id===taskId; });
      if(task) task.archived = false;
    });
    if(cascadedIds.length) await saveBacklog(state.backlog);
    render();
  });
}

      '<label style="font-size:11px;color:var(--slate-500);display:block;margin-bottom:4px;">作業名</label>'+
      '<input type="text" id="editTmplName" value="'+esc(m.name)+'" style="width:100%;border:2px solid var(--paper-line);border-radius:10px;padding:10px;font-size:14px;margin-bottom:14px;">'+
      '<label style="font-size:11px;color:var(--slate-500);display:block;margin-bottom:4px;">区分(実績画面の出荷/入庫集計に使われます)</label>'+
      renderCategoryToggle('editTmpl', m.category)+
      '<label style="font-size:11px;color:var(--slate-500);display:block;margin:10px 0 4px;">内訳(任意。使う場合は単位はここで内訳ごとに設定)</label>'+
      renderSubcatTagInput(m.subcatsList,'editTmpl','editTmplSubcatText',m.unit)+
      (hasSubcats ? '' : '<label style="font-size:11px;color:var(--slate-500);display:block;margin:10px 0 4px;">単位</label><input type="text" id="editTmplUnit" value="'+esc(m.unit)+'" style="width:100%;border:2px solid var(--paper-line);border-radius:10px;padding:10px;font-size:14px;">')+
      '<label style="font-size:11px;color:var(--slate-500);display:block;margin:10px 0 4px;">カラー</label>'+
      '<div class="swatches" style="margin-bottom:8px;">'+editFieldSwatches(m.color,'edit-tmpl-color')+'</div>'+
      '<div class="pool-hint" style="margin-bottom:14px;">発生する曜日は一覧の曜日ボタンから変更できます。</div>'+
      '<div class="modal-actions">'+
        '<button class="modal-cancel" id="editCancelBtn">キャンセル</button>'+
        '<button class="modal-confirm" id="editSaveBtn">保存</button>'+
      '</div>'+
      '<button id="editDeleteBtn" style="width:100%;margin-top:12px;background:transparent;border:none;color:var(--rust-600);font-size:13px;font-weight:600;padding:8px;">この繰り返し作業を削除する</button>'+
    '</div>'+
