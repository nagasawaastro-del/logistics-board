/* ロジリンクに引っ越し済み: ロジリンクと同じ Supabase プロジェクト(config.js)を使い、ログインも共通。
   データは factory_master(製品・ライン・受注・計画・資材など)と factory_records(生産実績を1件1行)に保存する(supabase/factory.sql)。
   見られるのは admin / manager / factory(生産管理者)、編集できるのは admin と factory。 */

const SUPABASE_ANON_KEY = (window.SUPABASE_CONFIG || {}).anonKey || '';

// 最後に読み込んだ(保存した)生産実績。保存のときに、変わった行・消えた行だけを書く
let lastSavedRecords = {};
async function cloudLoad() {
  const [m, r] = await Promise.all([
    supabaseClient.from('factory_master').select('data').eq('id', 'main').maybeSingle(),
    supabaseClient.from('factory_records').select('id, record').range(0, 19999),
  ]);
  if (m.error) throw m.error;
  if (r.error) throw r.error;
  const records = (r.data || []).map((x) => x.record).filter(Boolean)
    .sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')) || String(a.id).localeCompare(String(b.id)));
  lastSavedRecords = {};
  records.forEach((x) => { lastSavedRecords[x.id] = JSON.stringify(x); });
  if (!m.data) return records.length ? { records } : null;
  return { ...m.data.data, records };
}
// データの版(通信量を減らす): 最終更新日時と件数だけを読む(数十バイト)。変わっていなければ全体を読み直さない
let lastCloudSig = null;
async function cloudSig() {
  const [m, r] = await Promise.all([
    supabaseClient.from('factory_master').select('updated_at').eq('id', 'main').maybeSingle(),
    supabaseClient.from('factory_records').select('updated_at', { count: 'exact' }).order('updated_at', { ascending: false }).limit(1),
  ]);
  if (m.error || r.error) return null;
  return (m.data ? m.data.updated_at : '') + '|' + ((r.data && r.data[0]) ? r.data[0].updated_at : '') + '|' + r.count;
}
// ログイン中のアカウントの役割(ロジリンクの user_roles。自分の行だけ読める)
async function loadMyRole(userId) {
  const { data, error } = await supabaseClient.from('user_roles').select('role').eq('user_id', userId).maybeSingle();
  if (error) return null;
  return data ? data.role : null;
}
async function cloudSave(obj) {
  const { records, ...master } = obj;
  const now = new Date().toISOString();
  const { error } = await supabaseClient.from('factory_master').upsert({ id: 'main', data: master, updated_at: now });
  if (error) throw error;
  const cur = {};
  (records || []).forEach((x) => { cur[x.id] = JSON.stringify(x); });
  const ups = (records || []).filter((x) => lastSavedRecords[x.id] !== cur[x.id]).map((x) => ({ id: x.id, record: x, updated_at: now }));
  const dels = Object.keys(lastSavedRecords).filter((id) => !(id in cur));
  if (ups.length) { const { error: e1 } = await supabaseClient.from('factory_records').upsert(ups); if (e1) throw e1; }
  if (dels.length) { const { error: e2 } = await supabaseClient.from('factory_records').delete().in('id', dels); if (e2) throw e2; }
  lastSavedRecords = cur;
  return ups.map((x) => x.id);
}
/* ---- kintone 生産実績アプリ(981)への登録(Edge Function push-production-981) ----
   設定(data.k981)が「使う」で、開始日以降・製造分類のあるラインの実績を保存すると、自動で 981 に登録する。
   送れなかったときも生産管理の保存はそのまま(kintone の不具合で生産管理が止まらないように)。 */
async function callK981(body) {
  try {
    const res = await supabaseClient.functions.invoke('push-production-981', { body });
    if (res.error) {
      let msg = res.error.message || 'エラーが発生しました';
      try { const j = await res.error.context.json(); if (j && j.error) msg = j.error; } catch (e) {}
      return { ok: false, error: msg };
    }
    let d = res.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (e) { d = null; } }
    return d || { ok: false, error: '応答がありませんでした' };
  } catch (e) {
    return { ok: false, error: 'kintone 連携に接続できませんでした' };
  }
}
async function loadK981Status() {
  const { data, error } = await supabaseClient.from('factory_k981').select('record_id,kintone_id,error,sent_at').range(0, 19999);
  if (error) return null;
  const m = {};
  (data || []).forEach((x) => { m[x.record_id] = x; });
  return m;
}
/* ---- ロジリンクの現場入力(たたみ数) ----
   ロジリンクの作業記録で「たたみ」の作業を終えると、kv「factory-fold:日付」にたたみ数が入る。
   生産管理(編集できる人)が開いている間、1分ごとに版だけ確かめ、新しい分を生産実績(たたみのライン)に取り込む。
   現場の端末はログインしないので、計画の候補は kv「factory-fold-plans」に出しておく(計画が変わったときだけ書く)。 */
const FOLD_DAYS = 14;
const foldLineIdOf = (data) => ((data.fold || {}).lineId) || ((data.lines || []).find((l) => String(l.name || '').includes('たたみ')) || {}).id || '';
function foldKeys(today) {
  const keys = [];
  const d = new Date(today + 'T00:00:00');
  for (let i = 0; i < FOLD_DAYS; i++) {
    const x = new Date(d.getTime() - i * 86400000);
    keys.push('factory-fold:' + x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'));
  }
  return keys;
}
let lastFoldSig = null;
async function loadFoldEntries(force) {
  const keys = foldKeys(todayStr());
  const v = await supabaseClient.from('kv_store').select('key,updated_at').in('key', keys);
  if (v.error) return null;
  const sig = (v.data || []).map((x) => x.key + '@' + x.updated_at).sort().join('|');
  if (!force && sig === lastFoldSig) return null; // 変わっていない
  if (!(v.data || []).length) { lastFoldSig = sig; return []; }
  const r = await supabaseClient.from('kv_store').select('key,value').in('key', (v.data || []).map((x) => x.key));
  if (r.error) return null;
  lastFoldSig = sig;
  const out = [];
  (r.data || []).forEach((row) => { try { const list = JSON.parse(row.value); if (Array.isArray(list)) list.forEach((e) => { if (e && e.id && e.date) out.push(e); }); } catch (e) {} });
  return out;
}
let lastFoldPlansJson = null;
async function publishFoldPlans(payload) {
  const json = JSON.stringify(payload);
  if (lastFoldPlansJson === null) {
    const cur = await supabaseClient.from('kv_store').select('value').eq('key', 'factory-fold-plans').maybeSingle();
    if (!cur.error && cur.data) { try { lastFoldPlansJson = JSON.stringify(JSON.parse(cur.data.value)); } catch (e) {} }
  }
  if (json === lastFoldPlansJson) return;
  const { error } = await supabaseClient.from('kv_store').upsert({ key: 'factory-fold-plans', value: json }, { onConflict: 'key' });
  if (!error) lastFoldPlansJson = json;
}

const buildMonthGrid = (year, month) => {
  const firstWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);
  return cells;
};

const parseDate = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const planStart = (o) => o.startDate || o.dueDate;
const planEnd = (o) => o.dueDate || o.startDate;
// 開始時刻・終了時刻から所要時間の文字列を計算(日をまたぐ場合も考慮)
const workDuration = (start, end) => {
  if (!start || !end) return null;
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  if ([sh, sm, eh, em].some((v) => Number.isNaN(v))) return null;
  let diff = (eh * 60 + em) - (sh * 60 + sm);
  if (diff < 0) diff += 24 * 60;
  const h = Math.floor(diff / 60);
  const m = diff % 60;
  if (h === 0) return `${m}分`;
  if (m === 0) return `${h}時間`;
  return `${h}時間${m}分`;
};
const planSpanDays = (o) => {
  const s = parseDate(planStart(o));
  const e = parseDate(planEnd(o));
  return Math.max(1, Math.round((e - s) / 86400000) + 1);
};

    { id: 'R1b', date: todayStr(), lineId: 'L1', orderId: 'O1', worker: '佐藤', machineUpQty: 500, inspectedQty: 400, foldedQty: 300, defectQty: 10, defectCause: '寸法不良', defectNote: '', materialUsedLength: 30 },
    { id: 'R2', date: todayStr(), lineId: 'L2', orderId: 'O2', worker: '鈴木', machineUpQty: 600, inspectedQty: 600, foldedQty: 500, defectQty: 10, defectCause: '寸法不良', defectNote: '', materialUsedLength: 40 },
  ],
  materialTransactions: [],
  tabOrder: DEFAULT_TAB_ORDER,
};

function AuthBar({ session }) {
  const [open, setOpen] = useState(false);
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  if (session) {
    return (
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12, color: C.textDim }}>
        <User size={13} />
        <span className="fm-mono">{session.user.email}</span>
        <button
          onClick={() => authSignOut()}
          className="fm-btn"
          style={{ background: C.panelAlt2, border: `1px solid ${C.border}`, color: C.textDim, borderRadius: 6, padding: '3px 9px', cursor: 'pointer', fontSize: 11 }}
        >ログアウト</button>
      </div>
    );
  }

  const submit = async () => {
    setErr('');
    if (!email || !password) { setErr('メールアドレスとパスワードを入力してください。'); return; }
    setBusy(true);
    try {
      await authSignIn(email, password);
      setOpen(false);
      setEmail(''); setPassword('');
    } catch (e) {
      setErr('ログインできませんでした。メールアドレス・パスワードをご確認ください。');
    } finally {
      setBusy(false);
    }
  };

  return (
    <div style={{ position: 'relative' }}>
      <button
        onClick={() => setOpen((o) => !o)}
        className="fm-btn"
        style={{ background: C.panelAlt2, border: `1px solid ${C.border}`, color: C.text, borderRadius: 6, padding: '5px 12px', cursor: 'pointer', fontSize: 12, display: 'flex', alignItems: 'center', gap: 6 }}
      ><Lock size={12} /> ログイン</button>
      {open && (
        <div style={{ position: 'absolute', right: 0, top: '110%', background: C.panel, border: `1px solid ${C.border}`, borderRadius: 10, padding: 14, width: 240, zIndex: 20, boxShadow: '0 8px 24px rgba(0,0,0,0.4)' }}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            <input className="fm-input" type="email" placeholder="メールアドレス" value={email} onChange={(e) => setEmail(e.target.value)} />
            <input className="fm-input" type="password" placeholder="パスワード" value={password} onChange={(e) => setPassword(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') submit(); }} />
            {err && <div style={{ color: C.red, fontSize: 11 }}>{err}</div>}
            <PrimaryButton onClick={submit} style={{ justifyContent: 'center' }}>{busy ? 'ログイン中…' : 'ログイン'}</PrimaryButton>
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [saveStatus, setSaveStatus] = useState('idle'); // idle | saving | saved | error
  const [tab, setTab] = useState('dashboard');
  const [session, setSession] = useState(null);
  const [role, setRole] = useState(undefined); // undefined = 確認中、null = 役割なし
  const canView = role === 'admin' || role === 'manager' || role === 'factory';
  const isEditor = role === 'admin' || role === 'factory';
  useEffect(() => {
    if (!session) { setRole(null); return; }
    setRole(undefined);
    loadMyRole(session.user.id).then(setRole);
  }, [session]);

  /* --- ログイン状態の監視 --- */
  useEffect(() => {
    if (!CONFIGURED) return;
    supabaseClient.auth.getSession().then(({ data: d }) => setSession(d.session));
    const { data: sub } = supabaseClient.auth.onAuthStateChange((_event, sess) => setSession(sess));
    return () => sub.subscription.unsubscribe();
  }, []);

  /* --- 読み込み(Supabase) --- */
  const isFirstLoad = React.useRef(true);
  const lastLoadedJson = React.useRef('');
  const loadFromCloud = useCallback(async () => {
    try {
      const sig = await cloudSig();
      const remote = await cloudLoad();
      lastCloudSig = sig;
      const nd = normalizeData(remote);
      lastLoadedJson.current = JSON.stringify(nd); // 読み込んだだけ(変更なし)のときは保存しない
      setData(nd);
      setSaveStatus('saved');
    } catch (e) {
      console.error(e);
      setSaveStatus('error');
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { if (canView) loadFromCloud(); }, [canView, loadFromCloud]);

  // 他の人の更新を定期的に取り込む(10秒ごと)。画面が見えていないときは止め、版が変わったときだけ全体を読み直す
  useEffect(() => {
    if (!canView) return;
    const iv = setInterval(async () => {
      if (loading || document.hidden) return;
      const sig = await cloudSig();
      if (sig && sig === lastCloudSig) return;
      loadFromCloud();
    }, 10000);
    return () => clearInterval(iv);
  }, [canView, loading, loadFromCloud]);

  /* --- 保存(デバウンス) --- */
  useEffect(() => {
    if (loading || !data || !isEditor) return;
    if (isFirstLoad.current) { isFirstLoad.current = false; return; }
    if (JSON.stringify(data) === lastLoadedJson.current) return;
    setSaveStatus('saving');
    const t = setTimeout(async () => {
      try {
        const savedIds = await cloudSave(data);
        setSaveStatus('saved');
        const cfg = data.k981 || {};
        const ids = (savedIds || []).filter((id) => { const r = data.records.find((x) => x.id === id); return r && k981Target(cfg, r); });
        if (ids.length) pushK981(ids);
      } catch (e) {
        console.error(e);
        setSaveStatus('error');
      }
    }, 600);
    return () => clearTimeout(t);
  }, [data, loading]);

  /* --- kintone 981 への登録の状態 --- */
  const [k981Status, setK981Status] = useState(null);
  const [k981Busy, setK981Busy] = useState(false);
  const [k981Last, setK981Last] = useState(null);
  const refreshK981Status = useCallback(async () => { const st = await loadK981Status(); if (st) setK981Status(st); }, []);
  useEffect(() => { if (canView && data && data.k981 && data.k981.enabled && !k981Status) refreshK981Status(); }, [canView, data, k981Status, refreshK981Status]);
  const pushK981 = useCallback(async (ids) => {
    setK981Busy(true);
    const r = await callK981(ids ? { action: 'push', ids } : { action: 'push' });
    setK981Last({ ...r, at: new Date().toISOString() });
    setK981Busy(false);
    refreshK981Status();
    return r;
  }, [refreshK981Status]);
  const setK981 = (patch) => setData((d) => ({ ...d, k981: { ...(d.k981 || {}), ...patch } }));
  const setFold = (patch) => setData((d) => ({ ...d, fold: { ...(d.fold || {}), ...patch } }));

  /* --- ロジリンクの現場入力(たたみ数) --- */
  const foldPlansPayload = useMemo(() => {
    if (!data) return null;
    const lineId = foldLineIdOf(data);
    const line = data.lines.find((l) => l.id === lineId);
    const plans = data.orders.filter((o) => o.lineId === lineId).map((o) => {
      const folded = data.records.filter((r) => r.orderId === o.id).reduce((a, r) => a + num(r.foldedQty), 0);
      return { id: o.id, planNo: o.planNo || '', productName: o.productName || (data.products.find((p) => p.id === o.productId) || {}).productName || '', remaining: Math.max(0, num(o.targetQty) - folded) };
    }).filter((p) => p.remaining > 0);
    return { lineId, lineName: line ? line.name : '', plans };
  }, [data]);
  useEffect(() => {
    if (loading || !isEditor || !foldPlansPayload) return;
    const t = setTimeout(() => { publishFoldPlans(foldPlansPayload).catch(() => {}); }, 1500);
    return () => clearTimeout(t);
  }, [loading, isEditor, JSON.stringify(foldPlansPayload)]);
  const foldQueued = React.useRef(new Set()); // この画面で取り込み済みにした id(二重に取り込まない)
  const importFold = useCallback(async (force) => {
    if (!data) return;
    const entries = await loadFoldEntries(force);
    if (!entries) return;
    const lineId = foldLineIdOf(data);
    const done = new Set((data.foldImported || []).map((x) => String(x).split('|')[1]));
    const recIds = new Set(data.records.map((r) => r.id));
    const fresh = entries.filter((e) => !done.has(e.id) && !recIds.has('F-' + e.id) && !foldQueued.current.has(e.id)).sort((a, b) => String(a.at).localeCompare(String(b.at)));
    if (!fresh.length || !lineId) return;
    fresh.forEach((e) => foldQueued.current.add(e.id));
    fresh.forEach((e) => {
      const qty = num(e.qty), defect = num(e.defectQty);
      addRecord({
        id: 'F-' + e.id, source: 'logilink', date: e.date, orderId: e.orderId || '', lineId,
        worker: e.staffName || '', startTime: e.startTime || '', endTime: e.endTime || '',
        machineUpQty: qty + defect, inspectedQty: qty, foldedQty: qty, defectQty: defect,
        defectCause: '', defectItems: defect > 0 ? [{ cause: '', qty: defect }] : [],
        materialUsedLength: 0, setProductId: '', setQty: 0,
      });
    });
    // 取り込んだ印(30日より前のものは消す)。生産管理で実績を消しても、もう一度は取り込まない
    const cutoff = new Date(Date.now() - 30 * 86400000).toISOString().slice(0, 10);
    setData((d) => ({ ...d, foldImported: [...(d.foldImported || []).filter((x) => String(x).split('|')[0] >= cutoff), ...fresh.map((e) => e.date + '|' + e.id)] }));
  }, [data]);
  const importFoldRef = React.useRef(importFold);
  importFoldRef.current = importFold;
  useEffect(() => {
    if (loading || !isEditor || !data) return;
    importFoldRef.current(true);
    const iv = setInterval(() => { if (!document.hidden) importFoldRef.current(false); }, 60000);
    return () => clearInterval(iv);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loading, isEditor]);

  const lineById = useCallback((id) => data?.lines.find((l) => l.id === id), [data]);
  const lotById = useCallback((id) => data?.lots.find((l) => l.id === id), [data]);
  const orderById = useCallback((id) => data?.orders.find((o) => o.id === id), [data]);
  const salesOrderById = useCallback((id) => data?.salesOrders.find((s) => s.id === id), [data]);
  const productById = useCallback((id) => data?.products.find((p) => p.id === id), [data]);

  const orderStats = useCallback((orderId) => {
    const recs = (data?.records || []).filter((r) => r.orderId === orderId);
    return recs.reduce((acc, r) => ({
      machineUp: acc.machineUp + num(r.machineUpQty),
      inspected: acc.inspected + num(r.inspectedQty),
      folded: acc.folded + num(r.foldedQty),
      defect: acc.defect + num(r.defectQty),
    }), { machineUp: 0, inspected: 0, folded: 0, defect: 0 });
  }, [data]);

  const salesOrderStats = useCallback((salesOrderId) => {
    const so = (data?.salesOrders || []).find((s) => s.id === salesOrderId);
    const planIds = (data?.orders || []).filter((o) => o.salesOrderId === salesOrderId).map((o) => o.id);
    const recs = (data?.records || []).filter((r) => planIds.includes(r.orderId));
    const base = recs.reduce((acc, r) => ({
      machineUp: acc.machineUp + num(r.machineUpQty),
      folded: acc.folded + num(r.foldedQty),
    }), { machineUp: 0, folded: 0 });
    // セット品の受注の場合、バラ換算の完成数(folded)を1セットあたりの枚数で割って算出する。
    // これにより「セット単位入力」のチェックの有無に関わらず、生産計画で進んだ分がそのまま受注の進捗に反映される。
    let setsCompleted = 0;
    if (so) {
      const soProduct = (data?.products || []).find((p) => p.id === so.productId);
      if (soProduct?.isSet && num(soProduct.piecesPerSet) > 0) {
        setsCompleted = Math.floor(base.folded / num(soProduct.piecesPerSet));
      } else {
        setsCompleted = recs.filter((r) => r.setProductId === so.productId).reduce((sum, r) => sum + num(r.setQty), 0);
      }
    }
    return { ...base, setsCompleted };
  }, [data]);

  /* --- 追加・削除アクション --- */
  const addLine = (name) => setData((d) => ({ ...d, lines: [...d.lines, { id: uid('L'), name }] }));
  const removeLine = (id) => setData((d) => ({ ...d, lines: d.lines.filter((l) => l.id !== id) }));

  const addProduct = (p) => setData((d) => ({ ...d, products: [...d.products, { id: uid('P'), ...p }] }));
  const updateProduct = (id, patch) => setData((d) => ({ ...d, products: d.products.map((p) => (p.id === id ? { ...p, ...patch } : p)) }));
  const removeProduct = (id) => setData((d) => ({ ...d, products: d.products.filter((p) => p.id !== id) }));

  // バラ品からセット品を組み立てる(バラの完成品在庫を減らし、セット品の完成品在庫を増やす)
  const packSet = (setProductId, qty) => setData((d) => {
    const setProduct = d.products.find((p) => p.id === setProductId);
    if (!setProduct || !setProduct.isSet || !setProduct.setSourceProductId) return d;
    const baseProduct = d.products.find((p) => p.id === setProduct.setSourceProductId);
    if (!baseProduct) return d;
    const required = num(setProduct.piecesPerSet) * num(qty);
    const products = d.products.map((p) => {
      if (p.id === baseProduct.id) return { ...p, finishedStock: Math.max(0, num(p.finishedStock) - required) };
      if (p.id === setProduct.id) return { ...p, finishedStock: num(p.finishedStock) + num(qty) };
      return p;
    });
    return { ...d, products };
  });

  const addSalesOrder = (so) => setData((d) => ({ ...d, salesOrders: [...d.salesOrders, { id: uid('SO'), ...so }] }));
  const updateSalesOrder = (id, patch) => setData((d) => ({ ...d, salesOrders: d.salesOrders.map((s) => (s.id === id ? { ...s, ...patch } : s)) }));
  const removeSalesOrder = (id) => setData((d) => ({ ...d, salesOrders: d.salesOrders.filter((s) => s.id !== id) }));

  const addLot = (lot) => setData((d) => ({ ...d, lots: [...d.lots, { id: uid('LOT'), ...lot }] }));
  const updateLot = (id, patch) => setData((d) => ({ ...d, lots: d.lots.map((l) => (l.id === id ? { ...l, ...patch } : l)) }));
  const removeLot = (id) => setData((d) => ({ ...d, lots: d.lots.filter((l) => l.id !== id) }));

  // 資材の入出庫記録(生産計画とは独立して、日々の在庫の増減だけを記録する)
  const addMaterialTransaction = (tx) => setData((d) => {
    const lot = d.lots.find((l) => l.id === tx.lotId);
    if (!lot) return d;
    const delta = tx.type === '入庫' ? num(tx.qty) : -num(tx.qty);
    const lots = d.lots.map((l) => (l.id === tx.lotId ? { ...l, remainingLength: Math.max(0, num(l.remainingLength) + delta) } : l));
    return { ...d, lots, materialTransactions: [...d.materialTransactions, { id: uid('MT'), ...tx }] };
  });
  const removeMaterialTransaction = (id) => setData((d) => {
    const tx = d.materialTransactions.find((t) => t.id === id);
    if (!tx) return { ...d, materialTransactions: d.materialTransactions.filter((t) => t.id !== id) };
    const delta = tx.type === '入庫' ? -num(tx.qty) : num(tx.qty);
    const lots = d.lots.map((l) => (l.id === tx.lotId ? { ...l, remainingLength: Math.max(0, num(l.remainingLength) + delta) } : l));
    return { ...d, lots, materialTransactions: d.materialTransactions.filter((t) => t.id !== id) };
  });

  const updateTabOrder = (newOrder) => setData((d) => ({ ...d, tabOrder: newOrder }));
  const resetTabOrder = () => setData((d) => ({ ...d, tabOrder: DEFAULT_TAB_ORDER }));

  const addOrder = (order) => setData((d) => ({ ...d, orders: [...d.orders, { id: uid('O'), ...order }] }));
  const updateOrder = (id, patch) => setData((d) => ({ ...d, orders: d.orders.map((o) => (o.id === id ? { ...o, ...patch } : o)) }));
  const removeOrder = (id) => setData((d) => ({ ...d, orders: d.orders.filter((o) => o.id !== id), records: d.records.filter((r) => r.orderId !== id) }));

  // 実績が完成品在庫を加算する対象(セット単位入力ならセット品、それ以外は計画の商品自身)を判定
  // 実績が完成品在庫に与える影響(セット品への加算・元になるバラ品からの控除、通常は計画の商品への加算)を計算
  const stockEffects = (d, rec, ord) => {
    if (rec.setProductId && rec.setQty) {
      const effects = [{ productId: rec.setProductId, qty: num(rec.setQty) }];
      const setProduct = d.products.find((p) => p.id === rec.setProductId);
      if (setProduct && setProduct.setSourceProductId && num(setProduct.piecesPerSet) > 0) {
        effects.push({ productId: setProduct.setSourceProductId, qty: -(num(setProduct.piecesPerSet) * num(rec.setQty)) });
      }
      return effects;
    }
    if (ord && ord.productId && rec.foldedQty) {
      return [{ productId: ord.productId, qty: num(rec.foldedQty) }];
    }
    return [];
  };

  const addRecord = (rec) => setData((d) => {
    let lots = d.lots;
    let products = d.products;
    const ord = d.orders.find((o) => o.id === rec.orderId);
    if (ord && ord.lotId && rec.materialUsedLength) {
      lots = d.lots.map((l) => (l.id === ord.lotId ? { ...l, remainingLength: Math.max(0, num(l.remainingLength) - num(rec.materialUsedLength)) } : l));
    }
    stockEffects(d, rec, ord).forEach((eff) => {
      products = products.map((p) => (p.id === eff.productId ? { ...p, finishedStock: Math.max(0, num(p.finishedStock) + eff.qty) } : p));
    });
    return { ...d, lots, products, records: [...d.records, { id: uid('R'), ...rec }] };
  });
  const updateRecord = (id, patch) => setData((d) => {
    const old = d.records.find((r) => r.id === id);
    if (!old) return d;
    const merged = { ...old, ...patch };
    let lots = d.lots;
    let products = d.products;
    const oldOrd = d.orders.find((o) => o.id === old.orderId);
    const newOrd = d.orders.find((o) => o.id === merged.orderId);
    if (oldOrd && oldOrd.lotId && old.materialUsedLength) {
      lots = lots.map((l) => (l.id === oldOrd.lotId ? { ...l, remainingLength: num(l.remainingLength) + num(old.materialUsedLength) } : l));
    }
    if (newOrd && newOrd.lotId && merged.materialUsedLength) {
      lots = lots.map((l) => (l.id === newOrd.lotId ? { ...l, remainingLength: Math.max(0, num(l.remainingLength) - num(merged.materialUsedLength)) } : l));
    }
    stockEffects(d, old, oldOrd).forEach((eff) => {
      products = products.map((p) => (p.id === eff.productId ? { ...p, finishedStock: Math.max(0, num(p.finishedStock) - eff.qty) } : p));
    });
    stockEffects(d, merged, newOrd).forEach((eff) => {
      products = products.map((p) => (p.id === eff.productId ? { ...p, finishedStock: Math.max(0, num(p.finishedStock) + eff.qty) } : p));
    });
    return { ...d, lots, products, records: d.records.map((r) => (r.id === id ? merged : r)) };
  });
  const removeRecord = (id) => setData((d) => {
    const old = d.records.find((r) => r.id === id);
    if (!old) return { ...d, records: d.records.filter((r) => r.id !== id) };
    let lots = d.lots;
    let products = d.products;
    const ord = d.orders.find((o) => o.id === old.orderId);
    if (ord && ord.lotId && old.materialUsedLength) {
      lots = lots.map((l) => (l.id === ord.lotId ? { ...l, remainingLength: num(l.remainingLength) + num(old.materialUsedLength) } : l));
    }
    stockEffects(d, old, ord).forEach((eff) => {
      products = products.map((p) => (p.id === eff.productId ? { ...p, finishedStock: Math.max(0, num(p.finishedStock) - eff.qty) } : p));
    });
    return { ...d, lots, products, records: d.records.filter((r) => r.id !== id) };
  });

  if (!session || role === null || (role !== undefined && !canView)) {
    return (
      <div style={{ background: C.bg, color: C.text, minHeight: 400, borderRadius: 12, padding: 28, fontFamily: 'sans-serif' }}>
        <style>{FONT_STYLE}</style>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
          <div className="fm-display" style={{ fontSize: 22, fontWeight: 700 }}>生産管理</div>
          <a href="./" style={{ color: C.teal, fontSize: 13 }}>← LOGI LINK に戻る</a>
        </div>
        <p style={{ color: C.textDim, fontSize: 14, lineHeight: 1.8 }}>
          {!session ? '生産管理を見るには、ログインしてください(LOGI LINK と同じアカウントです)。'
            : 'このアカウントには生産管理を見る権限がありません。LOGI LINK の admin に「生産管理者」の役割を付けてもらってください。'}
        </p>
        <AuthBar session={session} />
      </div>
    );
  }
  if (loading || !data) {
    return (
      <div style={{ background: C.bg, minHeight: 400, display: 'flex', alignItems: 'center', justifyContent: 'center', color: C.textDim, borderRadius: 12 }}>
        <Loader2 className="fm-mono" size={20} style={{ marginRight: 8, animation: 'spin 1s linear infinite' }} />
        読み込み中...
        <style>{`@keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }`}</style>
      </div>
    );
  }

  const TABS = [
    { id: 'dashboard', label: 'ダッシュボード', icon: Gauge },
    { id: 'products', label: '商品マスタ', icon: Box },
    { id: 'salesorders', label: '受注', icon: FileText },
    { id: 'plan', label: '生産計画', icon: ClipboardList },
    { id: 'inventory', label: '資材管理', icon: Package },
    { id: 'production', label: '生産実績', icon: Activity },
    { id: 'calendar', label: 'カレンダー', icon: Calendar },
    { id: 'quality', label: '品質管理', icon: AlertTriangle },
  ];
  const tabOrder = data.tabOrder && data.tabOrder.length > 0 ? data.tabOrder : DEFAULT_TAB_ORDER;
  const orderedTabs = [
    ...tabOrder.map((id) => TABS.find((t) => t.id === id)).filter(Boolean),
    ...TABS.filter((t) => !tabOrder.includes(t.id)),
  ];

  return (
    <div className="fm-root" style={{ background: C.bg, color: C.text, borderRadius: 12, padding: 18, minHeight: 400 }}>
      <style>{FONT_STYLE}</style>

      {/* ヘッダー */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', flexWrap: 'wrap', gap: 10, marginBottom: 14 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{ width: 34, height: 34, borderRadius: 8, background: C.tealDim, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <Scissors size={17} color={C.teal} />
          </div>
          <div>
            <div className="fm-display" style={{ fontSize: 22, fontWeight: 700, lineHeight: 1 }}>不織布加工 生産管理 <a href="./" style={{ color: C.teal, fontSize: 12, fontWeight: 500, marginLeft: 8 }}>← LOGI LINK</a></div>
            <div style={{ fontSize: 11, color: C.textFaint, marginTop: 2 }}>資材 → 溶着・裁断 → 検品 → たたみ 工程トラッカー</div>
          </div>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14, flexWrap: 'wrap' }}>
          <div className="fm-mono" style={{ fontSize: 11, color: C.textFaint, display: 'flex', alignItems: 'center', gap: 10 }}>
            <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
              <span style={{
                width: 6, height: 6, borderRadius: 999,
                background: saveStatus === 'saving' ? C.amber : saveStatus === 'error' ? C.red : C.green,
              }} />
              {saveStatus === 'saving' ? '保存中…' : saveStatus === 'error' ? '保存エラー(接続を確認)' : 'クラウドと同期済み'}
            </span>
            <button onClick={loadFromCloud} className="fm-btn" style={{ background: C.panelAlt2, border: `1px solid ${C.border}`, color: C.textDim, borderRadius: 6, padding: '3px 9px', cursor: 'pointer', fontSize: 11 }}>更新</button>
          </div>
          <AuthBar session={session} />
        </div>
      </div>

      {!isEditor && (
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, background: C.panelAlt, border: `1px solid ${C.border}`, borderRadius: 8, padding: '8px 12px', marginBottom: 14, fontSize: 12, color: C.textDim }}>
          <Lock size={13} /> 閲覧のみです(編集できるのは admin と生産管理者のアカウントです)。
        </div>
      )}

      {/* タブ */}
      <div style={{ display: 'flex', gap: 4, borderBottom: `1px solid ${C.border}`, marginBottom: 16, overflowX: 'auto' }}>
        {orderedTabs.map((t) => {
          const active = tab === t.id;
          const Icon = t.icon;
          return (
            <button
              key={t.id}
              className="fm-tab"
              onClick={() => setTab(t.id)}
              style={{
                background: 'transparent', border: 'none', cursor: 'pointer',
                color: active ? C.teal : C.textDim, padding: '8px 12px', fontSize: 13,
                fontWeight: 600, display: 'flex', alignItems: 'center', gap: 6,
                borderBottom: active ? `2px solid ${C.teal}` : '2px solid transparent',
                whiteSpace: 'nowrap',
              }}
            >
              <Icon size={14} /> {t.label}
            </button>
          );
        })}
        <button
          key="settings"
          className="fm-tab"
          onClick={() => setTab('settings')}
          style={{
            background: 'transparent', border: 'none', cursor: 'pointer',
            color: tab === 'settings' ? C.teal : C.textFaint, padding: '8px 12px', fontSize: 13,
            fontWeight: 600, display: 'flex', alignItems: 'center', gap: 6,
            borderBottom: tab === 'settings' ? `2px solid ${C.teal}` : '2px solid transparent',
            whiteSpace: 'nowrap', marginLeft: 'auto',
          }}
        >
          <Settings size={14} /> 設定
        </button>
      </div>

      {tab === 'dashboard' && (
        <DashboardTab data={data} lineById={lineById} orderById={orderById} lotById={lotById} orderStats={orderStats} salesOrderById={salesOrderById} salesOrderStats={salesOrderStats} productById={productById} />
      )}
      {tab === 'products' && (
        <ProductTab data={data} addProduct={addProduct} updateProduct={updateProduct} removeProduct={removeProduct} packSet={packSet} isEditor={isEditor} />
      )}
      {tab === 'salesorders' && (
        <SalesOrderTab data={data} addSalesOrder={addSalesOrder} updateSalesOrder={updateSalesOrder} removeSalesOrder={removeSalesOrder} salesOrderStats={salesOrderStats} productById={productById} isEditor={isEditor} />
      )}
      {tab === 'plan' && (
        <PlanTab data={data} orderStats={orderStats} addOrder={addOrder} updateOrder={updateOrder} removeOrder={removeOrder} lineById={lineById} lotById={lotById} addLine={addLine} removeLine={removeLine} salesOrderById={salesOrderById} productById={productById} isEditor={isEditor} />
      )}
      {tab === 'inventory' && (
        <InventoryTab data={data} addLot={addLot} updateLot={updateLot} removeLot={removeLot} addMaterialTransaction={addMaterialTransaction} removeMaterialTransaction={removeMaterialTransaction} isEditor={isEditor} />
      )}
      {tab === 'production' && (
        <ProductionTab data={data} addRecord={addRecord} updateRecord={updateRecord} removeRecord={removeRecord} lineById={lineById} orderById={orderById} orderStats={orderStats} productById={productById} lotById={lotById} isEditor={isEditor}
          k981Status={k981Status} k981Busy={k981Busy} k981Last={k981Last} pushK981={pushK981} />
      )}
      {tab === 'calendar' && (
        <CalendarTab data={data} lineById={lineById} orderById={orderById} orderStats={orderStats} productById={productById} />
      )}
      {tab === 'quality' && (
        <QualityTab data={data} lineById={lineById} orderById={orderById} />
      )}
      {tab === 'settings' && (
        <>
        <FoldSettings data={data} setFold={setFold} isEditor={isEditor} />
        <K981Settings data={data} setK981={setK981} isEditor={isEditor} />
        <SettingsTab TABS={TABS} tabOrder={tabOrder} updateTabOrder={updateTabOrder} resetTabOrder={resetTabOrder} isEditor={isEditor} />
        </>
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* ダッシュボード                                                       */
/* ------------------------------------------------------------------ */
function DashboardTab({ data, lineById, orderById, lotById, orderStats, salesOrderById, salesOrderStats, productById }) {
  const [date, setDate] = useState(todayStr());
  const todays = data.records.filter((r) => r.date === date);

  const totals = todays.reduce((acc, r) => ({
    machineUp: acc.machineUp + num(r.machineUpQty),
    inspected: acc.inspected + num(r.inspectedQty),
    folded: acc.folded + num(r.foldedQty),
    defect: acc.defect + num(r.defectQty),
  }), { machineUp: 0, inspected: 0, folded: 0, defect: 0 });

  const defectRate = totals.machineUp > 0 ? (totals.defect / totals.machineUp) * 100 : 0;
  const lowStockLots = data.lots.filter((l) => num(l.initialLength) > 0 && num(l.remainingLength) / num(l.initialLength) < 0.2);
  const activeLines = new Set(todays.map((r) => r.lineId)).size;

  const planRows = data.orders.map((o) => ({ o, st: orderStats(o.id) }));
  const completedPlans = planRows.filter(({ o, st }) => o.targetQty > 0 && st.folded >= o.targetQty);
  const completedToday = completedPlans.filter(({ o }) => data.records.some((r) => r.orderId === o.id && r.date === date));

  // 生産計画が未作成の受注(受注はあるがまだ計画に紐づいていないもの)
  const unplannedOrders = data.salesOrders.filter((so) => !data.orders.some((o) => o.salesOrderId === so.id));

  // 納期が近い(7日以内)・または納期超過の未完了計画
  const urgentPlans = planRows
    .filter(({ o, st }) => !(o.targetQty > 0 && st.folded >= o.targetQty))
    .map(({ o, st }) => ({ o, st, daysLeft: daysUntil(planEnd(o)) }))
    .filter(({ daysLeft }) => daysLeft !== null && daysLeft <= 7)
    .sort((a, b) => a.daysLeft - b.daysLeft);

  // 在庫状況(資材・完成品)のサマリー
  const rawMaterialByUnit = data.lots.reduce((map, l) => {
    const label = unitLabel(l.unit);
    map[label] = (map[label] || 0) + num(l.remainingLength);
    return map;
  }, {});
  const rawMaterialSummary = Object.entries(rawMaterialByUnit).map(([u, v]) => `${fmt(v)}${u}`).join(' / ') || '0';

  // 原材料名ごとの内訳(同じ資材名のロットをまとめて集計)
  const rawMaterialByName = Object.values(data.lots.reduce((map, l) => {
    const key = l.materialName || '(名称未設定)';
    if (!map[key]) map[key] = { name: key, remaining: 0, initial: 0, unit: unitLabel(l.unit), lotCount: 0 };
    map[key].remaining += num(l.remainingLength);
    map[key].initial += num(l.initialLength);
    map[key].lotCount += 1;
    return map;
  }, {}));

  // 商品ごとの在庫内訳(資材・完成品)
  const productStockRows = data.products.map((p) => {
    const linkedOrders = data.orders.filter((o) => o.productId === p.id);
    const lotIds = [...new Set(linkedOrders.map((o) => o.lotId).filter(Boolean))];
    const lots = lotIds.map((id) => lotById(id)).filter(Boolean);
    const hasAssociatedSet = !p.isSet && data.products.some((sp) => sp.isSet && sp.setSourceProductId === p.id);
    return { p, lots, hasAssociatedSet };
  });

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
        <span style={{ fontSize: 12, color: C.textDim }}>対象日</span>
        <input type="date" className="fm-input" style={{ width: 160 }} value={date} onChange={(e) => setDate(e.target.value)} />
      </div>

      <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
        <StatCard icon={Factory} label="稼働ライン数" value={activeLines} unit={`/ ${data.lines.length}`} tone="teal" />
        <StatCard icon={CheckCircle2} label="本日の完成数" value={fmt(totals.folded)} unit="枚" tone="teal" />
        <StatCard icon={AlertTriangle} label="不良率" value={defectRate.toFixed(1)} unit="%" tone={defectRate > 5 ? 'red' : 'teal'} />
        <StatCard icon={CheckCircle2} label="完了済み計画" value={completedPlans.length} unit={`/ ${data.orders.length}件`} tone="green" />
      </div>

      {/* 要対応(未計画の受注・納期が近い計画) */}
      {(unplannedOrders.length > 0 || urgentPlans.length > 0) && (
        <Panel style={{ padding: 16, border: `1px solid ${C.amberDim || C.border}` }}>
          <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 10, display: 'flex', alignItems: 'center', gap: 8 }}>
            <AlertTriangle size={16} color={C.amber} /> 要対応
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            {unplannedOrders.length > 0 && (
              <div>
                <div style={{ fontSize: 12, color: C.textDim, marginBottom: 6 }}>生産計画が未作成の受注({unplannedOrders.length}件)</div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                  {unplannedOrders.map((so) => (
                    <div key={so.id} style={{ display: 'flex', alignItems: 'center', gap: 10, fontSize: 13, background: C.panelAlt, borderRadius: 6, padding: '6px 10px', flexWrap: 'wrap' }}>
                      <span style={{ fontWeight: 600 }}>{so.orderNo}</span>
                      <span style={{ color: C.textDim }}>{so.customerName} / {so.productName}</span>
                      <span className="fm-mono" style={{ marginLeft: 'auto', fontSize: 11, color: C.textFaint }}>納期 {so.dueDate}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
            {urgentPlans.length > 0 && (
              <div>
                <div style={{ fontSize: 12, color: C.textDim, marginBottom: 6 }}>納期が近い・超過している未完了の計画({urgentPlans.length}件)</div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                  {urgentPlans.map(({ o, st, daysLeft }) => {
                    const planProduct = o.productId ? productById(o.productId) : null;
                    const unitLabel4 = planProduct?.isSet ? 'セット' : '枚';
                    const overdue = daysLeft < 0;
                    return (
                      <div key={o.id} style={{ display: 'flex', alignItems: 'center', gap: 10, fontSize: 13, background: overdue ? 'rgba(224,90,90,0.08)' : 'rgba(212,163,74,0.08)', borderRadius: 6, padding: '6px 10px', flexWrap: 'wrap' }}>
                        <span style={{ fontWeight: 600 }}>{o.planNo}</span>
                        <span style={{ color: C.textDim }}>{o.productName}</span>
                        <span className="fm-mono" style={{ fontSize: 11, color: C.textFaint }}>{fmt(st.folded)}/{fmt(o.targetQty)}{unitLabel4}</span>
                        <Badge tone={overdue ? 'red' : 'amber'}>{overdue ? `納期${Math.abs(daysLeft)}日超過` : daysLeft === 0 ? '本日納期' : `納期まであと${daysLeft}日`}</Badge>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
        </Panel>
      )}

      {/* 完了済み計画(ひと目でわかるように) */}
      {completedPlans.length > 0 && (
        <Panel style={{ padding: 16, border: `1px solid ${C.greenDim}` }}>
          <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 10, display: 'flex', alignItems: 'center', gap: 8 }}>
            <CheckCircle2 size={16} color={C.green} /> 完了済み計画
            {completedToday.length > 0 && <Badge tone="green">本日 {completedToday.length}件 完了</Badge>}
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            {completedPlans.map(({ o, st }) => {
              const so = salesOrderById(o.salesOrderId);
              const planProduct = o.productId ? productById(o.productId) : null;
              const unitLabel3 = planProduct?.isSet ? 'セット' : '枚';
              return (
                <div key={o.id} style={{ display: 'flex', alignItems: 'center', gap: 10, fontSize: 13, background: 'rgba(79,179,116,0.08)', borderRadius: 6, padding: '6px 10px', flexWrap: 'wrap' }}>
                  <CheckCircle2 size={13} color={C.green} />
                  <span style={{ fontWeight: 600 }}>{o.planNo}</span>
                  <span style={{ color: C.textDim }}>{o.productName}</span>
                  {so && <span style={{ fontSize: 11, color: C.textFaint }}>({so.customerName}向け)</span>}
                  <span className="fm-mono" style={{ marginLeft: 'auto', color: C.green }}>{fmt(st.folded)} / {fmt(o.targetQty)}{unitLabel3}</span>
                </div>
              );
            })}
          </div>
        </Panel>
      )}

      {/* 受注進捗 */}
      <Panel style={{ padding: 16 }}>
        <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 12 }}>受注進捗</div>
        {data.salesOrders.length === 0 ? (
          <div style={{ fontSize: 13, color: C.textFaint }}>受注がまだありません。「受注」タブから登録してください。</div>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {data.salesOrders.map((so) => {
              const st = salesOrderStats(so.id);
              const soProduct = so.productId ? productById(so.productId) : null;
              const progressQty = soProduct?.isSet ? st.setsCompleted : st.folded;
              const unitLabel2 = soProduct?.isSet ? 'セット' : '枚';
              const ratio = pct(progressQty, so.orderedQty);
              const done = progressQty >= so.orderedQty && so.orderedQty > 0;
              return (
                <div key={so.id} style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap', background: done ? 'rgba(79,179,116,0.08)' : C.panelAlt, borderRadius: 8, padding: '8px 12px' }}>
                  <span style={{ fontSize: 13, fontWeight: 600, minWidth: 150, display: 'flex', alignItems: 'center', gap: 6 }}>
                    {done && <CheckCircle2 size={13} color={C.green} />}{so.orderNo} <span style={{ color: C.textDim, fontWeight: 400 }}>{so.customerName}</span>
                  </span>
                  <div style={{ flex: 1, minWidth: 120, maxWidth: 260 }}><ProgressBar ratio={ratio} color={done ? C.green : C.teal} /></div>
                  <span className="fm-mono" style={{ fontSize: 12, color: C.textDim }}>{fmt(progressQty)}/{fmt(so.orderedQty)}{unitLabel2}</span>
                  <span className="fm-mono" style={{ fontSize: 11, color: C.textFaint }}>納期 {so.dueDate}</span>
                </div>
              );
            })}
          </div>
        )}
      </Panel>

      {/* 資材アラート */}
      <Panel style={{ padding: 16 }}>
        <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 10 }}>資材 残量アラート(残20%未満)</div>
        {lowStockLots.length === 0 ? (
          <div style={{ fontSize: 13, color: C.textFaint }}>アラート対象の資材はありません。</div>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {lowStockLots.map((l) => (
              <div key={l.id} style={{ display: 'flex', alignItems: 'center', gap: 10, fontSize: 13 }}>
                <AlertTriangle size={14} color={C.red} />
                <span style={{ minWidth: 160 }}>{l.materialName}<span style={{ color: C.textFaint }}> ({l.lotNo})</span></span>
                <div style={{ flex: 1, maxWidth: 240 }}>
                  <ProgressBar ratio={pct(l.remainingLength, l.initialLength)} color={C.red} />
                </div>
                <span className="fm-mono" style={{ color: C.textDim }}>{fmt(l.remainingLength)} / {fmt(l.initialLength)} {unitLabel(l.unit)}</span>
              </div>
            ))}
          </div>
        )}
      </Panel>

      {/* 在庫状況サマリー(資材・完成品) */}
      <Panel style={{ padding: 16 }}>
        <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 4 }}>在庫状況(資材・完成品)</div>
        <div style={{ fontSize: 12, color: C.textFaint, marginBottom: 12 }}>資材(仕入れた原材料)・完成品(たたみ済みで出荷待ちのもの)の在庫を確認できます。</div>
        {rawMaterialByName.length > 0 && (
          <>
            <div className="fm-display" style={{ fontSize: 13, fontWeight: 600, marginBottom: 8, color: C.textDim }}>資材 残量(原材料別)</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 16 }}>
              {rawMaterialByName.map((m) => {
                const ratio = pct(m.remaining, m.initial);
                const low = ratio < 20;
                return (
                  <div key={m.name} style={{ display: 'flex', alignItems: 'center', gap: 10, fontSize: 13, background: C.panelAlt, borderRadius: 6, padding: '6px 10px' }}>
                    <span style={{ minWidth: 160 }}>{m.name}</span>
                    <span style={{ fontSize: 11, color: C.textFaint, whiteSpace: 'nowrap' }}>{m.lotCount}ロット</span>
                    <div style={{ flex: 1, maxWidth: 220 }}><ProgressBar ratio={ratio} color={low ? C.red : C.teal} /></div>
                    <span className="fm-mono" style={{ marginLeft: 'auto', color: low ? C.red : C.textDim, whiteSpace: 'nowrap' }}>{fmt(m.remaining)} / {fmt(m.initial)} {m.unit}</span>
                  </div>
                );
              })}
            </div>
          </>
        )}
        {data.products.length > 0 && (
          <>
            <div className="fm-display" style={{ fontSize: 13, fontWeight: 600, marginBottom: 8, color: C.textDim }}>在庫状況(商品別)</div>
            <div style={{ overflowX: 'auto' }}>
              <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13, minWidth: 620 }}>
                <thead>
                  <tr style={{ textAlign: 'left', color: C.textDim, borderBottom: `1px solid ${C.border}` }}>
                    {['商品', '保管場所', '資材(紐づくロット)', '完成品在庫'].map((h) => <th key={h} style={{ padding: '6px 8px', fontWeight: 500 }}>{h}</th>)}
                  </tr>
                </thead>
                <tbody>
                  {productStockRows.map(({ p, lots, hasAssociatedSet }) => (
                    <tr key={p.id} style={{ borderBottom: `1px solid ${C.border}` }}>
                      <td style={{ padding: '8px' }}>
                        <span className="fm-mono" style={{ color: C.textFaint, fontSize: 11, marginRight: 6 }}>{p.productCode}</span>
                        {p.productName}
                      </td>
                      <td style={{ padding: '8px', fontSize: 12, color: C.textDim }}>{p.storageLocation || '—'}</td>
                      <td style={{ padding: '8px', fontSize: 12 }}>
                        {lots.length === 0 ? <span style={{ color: C.textFaint }}>—</span> : (
                          <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
                            {lots.map((l) => (
                              <span key={l.id} className="fm-mono" style={{ color: C.textDim }}>
                                {l.lotNo}: {fmt(l.remainingLength)}{unitLabel(l.unit)}
                              </span>
                            ))}
                          </div>
                        )}
                      </td>
                      <td className="fm-mono" style={{ padding: '8px', color: C.green }}>
                        {hasAssociatedSet ? (
                          <span style={{ color: C.textFaint, fontSize: 12 }}>—(セット品で管理)</span>
                        ) : (
                          `${fmt(p.finishedStock)}枚`
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </>
        )}
      </Panel>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* 商品マスタタブ                                                       */
/* ------------------------------------------------------------------ */
function ProductTab({ data, addProduct, updateProduct, removeProduct, packSet, isEditor }) {
  const blankForm = {
    productCode: '', productName: '', spec: '', defaultCustomer: '', materialType: '',
    materialPerUnit: '', speedPerHour: '', minLotQty: '', storageLocation: '', finishedStock: '',
    isSet: false, setSourceProductId: '', piecesPerSet: '',
  };
  const [form, setForm] = useState(blankForm);
  const [editingId, setEditingId] = useState(null);
  const [err, setErr] = useState('');

  const [packProductId, setPackProductId] = useState('');
  const [packQty, setPackQty] = useState('');
  const [packErr, setPackErr] = useState('');

  const startEdit = (p) => {
    setEditingId(p.id);
    setForm({
      productCode: p.productCode, productName: p.productName, spec: p.spec || '',
      defaultCustomer: p.defaultCustomer || '', materialType: p.materialType || '',
      materialPerUnit: String(p.materialPerUnit || ''),
      speedPerHour: String(p.speedPerHour || ''), minLotQty: String(p.minLotQty || ''),
      storageLocation: p.storageLocation || '', finishedStock: String(p.finishedStock ?? '0'),
      isSet: !!p.isSet, setSourceProductId: p.setSourceProductId || '', piecesPerSet: String(p.piecesPerSet || ''),
    });
  };
  const cancelEdit = () => { setEditingId(null); setForm(blankForm); setErr(''); };

  const submit = () => {
    if (!form.productCode || !form.productName) {
      setErr('商品コード・商品名は必須です。');
      return;
    }
    if (form.isSet && (!form.setSourceProductId || !form.piecesPerSet)) {
      setErr('セット品の場合、元になるバラ品と1セットあたりの数量が必須です。');
      return;
    }
    setErr('');
    const payload = {
      ...form,
      materialPerUnit: Number(form.materialPerUnit) || 0,
      speedPerHour: Number(form.speedPerHour) || 0,
      minLotQty: Number(form.minLotQty) || 0,
      finishedStock: Number(form.finishedStock) || 0,
      isSet: !!form.isSet,
      piecesPerSet: form.isSet ? Number(form.piecesPerSet) || 0 : 0,
      setSourceProductId: form.isSet ? form.setSourceProductId : '',
    };
    if (editingId) {
      updateProduct(editingId, payload);
      setEditingId(null);
    } else {
      addProduct(payload);
    }
    setForm(blankForm);
  };

  const setProducts = data.products.filter((p) => p.isSet && p.setSourceProductId);
  const packProduct = data.products.find((p) => p.id === packProductId);
  const packBase = packProduct ? data.products.find((p) => p.id === packProduct.setSourceProductId) : null;
  const requiredForPack = packProduct && packQty ? num(packProduct.piecesPerSet) * Number(packQty) : 0;
  const packInsufficient = packBase && requiredForPack > num(packBase.finishedStock);

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      {isEditor ? (
        <Panel style={{ padding: 16, border: editingId ? `1px solid ${C.teal}` : undefined }}>
          <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 4 }}>{editingId ? '商品を編集' : '商品を登録'}</div>
          <div style={{ fontSize: 12, color: C.textFaint, marginBottom: 12 }}>受注・生産計画から選べる商品台帳です。標準生産速度と資材使用量(原単位)を入れておくと、計画・実績入力で自動計算されます。</div>
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 10 }}>
            <Field label="商品コード"><input className="fm-input" value={form.productCode} onChange={(e) => setForm({ ...form, productCode: e.target.value })} placeholder="PD-004" /></Field>
            <Field label="商品名"><input className="fm-input" value={form.productName} onChange={(e) => setForm({ ...form, productName: e.target.value })} placeholder="例: マスク用シート" /></Field>
            <Field label="規格・サイズ"><input className="fm-input" value={form.spec} onChange={(e) => setForm({ ...form, spec: e.target.value })} placeholder="175mm×95mm" /></Field>
            <Field label="主要得意先"><input className="fm-input" value={form.defaultCustomer} onChange={(e) => setForm({ ...form, defaultCustomer: e.target.value })} placeholder="例: A社" /></Field>
            <Field label="使用原材料"><input className="fm-input" value={form.materialType} onChange={(e) => setForm({ ...form, materialType: e.target.value })} placeholder="PP不織布 20g/m²" /></Field>
            <Field label="資材使用量(1枚あたり)"><input type="number" step="0.001" className="fm-input" value={form.materialPerUnit} onChange={(e) => setForm({ ...form, materialPerUnit: e.target.value })} placeholder="0.05" /></Field>
            <Field label="標準生産速度(枚/時間)"><input type="number" className="fm-input" value={form.speedPerHour} onChange={(e) => setForm({ ...form, speedPerHour: e.target.value })} placeholder="800" /></Field>
            <Field label="最低ロット(枚)"><input type="number" className="fm-input" value={form.minLotQty} onChange={(e) => setForm({ ...form, minLotQty: e.target.value })} placeholder="1000" /></Field>
            <Field label="保管場所"><input className="fm-input" value={form.storageLocation} onChange={(e) => setForm({ ...form, storageLocation: e.target.value })} placeholder="倉庫A-1" /></Field>
            <Field label="完成品在庫(枚)"><input type="number" className="fm-input" value={form.finishedStock} onChange={(e) => setForm({ ...form, finishedStock: e.target.value })} placeholder="0" /></Field>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10, paddingTop: 10, borderTop: `1px dashed ${C.border}` }}>
            <input
              type="checkbox"
              id="isSetCheckbox"
              checked={form.isSet}
              onChange={(e) => setForm({ ...form, isSet: e.target.checked })}
              style={{ width: 16, height: 16 }}
            />
            <label htmlFor="isSetCheckbox" style={{ fontSize: 13, color: C.text, cursor: 'pointer' }}>
              この商品は「セット品」(バラ品を複数まとめたもの)として管理する
            </label>
          </div>
          {form.isSet && (
            <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 10 }}>
              <Field label="元になるバラ品">
                <select className="fm-input" value={form.setSourceProductId} onChange={(e) => setForm({ ...form, setSourceProductId: e.target.value })}>
                  <option value="">選択してください</option>
                  {data.products.filter((p) => !p.isSet && p.id !== editingId).map((p) => <option key={p.id} value={p.id}>{p.productCode} - {p.productName}</option>)}
                </select>
              </Field>
              <Field label="1セットあたりの枚数"><input type="number" className="fm-input" value={form.piecesPerSet} onChange={(e) => setForm({ ...form, piecesPerSet: e.target.value })} placeholder="10" /></Field>
            </div>
          )}
          {form.isSet && (
            <div style={{ fontSize: 11, color: C.textFaint, marginBottom: 8 }}>
              セット品は生産計画には直接紐づけません。バラ品の生産実績が積み上がったら、下の「セットを組む」からバラを消費してセット在庫を作ってください。
            </div>
          )}
          {err && <div style={{ color: C.red, fontSize: 12, marginBottom: 8 }}>{err}</div>}
          <div style={{ display: 'flex', gap: 8 }}>
            <PrimaryButton onClick={submit}>{editingId ? <CheckCircle2 size={14} /> : <Plus size={14} />} {editingId ? '更新を保存' : '商品を登録'}</PrimaryButton>
            {editingId && <PrimaryButton onClick={cancelEdit} style={{ background: C.panelAlt2, color: C.text }}>キャンセル</PrimaryButton>}
          </div>
        </Panel>
      ) : (
        <LockedNotice text="商品の登録・編集にはログインが必要です。" />
      )}

      {setProducts.length > 0 && (
        isEditor ? (
          <Panel style={{ padding: 16 }}>
            <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 4 }}>セットを組む</div>
            <div style={{ fontSize: 12, color: C.textFaint, marginBottom: 12 }}>セット品を選んで数量を入力すると、元になるバラ品の完成品在庫を消費してセット品の完成品在庫を増やします。</div>
            <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 10 }}>
              <Field label="セット品">
                <select className="fm-input" value={packProductId} onChange={(e) => setPackProductId(e.target.value)}>
                  <option value="">選択してください</option>
                  {setProducts.map((p) => <option key={p.id} value={p.id}>{p.productCode} - {p.productName}(1セット={p.piecesPerSet}枚)</option>)}
                </select>
              </Field>
              <Field label="組むセット数"><input type="number" className="fm-input" value={packQty} onChange={(e) => setPackQty(e.target.value)} placeholder="10" /></Field>
            </div>
            {packProduct && packBase && (
              <div style={{ fontSize: 12, color: packInsufficient ? C.red : C.textDim, marginBottom: 8 }}>
                必要なバラ数: {fmt(requiredForPack)}枚(バラ品「{packBase.productName}」の在庫: {fmt(packBase.finishedStock)}枚)
                {packInsufficient && ' — バラの在庫が不足しています'}
              </div>
            )}
            {packErr && <div style={{ color: C.red, fontSize: 12, marginBottom: 8 }}>{packErr}</div>}
            <PrimaryButton
              onClick={() => {
                if (!packProductId || !packQty) {
                  setPackErr('セット品と数量を入力してください。');
                  return;
                }
                if (packInsufficient) {
                  setPackErr('バラの在庫が不足しているため、この数量は組めません。');
                  return;
                }
                setPackErr('');
                packSet(packProductId, Number(packQty));
                setPackQty('');
              }}
            ><CheckCircle2 size={14} /> セットを組む</PrimaryButton>
          </Panel>
        ) : (
          <LockedNotice text="セットを組むにはログインが必要です。" />
        )
      )}

      <Panel style={{ padding: 16, overflowX: 'auto' }}>
        <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 12 }}>商品一覧</div>
        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13, minWidth: 960 }}>
          <thead>
            <tr style={{ textAlign: 'left', color: C.textDim, borderBottom: `1px solid ${C.border}` }}>
              {['商品コード', '商品名', '規格', '主要得意先', '使用原材料', '原単位(1枚)', '生産速度', '最低ロット', '保管場所', '完成品在庫', '区分', ''].map((h) => <th key={h} style={{ padding: '6px 8px', fontWeight: 500 }}>{h}</th>)}
            </tr>
          </thead>
          <tbody>
            {data.products.length === 0 && (
              <tr><td colSpan={12} style={{ padding: 14, color: C.textFaint }}>商品がありません。上のフォームから登録してください。</td></tr>
            )}
            {data.products.map((p) => {
              const base = p.isSet ? data.products.find((b) => b.id === p.setSourceProductId) : null;
              return (
                <tr key={p.id} style={{ borderBottom: `1px solid ${C.border}`, background: p.id === editingId ? C.tealDim + '55' : 'transparent' }}>
                  <td className="fm-mono" style={{ padding: '8px' }}>{p.productCode}</td>
                  <td style={{ padding: '8px' }}>{p.productName}</td>
                  <td style={{ padding: '8px', fontSize: 12, color: C.textDim }}>{p.spec || '—'}</td>
                  <td style={{ padding: '8px', fontSize: 12, color: C.textDim }}>{p.defaultCustomer || '—'}</td>
                  <td style={{ padding: '8px', fontSize: 12, color: C.textDim }}>{p.materialType || '—'}</td>
                  <td className="fm-mono" style={{ padding: '8px' }}>{p.materialPerUnit ? `${p.materialPerUnit}` : '—'}</td>
                  <td className="fm-mono" style={{ padding: '8px' }}>{p.speedPerHour ? `${fmt(p.speedPerHour)}枚/h` : '—'}</td>
                  <td className="fm-mono" style={{ padding: '8px' }}>{p.minLotQty ? `${fmt(p.minLotQty)}枚` : '—'}</td>
                  <td style={{ padding: '8px', fontSize: 12, color: C.textDim }}>{p.storageLocation || '—'}</td>
                  <td className="fm-mono" style={{ padding: '8px' }}>{fmt(p.finishedStock)}枚</td>
                  <td style={{ padding: '8px' }}>
                    {p.isSet ? <Badge tone="amber">セット品({p.piecesPerSet}枚/{base?.productName || '?'})</Badge> : <Badge tone="dim">バラ品</Badge>}
                  </td>
                  <td style={{ padding: '8px', display: 'flex', gap: 2 }}>
                    {isEditor && <IconBtn onClick={() => startEdit(p)} title="編集" icon={Pencil} />}
                    {isEditor && <IconBtn onClick={() => removeProduct(p.id)} title="削除" danger />}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </Panel>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* 受注タブ                                                             */
/* ------------------------------------------------------------------ */
function SalesOrderTab({ data, addSalesOrder, updateSalesOrder, removeSalesOrder, salesOrderStats, productById, isEditor }) {
  const blankForm = { orderNo: '', productId: '', customerName: '', productName: '', orderedQty: '', orderDate: todayStr(), dueDate: '' };
  const [form, setForm] = useState(blankForm);
  const [editingId, setEditingId] = useState(null);
  const [err, setErr] = useState('');

  const customerOptions = useMemo(
    () => [...new Set([...data.products.map((p) => p.defaultCustomer), ...data.salesOrders.map((so) => so.customerName)].filter(Boolean))],
    [data.products, data.salesOrders],
  );

  const selectedProduct = productById(form.productId);

  const startEdit = (so) => {
    setEditingId(so.id);
    setForm({ orderNo: so.orderNo, productId: so.productId || '', customerName: so.customerName, productName: so.productName, orderedQty: String(so.orderedQty), orderDate: so.orderDate, dueDate: so.dueDate });
  };
  const cancelEdit = () => { setEditingId(null); setForm(blankForm); setErr(''); };

  const onPickProduct = (productId) => {
    const p = productById(productId);
    setForm((f) => ({
      ...f,
      productId,
      productName: p ? p.productName : f.productName,
      customerName: p && !f.customerName ? (p.defaultCustomer || f.customerName) : f.customerName,
    }));
  };

  const submit = () => {
    if (!form.orderNo || !form.customerName || !form.productName || !form.orderedQty || !form.dueDate) {
      setErr('受注番号・得意先名・製品名・受注数量・納期は必須です。');
      return;
    }
    setErr('');
    if (editingId) {
      updateSalesOrder(editingId, { ...form, orderedQty: Number(form.orderedQty) });
      setEditingId(null);
    } else {
      addSalesOrder({ ...form, orderedQty: Number(form.orderedQty) });
    }
    setForm(blankForm);
  };

  const withStatus = data.salesOrders.map((so) => {
    const linkedPlans = data.orders.filter((o) => o.salesOrderId === so.id);
    const st = salesOrderStats(so.id);
    const soProduct = so.productId ? productById(so.productId) : null;
    const progressQty = soProduct?.isSet ? st.setsCompleted : st.folded;
    const status = progressQty >= so.orderedQty && so.orderedQty > 0 ? '完了' : linkedPlans.length > 0 ? '計画中' : '未計画';
    return { so, linkedPlans, st, status, progressQty, soProduct };
  });
  const sorted = [...withStatus].sort((a, b) => (a.status === '完了') - (b.status === '完了'));

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      {isEditor ? (
        <Panel style={{ padding: 16, border: editingId ? `1px solid ${C.teal}` : undefined }}>
          <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 4 }}>{editingId ? '受注を編集' : '受注を入力'}</div>
          <div style={{ fontSize: 12, color: C.textFaint, marginBottom: 12 }}>お客様からの注文をここに登録します。この後「生産計画」タブでラインへの割り当てを行います。</div>
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 10 }}>
            <Field label="受注番号"><input className="fm-input" value={form.orderNo} onChange={(e) => setForm({ ...form, orderNo: e.target.value })} placeholder="SO-0004" /></Field>
            <Field label="商品(商品マスタから選択)">
              <select className="fm-input" value={form.productId} onChange={(e) => onPickProduct(e.target.value)}>
                <option value="">選択しない(自由入力)</option>
                {data.products.map((p) => <option key={p.id} value={p.id}>{p.productCode} - {p.productName}</option>)}
              </select>
            </Field>
            <Field label="得意先名">
              <input list="customer-options" className="fm-input" value={form.customerName} onChange={(e) => setForm({ ...form, customerName: e.target.value })} placeholder="例: D社" />
              <datalist id="customer-options">
                {customerOptions.map((c) => <option key={c} value={c} />)}
              </datalist>
            </Field>
            <Field label="製品名">
              <input
                className="fm-input"
                value={form.productName}
                disabled={!!form.productId}
                onChange={(e) => setForm({ ...form, productName: e.target.value })}
                placeholder="例: マスク用シート"
                style={form.productId ? { opacity: 0.65, cursor: 'not-allowed' } : undefined}
              />
            </Field>
            <Field label={selectedProduct?.isSet ? '受注数量(セット)' : '受注数量(枚)'}>
              <input type="number" className="fm-input" value={form.orderedQty} onChange={(e) => setForm({ ...form, orderedQty: e.target.value })} placeholder={selectedProduct?.isSet ? '20' : '5000'} />
            </Field>
            <Field label="受注日"><input type="date" className="fm-input" value={form.orderDate} onChange={(e) => setForm({ ...form, orderDate: e.target.value })} /></Field>
            <Field label="納期"><input type="date" className="fm-input" value={form.dueDate} onChange={(e) => setForm({ ...form, dueDate: e.target.value })} /></Field>
          </div>
          {form.productId && (
            <div style={{ fontSize: 11, color: C.textFaint, marginBottom: 8 }}>製品名は商品マスタから自動入力されています。変更したい場合は「選択しない(自由入力)」に戻してください。</div>
          )}
          {selectedProduct?.isSet && (
            <div style={{ fontSize: 11, color: C.teal, marginBottom: 8 }}>
              📦 この商品はセット品(1セット={fmt(selectedProduct.piecesPerSet)}枚)です。受注数量は「セットの数」で入力してください。生産計画にはバラ換算した枚数が自動で入ります。
            </div>
          )}
          {form.productId && Number(form.orderedQty) > 0 && !selectedProduct?.isSet && productById(form.productId)?.minLotQty > Number(form.orderedQty) && (
            <div style={{ color: C.amber, fontSize: 12, marginBottom: 8 }}>⚠ この商品の最低ロット({fmt(productById(form.productId).minLotQty)}枚)を下回っています。</div>
          )}
          {err && <div style={{ color: C.red, fontSize: 12, marginBottom: 8 }}>{err}</div>}
          <div style={{ display: 'flex', gap: 8 }}>
            <PrimaryButton onClick={submit}>{editingId ? <CheckCircle2 size={14} /> : <Plus size={14} />} {editingId ? '更新を保存' : '受注を追加'}</PrimaryButton>
            {editingId && <PrimaryButton onClick={cancelEdit} style={{ background: C.panelAlt2, color: C.text }}>キャンセル</PrimaryButton>}
          </div>
        </Panel>
      ) : (
        <LockedNotice text="受注の入力にはログインが必要です。" />
      )}

      <Panel style={{ padding: 16, overflowX: 'auto' }}>
        <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 12 }}>受注一覧</div>
        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13, minWidth: 780 }}>
          <thead>
            <tr style={{ textAlign: 'left', color: C.textDim, borderBottom: `1px solid ${C.border}` }}>
              {['受注番号', '得意先', '品番', '製品名', '受注数量', '進捗(完成/受注)', '納期', '状態', ''].map((h) => <th key={h} style={{ padding: '6px 8px', fontWeight: 500 }}>{h}</th>)}
            </tr>
          </thead>
          <tbody>
            {sorted.length === 0 && (
              <tr><td colSpan={9} style={{ padding: 14, color: C.textFaint }}>受注がありません。上のフォームから追加してください。</td></tr>
            )}
            {sorted.map(({ so, linkedPlans, st, status, progressQty, soProduct }) => {
              const ratio = pct(progressQty, so.orderedQty);
              const unitLabel2 = soProduct?.isSet ? 'セット' : '枚';
              const tone = status === '完了' ? 'green' : status === '計画中' ? 'teal' : 'dim';
              return (
                <tr key={so.id} style={{ borderBottom: `1px solid ${C.border}`, background: so.id === editingId ? C.tealDim + '55' : status === '完了' ? C.greenDim + '33' : 'transparent' }}>
                  <td className="fm-mono" style={{ padding: '8px' }}>{so.orderNo}</td>
                  <td style={{ padding: '8px' }}>{so.customerName}</td>
                  <td className="fm-mono" style={{ padding: '8px', fontSize: 12, color: C.textDim }}>{soProduct?.productCode || '—'}</td>
                  <td style={{ padding: '8px' }}>{so.productName}</td>
                  <td className="fm-mono" style={{ padding: '8px' }}>{fmt(so.orderedQty)}{unitLabel2}</td>
                  <td style={{ padding: '8px', minWidth: 170 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <div style={{ flex: 1 }}><ProgressBar ratio={ratio} color={status === '完了' ? C.green : C.teal} /></div>
                      <span className="fm-mono" style={{ fontSize: 11, color: C.textDim, whiteSpace: 'nowrap' }}>{fmt(progressQty)}/{fmt(so.orderedQty)}{unitLabel2}</span>
                    </div>
                    {linkedPlans.length === 0 && <div style={{ fontSize: 11, color: C.amber, marginTop: 4 }}>⚠ 生産計画が未作成です</div>}
                  </td>
                  <td className="fm-mono" style={{ padding: '8px' }}>{so.dueDate}</td>
                  <td style={{ padding: '8px' }}>
                    <Badge tone={tone}>{status === '完了' ? <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}><CheckCircle2 size={11} />完了</span> : status}</Badge>
                  </td>
                  <td style={{ padding: '8px', display: 'flex', gap: 2 }}>
                    {isEditor && <IconBtn onClick={() => startEdit(so)} title="編集" icon={Pencil} />}
                    {isEditor && <IconBtn onClick={() => removeSalesOrder(so.id)} title="削除" danger />}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </Panel>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* 生産計画タブ                                                         */
/* ------------------------------------------------------------------ */
function PlanTab({ data, orderStats, addOrder, updateOrder, removeOrder, lineById, lotById, addLine, removeLine, salesOrderById, productById, isEditor }) {
  const blankForm = { planNo: '', salesOrderId: '', productId: '', productName: '', lineId: data.lines[0]?.id || '', lotId: '', targetQty: '', startDate: todayStr(), dueDate: '' };
  const [form, setForm] = useState(blankForm);
  const [editingId, setEditingId] = useState(null);
  const [newLine, setNewLine] = useState('');
  const [err, setErr] = useState('');

  const startEdit = (o) => {
    setEditingId(o.id);
    setForm({
      planNo: o.planNo, salesOrderId: o.salesOrderId || '', productId: o.productId || '', productName: o.productName,
      lineId: o.lineId, lotId: o.lotId || '', targetQty: String(o.targetQty),
      startDate: planStart(o), dueDate: planEnd(o),
    });
  };
  const cancelEdit = () => { setEditingId(null); setForm(blankForm); setErr(''); };

  const submit = () => {
    if (!form.planNo || !form.productName || !form.lineId || !form.targetQty || !form.startDate || !form.dueDate) {
      setErr('計画番号・製品名・ライン・目標数量・開始日・終了日(納期)は必須です。');
      return;
    }
    if (form.startDate > form.dueDate) {
      setErr('開始日は終了日(納期)より前の日付にしてください。');
      return;
    }
    setErr('');
    if (editingId) {
      updateOrder(editingId, { ...form, targetQty: Number(form.targetQty) });
      setEditingId(null);
    } else {
      addOrder({ ...form, targetQty: Number(form.targetQty) });
    }
    setForm(blankForm);
  };

  const onPickSalesOrder = (soId) => {
    const so = salesOrderById(soId);
    if (!so) {
      setForm((f) => ({ ...f, salesOrderId: soId }));
      return;
    }
    const soProduct = so.productId ? productById(so.productId) : null;
    let targetProductId = so.productId || '';
    let targetProductName = so.productName;
    let targetQty = so.orderedQty;
    if (soProduct && soProduct.isSet && soProduct.setSourceProductId) {
      const baseProduct = productById(soProduct.setSourceProductId);
      if (baseProduct) {
        targetProductId = baseProduct.id;
        targetProductName = baseProduct.productName;
        targetQty = num(soProduct.piecesPerSet) * num(so.orderedQty);
      }
    }
    setForm((f) => ({
      ...f,
      salesOrderId: soId,
      productId: targetProductId || f.productId,
      productName: targetProductName || f.productName,
      targetQty: targetQty ? String(targetQty) : f.targetQty,
      dueDate: so.dueDate || f.dueDate,
    }));
  };

  const onPickProduct = (productId) => {
    const p = productById(productId);
    setForm((f) => ({
      ...f,
      productId,
      productName: p ? p.productName : f.productName,
    }));
  };

  const selectedProduct = productById(form.productId);
  const linkedSalesOrder = salesOrderById(form.salesOrderId);
  const linkedSOProduct = linkedSalesOrder?.productId ? productById(linkedSalesOrder.productId) : null;
  const sortedLots = useMemo(() => {
    if (!selectedProduct) return data.lots;
    return [...data.lots].sort((a, b) => {
      const aMatch = a.materialName === selectedProduct.materialType ? 0 : 1;
      const bMatch = b.materialName === selectedProduct.materialType ? 0 : 1;
      return aMatch - bMatch;
    });
  }, [data.lots, selectedProduct]);
  const estimatedHours = selectedProduct && selectedProduct.speedPerHour > 0 && Number(form.targetQty) > 0
    ? Number(form.targetQty) / selectedProduct.speedPerHour
    : null;
  const belowMinLot = selectedProduct && selectedProduct.minLotQty > 0 && Number(form.targetQty) > 0 && Number(form.targetQty) < selectedProduct.minLotQty;

  const requiredMaterial = selectedProduct && selectedProduct.materialPerUnit > 0 && Number(form.targetQty) > 0
    ? Number(form.targetQty) * selectedProduct.materialPerUnit
    : null;
  const selectedLot = lotById(form.lotId);
  const insufficientStock = requiredMaterial !== null && selectedLot && requiredMaterial > num(selectedLot.remainingLength);

  const rows = data.orders.map((o) => {
    const st = orderStats(o.id);
    const status = st.folded >= o.targetQty && o.targetQty > 0 ? '完了' : st.machineUp > 0 ? '仕掛中' : '未着手';
    return { o, st, status };
  });
  const sortedRows = [...rows].sort((a, b) => (a.status === '完了') - (b.status === '完了'));
  const completedCount = rows.filter((r) => r.status === '完了').length;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      {isEditor ? (
        <Panel style={{ padding: 16, border: editingId ? `1px solid ${C.teal}` : undefined }}>
          <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 4 }}>{editingId ? '生産計画を編集' : '生産計画を追加'}</div>
          <div style={{ fontSize: 12, color: C.textFaint, marginBottom: 12 }}>受注に対してライン・資材・目標数量・生産期間を割り当てます。受注と紐づけない在庫生産もOK。</div>
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 10 }}>
            <Field label="紐づく受注(任意)">
              <select className="fm-input" value={form.salesOrderId} onChange={(e) => onPickSalesOrder(e.target.value)}>
                <option value="">受注と紐づけない</option>
                {data.salesOrders.map((so) => <option key={so.id} value={so.id}>{so.orderNo} - {so.customerName} / {so.productName}</option>)}
              </select>
            </Field>
            <Field label="計画番号"><input className="fm-input" value={form.planNo} onChange={(e) => setForm({ ...form, planNo: e.target.value })} placeholder="MO-0004" /></Field>
            <Field label="商品(任意)">
              <select className="fm-input" value={form.productId} onChange={(e) => onPickProduct(e.target.value)}>
                <option value="">選択しない</option>
                {data.products.map((p) => <option key={p.id} value={p.id}>{p.productCode} - {p.productName}{p.isSet ? '(セット品)' : ''}</option>)}
              </select>
            </Field>
            <Field label="製品名">
              <input
                className="fm-input"
                value={form.productName}
                disabled={!!form.productId}
                onChange={(e) => setForm({ ...form, productName: e.target.value })}
                placeholder="例: マスク用シート"
                style={form.productId ? { opacity: 0.65, cursor: 'not-allowed' } : undefined}
              />
            </Field>
            <Field label="ライン">
              <select className="fm-input" value={form.lineId} onChange={(e) => setForm({ ...form, lineId: e.target.value })}>
                {data.lines.map((l) => <option key={l.id} value={l.id}>{l.name}</option>)}
              </select>
            </Field>
            <Field label="使用資材(任意)">
              <select className="fm-input" value={form.lotId} onChange={(e) => setForm({ ...form, lotId: e.target.value })}>
                <option value="">未指定</option>
                {sortedLots.map((l) => (
                  <option key={l.id} value={l.id}>
                    {l.lotNo} ({l.materialName}){selectedProduct && l.materialName === selectedProduct.materialType ? ' ★推奨' : ''}
                  </option>
                ))}
              </select>
            </Field>
            <Field label={selectedProduct?.isSet ? '目標数量(セット)' : '目標数量(枚)'}>
              <input type="number" className="fm-input" value={form.targetQty} onChange={(e) => setForm({ ...form, targetQty: e.target.value })} placeholder={selectedProduct?.isSet ? '500' : '5000'} />
            </Field>
            <Field label="開始日"><input type="date" className="fm-input" value={form.startDate} onChange={(e) => setForm({ ...form, startDate: e.target.value })} /></Field>
            <Field label="終了日(納期)"><input type="date" className="fm-input" value={form.dueDate} onChange={(e) => setForm({ ...form, dueDate: e.target.value })} /></Field>
          </div>
          {form.productId && (
            <div style={{ fontSize: 11, color: C.textFaint, marginBottom: 8 }}>製品名は商品マスタから自動入力されています。変更したい場合は「選択しない」に戻してください。</div>
          )}
          {linkedSOProduct?.isSet && (
