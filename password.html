<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>パスワードの変更 | LOGI LINK</title>
<style>
:root{ --bg:#F2F4F7; --panel:#fff; --line:#D0D5DD; --text:#101828; --sub:#667085; --accent:#101828; --ok:#067647; --ng:#B42318; }
@media (prefers-color-scheme: dark){ :root{ --bg:#0C111D; --panel:#161B26; --line:#333741; --text:#F5F5F6; --sub:#94969C; --accent:#F5F5F6; --ok:#47CD89; --ng:#F97066; } }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif; }
.wrap{ max-width:420px; margin:40px auto; padding:0 16px; }
.panel{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px; }
h1{ font-size:20px; margin:0 0 6px; }
.hint{ font-size:12px; color:var(--sub); margin:0 0 16px; line-height:1.6; }
label{ display:block; font-size:12px; color:var(--sub); margin:0 0 4px; }
input{ width:100%; border:1px solid var(--line); border-radius:8px; padding:10px; font-size:15px; margin:0 0 12px; background:var(--panel); color:var(--text); }
button{ width:100%; border:none; border-radius:8px; padding:12px; font-size:15px; font-weight:700; background:var(--accent); color:var(--bg); cursor:pointer; }
button:disabled{ opacity:.5; cursor:default; }
.msg{ font-size:13px; margin:0 0 12px; line-height:1.6; }
.msg.ng{ color:var(--ng); } .msg.ok{ color:var(--ok); font-weight:700; }
.links{ font-size:12px; margin-top:14px; color:var(--sub); }
.links a{ color:inherit; }
</style>
</head>
<body>
<div class="wrap"><div class="panel">
  <h1>パスワードの変更</h1>
  <p class="hint">LOGI LINK・生産管理のアカウントのパスワードを変えます。いまのパスワードと、新しいパスワード(8文字以上)を入れてください。<br>この画面で変えても、ほかの端末のログインはそのままです。次にログインするときから新しいパスワードを使います。</p>
  <form id="f" autocomplete="on" novalidate>
    <div id="msg" class="msg" role="status"></div>
    <label for="email">メールアドレス</label>
    <input type="email" id="email" name="email" autocomplete="username" required>
    <label for="cur">いまのパスワード</label>
    <input type="password" id="cur" name="current-password" autocomplete="current-password" required>
    <label for="pw1">新しいパスワード(8文字以上)</label>
    <input type="password" id="pw1" name="new-password" autocomplete="new-password" required>
    <label for="pw2">新しいパスワード(もう一度)</label>
    <input type="password" id="pw2" autocomplete="new-password" required>
    <button type="submit" id="btn">パスワードを変える</button>
  </form>
  <div class="links"><a href="index.html">LOGI LINK を開く</a> ・ <a href="factory.html">生産管理を開く</a></div>
</div></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var MIN = 8;
  var f = document.getElementById('f'), msg = document.getElementById('msg'), btn = document.getElementById('btn');
  var q = new URLSearchParams(location.search);
  if(q.get('email')) document.getElementById('email').value = q.get('email');
  function show(text, ok){ msg.textContent = text; msg.className = 'msg '+(ok ? 'ok' : 'ng'); }
  f.addEventListener('submit', async function(ev){
    ev.preventDefault();
    var email = document.getElementById('email').value.trim().toLowerCase();
    var cur = document.getElementById('cur').value, pw1 = document.getElementById('pw1').value, pw2 = document.getElementById('pw2').value;
    if(!email || !cur || !pw1 || !pw2) return show('すべての欄を入れてください。');
    if(pw1.length<MIN) return show('新しいパスワードは'+MIN+'文字以上にしてください。');
    if(pw1!==pw2) return show('新しいパスワードが2つの欄で違います。');
    if(pw1===cur) return show('新しいパスワードは、いまのパスワードと違うものにしてください。');
    var cfg = window.SUPABASE_CONFIG || {};
    if(!window.supabase || !cfg.url) return show('接続の準備ができていません。画面を開き直してください。');
    btn.disabled = true; show('変更しています…', true);
    // この画面だけの接続(端末のログインには触れない。ログインはこの画面の中だけで終わる)
    var c = window.supabase.createClient(cfg.url, cfg.anonKey, { auth: { persistSession:false, autoRefreshToken:false, detectSessionInUrl:false, storageKey:'logilink-password-change' } });
    try{
      var r = await c.auth.signInWithPassword({ email: email, password: cur });
      if(r.error){
        var m = String(r.error.message||'').toLowerCase();
        show(m.indexOf('invalid')!==-1 ? 'メールアドレスか、いまのパスワードが正しくありません。' : 'ログインできませんでした: '+r.error.message);
        return;
      }
      var u = await c.auth.updateUser({ password: pw1 });
      if(u.error){
        var um = String(u.error.message||'').toLowerCase();
        show(um.indexOf('different')!==-1 ? '新しいパスワードは、いまのパスワードと違うものにしてください。' : (um.indexOf('weak')!==-1 || um.indexOf('least')!==-1) ? '新しいパスワードが簡単すぎます。長く・数字や記号も入れてください。' : '変更できませんでした: '+u.error.message);
        return;
      }
      f.reset();
      if(q.get('email')) document.getElementById('email').value = email;
      show('✅ パスワードを変えました。次にログインするときから、新しいパスワードを使ってください。', true);
    }catch(e){
      show('変更できませんでした。通信の状態を確かめて、もう一度お試しください。');
    }finally{
      try{ await c.auth.signOut({ scope:'local' }); }catch(e){}
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
