function renderSubcatProductivity(agg, workVolume){
  var taskIds = Object.keys(agg.perTask).filter(function(tid){
    var info = agg.perTask[tid];
    return info.subMs && Object.keys(info.subMs).some(function(k){ return info.subMs[k]>0; });
  });
  if(!taskIds.length) return '';
  var rows = [];
  taskIds.forEach(function(tid){
    var t = taskById(tid);
    var info = agg.perTask[tid];
    var wvTotals = workVolume ? wvTotalsForTask(workVolume, tid) : null;
    var cfg = taskById(tid);
    var primaryLabel = (cfg && cfg.taskKind==='vc') ? 'PO' : '件数';
    Object.keys(info.subMs).filter(function(k){ return info.subMs[k]>0; }).forEach(function(scName){
      var hours = info.subMs[scName]/3600000;
      var ratioCells = '';
      if(wvTotals && hours>0){
        ratioCells = '<td class="num">'+(wvTotals.lineCount/hours).toFixed(1)+' 明細/時</td>'+
          '<td class="num">'+(wvTotals.totalQty/hours).toFixed(1)+' ピース/時</td>'+
          '<td class="num">'+(wvTotals.primaryCount/hours).toFixed(1)+' '+primaryLabel+'/時</td>';
      }else{
        ratioCells = '<td class="num" colspan="3" style="color:var(--slate-500);">CSV作業量が未取込のため計算できません</td>';
      }
      rows.push('<tr><td><span class="task-color-dot" style="background:'+t.color+'"></span> '+esc(t.name)+'</td><td>'+esc(scName)+'</td><td class="num">'+fmtHM(info.subMs[scName])+'</td>'+ratioCells+'</tr>');
    });
  });
  return '<div class="report-section-title">内訳別 人時・生産性</div>'+
    '<div class="report-range-note">内訳(ピッキング・梱包など)ごとの人時と、CSVで取り込んだ作業量(明細・ピース・件数/PO)を組み合わせた生産性です。同じ作業量を各内訳の工程が処理したものとして計算しています。</div>'+
    '<table class="report-table"><thead><tr><th>作業</th><th>内訳</th><th>人時</th><th colspan="3">1時間あたり</th></tr></thead><tbody>'+rows.join('')+'</tbody></table>';
}
function renderProductivityRanking(agg){
  var staffIds = Object.keys(agg.perStaff).filter(function(sid){
    var info = agg.perStaff[sid];
    var workMs = info.ms - (info.breakMs||0);
    return workMs > 0;
  }).sort(function(a,b){
    var infoA = agg.perStaff[a], infoB = agg.perStaff[b];
    var rateA = infoA.qty / ((infoA.ms - (infoA.breakMs||0))/3600000);
    var rateB = infoB.qty / ((infoB.ms - (infoB.breakMs||0))/3600000);
    return rateB - rateA;
  });
  if(!staffIds.length) return '';
  var rows = staffIds.map(function(sid, idx){
    var s = staffById(sid);
    var info = agg.perStaff[sid];
    var workMs = info.ms - (info.breakMs||0);
    var rate = info.qty / (workMs/3600000);
    return '<tr><td class="num">'+(idx+1)+'</td><td>'+esc(s.name)+'</td><td class="num"><b style="color:var(--rust-600);font-family:var(--font-mono);">'+rate.toFixed(1)+'</b> 件/時</td><td class="num">'+info.qty+'件</td><td class="num">'+fmtHM(workMs)+'</td></tr>';
  }).join('');
  return '<div class="report-section-title">生産性ランキング(実働1時間あたりの件数)</div>'+
    '<div class="report-range-note">休憩時間は除いた実働時間で計算しています。作業に内訳(件数)がある場合のみ対象です。</div>'+
    '<table class="report-table"><thead><tr><th>順位</th><th>名前</th><th>1時間あたり</th><th>合計件数</th><th>実働時間</th></tr></thead><tbody>'+rows+'</tbody></table>';
}
function csvEscape(v){
  var s = String(v==null?'':v);
  if(/[",\n]/.test(s)) s = '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function downloadJSON(filename, obj){
  var json = JSON.stringify(obj, null, 2);
  var blob = new Blob([json], {type:'application/json;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ if(a.parentNode) a.parentNode.removeChild(a); URL.revokeObjectURL(url); }, 200);
}
async function downloadBackupForDate(dateStr){
  var day = await loadDayByDate(dateStr);
  var wv = await getWorkVolumeForDate(dateStr);
  var caseLedger = await loadVcCaseLedger(dateStr);
  var bundle = { date: dateStr, exportedAt: new Date().toISOString(), day: day, workVolume: wv, vcCaseLedger: caseLedger };
  downloadJSON(dateStr+'_backup.json', bundle);

  var logRows = [['スタッフ','作業','内訳(終了時点)','開始時刻','終了時刻','件数']];
  (day.logs||[]).forEach(function(l){
    logRows.push([staffById(l.staffId).name, taskById(l.taskId).name, l.activeSubcat||'', l.start, l.end||'(作業中)', l.quantity!=null?l.quantity:'']);
  });
  downloadCSV(dateStr+'_作業時間実績.csv', logRows);

  var wvRows = [['取込日時','ファイル名','作業','件数またはPO数','明細数','ピース数','状態']];
  (wv.imports||[]).forEach(function(imp){
    wvRows.push([imp.importedAt, imp.fileName, taskById(imp.taskId).name, imp.primaryCount, imp.lineCount, imp.totalQty, imp.deletedAt?'削除済み':'有効']);
  });
  downloadCSV(dateStr+'_CSV取込履歴と作業量.csv', wvRows);

  var caseRows = [['作業','日時','加算数','担当者','状態','取消理由']];
  Object.keys(caseLedger).forEach(function(taskId){
    (caseLedger[taskId].entries||[]).forEach(function(e){
      var actorName = staffById(e.actor) ? staffById(e.actor).name : '';
      caseRows.push([taskById(taskId).name, e.at, e.delta, actorName, e.reversedAt?'取消済み':'有効', e.reverseReason||'']);
    });
  });
  downloadCSV(dateStr+'_VCケース数履歴.csv', caseRows);
}
function downloadCSV(filename, rows){
  var csv = '\uFEFF'+rows.map(function(r){ return r.map(csvEscape).join(','); }).join('\r\n');
  var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ if(a.parentNode) a.parentNode.removeChild(a); URL.revokeObjectURL(url); }, 200);
}
function exportAggCSV(agg, label){
  var rows = [];
  rows.push(['スタッフ別']);
  rows.push(['名前','合計時間(分)','実働時間(分)','合計件数','時間あたり件数']);
  Object.keys(agg.perStaff).forEach(function(sid){
    var s = staffById(sid);
    var info = agg.perStaff[sid];
    var workMs = info.ms - (info.breakMs||0);
    var rate = workMs>0 ? (info.qty/(workMs/3600000)).toFixed(1) : '';
    rows.push([s.name, Math.round(info.ms/60000), Math.round(workMs/60000), info.qty, rate]);
  });
  rows.push([]);
  rows.push(['作業別']);
  rows.push(['作業名','合計時間(分)','合計件数','稼働人数','内訳']);
  Object.keys(agg.perTask).forEach(function(tid){
    var t = taskById(tid);
    var info = agg.perTask[tid];
    var unitMap = subcatUnitMap(t);
    var bdKeys = Object.keys(info.breakdown||{}).filter(function(k){ return info.breakdown[k]>0; });
    var bdStr = bdKeys.map(function(k){ return k+':'+info.breakdown[k]+(unitMap[k]||t.unit); }).join(' / ');
    var hasSubcats = t.subcategories && t.subcategories.length;
    var unitGroups = hasSubcats ? unitGroupedTotals(info.breakdown, t) : [];
    var qtyForCsv = hasSubcats ? formatUnitGroupedTotals(unitGroups, false) : info.qty;
    rows.push([t.name, Math.round(info.ms/60000), qtyForCsv, Object.keys(info.staff).length, bdStr]);
  });
  downloadCSV('集計_'+label+'.csv', rows);
}

/* ---------- RPG-style lifetime achievements ---------- */
/* ---------- Achievements (実績) data helpers ---------- */
function isPieceUnit(unit){
  return unit==='ピース' || unit==='個';
}
function isCountUnit(unit){
  return unit==='件';
}
function freshCategoryBucket(){
  return { pieces:0, count:0, other:{}, logCount:0 };
}
function addQtyToBucket(bucket, unit, v){
  if(v<=0) return;
  if(isPieceUnit(unit)) bucket.pieces += v;
  else if(isCountUnit(unit)) bucket.count += v;
  else bucket.other[unit] = (bucket.other[unit]||0) + v;
}
function classifyDayIntoBuckets(day, buckets){
  if(!day) return;
  day.logs.forEach(function(l){
    if(l.taskId==='BREAK') return;
    var task = taskById(l.taskId);
    var cat = taskCategory(task);
    if(!buckets[cat]) buckets[cat] = freshCategoryBucket();
    buckets[cat].logCount++;
    if(l.breakdown){
      var unitMap = subcatUnitMap(task);
      Object.keys(l.breakdown).forEach(function(k){
        addQtyToBucket(buckets[cat], unitMap[k]||task.unit, l.breakdown[k]||0);
      });
    }else if(l.quantity){
      addQtyToBucket(buckets[cat], task.unit, l.quantity);
    }
  });
}
function aggregateBucketsForDays(days){
  var buckets = {};
  (days||[]).forEach(function(day){ classifyDayIntoBuckets(day, buckets); });
  return buckets;
}
function monthKeyOf(dateStr){ return dateStr.slice(0,7); }
function aggregateByMonth(days){
  var byMonth = {};
  (days||[]).forEach(function(day){
    if(!day) return;
    var mk = monthKeyOf(day.date);
    if(!byMonth[mk]) byMonth[mk] = {};
    classifyDayIntoBuckets(day, byMonth[mk]);
  });
  return byMonth;
}
function shipmentPieces(buckets){
  return (buckets && buckets['出荷']) ? buckets['出荷'].pieces : 0;
}
async function runAchievementsReport(){
  state.achievementsLoading = true;
  state.achievementsError = null;
  render();
  try{
    var allDays = await loadAllDaysForLifetime();
    var byMonth = aggregateByMonth(allDays);
    var now = new Date();
    var curMonthKey = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
    var curBuckets = byMonth[curMonthKey] || {};

    var bestMonthKey = null, bestPieces = 0;
    Object.keys(byMonth).forEach(function(mk){
      if(mk===curMonthKey) return;
      var p = shipmentPieces(byMonth[mk]);
      if(p>bestPieces){ bestPieces=p; bestMonthKey=mk; }
    });

    var lastYearKey = (now.getFullYear()-1)+'-'+String(now.getMonth()+1).padStart(2,'0');
    var lastYearBuckets = byMonth[lastYearKey] || null;

    var dailyPieces = {};
    var bestDay = null, bestDayPieces = 0;
    allDays.forEach(function(day){
      if(!day || monthKeyOf(day.date)!==curMonthKey) return;
      var b = {};
      classifyDayIntoBuckets(day, b);
      var p = shipmentPieces(b);
      dailyPieces[day.date] = p;
      if(p>bestDayPieces){ bestDayPieces=p; bestDay=day.date; }
    });

    state.achievementsResult = {
      generatedAt: Date.now(),
      curMonthKey: curMonthKey,
      curBuckets: curBuckets,
      bestMonthKey: bestMonthKey,
      bestPieces: bestPieces,
      lastYearKey: lastYearKey,
      lastYearBuckets: lastYearBuckets,
      dailyPieces: dailyPieces,
      bestDay: bestDay,
      bestDayPieces: bestDayPieces,
      dayCount: allDays.length
    };
  }catch(e){
    state.achievementsError = 'データの読み込みに失敗しました。もう一度お試しください。';
  }
  state.achievementsLoading = false;
  render();
}
function formatNum(n){
  return Math.round(n||0).toLocaleString('ja-JP');
}
function monthLabel(monthKey){
  if(!monthKey) return '';
  var parts = monthKey.split('-');
  return parts[0]+'年'+parseInt(parts[1],10)+'月';
}
function dateLabelShort(dateStr){
  if(!dateStr) return '';
  var d = new Date(dateStr+'T00:00:00');
  return (d.getMonth()+1)+'月'+d.getDate()+'日';
}
function todaysBuckets(){
  var b = {};
  if(state.day) classifyDayIntoBuckets(state.day, b);
  return b;
}
function todaysTaskDetail(){
  var details = {};
  if(!state.day) return details;
  state.day.logs.forEach(function(l){
    if(l.taskId==='BREAK') return;
    var task = taskById(l.taskId);
    var cat = taskCategory(task);
    if(!details[l.taskId]) details[l.taskId] = { name: task.name, category: cat, pieces:0, count:0, other:{}, sessions:0, staffIds:{} };
    var d = details[l.taskId];
    d.sessions++;
    d.staffIds[l.staffId] = true;
    if(l.breakdown){
      var unitMap = subcatUnitMap(task);
      Object.keys(l.breakdown).forEach(function(k){
        var v = l.breakdown[k]||0;
        if(v<=0) return;
        addQtyToBucket(d, unitMap[k]||task.unit, v);
      });
    }else if(l.quantity){
      addQtyToBucket(d, task.unit, l.quantity);
    }
  });
  return details;
}
function achievementMessage(rate, isNewRecord){
  if(isNewRecord) return '🏆 NEW RECORD!';
  if(rate>=1) return '🎉 目標達成！';
  if(rate>=0.9) return '過去最高が見えてきました！';
  if(rate>=0.8) return 'あと少し！';
  if(rate>=0.5) return '順調です！';
  return 'まだまだこれから！';
}

function aggregateLifetime(days){
  var perStaff = {};
  days.forEach(function(day){
    if(!day) return;
    day.logs.forEach(function(l){
      if(!perStaff[l.staffId]) perStaff[l.staffId] = { xp:0, bySpec:{}, workMs:0, workDays:{} };
      if(l.taskId==='BREAK') return;
      var end = l.end ? new Date(l.end).getTime() : Date.now();
      var dur = Math.max(0, end - new Date(l.start).getTime());
      perStaff[l.staffId].workMs += dur;
      perStaff[l.staffId].workDays[day.date] = true;
      if(l.breakdown){
        Object.keys(l.breakdown).forEach(function(k){
          var v = l.breakdown[k]||0;
          if(v<=0) return;
          perStaff[l.staffId].xp += v;
          perStaff[l.staffId].bySpec[k] = (perStaff[l.staffId].bySpec[k]||0) + v;
        });
      }else if(l.quantity){
        var q = l.quantity||0;
        if(q<=0) return;
        perStaff[l.staffId].xp += q;
        var t = taskById(l.taskId);
        perStaff[l.staffId].bySpec[t.name] = (perStaff[l.staffId].bySpec[t.name]||0) + q;
      }
    });
  });
  return perStaff;
}
function rpgXpForLevel(lv){ return 25*Math.pow(lv-1,2); }
function rpgLevelInfo(xp){
  var level = Math.floor(Math.sqrt(xp/25)) + 1;
  var curFloor = rpgXpForLevel(level);
  var nextFloor = rpgXpForLevel(level+1);
  var progress = nextFloor>curFloor ? (xp-curFloor)/(nextFloor-curFloor) : 1;
  return { level:level, xp:xp, curFloor:curFloor, nextFloor:nextFloor, progress:Math.min(1,Math.max(0,progress)) };
}
function rpgTitleForLevel(level){
  if(level>=21) return 'マスター';
  if(level>=11) return 'エキスパート';
  if(level>=6) return 'ベテラン';
  if(level>=3) return '一人前';
  return '見習い';
}
function rpgAvatarTier(level){
  if(level>=21) return 4;
  if(level>=11) return 3;
  if(level>=6) return 2;
  if(level>=3) return 1;
  return 0;
}
function rpgStats(info){
  var workDaysCount = Object.keys(info.workDays||{}).length;
  var workHours = (info.workMs||0)/3600000;
  var rate = workHours>0 ? info.xp/workHours : 0;
  return {
    atk: Math.min(99, Math.round(Math.sqrt(info.xp)*2)),
    def: Math.min(99, Math.round(workDaysCount*2.5)),
    spd: Math.min(99, Math.round(rate*3))
  };
}

async function runRangeReport(startStr, endStr){
  state.reportStart = startStr;
  state.reportEnd = endStr;
  if(new Date(startStr) > new Date(endStr)){
    state.reportError = '開始日は終了日より前にしてください。';
    render();
    return;
  }
  var dates = dateRangeList(startStr, endStr);
  if(dates.length > 62){
    state.reportError = '一度に集計できるのは62日間までです。期間を短くしてください。';
    render();
    return;
  }
  state.reportLoading = true;
  state.reportError = null;
  render();
  var days = [];
  for(var i=0;i<dates.length;i++){
    var d = await loadDayByDate(dates[i]);
    if(d) days.push(d);
  }
  var agg = aggregateDays(days);
  state.reportRangeResult = { start: startStr, end: endStr, dayCount: dates.length, daysWithData: days.length, agg: agg };
  state.reportLoading = false;
  render();
}
function bindReport(){

  document.querySelectorAll('[data-report-mode]').forEach(function(el){
    el.addEventListener('click', function(){
      state.reportMode = el.getAttribute('data-report-mode');
      render();
    });
  });
  var dateInput = document.getElementById('reportDateInput');
  var startInput = document.getElementById('reportStartInput');
  var endInput = document.getElementById('reportEndInput');
  [dateInput, startInput, endInput].forEach(function(el){
    if(!el) return;
    el.addEventListener('focusin', function(){ state.suppressRender = true; });
    el.addEventListener('focusout', function(){ setTimeout(function(){ state.suppressRender = false; }, 150); });
  });
  var singleGo = document.getElementById('reportSingleGo');
  if(singleGo) singleGo.addEventListener('click', function(){
    state.suppressRender = false;
    runSingleReport(dateInput.value || todayStr());

  var rangeGo = document.getElementById('reportRangeGo');
  if(rangeGo) rangeGo.addEventListener('click', function(){
    state.suppressRender = false;
    runRangeReport(startInput.value || todayStr(), endInput.value || todayStr());
  });
  var csvSingle = document.getElementById('csvExportSingle');
  if(csvSingle) csvSingle.addEventListener('click', function(){
    if(!state.reportSingleDay) return;
    exportAggCSV(aggregateDays([state.reportSingleDay]), state.reportDate);
  });
  var csvRange = document.getElementById('csvExportRange');

function renderSummary(staff){

    var t = taskById(tid);

      if(l.staffId===staff.id && l.taskId===tid){
        qty += (l.quantity||0);

          Object.keys(l.breakdown).forEach(function(k){ breakdown[k] = (breakdown[k]||0) + (l.breakdown[k]||0); });
        }

      '<div class="summary-task"><span class="task-color-dot" style="background:'+t.color+'"></span>'+esc(t.name)+'</div>'+
      '<div class="summary-vals">'+fmtHM(totals[tid])+' ・ '+qty+esc(t.unit)+(bd?' '+bd:'')+'</div>'+
    '</div>';
  }).join('') || '<div class="empty-note">本日の記録はありません。</div>';

    '<div class="summary-title">お疲れ様でした</div>'+

async function endBreakAndStart(taskId){
  var log = currentLog(state.activeStaffId);
  if(log){
    log.end = new Date().toISOString();
    log.quantity = null;
  }
  await saveDay(state.day);
  startTaskWithSubcatCheck(taskId);
}
async function liveCountAdjust(taskId, subcatName, delta){
  var log = currentLog(state.activeStaffId);
  if(!log || log.taskId!==taskId) return;
  if(!log.breakdown) log.breakdown = {};
  log.breakdown[subcatName] = Math.max(0, (log.breakdown[subcatName]||0) + delta);
  log.quantity = Object.keys(log.breakdown).reduce(function(a,k){ return a+(log.breakdown[k]||0); }, 0);
  await saveDay(state.day);
  render();
}
function finalizeActiveSubTimer(log){
  if(!log || !log.activeSubcat || !log.activeSubcatStart) return;
  if(!log.subTimes) log.subTimes = {};
  var start = new Date(log.activeSubcatStart).getTime();
  log.subTimes[log.activeSubcat] = (log.subTimes[log.activeSubcat]||0) + Math.max(0, Date.now()-start);
  log.activeSubcat = null;
  log.activeSubcatStart = null;
}
async function toggleSubTimer(taskId, subcatName){
  var log = currentLog(state.activeStaffId);
  if(!log || log.taskId!==taskId) return;
  if(log.activeSubcat === subcatName){
    finalizeActiveSubTimer(log);
  }else{
    finalizeActiveSubTimer(log);
    log.activeSubcat = subcatName;
    log.activeSubcatStart = new Date().toISOString();
  }
  await saveDay(state.day);
  render();
}

/* ---------- 管理者(manager/admin)認証と収支データ ----------
   重要: 以下の関数は、必ず「本物のSupabase Authセッションがあるか」を
   確認してからデータ取得を行う。作業者(未ログイン=anon)のコード経路
   からはこれらの関数が呼ばれることは一切ない(gate_financial系の

async function refreshManagerSession(){
  if(!window.__supabaseClient) { state.managerSession = null; return null; }
  try{
    var res = await window.__supabaseClient.auth.getSession();
    state.managerSession = (res.data && res.data.session) ? res.data.session : null;
  }catch(e){ state.managerSession = null; }
  return state.managerSession;

async function managerSignIn(email, password){
  if(!window.__supabaseClient) return { ok:false, error:'Supabaseが設定されていません' };
  try{
    var res = await window.__supabaseClient.auth.signInWithPassword({ email: email, password: password });
    if(res.error){
      var msg = (res.error.message||'').toLowerCase();
      if(msg.indexOf('invalid login credentials')!==-1 || msg.indexOf('invalid email or password')!==-1){
        return { ok:false, error:'メールアドレスまたはパスワードが正しくありません' };
      }
      return { ok:false, error: res.error.message };
    }
    state.managerSession = res.data.session;
    return { ok:true };
  }catch(e){
    return { ok:false, error: 'ログインに失敗しました' };
  }
}

/* ---------- 単価データの取得元(将来kintoneへの切替ポイント) ----------
   現在はSupabaseのunit_pricesテーブルから取得・編集している。
   将来kintoneの単価マスタを正本にする場合は、UNIT_PRICE_SOURCE を
   'kintone' に切り替え、getUnitPriceSource() の中身をkintone APIコールに
   差し替える。物流ボード側からの編集(saveUnitPrice)は二重管理を避けるため
   行わなくなり、「単価マスタ・人件費設定」画面は自動的に読み取り専用表示
   (「kintoneで管理してください」)に切り替わる(renderFinancial参照)。
   呼び出し側(fetchFinancialData等)や集計エンジン(computeAnalytics)は
   一切変更不要。
   ※今回はkintone API連携そのものは実装していません(Supabaseから取得・
   編集する現行の実装のまま。UNIT_PRICE_SOURCE も 'supabase' のままです)。 */
var UNIT_PRICE_SOURCE = 'supabase'; // 将来: 'kintone' に切り替えると単価編集UIが読み取り専用になる
async function getUnitPriceSource(){
  if(!window.__supabaseClient) return { ok:false, rows:[] };
  var res = await window.__supabaseClient.from('unit_prices').select('*');
  if(res.error) return { ok:false, rows:[] };
  return { ok:true, rows: res.data || [] };
}
/* ---------- 商品マスタ情報の取得(将来kintone連携用。バッチ取得+キャッシュ設計) ----------
   商品コードをキーに、ケース入数・才数などをkintoneの商品マスタから
   取得する想定のインターフェース。

   重要: 実際にkintone APIを実装する際は、商品コード1件につき1リクエストを
   発行する方式にはしない。分析対象の商品コードをすべて集めたうえで、
     1) まだキャッシュに無いコードだけを抽出
     2) kintoneに「これらのコードに該当するレコード」を1回(または
        必要であれば分割しても少数回)のクエリでまとめて問い合わせる
     3) 結果を商品コードをキーにしたオブジェクトに変換し、キャッシュへ格納
     4) 呼び出し元には、キャッシュ済み分+今回取得した分をまとめて返す
   という流れにする。下記の関数はこの形で呼び出せるよう、最初から
   「複数コードをまとめて受け取り、まとめて返す」シグネチャにしてある。

   現時点ではkintone連携が無いため、内部の実問い合わせ部分
   (fetchProductMasterFromKintone)は常に空を返すダミーのままだが、
   バッチ化・キャッシュの構造自体は今回のうちに整えておく。 */
var productMasterCache = {}; // productCode -> {caseQty, saijou, ...} | null(取得したが情報なし)
async function fetchProductMasterFromKintone(productCodes){
  // 将来: kintoneの商品マスタアプリへ、productCodes をまとめて問い合わせる。
  // 例: 「商品コード in (…)」のようなクエリで1回のAPIコールにまとめる想定。
  // 今回はkintone連携を実装しないため、常に空を返す。
  return {}; // { [productCode]: {caseQty, saijou, ...} }
}
async function getProductMasterInfoBatch(productCodes){
  var uncached = productCodes.filter(function(code){ return !(code in productMasterCache); });
  if(uncached.length){
    var fetched = await fetchProductMasterFromKintone(uncached);
    uncached.forEach(function(code){
      productMasterCache[code] = (fetched && fetched[code]) ? fetched[code] : null;
    });
  }
  var result = {};
  productCodes.forEach(function(code){ result[code] = productMasterCache[code] || null; });
  return result;
}
async function fetchFinancialData(){
  state.financialLoadError = '';
  if(!hasManagerSession() || !window.__supabaseClient){
    state.financialUnitPrices = null;
    state.financialLaborCost = null;
    return;
  }
  try{
    var upResult = await getUnitPriceSource();
    var lcRes = await window.__supabaseClient.from('labor_costs').select('*').eq('id','default').maybeSingle();
    if(!upResult.ok || lcRes.error){
      state.financialLoadError = 'このアカウントには収支データの閲覧権限がありません';
      state.financialUnitPrices = null;
      state.financialLaborCost = null;
      return;
    }
    state.financialUnitPrices = upResult.rows;
    state.financialLaborCost = lcRes.data || { id:'default', hourly_wage:0 };
  }catch(e){
    state.financialLoadError = '収支データの取得に失敗しました';
    state.financialUnitPrices = null;
    state.financialLaborCost = null;
  }
}

function openQuantityModal(nextTaskId, isEndDay){
  var log = currentLog(state.activeStaffId);
  state.suppressRender = true;
  if(log){
    if(isCsvLinkedTask(log.taskId)){
      finishCsvLinkedLog(log, nextTaskId, isEndDay);
      return;
    }
    var t = taskById(log.taskId);
    if(t.subcategories && t.subcategories.length){
      var subcatObjs = t.subcategories.map(function(sc){ return { name: subcatName(sc), unit: subcatUnit(sc, t.unit) }; });
      var values = {};
      subcatObjs.forEach(function(sc){ values[sc.name] = (log.breakdown && log.breakdown[sc.name]) || 0; });
      state.modal = {kind:'qtyBreakdown', closingTaskId: log.taskId, closingTaskName: t.name, closingUnit: t.unit, subcategories: subcatObjs, values: values, nextTaskId: nextTaskId, isEndDay: isEndDay};
    }else{
      state.modal = {kind:'qty', closingTaskId: log.taskId, closingTaskName: t.name, closingUnit: t.unit, value:0, nextTaskId: nextTaskId, isEndDay: isEndDay};
    }
  }else{
    state.suppressRender = false;
    startTaskWithSubcatCheck(nextTaskId);
    return;
  }
  render();
}
async function finishCsvLinkedLog(log, nextTaskId, isEndDay){
  finalizeActiveSubTimer(log);
  log.end = new Date().toISOString();
  log.quantity = null;
  delete log.breakdown;
  await saveDay(state.day);
  state.suppressRender = false;
  if(isEndDay){
    state.day.summaryFor = state.activeStaffId;
    render();
  }else if(nextTaskId){
    startTaskWithSubcatCheck(nextTaskId);
  }else{
    maybeShowNextSuggestion();
    render();
  }
}
function maybeShowNextSuggestion(){
  if(!state.pendingNextSuggestion) return;
  state.pendingNextSuggestion = false;
  if(!state.activeStaffId) return;
  var suggestion = suggestNextTaskFor(state.activeStaffId, state.day, state.workVolume||emptyWorkVolume(), state.taskPriority||{}, state.productivityMaster||{}, new Date(), state.backlog);
  state.nextTaskSuggestModal = suggestion; // nullなら「おすすめ無し」として表示
  state.showNextSuggestBanner = true;
}
function startTaskWithSubcatCheck(taskId){
  var task = taskById(taskId);
  if(task.subcategories && task.subcategories.length>1){
    state.modal = {
      kind:'pickSubcat', taskId: taskId, taskName: task.name,
      subcategories: task.subcategories.map(function(sc){ return { name: subcatName(sc), unit: subcatUnit(sc, task.unit) }; })
    };
    render();
    return;
  }
  var firstSubcat = (task.subcategories && task.subcategories.length===1) ? subcatName(task.subcategories[0]) : null;
  startTask(taskId, firstSubcat);
}
async function startTask(taskId, chosenSubcat){
  var entry = {id:uid(), staffId:state.activeStaffId, taskId:taskId, start:new Date().toISOString(), end:null, quantity:null};
  var task = taskById(taskId);
  if(task.subcategories && task.subcategories.length){
    entry.activeSubcat = chosenSubcat || subcatName(task.subcategories[0]);
    entry.activeSubcatStart = entry.start;
    entry.subTimes = {};

async function checkAutoBreak(){
  if(!state.breakSettings || !state.breakSettings.enabled) return;
  if(!state.day || state.day.date !== todayStr()) return;
  var day = state.day;
  var now = new Date();
  var nowStr = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  var inBreak = nowStr >= state.breakSettings.start && nowStr < state.breakSettings.end;
  if(!day.autoBreakStarted) day.autoBreakStarted = {};
  if(!day.autoBreakEnded) day.autoBreakEnded = {};
  var changed = false;
  presentStaff().forEach(function(s){
    var log = currentLog(s.id);
    if(inBreak){
      if(!day.autoBreakStarted[s.id] && log && log.taskId!=='BREAK'){
        finalizeActiveSubTimer(log);
        log.end = new Date().toISOString();
        if(log.quantity==null && !log.breakdown) log.quantity = 0;
        day.logs.push({id:uid(), staffId:s.id, taskId:'BREAK', start:new Date().toISOString(), end:null, quantity:null});
        day.autoBreakStarted[s.id] = true;
        changed = true;
      }
    }else{
      if(!day.autoBreakEnded[s.id] && log && log.taskId==='BREAK'){
        log.end = new Date().toISOString();
        log.quantity = null;
        day.autoBreakEnded[s.id] = true;
        changed = true;
      }
    }
  });
  if(changed){
    await saveDay(day);
  }
}
async function checkAutoShift(){
  if(!state.shiftSettings || !state.shiftSettings.enabled) return;
  if(!state.day || state.day.date !== todayStr()) return;
  var day = state.day;
  var now = new Date();
  var wd = now.getDay();
  var nowStr = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  if(!day.autoShiftStarted) day.autoShiftStarted = {};
  if(!day.autoShiftEnded) day.autoShiftEnded = {};
  if(!day.shiftEndOverrides) day.shiftEndOverrides = {};
  var changed = false;
  activeRoster().forEach(function(s){
    var pattern = s.pattern || defaultPattern();
    if(!pattern[wd]) return;
    var endTime = day.shiftEndOverrides[s.id] || state.shiftSettings.end;
    var isOn = !!day.attendance[s.id];

    if(!isOn && !day.autoShiftStarted[s.id] && nowStr >= state.shiftSettings.start && nowStr < endTime){
      day.attendance[s.id] = true;
      day.autoShiftStarted[s.id] = true;
      changed = true;
      isOn = true;
    }

    if(isOn && !day.autoShiftEnded[s.id] && nowStr >= endTime){
      day.attendance[s.id] = false;
      day.autoShiftEnded[s.id] = true;
      changed = true;
      var log = currentLog(s.id);
      if(log && log.end===null){
        finalizeActiveSubTimer(log);
        log.end = new Date().toISOString();
        if(log.taskId==='BREAK'){
          log.quantity = null;
        }else if(log.quantity==null && !log.breakdown){
          log.quantity = 0;
        }
      }
    }
  });
  if(changed){
    await saveDay(day);
  }
}

      var taskId = select ? select.value : '';
      if(!taskId){ showToast('作業枠を選択してください'); return; }
      if(!state.customerTaskMapping) state.customerTaskMapping = { entries: [] };
      state.customerTaskMapping.entries.push({ id: uid(), customerName: customerName, taskId: taskId, enabled: true });
      await saveCustomerTaskMapping(state.customerTaskMapping);
      await appendAuditLog({ action:'得意先マスター追加(CSVプレビューから)', target: customerName, before:null, after: customerName+' → '+taskById(taskId).name });
      // 取込プレビューを再計算(この得意先が未紐付けから該当作業枠へ移動する)
      var d = state.autoMapPreviewData;
      var plan = buildAutoMappedImportPlan(d.rawParseResult, state.customerTaskMapping);
      d.taskPlans = plan.taskPlans;
      d.unmapped = plan.unmapped;
      showToast('「'+customerName+'」を「'+taskById(taskId).name+'」に追加しました');
      render();
    });
  });
  var confirmBtn = document.getElementById('autoMapPreviewConfirmBtn');
  if(confirmBtn){
    confirmBtn.addEventListener('click', async function(){
      var d = state.autoMapPreviewData;
      if(!d.taskPlans.length){
        showToast('自動紐付けできた作業枠がないため、確定できません');
        return;
      }
      var targetData = await getWorkVolumeForDate(d.targetDate);
      var groupImportId = uid(); // 同一CSVから生成された取込群であることが分かるように共通のグループIDを持たせる
      for(var i=0;i<d.taskPlans.length;i++){
        var p = d.taskPlans[i];
        var importId = uid();
        targetData.imports.push({
          id: importId, importedAt: new Date().toISOString(), fileName: d.fileName, taskId: p.taskId,
          taskKind: (taskById(p.taskId).taskKind) || 'normal',
          primaryCount: p.primaryCount, lineCount: p.lineCount, totalQty: p.totalQty,
          fileFingerprint: d.fingerprint, fileSize: d.fileSize, shipperNos: p.shipperNos,
          byCustomer: p.byCustomer||{}, byProduct: p.byProduct||{},
          autoMappedGroupId: groupImportId,
          deletedAt: null, deletedBy: null, deleteReason: null
        });
      }
      var saveOk = await saveWorkVolume(d.targetDate, targetData);
      if(d.targetDate===todayStr()) state.workVolume = targetData;
      if(state.wvTargetDate===d.targetDate) state.wvViewData = targetData;
      if(saveOk) await registerFileFingerprint(d.fingerprint, d.fileSize, d.fileName, d.targetDate, '(自動振り分け・複数作業枠)', groupImportId);
      await appendAuditLog({ action:'CSV自動振り分け取込確定', target: d.fileName, before:null, after: d.taskPlans.length+'作業枠に振り分け、未紐付け'+d.unmapped.length+'件('+d.targetDate+')' });
      var msg = saveOk
        ? d.taskPlans.length+'件の作業枠に取り込みました'+(d.unmapped.length?'(未紐付け'+d.unmapped.length+'件は取り込まれていません)':'')
        : '保存に失敗した可能性があります。本日の確認事項をご確認ください。';
      state.autoMapPreviewData = null;
      state.modal = null;
      showToast(msg);
      render();
    });
  }
}

        deletedAt: null, deletedBy: null, deleteReason: null
      });
      targetData.batches = targetData.batches.concat(finalBatches);
      var saveOk = await saveWorkVolume(vp.targetDate, targetData);
      if(vp.targetDate===todayStr()) state.workVolume = targetData;
      if(state.wvTargetDate===vp.targetDate) state.wvViewData = targetData;
      await markImportAttemptStatus(vp.targetDate, vp.attemptId, saveOk ? 'done' : 'failed');
      if(saveOk) await registerFileFingerprint(vp.fingerprint, vp.fileSize, vp.fileName, vp.targetDate, vp.taskId, vp.importId);
      var primaryLabel = (vp.cfg.taskKind==='vc') ? 'PO数' : '件数';
      await appendAuditLog({ action:'CSV作業量取込確定', target: taskById(vp.taskId).name+' / '+vp.fileName, before:null, after: vp.primaryCount+primaryLabel+'、'+finalBatches.length+'件のバッチ('+vp.targetDate+')' });
      var msg = saveOk
        ? '取込を確定しました('+vp.primaryCount+primaryLabel+' / '+vp.lineCount+'明細 / '+formatNum(vp.totalQty)+'ピース)'+(finalBatches.length?'。'+finalBatches.length+'件のバッチを作成しました':'')
        : '保存に失敗した可能性があります。本日の確認事項をご確認ください。';
      state.vcPreview = null;
      state.modal = null;
      showToast(msg);
      render();
    });
  }
}

/* ---------- update notifications (toast) ---------- */
function showToast(msg, actionLabel, actionFn){
  var container = document.getElementById('toastContainer');
  if(!container){
    container = document.createElement('div');
    container.id = 'toastContainer';
    container.className = 'toast-container';
    document.body.appendChild(container);
  }
  var el = document.createElement('div');
  el.className = 'toast';
  var textSpan = document.createElement('span');
  textSpan.textContent = msg;
  textSpan.className = 'toast-text';
  el.appendChild(textSpan);
  if(actionLabel && actionFn){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'toast-action';
    btn.textContent = actionLabel;
    btn.addEventListener('click', function(){
      actionFn();
      if(el.parentNode) el.parentNode.removeChild(el);
    });
    el.appendChild(btn);
  }
  container.appendChild(el);
  while(container.children.length > 5){
    container.removeChild(container.firstChild);
  }
  setTimeout(function(){
    el.classList.add('leaving');
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 200);
  }, 5500);
}
function notifyChanges(oldRoster, oldBacklog, oldDay, newRoster, newBacklog, newDay){
  if(state.role!=='manager' && state.role!=='register') return;
  if(!oldDay || !newDay || oldDay.date!==newDay.date) return;
  var msgs = [];
  var rosterById = {};
  newRoster.forEach(function(s){ rosterById[s.id] = s; });

  newRoster.forEach(function(s){
    if(s.archived) return;
    var oldOn = !!(oldDay.attendance||{})[s.id];
    var newOn = !!(newDay.attendance||{})[s.id];
    if(oldOn!==newOn){
      msgs.push(esc(s.name)+'さんが'+(newOn?'出勤中':'欠勤')+'に変更されました');
    }
  });

  newRoster.forEach(function(s){
    if(s.archived) return;
    var oldArr = (oldDay.assignments||{})[s.id] || [];
    var newArr = (newDay.assignments||{})[s.id] || [];
    newArr.forEach(function(tid){
      if(oldArr.indexOf(tid)===-1){
        var t = newBacklog.find(function(x){ return x.id===tid; });
        msgs.push(s.name+'さんが「'+(t?t.name:'作業')+'」に割り当てられました');
      }
    });
    oldArr.forEach(function(tid){
      if(newArr.indexOf(tid)===-1){
        var t = oldBacklog.find(function(x){ return x.id===tid; });
        msgs.push(s.name+'さんが「'+(t?t.name:'作業')+'」から外れました');
      }
    });
  });

  var today = todayStr();
  var oldToday = {}; oldBacklog.forEach(function(t){ if(t.workDate===today) oldToday[t.id] = t; });
  var newToday = {}; newBacklog.forEach(function(t){ if(t.workDate===today) newToday[t.id] = t; });
  Object.keys(newToday).forEach(function(id){
    var nt = newToday[id];
    var ot = oldToday[id];
    if(!ot){
      if(!nt.archived) msgs.push('新しい作業「'+nt.name+'」が追加されました');
    }else if(!ot.archived && nt.archived){
      msgs.push('作業「'+nt.name+'」が削除されました');
    }
  });

  var oldLogsById = {};
  (oldDay.logs||[]).forEach(function(l){ oldLogsById[l.id] = l; });
  (newDay.logs||[]).forEach(function(l){
    var s = rosterById[l.staffId];
    var t = newBacklog.find(function(x){ return x.id===l.taskId; });
    var sName = s ? s.name : '?';
    var tName = t ? t.name : '?';
    var old = oldLogsById[l.id];
    if(!old){
      msgs.push(sName+'さんが「'+tName+'」を開始しました');
    }else if(old.end===null && l.end!==null){
      msgs.push(sName+'さんが「'+tName+'」を終了しました('+(l.quantity||0)+(t?t.unit:'')+')');
    }
  });

  if(msgs.length===0) return;
  if(msgs.length>4){
    msgs.slice(0,4).forEach(showToast);
    showToast('他'+(msgs.length-4)+'件の更新がありました');
  }else{
    msgs.forEach(showToast);
  }
}

async function pollTick(){
  if(pollTickRunning) return;
  if(!state.role) return;
  if(pendingSaves>0) return;
  if(isUserBusy()) return;
  pollTickRunning = true;
  try{
    var oldRoster = state.roster;
    var oldBacklog = state.backlog;
    var oldDay = state.day;
    var roster = state.roster, backlog = state.backlog, templates = state.templates;
    /* 通信失敗 ≠ データが空、の原則を徹底する。
       fetchXRaw()は取得できなかった場合に必ず例外を投げるとは限らず(一時的な不具合で
       「成功したが空」という結果を返すことがある)、既存データが1件以上あったのに
       今回の取得結果が0件だった場合は、実際に全削除されたのではなく取得の不具合である
       可能性が高いため、直前のデータを保持し、上書きしない(安全側に倒す)。
       これを怠ると、直後のensureTemplateTasksForToday()が「今日の作業がまだ無い」と
       誤判定して重複作成し、その空の状態をsaveBacklog()で永続化してしまう恐れがある。 */
    try{
      var fetchedRoster = await fetchRosterRaw();
      if(fetchedRoster.length>0 || oldRoster.length===0) roster = fetchedRoster;
      else console.warn('スタッフ一覧の取得結果が予期せず空でした。直前のデータを保持します。');
    }catch(e){}
    try{
      var fetchedBacklog = await fetchBacklogRaw();
      if(fetchedBacklog.length>0 || oldBacklog.length===0) backlog = fetchedBacklog;
      else console.warn('作業一覧の取得結果が予期せず空でした。直前のデータを保持します。');
    }catch(e){}
    try{
      var fetchedTemplates = await fetchTemplatesRaw();
      if(fetchedTemplates.length>0 || state.templates.length===0) templates = fetchedTemplates;
      else console.warn('繰り返し作業一覧の取得結果が予期せず空でした。直前のデータを保持します。');
    }catch(e){}
    var breakSettings = await loadBreakSettings();
    var shiftSettings = await loadShiftSettings();
    var achievementSettings = await loadAchievementSettings();
    if(pendingSaves>0) return;
    state.roster = roster;
    state.backlog = backlog;
    state.templates = templates;
    state.breakSettings = breakSettings;
    state.shiftSettings = shiftSettings;
    state.achievementSettings = achievementSettings;
    await ensureTemplateTasksForToday();
    var day;
    if(state.day && state.day.date===todayStr()){
      day = state.day;
      try{
        var r = await window.storage.get('day:'+todayStr(), true);
        if(r && r.value) day = JSON.parse(r.value);
      }catch(e){ /* keep existing day data on transient fetch failure */ }
    }else{
      day = await loadDay();
    }
    if(pendingSaves>0) return;
    state.day = day;
    var freshWorkVolume = await loadWorkVolume(todayStr());
    if(freshWorkVolume) state.workVolume = freshWorkVolume;
    var freshCaseLedger = await loadVcCaseLedger(todayStr());
    if(freshCaseLedger) state.vcCaseLedger = freshCaseLedger;
    var freshAck = await loadChecklistAck(todayStr());
    if(freshAck) state.dailyChecklistAck = freshAck;
    var freshAttempts = await loadVcImportAttempts(todayStr());
    if(freshAttempts) state.vcImportAttemptsToday = freshAttempts;
    notifyChanges(oldRoster, oldBacklog, oldDay, state.roster, state.backlog, state.day);
    await checkAutoBreak();
    await checkAutoShift();
    var newSnapshot = safeSnapshotForChangeDetection();
    var dataChanged = newSnapshot !== state.lastSnapshotStr;
    state.lastSnapshotStr = newSnapshot;
    if(!isUserBusy() && dataChanged) render();
  } finally {
    pollTickRunning = false;
  }
}
function maybeRefreshNow(){
  if(state.role && !isUserBusy()) pollTick();
}
function startPolling(){
  if(pollHandle) return;
  pollHandle = setInterval(pollTick, 4000);
}
function setupGlobalFocusTracking(){
  var FIELD_TAGS = {INPUT:1, SELECT:1, TEXTAREA:1};
  document.addEventListener('focusin', function(e){
    var t = e.target;
    if(t && FIELD_TAGS[t.tagName]) state.focusBusy = true;
  }, true);
  document.addEventListener('focusout', function(e){
    var t = e.target;
    if(t && FIELD_TAGS[t.tagName]){
      setTimeout(function(){
        var active = document.activeElement;
        if(!active || !FIELD_TAGS[active.tagName]){
          state.focusBusy = false;
          maybeRefreshNow();
        }
      }, 150);
    }
  }, true);
}

/* ---------- init ---------- */
function renderStorageWarning(){
  return '<div class="gate">'+
    '<div class="gate-eyebrow">Setup required</div>'+
    '<h1 class="gate-title" style="font-size:26px;">保存機能が使えません</h1>'+
    '<p class="gate-sub" style="max-width:520px;">このアプリはClaudeのアーティファクト表示画面の中で開いたときだけデータが保存されます。ダウンロードしたHTMLファイルを直接開いたり、社内サーバーにそのまま置いて開いたりすると、入力した内容が保存されず消えてしまいます。<br><br>Claudeの会話(アーティファクトのリンクや共有リンク)から開き直してください。</p>'+
  '</div>';
}
function renderSupabaseWarning(){
  return '<div class="gate">'+
    '<div class="gate-eyebrow">Setup required</div>'+
    '<h1 class="gate-title" style="font-size:26px;">Supabaseが未設定です</h1>'+
    '<p class="gate-sub" style="max-width:520px;">config.js に SupabaseプロジェクトのURLとanonキーが設定されていません。<br><br>Supabaseダッシュボード → Project Settings → API から値を取得し、config.js の url / anonKey を書き換えてから、もう一度このページを開いてください。</p>'+
  '</div>';
}
async function init(){
  if(!window.SUPABASE_CONFIG || !window.SUPABASE_CONFIG.url || window.SUPABASE_CONFIG.url.indexOf('YOUR-PROJECT')!==-1){
    document.getElementById('app').innerHTML = renderSupabaseWarning();
    return;
  }
  if(!storageAvailable()){
    document.getElementById('app').innerHTML = renderStorageWarning();
    return;
  }
  state.roster = await loadRoster();
  state.backlog = await loadBacklog();
  state.templates = await loadTemplates();
  state.breakSettings = await loadBreakSettings();
  state.shiftSettings = await loadShiftSettings();
  state.achievementSettings = await loadAchievementSettings();
  state.jpHolidays = await loadJpHolidays();
  await ensureTemplateTasksForToday();
  state.day = await loadDay();
  state.workVolume = await loadWorkVolume(todayStr());
  if(!state.workVolume) state.workVolume = emptyWorkVolume();
  state.vcCaseLedger = await loadVcCaseLedger(todayStr());
  state.dailyChecklistAck = await loadChecklistAck(todayStr());
  state.taskPriority = await loadTaskPriority(todayStr());
  state.productivityMaster = await loadProductivityMaster();
  state.vcImportAttemptsToday = await loadVcImportAttempts(todayStr());
  await checkAutoBreak();
  await checkAutoShift();
  render();
  startTicker();
}
setupGlobalFocusTracking();
init();

})();
</script>
