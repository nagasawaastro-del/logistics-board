# kintone の自動取得。本番では .github/workflows/kintone-sync.yml に置く
# 日本時間 5時〜21時台に15分ごとに動き、ロジリンクの設定(データ取込 → kintone の同期 →「⏰ 自動取得の設定」)を見て、
# 設定の時刻を過ぎていて今日まだ取っていない項目だけを取る(.github/scripts/kintone_sync.py)。2026-10-21 から。
# 見積もり・入荷予定(sync-stock-outlook)/商品台帳(sync-product-master)/作業日報(sync-work-report)/作業単価(sync-work-price-master)
# 合言葉: 生産管理の定期取り込みと同じ FACTORY_CRON_KEY(GitHub の Secrets と Supabase の Secrets に同じ値)。
#         登録していない間は、何もせずに終わる。
# 手で動かすときは Actions →「kintone-sync」→「Run workflow」(設定に関係なく、オンの項目を全部取る)。
name: kintone-sync
on:
  schedule:
    - cron: '7,22,37,52 20-23,0-12 * * *'   # UTC 20〜12時台 = 日本時間 5〜21時台。毎時0分は GitHub が混むのでずらす
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KEY: ${{ secrets.FACTORY_CRON_KEY }}
      FORCE: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            config.js
            .github/scripts
          sparse-checkout-cone-mode: false
      - name: 設定を見て、kintone から取る
        run: python3 .github/scripts/kintone_sync.py
