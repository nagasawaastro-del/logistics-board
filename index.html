function vcCaseCurrentValue(entries){
  return (entries||[]).filter(function(e){ return !e.reversedAt; }).reduce(function(a,e){ return a+(e.delta||0); }, 0);
}
async function addVcCaseEntry(dateStr, taskId, delta, note){
  var data = state.vcCaseLedger || {};
  if(!data[taskId]) data[taskId] = { entries: [] };
  data[taskId].entries.push({ id: uid(), delta: delta, actor: state.activeStaffId, at: new Date().toISOString(), note: note||'', reversedAt: null, reversedBy: null });
  state.vcCaseLedger = data;
  await saveVcCaseLedger(dateStr, data);
  await appendAuditLog({ action:'ケース数追加', target: taskById(taskId).name, before: null, after: (delta>=0?'+':'')+delta+'(理由: '+(note||'なし')+')' });
}
async function reverseVcCaseEntry(dateStr, taskId, entryId, reason){
  var data = state.vcCaseLedger || {};
  var entry = data[taskId] && data[taskId].entries.find(function(e){ return e.id===entryId; });
  if(!entry || entry.reversedAt) return;
  entry.reversedAt = new Date().toISOString();
  entry.reversedBy = state.activeStaffId;
  entry.reverseReason = reason || '';
  await saveVcCaseLedger(dateStr, data);
  await appendAuditLog({ action:'ケース数取消', target: taskById(taskId).name, before: (entry.delta>=0?'+':'')+entry.delta, after:'取消(理由: '+(reason||'なし')+')' });
}
function freshDay(dateStr){
  var attendance = {};
  var weekday = new Date(dateStr+'T00:00:00').getDay();
  var holiday = holidayName(dateStr);
  state.roster.forEach(function(s){
    if(s.archived) return;
    var pattern = s.pattern || defaultPattern();
    var on = !!pattern[weekday];
    if(on && s.offOnHolidays && holiday) on = false;
    attendance[s.id] = on;
  });
  return { date: dateStr, attendance: attendance, assignments:{}, logs:[] };
}
async function fetchDayRaw(dateStr){
  try{
    var r = await window.storage.get('day:'+dateStr, true);
    return r && r.value ? JSON.parse(r.value) : null;
  }catch(e){
    var msg = (e && e.message) ? String(e.message).toLowerCase() : '';
    if(msg.indexOf('not found')!==-1 || msg.indexOf('does not exist')!==-1 || msg.indexOf('no such key')!==-1) return null;
    throw e;
  }
}
async function loadDayByDate(dateStr){
  try{
    return await fetchDayRaw(dateStr);
  }catch(e){}
  return null;
}
async function loadAllDayKeys(){
  try{
    var r = await window.storage.list('day:', true);
    return r ? r.keys : [];
  }catch(e){ return []; }
}
async function loadAllDaysForLifetime(){
  var keys = await loadAllDayKeys();
  keys = keys.slice(0, 400);
  var days = [];
  for(var i=0;i<keys.length;i++){
    var dateStr = keys[i].replace('day:','');
    var d = await loadDayByDate(dateStr);
    if(d) days.push(d);
  }
  return days;
}
async function loadDay(){
  var d = await loadDayByDate(todayStr());
  if(d && d.date===todayStr()) return d;
  return freshDay(todayStr());
}
async function saveDay(day){
  if(day.date===todayStr()){
    state.day = day;
  }
  if(state.managerDate && state.managerDate===day.date){
    state.managerDay = day;
  }
  pendingSaves++;
  try{ await window.storage.set('day:'+day.date, JSON.stringify(day), true); }catch(e){}
  finally{ pendingSaves--; }
}

/* ---------- 実績管理(作業日ごと・期間指定でのまとめて編集/削除) ----------
   重要: 進行中のログ(end===null、つまりまだ計測が終わっていない実績)は、
   一括削除・一括日付変更のどちらの対象にもしない(安全のため常に除外する)。 */
async function loadLogEntriesForRange(startDate, endDate){
  var dates = dateRangeList(startDate, endDate);
  var entries = [];
  for(var i=0;i<dates.length;i++){
    var dateStr = dates[i];
    var day = (dateStr===todayStr()) ? state.day : await loadDayByDate(dateStr);
    if(!day) continue;
    (day.logs||[]).forEach(function(log){
      entries.push({ dateStr: dateStr, log: log });
    });
  }
  entries.sort(function(a,b){
    if(a.dateStr!==b.dateStr) return a.dateStr<b.dateStr?-1:1;
    return new Date(a.log.start) - new Date(b.log.start);
  });
  return entries;
}
async function bulkDeleteLogs(startDate, endDate, selectedIds){
  var dates = dateRangeList(startDate, endDate);
  var deletedCount = 0;
  for(var i=0;i<dates.length;i++){
    var dateStr = dates[i];
    var day = (dateStr===todayStr()) ? state.day : await loadDayByDate(dateStr);
    if(!day || !day.logs || !day.logs.length) continue;
    var before = day.logs.length;
    day.logs = day.logs.filter(function(l){
      if(selectedIds[l.id] && l.end!==null){ deletedCount++; return false; }
      return true;
    });
    if(day.logs.length !== before) await saveDay(day);
  }
  return deletedCount;
}
async function bulkMoveLogs(startDate, endDate, selectedIds, targetDate){
  var dates = dateRangeList(startDate, endDate);
  var allMoved = [];
  for(var i=0;i<dates.length;i++){
    var dateStr = dates[i];
    if(dateStr===targetDate) continue;
    var day = (dateStr===todayStr()) ? state.day : await loadDayByDate(dateStr);
    if(!day || !day.logs || !day.logs.length) continue;
    var remaining = [];
    var movedThisDay = [];
    day.logs.forEach(function(l){
      if(selectedIds[l.id] && l.end!==null) movedThisDay.push(l);
      else remaining.push(l);
    });
    if(movedThisDay.length){
      day.logs = remaining;
      await saveDay(day);
      allMoved = allMoved.concat(movedThisDay);
    }
  }
  if(allMoved.length){
    var targetDay = (targetDate===todayStr()) ? state.day : ((await loadDayByDate(targetDate)) || freshDay(targetDate));
    targetDay.logs = (targetDay.logs||[]).concat(allMoved);
    await saveDay(targetDay);
  }
  return allMoved.length;
}

function presentStaff(){

}
function presentStaffForDay(day){
  return state.roster.filter(function(s){ return !s.archived && day.attendance[s.id]; });
}
function activeRoster(){
  return state.roster.filter(function(s){ return !s.archived; });
}
function managerActiveDate(){
  return state.managerDate || todayStr();
}
function managerActiveDay(){
  return managerActiveDate()===todayStr() ? state.day : state.managerDay;
}
function managerActiveWorkVolume(){
  return managerActiveDate()===todayStr() ? state.workVolume : state.managerWorkVolume;
}
async function loadDayByDateWithRetry(dateStr, retries){
  for(var i=0;i<=retries;i++){
    try{
      return await fetchDayRaw(dateStr);
    }catch(e){
      if(i<retries) await new Promise(function(res){ setTimeout(res, 400); });
    }
  }
  throw new Error('day fetch failed after retries');
}
async function switchManagerDate(dateStr){
  state.managerDate = dateStr;
  state.managerDateLoadError = false;
  if(dateStr===todayStr()){
    state.managerDay = null;
    state.managerWorkVolume = null;
    render();
    return;
  }
  var day;
  try{
    day = await loadDayByDateWithRetry(dateStr, 2);
  }catch(e){
    state.managerDay = null;
    state.managerDateLoadError = true;
    render();
    return;
  }
  if(!day) day = freshDay(dateStr);
  state.managerDay = day;
  state.managerWorkVolume = await loadWorkVolume(dateStr) || emptyWorkVolume();
  render();
  await ensureTemplateTasksForDate(dateStr);
  var refreshed = await loadDayByDate(dateStr);
  if(refreshed && state.managerDate===dateStr) state.managerDay = refreshed;
  render();
}

/* ---------- CALENDAR (登録内容・出勤予定の月表示) ---------- */
function daysInMonth(monthKey){
  var p = monthKey.split('-').map(Number);
  return new Date(p[0], p[1], 0).getDate();
}
function firstWeekdayOfMonth(monthKey){
  var p = monthKey.split('-').map(Number);
  return new Date(p[0], p[1]-1, 1).getDay();
}
function shiftMonthKey(monthKey, delta){
  var p = monthKey.split('-').map(Number);
  var d = new Date(p[0], p[1]-1+delta, 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function monthKeyLabel(monthKey){
  var p = monthKey.split('-');
  return p[0]+'年'+parseInt(p[1],10)+'月';
}
function predictedAttendanceCount(dateStr){
  var wd = new Date(dateStr+'T00:00:00').getDay();
  var holiday = holidayName(dateStr);
  return activeRoster().filter(function(s){
    var pattern = s.pattern || defaultPattern();
    if(!pattern[wd]) return false;
    if(s.offOnHolidays && holiday) return false;
    return true;
  }).length;
}
function actualAttendanceCount(day){
  var roster = activeRoster();
  return roster.filter(function(s){ return !!day.attendance[s.id]; }).length;
}
async function runCalendarMonth(monthKey){
  state.calendarLoading = true;
  render();
  var n = daysInMonth(monthKey);
  var data = {};
  for(var d=1; d<=n; d++){
    var dateStr = monthKey+'-'+String(d).padStart(2,'0');
    var day = await loadDayByDate(dateStr);
    data[dateStr] = {
      taskCount: tasksForDate(dateStr).length,
      presentCount: day ? actualAttendanceCount(day) : predictedAttendanceCount(dateStr),
      isActual: !!day
    };
  }
  if(state.calendarMonth===monthKey){
    state.calendarData = data;
  }
  state.calendarLoading = false;
  render();
}

      else delete state.logMgmtSelected[id];
      render();
    });
  });
  var selectAll = document.getElementById('logMgmtSelectAll');
  if(selectAll){
    selectAll.addEventListener('change', function(){
      // 重要: 「まとめてチェック」は、現在の絞り込み条件で表示されている実績だけを対象にする。
      // 絞り込みで非表示になっている実績の選択状態には一切触れない。
      var visibleEntries = getFilteredLogMgmtEntries();
      var wantChecked = selectAll.checked;
      visibleEntries.forEach(function(e){
        if(e.log.end===null) return; // 進行中は対象外
        if(wantChecked) state.logMgmtSelected[e.log.id] = true;
        else delete state.logMgmtSelected[e.log.id];
      });
      render();
    });
  }
  var moveTargetInput = document.getElementById('logMgmtMoveTarget');
  if(moveTargetInput) moveTargetInput.addEventListener('change', function(){ state.logMgmtMoveTargetDate = moveTargetInput.value; });
  var deleteBtn = document.getElementById('logMgmtDeleteBtn');
  if(deleteBtn){
    deleteBtn.addEventListener('click', async function(){
      var count = Object.keys(state.logMgmtSelected).filter(function(id){ return state.logMgmtSelected[id]; }).length;
      if(!count) return;
      if(!confirm('選択した'+count+'件の実績を削除します。この操作は元に戻せません。よろしいですか?')) return;
      var deleted = await bulkDeleteLogs(state.logMgmtStartDate, state.logMgmtEndDate, state.logMgmtSelected);
      await appendAuditLog({ action:'実績の一括削除', target: state.logMgmtStartDate+'〜'+state.logMgmtEndDate, before:null, after: deleted+'件を削除' });
      state.logMgmtSelected = {};
      state.logMgmtEntries = await loadLogEntriesForRange(state.logMgmtStartDate, state.logMgmtEndDate);
      showToast(deleted+'件の実績を削除しました');
      render();
    });
  }
  var moveBtn = document.getElementById('logMgmtMoveBtn');
  if(moveBtn){
    moveBtn.addEventListener('click', async function(){
      var count = Object.keys(state.logMgmtSelected).filter(function(id){ return state.logMgmtSelected[id]; }).length;
      if(!count) return;
      var targetDate = state.logMgmtMoveTargetDate || todayStr();
      if(!confirm('選択した'+count+'件の実績を、'+dateLabelFromStr(targetDate)+'の記録として移動します。よろしいですか?')) return;
      var moved = await bulkMoveLogs(state.logMgmtStartDate, state.logMgmtEndDate, state.logMgmtSelected, targetDate);
      await appendAuditLog({ action:'実績の一括日付変更', target: state.logMgmtStartDate+'〜'+state.logMgmtEndDate, before:null, after: moved+'件を'+targetDate+'へ移動' });
      state.logMgmtSelected = {};
      state.logMgmtEntries = await loadLogEntriesForRange(state.logMgmtStartDate, state.logMgmtEndDate);
      showToast(moved+'件の実績を'+dateLabelFromStr(targetDate)+'に移動しました');
      render();
    });
  }
}

function bindProductivityTab(){
  var staffingRefreshProductivityBtn = document.getElementById('staffingRefreshProductivityBtn');
  if(staffingRefreshProductivityBtn){
    staffingRefreshProductivityBtn.addEventListener('click', async function(){
      staffingRefreshProductivityBtn.disabled = true;
      staffingRefreshProductivityBtn.textContent = '更新中...';
      var master = await loadProductivityMaster();
      var todayD = new Date();
      var updatedDays = 0;
      for(var i=0;i<30;i++){ // 直近30日分から蓄積する
        var d = new Date(todayD.getTime() - i*86400000);
        var dStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
        var day = (dStr===todayStr()) ? state.day : await loadDayByDate(dStr);
        if(!day || !day.logs || !day.logs.length) continue;
        var wv = await getWorkVolumeForDate(dStr);
        if(!wv) continue;
        updateProductivityMasterFromDay(master, dStr, day, wv);
        updatedDays++;
      }
      await saveProductivityMaster(master);
      state.productivityMaster = master;
      await appendAuditLog({ action:'生産性データ更新', target:'productivity-master', before:null, after: updatedDays+'日分を反映' });
      showToast('直近30日のうち、実績のあった'+updatedDays+'日分を生産性データに反映しました');
      render();
    });
  }
}

function shiftDateStr(dateStr, deltaDays){

}
function localDateTimeToISO(dateStr, timeStr){
  var dp = dateStr.split('-').map(Number);
  var tp = (timeStr||'00:00').split(':').map(Number);
  var d = new Date(dp[0], dp[1]-1, dp[2], tp[0]||0, tp[1]||0, 0);
  return d.toISOString();
}
function isoToLocalTimeInput(iso){

function coworkersForTask(taskId, excludeStaffId){
  return activeRoster().filter(function(s){
    if(s.id===excludeStaffId) return false;
    if(!state.day.attendance[s.id]) return false;
    return (state.day.assignments[s.id]||[]).indexOf(taskId)!==-1;
  }).map(function(s){
    var log = currentLog(s.id);
    var working = !!(log && log.taskId===taskId);
    var onBreak = !!(log && log.taskId==='BREAK');
    var onOther = !!(log && !working && !onBreak);
    var statusLabel = working ? '作業中' : onBreak ? '休憩中' : onOther ? '別作業中' : '待機中';
    var statusClass = working ? 'working' : onBreak ? 'brk' : onOther ? 'other' : 'idle';
    return { name: s.name, statusLabel: statusLabel, statusClass: statusClass };
  }).sort(function(a,b){
    var order = {working:0, other:1, brk:2, idle:3};
    return order[a.statusClass]-order[b.statusClass];
  });
}
function totalsByTaskForDay(day, staffId){

function taskAggregateForDay(day, taskId){
  var ms=0, qty=0, activeCount=0, breakdown={};
  day.logs.forEach(function(l){
    if(l.taskId!==taskId) return;
    var end = l.end ? new Date(l.end).getTime() : Date.now();
    ms += end - new Date(l.start).getTime();
    qty += (l.quantity||0);
    if(l.end===null) activeCount++;
    if(l.breakdown){
      Object.keys(l.breakdown).forEach(function(k){ breakdown[k] = (breakdown[k]||0) + (l.breakdown[k]||0); });
    }
  });
  return {ms:ms, qty:qty, activeCount:activeCount, breakdown:breakdown};
}
function taskAggregate(taskId){

function dateRangeList(startStr, endStr){
  var dates = [];
  var d = new Date(startStr+'T00:00:00');
  var end = new Date(endStr+'T00:00:00');
  var guard = 0;
  while(d.getTime() <= end.getTime() && guard < 400){
    dates.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
    d.setDate(d.getDate()+1);
    guard++;
  }
  return dates;
}
function aggregateDays(days){
  var perStaff = {};
  var perTask = {};
  days.forEach(function(day){
    if(!day) return;
    day.logs.forEach(function(l){
      var end = l.end ? new Date(l.end).getTime() : Date.now();
      var dur = Math.max(0, end - new Date(l.start).getTime());
      var qty = l.quantity || 0;
      if(!perStaff[l.staffId]) perStaff[l.staffId] = { ms:0, qty:0, breakMs:0, byTask:{} };
      perStaff[l.staffId].ms += dur;
      perStaff[l.staffId].qty += qty;
      if(l.taskId==='BREAK') perStaff[l.staffId].breakMs += dur;
      if(!perStaff[l.staffId].byTask[l.taskId]) perStaff[l.staffId].byTask[l.taskId] = { ms:0, qty:0, breakdown:{}, subMs:{} };
      perStaff[l.staffId].byTask[l.taskId].ms += dur;
      perStaff[l.staffId].byTask[l.taskId].qty += qty;

      if(!perTask[l.taskId]) perTask[l.taskId] = { ms:0, qty:0, staff:{}, breakdown:{}, subMs:{} };
      perTask[l.taskId].ms += dur;
      perTask[l.taskId].qty += qty;
      perTask[l.taskId].staff[l.staffId] = true;
      if(l.breakdown){
        Object.keys(l.breakdown).forEach(function(k){
          perTask[l.taskId].breakdown[k] = (perTask[l.taskId].breakdown[k]||0) + (l.breakdown[k]||0);
          perStaff[l.staffId].byTask[l.taskId].breakdown[k] = (perStaff[l.staffId].byTask[l.taskId].breakdown[k]||0) + (l.breakdown[k]||0);
        });
      }
      // 内訳ごとの人時(確定分)
      if(l.subTimes){
        Object.keys(l.subTimes).forEach(function(scName){
          var ms = l.subTimes[scName]||0;
          perTask[l.taskId].subMs[scName] = (perTask[l.taskId].subMs[scName]||0) + ms;
          perStaff[l.staffId].byTask[l.taskId].subMs[scName] = (perStaff[l.staffId].byTask[l.taskId].subMs[scName]||0) + ms;
        });
      }
      // 現在計測中の内訳の経過分も加算(未確定分)
      if(l.activeSubcat && l.activeSubcatStart){
        var liveMs = Math.max(0, Date.now() - new Date(l.activeSubcatStart).getTime());
        perTask[l.taskId].subMs[l.activeSubcat] = (perTask[l.taskId].subMs[l.activeSubcat]||0) + liveMs;
        perStaff[l.staffId].byTask[l.taskId].subMs[l.activeSubcat] = (perStaff[l.staffId].byTask[l.taskId].subMs[l.activeSubcat]||0) + liveMs;
      }
    });
  });
  return { perStaff: perStaff, perTask: perTask };
}
function priceLookup(priceRows, taskId, customerName){
  if(!priceRows) return null;
  if(customerName){
    var exact = priceRows.find(function(p){ return p.task_id===taskId && p.customer_name===customerName; });
    if(exact) return exact;
  }
  return priceRows.find(function(p){ return p.task_id===taskId && !p.customer_name; }) || null;
}async function collectDaysAndVolumeForRange(startDate, endDate){
  var dates = [];
  var d = new Date(startDate+'T00:00:00');
  var end = new Date(endDate+'T00:00:00');
  while(d<=end){
    dates.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
    d.setDate(d.getDate()+1);
  }
  var days = [];
  var volumes = [];
  for(var i=0;i<dates.length;i++){
    var dt = dates[i];
    var day = (dt===todayStr()) ? state.day : await loadDayByDate(dt);
    if(day) days.push(day);
    var wv = await getWorkVolumeForDate(dt);
    if(wv) volumes.push(wv);
  }
  return { days: days, volumes: volumes };
}
async function computeAnalytics(days, volumes, axis, filterCustomer){
  if(!hasManagerSession()) return null;
  if(!state.financialUnitPrices || !state.financialLaborCost) return null;
  var agg = aggregateDays(days);
  var allImports = [];
  volumes.forEach(function(wv){ allImports = allImports.concat(wvActiveImports(wv)); });

  var taskVolumeTotals = {};
  allImports.forEach(function(imp){
    if(!taskVolumeTotals[imp.taskId]) taskVolumeTotals[imp.taskId] = { primaryCount:0, lineCount:0, totalQty:0 };
    taskVolumeTotals[imp.taskId].primaryCount += imp.primaryCount||0;
    taskVolumeTotals[imp.taskId].lineCount += imp.lineCount||0;
    taskVolumeTotals[imp.taskId].totalQty += imp.totalQty||0;
  });
  var taskHours = {};
  Object.keys(agg.perTask).forEach(function(tid){
    if(tid==='BREAK') return;
    taskHours[tid] = Math.max(0, (agg.perTask[tid].ms||0))/3600000;
  });

  var groups = {};
  var hourlyWage = (state.financialLaborCost && state.financialLaborCost.hourly_wage)||0;

  // 出荷件数(通常出荷)とPO数(VC)は意味が異なるため、別々の集計値として保持する。
  // 明細数・出荷個数はもともと別項目として扱っていたため変更なし。
  function addToGroup(key, label, taskId, taskKind, customerName, primaryCount, lineCount, totalQty){
    if(!groups[key]) groups[key] = { key:key, label:label, shipmentCount:0, poCount:0, lineCount:0, totalQty:0, personHours:0, sales:0, customerName:customerName, taskIds:{} };
    var g = groups[key];
    if(taskKind==='vc') g.poCount += primaryCount;
    else g.shipmentCount += primaryCount;
    g.lineCount += lineCount;
    g.totalQty += totalQty;
    g.taskIds[taskId] = true;
    // 推計: このグループの、作業枠全体の出荷個数に対する割合ぶんだけ人時を配分する。
    // 実測ではなく推計値。将来、荷主・商品単位で実測できるようになった場合は、
    // ここをその実測値に置き換えられるよう、personHoursは常にこの1関数だけで算出する。
    var taskTotalQty = (taskVolumeTotals[taskId] && taskVolumeTotals[taskId].totalQty) || 0;
    var share = taskTotalQty>0 ? (totalQty/taskTotalQty) : 0;
    g.personHours += (taskHours[taskId]||0) * share;
    var price = priceLookup(state.financialUnitPrices, taskId, customerName);
    if(price){
      var qtyForPrice = price.unit_label==='ピース' ? totalQty : (price.unit_label==='明細' ? lineCount : primaryCount);
      g.sales += qtyForPrice * (price.price_per_unit||0);
    }
  }

  if(axis==='customer'){
    allImports.forEach(function(imp){
      Object.keys(imp.byCustomer||{}).forEach(function(cust){
        var c = imp.byCustomer[cust];
        addToGroup(cust, cust, imp.taskId, imp.taskKind, cust, c.primaryCount, c.lineCount, c.totalQty);
      });
    });
  }else if(axis==='product'){
    allImports.forEach(function(imp){
      Object.keys(imp.byProduct||{}).forEach(function(code){
        var p = imp.byProduct[code];
        if(filterCustomer && p.customerName!==filterCustomer) return;
        addToGroup(code, (p.productName||code), imp.taskId, imp.taskKind, p.customerName, p.primaryCount, p.lineCount, p.totalQty);
        groups[code].productCode = code;
        groups[code].productName = p.productName||'';
      });
    });
  }else{
    Object.keys(taskVolumeTotals).forEach(function(tid){
      var v = taskVolumeTotals[tid];
      var kindForTask = allImports.find(function(imp){ return imp.taskId===tid; });
      addToGroup(tid, taskById(tid).name, tid, kindForTask ? kindForTask.taskKind : 'normal', null, v.primaryCount, v.lineCount, v.totalQty);
    });
  }

  var rows = Object.keys(groups).map(function(k){
    var g = groups[k];
    var laborCost = g.personHours * hourlyWage;
    var grossProfit = g.sales - laborCost;
    var margin = g.sales>0 ? (grossProfit/g.sales*100) : 0;
    return {
      key:g.key, label:g.label, productCode:g.productCode, productName:g.productName,
      shipmentCount:g.shipmentCount, poCount:g.poCount, lineCount:g.lineCount, totalQty:g.totalQty,
      caseQty:null, fractionQty:null, // 下でまとめて商品マスタ情報を取得し、あれば上書きする
      personHours:g.personHours, sales:g.sales, laborCost:laborCost, grossProfit:grossProfit, margin:margin,
      customerName:g.customerName
    };
  });

  if(axis==='product' && rows.length){
    // 商品コードをまとめて集め、1回のバッチ呼び出しで商品マスタ情報を取得する
    // (商品ごとに1件ずつ問い合わせない。getProductMasterInfoBatch側でキャッシュも効く)
    var codes = rows.map(function(r){ return r.productCode; }).filter(Boolean);
    var masterInfo = await getProductMasterInfoBatch(codes);
    rows.forEach(function(r){
      var info = r.productCode ? masterInfo[r.productCode] : null;
      if(info){
        r.caseQty = (typeof info.caseQty==='number') ? info.caseQty : null;
        r.fractionQty = (typeof info.fractionQty==='number') ? info.fractionQty : null;
      }
    });
  }

  rows.sort(function(a,b){ return b.sales-a.sales; });
  return rows;
}
function computeFinancialSummary(dateStr, day, workVolume){
  if(!hasManagerSession()) return null;
  if(!state.financialUnitPrices || !state.financialLaborCost) return null;
  var agg = aggregateDays([day]);
  var wv = workVolume || emptyWorkVolume();
  var priceMap = {};
  state.financialUnitPrices.forEach(function(p){ priceMap[p.task_id] = p; });
  var rows = [];
  var totalSales = 0;
  Object.keys(agg.perTask).forEach(function(tid){
    if(tid==='BREAK') return;
    var price = priceMap[tid];
    if(!price) return;
    var wvTotals = wvTotalsForTask(wv, tid);
    var qty = 0;
    if(price.unit_label==='ピース') qty = wvTotals.totalQty;
    else if(price.unit_label==='明細') qty = wvTotals.lineCount;
    else if(price.unit_label==='ケース'){
      var ledger = (state.vcCaseLedger && state.vcCaseLedger[tid]) || { entries: [] };
      qty = vcCaseCurrentValue(ledger.entries);
    }else{
      qty = wvTotals.primaryCount;
    }
    var sales = qty * (price.price_per_unit||0);
    totalSales += sales;
    rows.push({ taskId: tid, taskName: taskById(tid).name, qty: qty, unitLabel: price.unit_label, pricePerUnit: price.price_per_unit, sales: sales });
  });
  var totalMs = 0;
  Object.keys(agg.perStaff).forEach(function(sid){
    totalMs += Math.max(0, (agg.perStaff[sid].ms||0) - (agg.perStaff[sid].breakMs||0));
  });
  var totalHours = totalMs/3600000;
  var laborCost = totalHours * ((state.financialLaborCost && state.financialLaborCost.hourly_wage)||0);
  var grossProfit = totalSales - laborCost;
  var margin = totalSales>0 ? (grossProfit/totalSales*100) : 0;
  return { rows: rows, totalSales: totalSales, laborCost: laborCost, totalHours: totalHours, grossProfit: grossProfit, margin: margin };
}

function computeDailyChecklist(){
  var items = [];
  var day = state.day;
  var today = todayStr();
  if(!day || day.date!==today) return items;

  (day.logs||[]).forEach(function(l){
    if(l.end===null && l.taskId!=='BREAK'){
      var s = staffById(l.staffId);
      var t = taskById(l.taskId);
      items.push({
        id: 'open_log_'+l.id, title: s.name+'さんが「'+t.name+'」を作業中のまま終了していません',
        target: s.name+' / '+t.name, action: '現場で終了操作をしてもらうか、管理者が終了してください',
        canForceEnd: true, logId: l.id, staffId: l.staffId, taskId: l.taskId
      });
    }
  });

  var todayTasks = tasksForDate(today);
  var wv = state.workVolume || emptyWorkVolume();
  var agg = aggregateDays([day]);

  todayTasks.forEach(function(t){
    if(isCsvLinkedTask(t.id, wv)){
      var info = agg.perTask[t.id];
      var ms = info ? info.ms : 0;
      if(ms===0){
        items.push({
          id: 'zero_hours_'+t.id, title: '「'+t.name+'」はCSV取込済みですが、作業実績が0時間です',
          target: t.name, action: '現場で作業が開始されているか確認してください'
        });
      }
    }
    if(isVcKindTask(t.id)){
      var ledger = (state.vcCaseLedger && state.vcCaseLedger[t.id]) || {entries:[]};
      if(vcCaseCurrentValue(ledger.entries)===0){
        items.push({
          id: 'no_case_'+t.id, title: '「'+t.name+'」はVC作業ですが、ケース数が未入力です',
          target: t.name, action: '現場でケース数を入力してください'
        });
      }
    }
  });

  var attempts = (state.vcImportAttemptsToday && state.vcImportAttemptsToday.attempts) || [];
  attempts.filter(function(a){ return a.status==='pending' || a.status==='failed'; }).forEach(function(a){
    items.push({
      id: 'attempt_'+a.id,
      title: '「'+taskById(a.taskId).name+'」の取込(「'+a.fileName+'」)が'+(a.status==='failed'?'失敗しました':'確認未完了のままです'),
      target: taskById(a.taskId).name, action: '取込をやり直すか、内容を確認してください'
    });
  });

  (wv.imports||[]).filter(function(i){ return i.deletedAt; }).forEach(function(imp){
    items.push({
      id: 'deleted_import_'+imp.id,
      title: '「'+taskById(imp.taskId).name+'」に削除済みの取込データがあります(「'+imp.fileName+'」)',
      target: taskById(imp.taskId).name, action: '誤って削除していないか確認してください(削除済みタブから復元できます)'
    });
  });

  var ack = (state.dailyChecklistAck && state.dailyChecklistAck.ack) || {};
  return items.filter(function(item){ return !ack[item.id]; });
}
function renderDailyChecklist(){
  var items = computeDailyChecklist();
  if(!items.length) return '';
  var rows = items.map(function(item){
    var forceEndBtn = item.canForceEnd ? '<button type="button" class="vc-manage-toggle-btn" data-checklist-force-end="'+item.logId+'|'+item.staffId+'|'+item.taskId+'">管理者が作業を終了する</button>' : '';
    return '<div class="checklist-item">'+

  }).join('');

    '<div class="panel-title">⚠️ 本日の確認事項 <span class="count-badge">'+items.length+'件</span></div>'+

function bindCustomerMappingPanel(){
  var nameInput = document.getElementById('customerMappingNameInput');
  var taskSelect = document.getElementById('customerMappingTaskSelect');
  if(nameInput){
    nameInput.addEventListener('focusin', function(){ state.suppressRender = true; });
    nameInput.addEventListener('focusout', function(){ setTimeout(function(){ state.suppressRender = false; }, 150); });
    nameInput.addEventListener('input', function(){ state.customerMappingDraftName = nameInput.value; });
  }
  if(taskSelect){
    taskSelect.addEventListener('change', function(){ state.customerMappingDraftTaskId = taskSelect.value; });
  }
  var saveBtn = document.getElementById('customerMappingSaveBtn');
  if(saveBtn){
    saveBtn.addEventListener('click', async function(){
      var name = (nameInput.value||'').trim();
      var taskId = taskSelect.value;
      if(!name){ showToast('得意先名を入力してください'); return; }
      if(!taskId){ showToast('作業枠を選択してください'); return; }
      if(!state.customerTaskMapping) state.customerTaskMapping = { entries: [] };
      var editingId = state.customerMappingEditingId;
      if(editingId){
        var entry = state.customerTaskMapping.entries.find(function(e){ return e.id===editingId; });
        if(entry){
          var before = entry.customerName+' → '+taskById(entry.taskId).name;
          entry.customerName = name;
          entry.taskId = taskId;
          await appendAuditLog({ action:'得意先マスター編集', target: name, before: before, after: name+' → '+taskById(taskId).name });
        }
        state.customerMappingEditingId = null;
      }else{
        state.customerTaskMapping.entries.push({ id: uid(), customerName: name, taskId: taskId, enabled: true });
        await appendAuditLog({ action:'得意先マスター追加', target: name, before: null, after: name+' → '+taskById(taskId).name });
      }
      await saveCustomerTaskMapping(state.customerTaskMapping);
      state.customerMappingDraftName = '';
      state.customerMappingDraftTaskId = '';
      state.suppressRender = false;
      showToast('保存しました');
      render();
    });
  }
  var cancelEditBtn = document.getElementById('customerMappingCancelEditBtn');
  if(cancelEditBtn){
    cancelEditBtn.addEventListener('click', function(){
      state.customerMappingEditingId = null;
      state.customerMappingDraftName = '';
      state.customerMappingDraftTaskId = '';
      render();
    });
  }
  document.querySelectorAll('[data-mapping-edit]').forEach(function(el){
    el.addEventListener('click', function(){
      state.customerMappingEditingId = el.getAttribute('data-mapping-edit');
      render();
    });
  });
  document.querySelectorAll('[data-mapping-toggle]').forEach(function(el){
    el.addEventListener('click', async function(){
      var id = el.getAttribute('data-mapping-toggle');
      var entry = state.customerTaskMapping.entries.find(function(e){ return e.id===id; });
      if(!entry) return;
      entry.enabled = !entry.enabled;
      await saveCustomerTaskMapping(state.customerTaskMapping);
      await appendAuditLog({ action:'得意先マスター状態変更', target: entry.customerName, before:null, after: entry.enabled?'有効':'無効' });
      render();
    });
  });
  document.querySelectorAll('[data-mapping-delete]').forEach(function(el){
    el.addEventListener('click', async function(){
      var id = el.getAttribute('data-mapping-delete');
      var entry = state.customerTaskMapping.entries.find(function(e){ return e.id===id; });
      if(!entry) return;
      if(!confirm('「'+entry.customerName+'」の紐付けを削除しますか?')) return;
      state.customerTaskMapping.entries = state.customerTaskMapping.entries.filter(function(e){ return e.id!==id; });
      await saveCustomerTaskMapping(state.customerTaskMapping);
      await appendAuditLog({ action:'得意先マスター削除', target: entry.customerName, before: entry.customerName+' → '+taskById(entry.taskId).name, after:'削除' });
      showToast('削除しました');
      render();
    });
  });
}
function bindCsvImportPanel(){
  var wvManualDetails = document.getElementById('wvManualDetails');
  if(wvManualDetails){
    wvManualDetails.addEventListener('toggle', function(){
      state.wvManualOpen = wvManualDetails.open;
    });
  }
  var wvHistoryDetails = document.getElementById('wvHistoryDetails');
  if(wvHistoryDetails){
    wvHistoryDetails.addEventListener('toggle', function(){
      state.wvHistoryOpen = wvHistoryDetails.open;
    });
  }
  var wvTaskSelect = document.getElementById('wvTaskSelect');
  if(wvTaskSelect) wvTaskSelect.addEventListener('change', function(){
    state.wvImportTaskId = wvTaskSelect.value;
    render();
  });
  var wvTargetDateInput = document.getElementById('wvTargetDate');
  if(wvTargetDateInput){
    wvTargetDateInput.addEventListener('change', async function(){
      var newDate = wvTargetDateInput.value || todayStr();
      state.wvTargetDate = newDate;
      state.wvViewData = await getWorkVolumeForDate(newDate);
      render();
    });
  }
  var autoMapTargetDateInput = document.getElementById('autoMapTargetDate');
  if(autoMapTargetDateInput){
    autoMapTargetDateInput.addEventListener('change', function(){
      state.wvTargetDate = autoMapTargetDateInput.value || todayStr();
    });
  }
  var autoMapCsvInput = document.getElementById('autoMapCsvInput');
  if(autoMapCsvInput){
    autoMapCsvInput.addEventListener('change', async function(){
      var file = autoMapCsvInput.files[0];
      if(!file) return;
      var targetDate = (autoMapTargetDateInput && autoMapTargetDateInput.value) || state.wvTargetDate || todayStr();
      state.autoMapImporting = true;
      render();

      var fingerprint, fileSize = file.size, fileName = file.name;
      try{
        fingerprint = await computeFileFingerprint(file);
      }catch(e){
        state.autoMapImporting = false;
        showToast('ファイルの読み取りに失敗しました');
        autoMapCsvInput.value = '';
        render();
        return;
      }
      var fpIndex = await loadCsvFingerprintIndex();
      var dup = findDuplicateFingerprint(fpIndex, fingerprint, fileSize, fileName);
      if(dup){
        state.autoMapImporting = false;
        autoMapCsvInput.value = '';
        alert('このファイル(「'+fileName+'」)は '+dup.date+' に既に取り込み済みです。同じファイルの二重取込はできません。');
        render();
        return;
      }

      var mapping = state.customerTaskMapping || await loadCustomerTaskMapping();
      state.customerTaskMapping = mapping;

      parseCsvForWorkVolume(file, {}, function(result){
        var plan = buildAutoMappedImportPlan(result, mapping);
        state.autoMapPreviewData = {
          fileName: fileName, targetDate: targetDate, fingerprint: fingerprint, fileSize: fileSize,
          rowCount: result.rowCount, missingColumns: result.missingColumns||[],
          rawParseResult: result,
          taskPlans: plan.taskPlans, unmapped: plan.unmapped
        };
        state.autoMapImporting = false;
        autoMapCsvInput.value = '';
        state.modal = { kind:'autoMapPreview' };
        render();
      }, function(errMsg){
        state.autoMapImporting = false;
        autoMapCsvInput.value = '';
        showToast(errMsg);
        render();
      });
    });
  }
  var wvCsvInput = document.getElementById('wvCsvInput');
  if(wvCsvInput){
    wvCsvInput.addEventListener('change', async function(){
      var file = wvCsvInput.files[0];
      if(!file) return;
      var taskId = state.wvImportTaskId || (document.getElementById('wvTaskSelect') ? document.getElementById('wvTaskSelect').value : '');
      if(!taskId){ showToast('対象作業を選択してください'); wvCsvInput.value=''; return; }
      var targetDate = state.wvTargetDate || todayStr();
      var cfg = { taskKind: taskById(taskId).taskKind || 'normal' };
      state.wvImporting = true;
      render();

      var fingerprint, fileSize = file.size, fileName = file.name;
      try{
        fingerprint = await computeFileFingerprint(file);
      }catch(e){
        state.wvImporting = false;
        showToast('ファイルの読み取りに失敗しました');
        wvCsvInput.value = '';
        render();
        return;
      }
      var fpIndex = await loadCsvFingerprintIndex();
      var dup = findDuplicateFingerprint(fpIndex, fingerprint, fileSize, fileName);
      if(dup){
        state.wvImporting = false;
        wvCsvInput.value = '';
        alert('このファイル(「'+fileName+'」)は '+dup.date+' に既に取り込み済みです。同じファイルの二重取込はできません。\n\n誤って取り込んだ場合は、その取込履歴を削除してから、正しいファイルを取り込み直してください。');
        render();
        return;
      }

      var targetData = await getWorkVolumeForDate(targetDate);
      var attemptId = uid();
      var attemptsData = await loadVcImportAttempts(targetDate);
      attemptsData.attempts.push({ id: attemptId, taskId: taskId, startedAt: new Date().toISOString(), status:'pending', fileName: fileName });
      await saveVcImportAttempts(targetDate, attemptsData);
      if(targetDate===todayStr()) state.vcImportAttemptsToday = attemptsData;

      parseCsvForWorkVolume(file, {}, async function(result){
        var importId = uid();
        var newBatches = [];
        var shipperNos = result.shipperGroups.map(function(g){ return g.shipperNo; });
        var prevImport = findPreviousImportForTaskDate(targetData, taskId, importId);
        var anomaly = computeAnomalyWarning({primaryCount:result.primaryCount, lineCount:result.lineCount, totalQty:result.totalQty}, prevImport);
        var overlap = findShipperNoOverlap(shipperNos, targetData, taskId, importId);
        state.vcPreview = {
          taskId: taskId, importId: importId, fileName: fileName, cfg: cfg, targetDate: targetDate,
          attemptId: attemptId,
          primaryCount: result.primaryCount, lineCount: result.lineCount, totalQty: result.totalQty,
          batches: newBatches, shipperNos: shipperNos,
          fingerprint: fingerprint, fileSize: fileSize,
          missingColumns: result.missingColumns||[], anomaly: anomaly, overlap: overlap,
          byCustomer: result.byCustomer||{}, byProduct: result.byProduct||{}
        };
        state.wvImporting = false;
        wvCsvInput.value = '';
        state.modal = { kind:'vcPreview' };
        render();
      }, async function(errMsg){
        await markImportAttemptStatus(targetDate, attemptId, 'failed');
        state.wvImporting = false;
        showToast(errMsg);
        render();
      });
    });
  }
  document.querySelectorAll('[data-wv-import-delete]').forEach(function(el){
    el.addEventListener('click', async function(){
      var importId = el.getAttribute('data-wv-import-delete');
      var viewDate = state.wvTargetDate || todayStr();
      var data = state.wvViewData || (viewDate===todayStr() ? state.workVolume : null);
      var imp = data && data.imports.find(function(i){ return i.id===importId; });
      if(!imp) return;
      if(!confirm('この取込(「'+imp.fileName+'」)を削除しますか?(論理削除。あとで復元できます)')) return;
      var reason = prompt('削除理由を入力してください(任意)', '') || '';
      await deleteWvImport(viewDate, importId, reason);
      await appendAuditLog({ action:'作業量取込削除', target: taskById(imp.taskId).name+' / '+imp.fileName, before:'有効', after:'削除(理由: '+reason+')' });
      showToast('取込を削除しました');
      render();
    });
  });
  document.querySelectorAll('[data-wv-import-restore]').forEach(function(el){
    el.addEventListener('click', async function(){
      var importId = el.getAttribute('data-wv-import-restore');
      var viewDate = state.wvTargetDate || todayStr();
      var data = state.wvViewData || (viewDate===todayStr() ? state.workVolume : null);
      var imp = data && data.imports.find(function(i){ return i.id===importId; });
      if(!imp) return;
      await restoreWvImport(viewDate, importId);
      await appendAuditLog({ action:'作業量取込復元', target: taskById(imp.taskId).name+' / '+imp.fileName, before:'削除', after:'復元' });
      showToast('取込を復元しました');
      render();
    });
  });
  document.querySelectorAll('[data-wv-import-move]').forEach(function(el){
    el.addEventListener('click', async function(){
      var importId = el.getAttribute('data-wv-import-move');
      var viewDate = state.wvTargetDate || todayStr();
      var newDate = prompt('移動先の日付を入力してください(例: 2026-09-10)', viewDate);
      if(!newDate) return;
      var result = await moveWvImportDate(viewDate, newDate, importId);
      if(!result.ok){ showToast(result.msg); return; }
      await appendAuditLog({ action:'作業量取込の日付変更', target: taskById(result.imp.taskId).name+' / '+result.imp.fileName, before: viewDate, after: newDate });
      showToast('取込の対象日付を'+newDate+'に変更しました');
      render();
    });
  });
}
function renderStaffSettingsPanel(){

    var pattern = s.pattern || defaultPattern();

      return '<button class="pattern-day '+(v?'on':'')+'" data-pattern-toggle="'+s.id+'|'+i+'">'+WD[i]+'</button>';
    }).join('');
    var currentAvatarColor = avatarColorForStaff(s);

    }).join('');

      '</div>'+
      '<div class="pattern-row">'+dayToggles+'</div>'+

      overtimeRow+
      '<div class="avatar-swatch-row" title="アバターカラー(累計実績画面のキャラクターの色)">'+avatarSwatches+'</div>'+
    '</div>';
  }).join('') || '<div class="empty-note">スタッフを登録してください。</div>';

  return '<div class="panel">'+

    '<div class="pool-hint" style="margin-bottom:8px;">曜日ボタンで通常の出勤パターンを設定。本日の出退勤はボタンで個別に切替できます。</div>'+
    '<div class="roster-list">'+rosterHtml+'</div>'+
    '<div class="add-row">'+
      '<input type="text" id="newStaffInput" placeholder="名前を入力" value="'+esc(state.newStaffDraftName)+'">'+
      '<button class="add-btn" id="addStaffBtn">追加</button>'+

  '</div>';

function bindStaffSettingsPanel(){
  document.querySelectorAll('[data-toggle-att]').forEach(function(el){
    el.addEventListener('click', async function(){
      var id = el.getAttribute('data-toggle-att');
      var day = state.day;
      var before = !!day.attendance[id];
      day.attendance[id] = !day.attendance[id];
      await saveDay(day);
      await appendAuditLog({ action:'出勤状態変更', target: staffById(id).name, before: (before?'出勤中':'欠勤'), after: (day.attendance[id]?'出勤中':'欠勤') });
      render();
    });
  });
  document.querySelectorAll('[data-del-staff]').forEach(function(el){
    el.addEventListener('click', async function(){
      var id = el.getAttribute('data-del-staff');
      var s = state.roster.find(function(s){ return s.id===id; });
      if(!s) return;
      if(!confirm('スタッフ「'+s.name+'」を削除しますか?(名簿から非表示になります。過去の記録は残ります)')) return;
      s.archived = true;
      await saveRoster(state.roster);
      await appendAuditLog({ action:'スタッフ削除', target: s.name, before:'在籍', after:'削除(名簿非表示)' });
      render();
      showToast('「'+s.name+'」を削除しました', '元に戻す', async function(){
        var cur = state.roster.find(function(x){ return x.id===id; });
        if(cur){
          cur.archived = false;
          await saveRoster(state.roster);
          await appendAuditLog({ action:'スタッフ削除の取り消し', target: cur.name, before:'削除(名簿非表示)', after:'在籍' });
          render();
        }
      });
    });
  });
  var newStaffInput = document.getElementById('newStaffInput');
  var addStaffBtn = document.getElementById('addStaffBtn');
  function staffFocusGuard(el){
    el.addEventListener('focusin', function(){ state.suppressRender = true; });
    el.addEventListener('focusout', function(){ setTimeout(function(){ state.suppressRender = false; }, 150); });
  }
  if(newStaffInput){
    staffFocusGuard(newStaffInput);
    newStaffInput.addEventListener('input', function(){ state.newStaffDraftName = newStaffInput.value; });
    newStaffInput.addEventListener('keydown', function(e){ if(e.key==='Enter') addStaffBtn.click(); });
  }
  if(addStaffBtn){
    addStaffBtn.addEventListener('click', async function(){
      var name = (newStaffInput.value||'').trim();
      if(!name) return;
      state.roster.push({id:uid(), name:name, archived:false, pattern:defaultPattern()});
      state.newStaffDraftName = '';
      state.suppressRender = false;
      await saveRoster(state.roster);
      render();
    });
  }
  document.querySelectorAll('[data-pattern-toggle]').forEach(function(el){
    el.addEventListener('click', async function(){
      var parts = el.getAttribute('data-pattern-toggle').split('|');
      var sid = parts[0], idx = parseInt(parts[1],10);
      var s = state.roster.find(function(s){ return s.id===sid; });
      if(!s) return;
      var pattern = (s.pattern || defaultPattern()).slice();
      pattern[idx] = !pattern[idx];
      s.pattern = pattern;
      await saveRoster(state.roster);
      render();
    });
  });
  document.querySelectorAll('[data-avatar-color]').forEach(function(el){
    el.addEventListener('click', async function(){
      var parts = el.getAttribute('data-avatar-color').split('|');
      var sid = parts[0], color = parts[1];
      var s = state.roster.find(function(s){ return s.id===sid; });
      if(!s) return;
      s.avatarColor = color;
      await saveRoster(state.roster);
      render();
    });
  });
  document.querySelectorAll('[data-holiday-off-toggle]').forEach(function(el){
    el.addEventListener('click', async function(){
      var sid = el.getAttribute('data-holiday-off-toggle');
      var s = state.roster.find(function(s){ return s.id===sid; });
      if(!s) return;
      s.offOnHolidays = !s.offOnHolidays;
      await saveRoster(state.roster);
      render();
    });
  });
  document.querySelectorAll('[data-overtime-end]').forEach(function(el){
    el.addEventListener('focusin', function(){ state.suppressRender = true; });
    el.addEventListener('focusout', function(){ setTimeout(function(){ state.suppressRender = false; }, 150); });
    el.addEventListener('change', async function(){
      var sid = el.getAttribute('data-overtime-end');
      var day = state.day;
      if(!day.shiftEndOverrides) day.shiftEndOverrides = {};
      if(el.value){
        day.shiftEndOverrides[sid] = el.value;
      }else{
        delete day.shiftEndOverrides[sid];
      }
      state.suppressRender = false;
      await saveDay(day);
      render();
    });
  });
}

  }

  var roster = activeRoster();
  var present = presentStaffForDay(day);
  var tasks = tasksForDate(viewDate).slice().sort(byTaskColor(function(t){ return t.color; }));
  var WD = ['日','月','火','水','木','金','土'];

  var dateNav = '<div class="date-nav">'+
    '<button class="date-nav-btn" id="dateNavPrev" title="前の日">&#8592;</button>'+
    '<input type="date" id="dateNavInput" value="'+viewDate+'" class="date-nav-input">'+
    '<button class="date-nav-btn" id="dateNavNext" title="次の日">&#8594;</button>'+
    (isToday ? '<span class="date-nav-today-badge">本日</span>' : '<button class="date-nav-today-btn" id="dateNavToday">本日に戻る</button>')+
  '</div>';


  var poolHtml = present.map(function(s){
    var isUnassigned = !(day.assignments[s.id]||[]).length;
    return '<div class="chip '+(isUnassigned?'chip-warn':'')+'" draggable="true" data-staff-chip="'+s.id+'"><span class="chip-dot"></span>'+esc(s.name)+(isUnassigned?' <span class="chip-warn-label">未割当</span>':'')+'</div>';
  }).join('') || '<div class="pool-hint">出勤中のスタッフがここに表示されます</div>';

  var unassignedStaff = present.filter(function(s){ return !(day.assignments[s.id]||[]).length; });
  var unassignedBanner = unassignedStaff.length ? (
    '<div class="warn-banner">⚠️ 未割り当てのスタッフが'+unassignedStaff.length+'人います: '+
    unassignedStaff.map(function(s){ return esc(s.name); }).join('、')+
    '</div>'
  ) : '';

  var brokenAssignStaff = [];
  present.forEach(function(s){
    var assigned = day.assignments[s.id]||[];
    var missingTaskIds = assigned.filter(function(tid){
      return tid!=='BREAK' && !state.backlog.some(function(t){ return t.id===tid; });
    });
    if(missingTaskIds.length) brokenAssignStaff.push({staff:s, count:missingTaskIds.length, ids:missingTaskIds});
  });
  var brokenBanner = brokenAssignStaff.length ? (
    '<div class="warn-banner warn-banner-danger">🛑 データの不整合があります。以下のスタッフの割り当てが、存在しない作業を指しています(データ消失の影響の可能性):<br>'+
    brokenAssignStaff.map(function(x){ return esc(x.staff.name)+'('+x.count+'件)'; }).join('、')+
    '<br>この状態だと、該当のスタッフは作業実績入力画面でその作業がタップできません。下のボタンで、壊れた割り当てを外したうえで、本日の有効な作業に自動で割り当て直せます。<button type="button" class="warn-fix-btn" id="clearBrokenAssignBtn">壊れた割り当てを修復する(本日の作業に再割り当て)</button>'+
    '</div>'
  ) : '';

  var colsHtml = tasks.map(function(t, idx){
    var assignedNames = roster.filter(function(s){
      return (day.assignments[s.id]||[]).indexOf(t.id) !== -1;
    });
    var chips = assignedNames.map(function(s){
      return '<div class="task-chip">'+esc(s.name)+'<button data-unassign="'+s.id+'|'+t.id+'" title="'+esc(s.name)+'を「'+esc(t.name)+'」から外す" aria-label="'+esc(s.name)+'を「'+esc(t.name)+'」から外す">&times;</button></div>';
    }).join('') || '<span class="pool-hint" style="margin:0;">ここにスタッフをドラッグ</span>';
    return '<div class="task-col" data-task-col="'+t.id+'">'+
      '<div class="task-col-head">'+
        '<span class="task-color-dot" style="background:'+t.color+'"></span>'+
        '<span class="task-col-name">'+esc(t.name)+'</span>'+
        csvLinkBadge(t.id, managerActiveWorkVolume())+
        '<button class="task-col-edit" data-edit-task-col="'+t.id+'" title="編集">✎</button>'+
        '<button class="task-col-del" data-del-task="'+t.id+'" title="'+esc(t.name)+'を削除" aria-label="'+esc(t.name)+'を削除">&times;</button>'+
      '</div>'+
      '<div class="task-col-unit">単位: '+esc(t.unit)+'</div>'+
      '<button class="assign-all-btn" data-assign-all="'+t.id+'">出勤者'+present.length+'人を全員割り当て</button>'+
      '<div class="task-col-body" style="margin-top:10px;">'+chips+'</div>'+
    '</div>';
  }).join('');

  var newTaskForm = state.newTaskColIndex>=0 ? renderTaskForm() : '<button class="new-task-btn" id="addTaskBtn">+ 作業を追加</button>';

  var logsSorted = (day.logs||[]).slice().sort(function(a,b){
    var ci = colorSortIndex(taskById(a.taskId).color) - colorSortIndex(taskById(b.taskId).color);
    if(ci!==0) return ci;
    return new Date(a.start)-new Date(b.start);
  });
  var logRows = logsSorted.map(function(l){
    var s = staffById(l.staffId);
    var t = taskById(l.taskId);
    var endLabel = l.end ? fmtClock(l.end) : '<span style="color:var(--green-500);font-weight:700;">作業中</span>';
    var hasSubcats = t.subcategories && t.subcategories.length;
    var qtyLabel;
    if(l.taskId==='BREAK'){
      qtyLabel = '-';
    }else if(hasSubcats){
      var unitGroups = unitGroupedTotals(l.breakdown, t);
      var totalStr = formatUnitGroupedTotals(unitGroups, true);
      if(l.end){
        qtyLabel = totalStr;
      }else{
        qtyLabel = '<span style="color:var(--rust-600);font-size:12px;font-weight:700;">進行中'+(totalStr?' '+totalStr:'')+'</span>';
      }
    }else if(l.end){
      qtyLabel = (l.quantity||0)+esc(t.unit);
    }else if(l.quantity){
      qtyLabel = '<span style="color:var(--rust-600);">'+(l.quantity||0)+esc(t.unit)+' (進行中)</span>';
    }else{
      qtyLabel = '-';
    }
    var detailHtml = breakdownDetailRows(l, t);
    var hasBreakdownQty = l.breakdown && Object.keys(l.breakdown).some(function(k){ return l.breakdown[k]>0; });
    var hasSubTimes = l.subTimes && Object.keys(l.subTimes).some(function(k){ return l.subTimes[k]>0; });
    var missingTimeWarning = (l.end && hasBreakdownQty && !hasSubTimes) ? '<div class="missing-subtime-warning" title="内訳の計測時間が記録されていません(手動追加・編集・修正前のデータの可能性)">⚠️ 内訳の時間未計測</div>' : '';
    var stopBtn = l.end ? '' : '<button class="log-stop-btn" data-stop-log="'+l.id+'">■ ストップ</button>';
    return '<tr>'+
      '<td>'+esc(s.name)+'</td>'+
      '<td><span class="task-color-dot" style="background:'+t.color+'"></span> '+esc(t.name)+'</td>'+
      '<td class="num">'+fmtClock(l.start)+'</td>'+
      '<td class="num">'+endLabel+'</td>'+
      '<td class="num">'+qtyLabel+detailHtml+missingTimeWarning+'</td>'+
      '<td class="num">'+stopBtn+'<button class="log-edit-btn" data-edit-log="'+l.id+'">編集</button></td>'+
    '</tr>';
  }).join('') || '<tr><td colspan="6" style="color:var(--slate-500);">この日の記録はまだありません</td></tr>';

  // ---- ダッシュボード要約(その日の状況を数秒で把握できるように) ----
  var activeStaffIds = {}, breakStaffIds = {};
  (day.logs||[]).forEach(function(l){
    if(l.end!==null) return;
    if(l.taskId==='BREAK') breakStaffIds[l.staffId] = true;
    else activeStaffIds[l.staffId] = true;
  });
  var activeCount = Object.keys(activeStaffIds).length;
  var breakCount = Object.keys(breakStaffIds).length;
  var idleCount = Math.max(0, present.length - activeCount - breakCount);
  var totalLoggedMs = 0;
  (day.logs||[]).forEach(function(l){
    var end = l.end ? new Date(l.end) : (isToday ? new Date() : new Date(l.start));
    totalLoggedMs += Math.max(0, end - new Date(l.start));
  });
  var totalLoggedHours = (totalLoggedMs/3600000).toFixed(1);
  var dashboardBar = '<div class="dash-summary">'+
    '<div class="dash-stat"><div class="dash-stat-value">'+tasks.length+'</div><div class="dash-stat-label">本日の作業</div></div>'+
    '<div class="dash-stat"><div class="dash-stat-value">'+present.length+'</div><div class="dash-stat-label">出勤者</div></div>'+
    '<div class="dash-stat dash-stat-working"><div class="dash-stat-value">'+activeCount+'</div><div class="dash-stat-label">● 作業中</div></div>'+
    '<div class="dash-stat dash-stat-idle"><div class="dash-stat-value">'+idleCount+'</div><div class="dash-stat-label">○ 未着手</div></div>'+
    '<div class="dash-stat dash-stat-break"><div class="dash-stat-value">'+breakCount+'</div><div class="dash-stat-label">⏸ 休憩中</div></div>'+
    '<div class="dash-stat"><div class="dash-stat-value">'+totalLoggedHours+'h</div><div class="dash-stat-label">実績時間(合計)</div></div>'+
  '</div>';

  return ''+
  '<div class="mgr-wrap">'+
    (isToday ? renderDailyChecklist() : '')+
    dashboardBar+
    dateNav+
    unassignedBanner+
    brokenBanner+
    '<div class="mgr-grid">'+
      '<div class="panel">'+
        '<div class="panel-title">出勤スタッフ <span class="count-badge">'+present.length+' / '+roster.length+'</span></div>'+
        '<div class="pool-hint" style="margin-bottom:8px;">出勤の切替・出勤パターン・スタッフの追加は「設定 → スタッフ設定」に移動しました。</div>'+
        '<button type="button" class="vc-manage-toggle-btn" id="goToStaffSettingsBtn">⚙️ スタッフ設定を開く</button>'+
      '</div>'+
      '<div class="panel">'+
        '<div class="panel-title">'+esc(dateLabelFromStr(viewDate))+'の作業 <span class="count-badge">'+tasks.length+'件</span></div>'+
        '<div class="pool-hint" style="margin-bottom:8px;">作業登録画面でこの日付の作業として登録されたものが並びます。急ぎの作業はここから直接追加できます。</div>'+
        '<div class="task-board">'+colsHtml+newTaskForm+'</div>'+
        '<div class="staff-pool">'+
          '<div class="pool-hint">出勤中スタッフ(ドラッグして作業に割り当て)</div>'+
          poolHtml+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="panel" style="margin-top:20px;">'+
      '<div class="panel-title">作業実績(この日の記録) <span class="count-badge">'+logsSorted.length+'件</span></div>'+
      '<div class="pool-hint" style="margin-bottom:10px;">パートさんが入力した内容に誤りがあれば「編集」から修正できます。パートさんが入力し忘れた実績は「+ 実績を手動で追加」から入力できます。</div>'+
      '<button class="add-btn" id="openAddLogBtn" style="margin-bottom:12px;">+ 実績を手動で追加</button>'+
      '<div style="overflow-x:auto;"><table class="report-table"><thead><tr><th>スタッフ</th><th>作業</th><th>開始</th><th>終了</th><th>件数</th><th></th></tr></thead><tbody>'+logRows+'</tbody></table></div>'+
    '</div>'+
    '<div class="pool-hint" style="margin-top:16px;text-align:center;">自動出退勤・休憩・CSV取込バッチ管理・実績目標・管理者PINは、トップ画面の「⚙️ 設定」から変更できます。</div>'+
  '</div>';
}

function renderCsvImportPanel(){
  var wvTargetDate = state.wvTargetDate || todayStr();
  var workVolumePanel = '';
  if(!state.workVolume) state.workVolume = emptyWorkVolume();
  var wvViewData = state.wvViewData || (wvTargetDate===todayStr() ? state.workVolume : emptyWorkVolume());
  var wvDateTasks = tasksForDate(wvTargetDate);
  if(state.wvImportTaskId===null){
    state.wvImportTaskId = wvDateTasks[0] ? wvDateTasks[0].id : '';
  }
  var wvTaskId = state.wvImportTaskId;
  var wvTask = taskById(wvTaskId);
  var wvTaskOptions = wvDateTasks.map(function(t){
    return '<option value="'+t.id+'" '+(wvTaskId===t.id ? 'selected':'')+'>'+esc(t.name)+'</option>';
  }).join('') || '<option value="">この日付の作業がありません</option>';
  var wvPrimaryLabel = (wvTask.taskKind==='vc') ? 'PO数' : '件数';
  var wvTotals = wvTotalsForTask(wvViewData, wvTaskId);

  var wvStatusHtml = '';
  if(wvTotals.importCount){
    wvStatusHtml = '<div class="vc-import-status">「'+esc(wvTask.name)+'」の'+esc(dateLabelFromStr(wvTargetDate))+'の作業量(取込'+wvTotals.importCount+'回の合計): '+wvPrimaryLabel+' '+formatNum(wvTotals.primaryCount)+' / 明細 '+formatNum(wvTotals.lineCount)+' / ピース '+formatNum(wvTotals.totalQty)+'</div>';
  }

  var wvImportRows = wvActiveImports(wvViewData).filter(function(i){ return i.taskId===wvTaskId; }).map(function(imp){
    var lbl = imp.taskKind==='vc' ? 'PO数' : '件数';
    return '<tr>'+
      '<td>'+fmtClock(imp.importedAt)+'</td>'+
      '<td>'+esc(imp.fileName)+'</td>'+
      '<td class="num">'+lbl+' '+formatNum(imp.primaryCount)+'</td>'+
      '<td class="num">明細'+formatNum(imp.lineCount)+'</td>'+
      '<td class="num">ピース'+formatNum(imp.totalQty)+'</td>'+
      '<td class="num"><button type="button" class="vc-manage-toggle-btn" data-wv-import-move="'+imp.id+'">日付変更</button> <button type="button" class="log-stop-btn" data-wv-import-delete="'+imp.id+'">削除</button></td>'+
    '</tr>';
  }).join('') || '<tr><td colspan="6" style="color:var(--slate-500);">この作業の取込履歴はまだありません</td></tr>';
  var wvDeletedImports = (wvViewData.imports||[]).filter(function(i){ return i.deletedAt && i.taskId===wvTaskId; });
  var wvDeletedHtml = wvDeletedImports.map(function(imp){
    return '<div class="vc-slip-row">'+esc(imp.fileName)+'(削除: '+fmtClock(imp.deletedAt)+') <button type="button" class="vc-manage-toggle-btn" data-wv-import-restore="'+imp.id+'">復元</button></div>';
  }).join('') || '<div class="empty-note">削除済みの取込はありません</div>';

  var wvHistoryHtml = '<details class="vc-manage-details" id="wvHistoryDetails" '+(state.wvHistoryOpen?'open':'')+'>'+
    '<summary>取込履歴・削除済み(この作業)</summary>'+
    '<div style="margin-top:10px;overflow-x:auto;"><table class="report-table"><thead><tr><th>取込日時</th><th>ファイル名</th><th>合計</th><th>明細</th><th>ピース</th><th></th></tr></thead><tbody>'+wvImportRows+'</tbody></table></div>'+
    '<div class="vc-queue-title" style="margin-top:12px;">削除済み</div><div class="vc-slip-list">'+wvDeletedHtml+'</div>'+
  '</details>';

  workVolumePanel = '<div class="panel" style="margin-top:14px;">'+
    '<div class="panel-title">📋 作業量CSV取込</div>'+
    '<div class="pool-hint" style="margin-bottom:14px;">CSVから件数(VCはPO数)・明細数・ピース数を自動集計し、作業枠に紐づけて表示します。時間の計測とは別のデータとして扱われ、パートさんへの数字入力は求めません。取込は履歴として積み上がり、既存の取込を上書きすることはありません。</div>'+
    '<div class="panel-title" style="font-size:15px;">🔗 得意先マスターで自動振り分けて取り込む</div>'+
    '<div class="pool-hint" style="margin-bottom:10px;">対象作業を選ばずにCSVを取り込み、「設定→得意先・作業枠マスター」の対応表から自動的に作業枠を判定します。マスターに無い得意先は取り込まれず、一覧で確認できます。</div>'+
    '<div style="display:flex;gap:10px;">'+
      '<div style="flex:1;"><label style="font-size:11px;color:var(--slate-500);display:block;margin-bottom:4px;">対象日付</label><input type="date" id="autoMapTargetDate" value="'+(state.wvTargetDate||todayStr())+'" style="width:100%;border:1px solid var(--paper-line);border-radius:8px;padding:8px;"></div>'+
      '<div style="flex:2;"><label style="font-size:11px;color:var(--slate-500);display:block;margin-bottom:4px;">CSVファイル</label><input type="file" id="autoMapCsvInput" accept=".csv" style="display:block;"></div>'+
    '</div>'+
    (state.autoMapImporting ? '<div class="empty-note">解析中...</div>' : '')+
    '<details class="vc-manage-details" id="wvManualDetails" '+(state.wvManualOpen?'open':'')+' style="margin-top:18px;padding-top:16px;border-top:1px solid var(--paper-line);">'+
      '<summary>✋ 作業を指定して手動で取り込む(通常は上の自動振り分けをお使いください)</summary>'+
      '<div style="margin-top:10px;">'+
        '<div class="pool-hint" style="margin-bottom:10px;">件数/PO数の種別は、各作業の編集画面(通常/VC)で設定してください。</div>'+
        '<label style="font-size:11px;color:var(--slate-500);display:block;margin:10px 0 4px;">対象作業</label>'+
        '<select id="wvTaskSelect" style="width:100%;border:2px solid var(--paper-line);border-radius:10px;padding:10px;font-size:14px;margin-bottom:10px;">'+wvTaskOptions+'</select>'+
        wvStatusHtml+
        '<div style="margin-top:12px;display:flex;gap:10px;">'+
          '<div style="flex:1;"><label style="font-size:11px;color:var(--slate-500);display:block;margin-bottom:4px;">対象日付</label><input type="date" id="wvTargetDate" value="'+(state.wvTargetDate||todayStr())+'" style="width:100%;border:1px solid var(--paper-line);border-radius:8px;padding:8px;"></div>'+
          '<div style="flex:2;"><label style="font-size:11px;color:var(--slate-500);display:block;margin-bottom:4px;">CSVファイル</label><input type="file" id="wvCsvInput" accept=".csv" style="display:block;"></div>'+
        '</div>'+
        (state.wvImporting ? '<div class="empty-note">取り込み中...</div>' : '')+
        wvHistoryHtml+
      '</div>'+
    '</details>'+
  '</div>';

  return workVolumePanel;
}

/* ---------- REGISTER (task registration by employees) ---------- */
function tomorrowStr(){
  var d = new Date();
  d.setDate(d.getDate()+1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function dateLabelFromStr(dateStr){
  var d = new Date(dateStr+'T00:00:00');
  var WD = ['日','月','火','水','木','金','土'];
  var label = (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')';
  if(dateStr===todayStr()) label += ' ・本日';
  return label;
}
function renderRegister(){
  if(!state.regNewDate) state.regNewDate = tomorrowStr();
  if(state.regSearchQuery===undefined) state.regSearchQuery = '';
  var swatches = TASK_COLORS.map(function(c){
    return '<div class="swatch '+(state.newTaskColor===c.hex?'sel':'')+'" style="background:'+c.hex+'" data-color-swatch="'+c.hex+'"></div>';
  }).join('');

  var query = state.regSearchQuery.trim().toLowerCase();
  var upcoming = activeBacklog().filter(function(t){ return t.workDate >= todayStr(); })
    .filter(function(t){ return !query || t.name.toLowerCase().indexOf(query)!==-1; })
    .sort(function(a,b){ return a.workDate < b.workDate ? -1 : (a.workDate > b.workDate ? 1 : 0); });
  var groups = {};
  var order = [];
  upcoming.forEach(function(t){
    if(!groups[t.workDate]){ groups[t.workDate] = []; order.push(t.workDate); }
    groups[t.workDate].push(t);
  });
  var listHtml = order.map(function(dateStr){
    var items = groups[dateStr].slice().sort(byTaskColor(function(t){ return t.color; }));
    var rows = items.map(function(t){
      var badge = t.fromTemplate ? '<span class="reg-row-badge">定型</span>' : '';
      var catBadge = '<span class="reg-row-cat reg-row-cat-'+taskCategory(t)+'">'+esc(taskCategory(t))+'</span>';
      return '<div class="reg-row">'+
        '<span class="task-color-dot" style="background:'+t.color+'"></span>'+
        '<span class="reg-row-name">'+esc(t.name)+'</span>'+
        catBadge+
        badge+
        '<span class="reg-row-unit">'+esc(t.unit)+'</span>'+
        '<button class="log-edit-btn" data-edit-backlog="'+t.id+'">編集</button>'+
        '<button class="icon-x" data-del-backlog="'+t.id+'" title="'+esc(t.name)+'を削除" aria-label="'+esc(t.name)+'を削除">&times;</button>'+
      '</div>';
    }).join('');
    var isOpen = state.regExpandedDates && Object.prototype.hasOwnProperty.call(state.regExpandedDates, dateStr)
      ? state.regExpandedDates[dateStr]
      : dateStr===todayStr();

function bindRegister(){
  var dateInput = document.getElementById('regDate');
  var nameInput = document.getElementById('regName');
  var unitInput = document.getElementById('regUnit');
  [dateInput, nameInput, unitInput].forEach(function(el){
    if(!el) return;
    el.addEventListener('focusin', function(){ state.suppressRender = true; });
    el.addEventListener('focusout', function(){ setTimeout(function(){ state.suppressRender = false; }, 150); });
  });
  if(dateInput){
    dateInput.addEventListener('change', function(){ state.regNewDate = dateInput.value; });
  }
  if(nameInput) nameInput.addEventListener('input', function(){ state.regDraftName = nameInput.value; });
  if(unitInput) unitInput.addEventListener('input', function(){ state.regDraftUnit = unitInput.value; });
  var searchInput = document.getElementById('regSearchInput');
  if(searchInput){
    searchInput.addEventListener('focusin', function(){ state.suppressRender = true; });
    searchInput.addEventListener('focusout', function(){ setTimeout(function(){ state.suppressRender = false; }, 150); });
    searchInput.addEventListener('input', function(){
      state.regSearchQuery = searchInput.value;
      var caret = searchInput.selectionStart;
      render();
      var again = document.getElementById('regSearchInput');
      if(again){ again.focus(); try{ again.setSelectionRange(caret, caret); }catch(e){} }
    });
  }
  document.querySelectorAll('[data-color-swatch]').forEach(function(el){
    el.addEventListener('click', function(){
      state.newTaskColor = el.getAttribute('data-color-swatch');
      render();
    });
  });
  var submitBtn = document.getElementById('regSubmitBtn');
  if(submitBtn){
    submitBtn.addEventListener('click', async function(){
      var name = (nameInput.value||'').trim();
      if(!name){ nameInput.style.borderColor='#F04438'; nameInput.focus(); return; }
      var unit = unitInput ? ((unitInput.value||'件').trim() || '件') : '件';
      var workDate = dateInput.value || tomorrowStr();
      var subcats = (state.regDraftSubcats||[]).slice();
      state.backlog.push({id:uid(), name:name, unit:unit, color:state.newTaskColor, workDate:workDate, archived:false, subcategories:subcats, category:state.regDraftCategory});
      state.regNewDate = workDate;
      state.regDraftName = '';
      state.regDraftSubcats = [];
      state.regSubcatDraft = {name:'', unit:''};
      state.suppressRender = false;
      await saveBacklog(state.backlog);
      render();
    });
  }
  document.querySelectorAll('[data-del-backlog]').forEach(function(el){
    el.addEventListener('click', async function(){
      var id = el.getAttribute('data-del-backlog');
      var t = state.backlog.find(function(t){ return t.id===id; });
      if(!t) return;
      var taskName = t.name;
      if(!confirm('作業「'+taskName+'」を削除しますか?(過去の記録は残ります)')) return;
      t.archived = true;
      await saveBacklog(state.backlog);
      await appendAuditLog({ action:'作業削除', target: taskName, before:'有効', after:'削除' });
      render();
      showToast('「'+taskName+'」を削除しました', '元に戻す', async function(){
        var cur = state.backlog.find(function(x){ return x.id===id; });
        if(cur){
          cur.archived = false;
          await saveBacklog(state.backlog);
          await appendAuditLog({ action:'作業削除の取り消し', target: taskName, before:'削除', after:'有効' });
          render();
        }
      });
    });
  });
  document.querySelectorAll('[data-edit-backlog]').forEach(function(el){
    el.addEventListener('click', function(){
      var id = el.getAttribute('data-edit-backlog');
      var t = state.backlog.find(function(t){ return t.id===id; });
      if(t) openEditTaskModal(t);
    });
  });

  var tmplNameInput = document.getElementById('tmplName');
  var tmplUnitInput = document.getElementById('tmplUnit');
  [tmplNameInput, tmplUnitInput].forEach(function(el){
    if(!el) return;
    el.addEventListener('focusin', function(){ state.suppressRender = true; });
    el.addEventListener('focusout', function(){ setTimeout(function(){ state.suppressRender = false; }, 150); });
  });
  if(tmplNameInput) tmplNameInput.addEventListener('input', function(){ state.tmplDraftName = tmplNameInput.value; });
  if(tmplUnitInput) tmplUnitInput.addEventListener('input', function(){ state.tmplDraftUnit = tmplUnitInput.value; });
  document.querySelectorAll('[data-tmpl-color-swatch]').forEach(function(el){
    el.addEventListener('click', function(){
      state.newTemplateColor = el.getAttribute('data-tmpl-color-swatch');
      render();
    });
  });
  document.querySelectorAll('[data-draft-pattern-toggle]').forEach(function(el){
    el.addEventListener('click', function(){
      var idx = parseInt(el.getAttribute('data-draft-pattern-toggle'),10);
      state.newTemplatePattern[idx] = !state.newTemplatePattern[idx];
      render();
    });
  });
  var tmplSubmitBtn = document.getElementById('tmplSubmitBtn');
  if(tmplSubmitBtn){
    tmplSubmitBtn.addEventListener('click', async function(){
      var name = (tmplNameInput.value||'').trim();
      if(!name){ tmplNameInput.style.borderColor='#F04438'; tmplNameInput.focus(); return; }
      var unit = tmplUnitInput ? ((tmplUnitInput.value||'件').trim() || '件') : '件';
      var subcats = (state.tmplDraftSubcats||[]).slice();
      state.templates.push({id:uid(), name:name, unit:unit, color:state.newTemplateColor, pattern:state.newTemplatePattern, archived:false, subcategories:subcats, category:state.tmplDraftCategory});
      state.newTemplatePattern = defaultPattern();
      state.tmplDraftName = '';
      state.tmplDraftUnit = '件';
      state.tmplDraftSubcats = [];
      state.tmplSubcatDraft = {name:'', unit:''};
      state.suppressRender = false;
      await saveTemplates(state.templates);
      await ensureTemplateTasksForUpcoming(14);
      render();
    });
  }
  document.querySelectorAll('[data-tmpl-pattern-toggle]').forEach(function(el){
    el.addEventListener('click', async function(){
      var parts = el.getAttribute('data-tmpl-pattern-toggle').split('|');
      var tid = parts[0], idx = parseInt(parts[1],10);
      var tmpl = state.templates.find(function(t){ return t.id===tid; });
      if(!tmpl) return;
      var pattern = (tmpl.pattern || defaultPattern()).slice();
      pattern[idx] = !pattern[idx];
      tmpl.pattern = pattern;
      await saveTemplates(state.templates);
      await ensureTemplateTasksForUpcoming(14);
      render();
    });
  });
  document.querySelectorAll('[data-del-template]').forEach(function(el){
    el.addEventListener('click', async function(){
      var id = el.getAttribute('data-del-template');
      var t = state.templates.find(function(t){ return t.id===id; });
      if(!t) return;
      var tmplName = t.name;
      if(!confirm('繰り返し作業「'+tmplName+'」を削除しますか?(本日以降に生成済みの作業も一緒に削除されます。過去の記録は残ります)')) return;
      t.archived = true;
      await saveTemplates(state.templates);
      var today = todayStr();
      var cascadedIds = [];
      state.backlog.forEach(function(task){
        if(task.fromTemplate===id && task.workDate>=today && !task.archived){
          task.archived = true;
          cascadedIds.push(task.id);
        }
      });
      if(cascadedIds.length) await saveBacklog(state.backlog);
      await appendAuditLog({ action:'繰り返し作業削除', target: tmplName, before:'有効', after:'削除('+cascadedIds.length+'件の生成済み作業も削除)' });
      render();
      showToast('繰り返し作業「'+tmplName+'」を削除しました', '元に戻す', async function(){
        var curTmpl = state.templates.find(function(x){ return x.id===id; });
        if(curTmpl) curTmpl.archived = false;
        await saveTemplates(state.templates);
        cascadedIds.forEach(function(taskId){
          var task = state.backlog.find(function(x){ return x.id===taskId; });
          if(task) task.archived = false;
        });
        if(cascadedIds.length) await saveBacklog(state.backlog);
        await appendAuditLog({ action:'繰り返し作業削除の取り消し', target: tmplName, before:'削除', after:'有効' });
        render();
      });
    });
  });
  document.querySelectorAll('[data-edit-template]').forEach(function(el){
    el.addEventListener('click', function(){
      var id = el.getAttribute('data-edit-template');
      var t = state.templates.find(function(t){ return t.id===id; });
      if(t) openEditTemplateModal(t);
    });
  });
  document.querySelectorAll('[data-date-group]').forEach(function(el){
    el.addEventListener('toggle', function(){
      var d = el.getAttribute('data-date-group');
      if(!state.regExpandedDates) state.regExpandedDates = {};
      state.regExpandedDates[d] = el.open;
    });
  });
  bindCategoryToggle();
  bindSubcatTagControls();
}

function taskSubMsRows(info, task){
