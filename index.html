}
function bindModal(){
  var m = state.modal;
  if(m.kind==='editLog'){ bindEditLogModal(m); return; }
  if(m.kind==='editTask'){ bindEditTaskModal(m); return; }
  if(m.kind==='editTemplate'){ bindEditTemplateModal(m); return; }
  if(m.kind==='qtyBreakdown'){ bindQtyBreakdownModal(m); return; }
  if(m.kind==='addLog'){ bindAddLogModal(m); return; }
  document.querySelectorAll('[data-qty-delta]').forEach(function(el){
    el.addEventListener('click', function(){
      var d = parseInt(el.getAttribute('data-qty-delta'),10);
      m.value = Math.max(0, m.value + d);
      document.getElementById('qtyDisplay').textContent = m.value;
      document.getElementById('qtyManual').value = m.value;
    });
  });
  var manual = document.getElementById('qtyManual');
  if(manual){
    manual.addEventListener('input', function(){
      var v = parseInt(manual.value,10);
      if(isNaN(v) || v<0) v=0;
      m.value = v;
      document.getElementById('qtyDisplay').textContent = v;
    });
  }
  var cancelBtn = document.getElementById('qtyCancel');
  if(cancelBtn) cancelBtn.addEventListener('click', function(){
    state.modal = null;
    state.suppressRender = false;
    render();
  });
  var confirmBtn = document.getElementById('qtyConfirm');
  if(confirmBtn) confirmBtn.addEventListener('click', function(){
    closeCurrentAndProceed(m.value);
  });
}

/* ---------- MONITOR ---------- */
function renderMonitor(){
  var present = presentStaff();
  var tasks = tasksForToday().slice().sort(byTaskColor(function(t){ return t.color; }));
  var rows = present.map(function(s){
    var log = currentLog(s.id);
    var totals = totalsByTask(s.id);
    var totalMs = Object.keys(totals).reduce(function(a,k){ return a+totals[k]; },0);
    var barSegs = Object.keys(totals).sort(byTaskColor(function(tid){ return taskById(tid).color; })).map(function(tid){
      var t = taskById(tid);
      var pct = totalMs>0 ? (totals[tid]/totalMs*100) : 0;
      return '<span class="mon-bar-seg" style="width:'+pct.toFixed(1)+'%;background:'+t.color+'"></span>';
    }).join('');
    var statusText, dotColor, timerHtml;
    if(log){
      var t = taskById(log.taskId);
      statusText = '<span class="mon-status-dot" style="background:'+t.color+'"></span><span class="mon-status-text">'+esc(t.name)+'</span>';
      timerHtml = '<div class="mon-timer" data-live-timer="'+log.start+'">'+fmtElapsed(Date.now()-new Date(log.start).getTime())+'</div>';
    }else{
      statusText = '<span class="mon-status-dot" style="background:#667085"></span><span class="mon-status-text idle">待機中</span>';
      timerHtml = '<div class="mon-timer idle">-</div>';
    }
    return '<div class="mon-row">'+
      '<div class="mon-row-top">'+
        '<div class="mon-name">'+esc(s.name)+'</div>'+
        timerHtml+
      '</div>'+
      '<div class="mon-status">'+statusText+'</div>'+
      '<div class="mon-bar-wrap"><div class="mon-bar">'+(barSegs||'')+'</div><div class="mon-bar-total">本日計 '+fmtHM(totalMs)+'</div></div>'+
    '</div>';
  }).join('') || '<div class="mon-empty">本日出勤中のスタッフはいません</div>';

  var sideCards = tasks.map(function(t){
    var agg = taskAggregate(t.id);
    var bd = breakdownLabel(agg.breakdown, t);
    return '<div class="mon-task-card" style="border-left-color:'+t.color+'">'+
      '<div class="mon-task-name">'+esc(t.name)+'</div>'+
      '<div class="mon-task-stats"><span>稼働 <b>'+agg.activeCount+'</b>人</span><span>計 <b>'+fmtHM(agg.ms)+'</b></span><span>'+agg.qty+esc(t.unit)+'</span></div>'+
      (bd ? '<div style="font-size:11px;color:var(--slate-300);margin-top:6px;font-family:var(--font-mono);">'+bd+'</div>' : '')+
    '</div>';
  }).join('') || '<div class="empty-note" style="color:var(--slate-300)">本日の作業が未登録です</div>';

  var now = new Date();
  var clock = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');

  return '<div class="monitor"><div class="mon-inner">'+
    '<div class="mon-header">'+
      '<div class="mon-title-block"><span class="mon-title">本日の稼働状況</span><span class="mon-date">'+todayLabel()+'</span></div>'+
      '<div style="display:flex;align-items:center;gap:16px;">'+
        '<span class="mon-clock" id="monClock">'+clock+'</span>'+
        '<button class="mon-exit" id="switchRoleBtn">役割を変更</button>'+
      '</div>'+
    '</div>'+
    '<div class="mon-body">'+
      '<div class="mon-staff-list">'+rows+'</div>'+
      '<div class="mon-side"><div class="mon-side-title">作業別サマリー</div>'+sideCards+'</div>'+
    '</div>'+
  '</div></div>';
}
function bindMonitor(){}

/* ---------- ticking / polling ---------- */
var tickerHandle = null;
function startTicker(){
  if(tickerHandle) return;
  tickerHandle = setInterval(function(){
    document.querySelectorAll('[data-live-timer]').forEach(function(el){
      var start = new Date(el.getAttribute('data-live-timer')).getTime();
      el.textContent = fmtElapsed(Date.now()-start);
    });
    document.querySelectorAll('[data-live-subtimer-start]').forEach(function(el){
      var base = parseInt(el.getAttribute('data-live-subtimer-base'),10) || 0;
      var start = new Date(el.getAttribute('data-live-subtimer-start')).getTime();
      el.textContent = fmtElapsed(base + (Date.now()-start));
    });
    var clockEl = document.getElementById('monClock');
    if(clockEl){
      var now = new Date();
      clockEl.textContent = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
    }
  }, 1000);
}

/* ---------- update notifications (toast) ---------- */
function showToast(msg, actionLabel, actionFn){
  var container = document.getElementById('toastContainer');
  if(!container){
    container = document.createElement('div');
    container.id = 'toastContainer';
    container.className = 'toast-container';
    document.body.appendChild(container);
  }
  var el = document.createElement('div');
  el.className = 'toast';
  var textSpan = document.createElement('span');
  textSpan.textContent = msg;
  textSpan.className = 'toast-text';
  el.appendChild(textSpan);
  if(actionLabel && actionFn){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'toast-action';
    btn.textContent = actionLabel;
    btn.addEventListener('click', function(){
      actionFn();
      if(el.parentNode) el.parentNode.removeChild(el);
    });
    el.appendChild(btn);
  }
  container.appendChild(el);
  while(container.children.length > 5){
    container.removeChild(container.firstChild);
  }
  setTimeout(function(){
    el.classList.add('leaving');
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 200);
  }, 5500);
}
function notifyChanges(oldRoster, oldBacklog, oldDay, newRoster, newBacklog, newDay){
  if(state.role!=='manager' && state.role!=='register') return;
  if(!oldDay || !newDay || oldDay.date!==newDay.date) return;
  var msgs = [];
  var rosterById = {};
  newRoster.forEach(function(s){ rosterById[s.id] = s; });

  newRoster.forEach(function(s){
    if(s.archived) return;
    var oldOn = !!(oldDay.attendance||{})[s.id];
    var newOn = !!(newDay.attendance||{})[s.id];
    if(oldOn!==newOn){
      msgs.push(esc(s.name)+'さんが'+(newOn?'出勤中':'欠勤')+'に変更されました');
    }
  });

  newRoster.forEach(function(s){
    if(s.archived) return;
    var oldArr = (oldDay.assignments||{})[s.id] || [];
    var newArr = (newDay.assignments||{})[s.id] || [];
    newArr.forEach(function(tid){
      if(oldArr.indexOf(tid)===-1){
        var t = newBacklog.find(function(x){ return x.id===tid; });
        msgs.push(s.name+'さんが「'+(t?t.name:'作業')+'」に割り当てられました');
      }
    });
    oldArr.forEach(function(tid){
      if(newArr.indexOf(tid)===-1){
        var t = oldBacklog.find(function(x){ return x.id===tid; });
        msgs.push(s.name+'さんが「'+(t?t.name:'作業')+'」から外れました');
      }
    });
  });

  var today = todayStr();
  var oldToday = {}; oldBacklog.forEach(function(t){ if(t.workDate===today) oldToday[t.id] = t; });
  var newToday = {}; newBacklog.forEach(function(t){ if(t.workDate===today) newToday[t.id] = t; });
  Object.keys(newToday).forEach(function(id){
    var nt = newToday[id];
    var ot = oldToday[id];
    if(!ot){
      if(!nt.archived) msgs.push('新しい作業「'+nt.name+'」が追加されました');
    }else if(!ot.archived && nt.archived){
      msgs.push('作業「'+nt.name+'」が削除されました');
    }
  });

  var oldLogsById = {};
  (oldDay.logs||[]).forEach(function(l){ oldLogsById[l.id] = l; });
  (newDay.logs||[]).forEach(function(l){
    var s = rosterById[l.staffId];
    var t = newBacklog.find(function(x){ return x.id===l.taskId; });
    var sName = s ? s.name : '?';
    var tName = t ? t.name : '?';
    var old = oldLogsById[l.id];
    if(!old){
      msgs.push(sName+'さんが「'+tName+'」を開始しました');
    }else if(old.end===null && l.end!==null){
      msgs.push(sName+'さんが「'+tName+'」を終了しました('+(l.quantity||0)+(t?t.unit:'')+')');
    }
  });

  if(msgs.length===0) return;
  if(msgs.length>4){
    msgs.slice(0,4).forEach(showToast);
    showToast('他'+(msgs.length-4)+'件の更新がありました');
  }else{
    msgs.forEach(showToast);
  }
}

var pollHandle = null;
function startPolling(){
  if(pollHandle) return;
  pollHandle = setInterval(async function(){
    if(!state.role) return;
    if(pendingSaves>0) return;
    var oldRoster = state.roster;
    var oldBacklog = state.backlog;
    var oldDay = state.day;
    var roster = await loadRoster();
    var backlog = await loadBacklog();
    var templates = await loadTemplates();
    var breakSettings = await loadBreakSettings();
    var shiftSettings = await loadShiftSettings();
    var achievementSettings = await loadAchievementSettings();
    if(pendingSaves>0) return;
    state.roster = roster;
    state.backlog = backlog;
    state.templates = templates;
    state.breakSettings = breakSettings;
    state.shiftSettings = shiftSettings;
    state.achievementSettings = achievementSettings;
    await ensureTemplateTasksForToday();
    var day = await loadDay();
    if(pendingSaves>0) return;
    state.day = day;
    notifyChanges(oldRoster, oldBacklog, oldDay, state.roster, state.backlog, state.day);
    await checkAutoBreak();
    await checkAutoShift();
    if(!state.suppressRender) render();
  }, 4000);
}

function renderSupabaseWarning(){

async function init(){
  if(!window.SUPABASE_CONFIG || !window.SUPABASE_CONFIG.url || window.SUPABASE_CONFIG.url.indexOf('YOUR-PROJECT')!==-1){
    document.getElementById('app').innerHTML = renderSupabaseWarning();
    return;
  }
  if(!storageAvailable()){
    document.getElementById('app').innerHTML = renderStorageWarning();
    return;
  }
  state.roster = await loadRoster();
  state.backlog = await loadBacklog();
  state.templates = await loadTemplates();
  state.breakSettings = await loadBreakSettings();
  state.shiftSettings = await loadShiftSettings();
  state.achievementSettings = await loadAchievementSettings();
  state.jpHolidays = await loadJpHolidays();
  await ensureTemplateTasksForToday();
  state.day = await loadDay();
  await checkAutoBreak();
  await checkAutoShift();
  render();
  startTicker();
}
init();
